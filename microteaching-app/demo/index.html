><h4>ประเมินการสอน</h4><div class=\"small muted\">ตนเอง เพื่อน อาจารย์ 10 ทักษะ</div></a>\n        <a class=\"card center\" href=\"#\" id=\"toReq\" style=\"text-decoration:none;color:inherit\"><div style=\"font-size:34px\">✉️</div><h4>ยื่นคำร้อง</h4><div class=\"small muted\">นอกเวลา ยืมอุปกรณ์ ขอไฟล์ แจ้งซ่อม</div></a>\n      </div>\n      <div class=\"grid g2 mt\" style=\"align-items:start\">\n        <div class=\"card\" id=\"reqCard\"><h3>✉️ ยื่นคำร้องออนไลน์</h3><form id=\"rf\" novalidate>\n          <label class=\"f\"><span>ประเภทคำร้อง <i>*</i></span><select name=\"type\">${Object.keys(P.requestTypes).map(k => `<option value=\"${k}\" ${arg === k ? 'selected' : ''}>${esc(P.requestTypes[k])}</option>`).join('')}</select></label>\n          <div class=\"fgrid\"><label class=\"f\"><span>ชื่อ-นามสกุล <i>*</i></span><input type=\"text\" name=\"name\" value=\"${esc(me.name || '')}\"></label>\n            <label class=\"f\"><span>สถานะผู้ยื่น</span><select name=\"userType\">${Object.keys(P.userTypes).map(k => `<option value=\"${k}\" ${me.userType === k ? 'selected' : ''}>${esc(P.userTypes[k])}</option>`).join('')}</select></label>\n            <label class=\"f\"><span>รหัสนักศึกษา / บุคลากร</span><input type=\"text\" name=\"studentId\" value=\"${esc(me.studentId || '')}\"></label>\n            <label class=\"f\"><span>คณะ / หน่วยงาน</span><input type=\"text\" name=\"faculty\" value=\"${esc(me.faculty || '')}\"></label>\n            <label class=\"f\"><span>เบอร์โทรศัพท์ <i>*</i></span><input type=\"tel\" name=\"phone\" value=\"${esc(me.phone || '')}\"></label>\n            <label class=\"f\"><span>อีเมล</span><input type=\"email\" name=\"email\" value=\"${esc(me.email || '')}\"></label></div>\n          <label class=\"f\"><span>เรื่อง <i>*</i></span><input type=\"text\" name=\"subject\"></label>\n          <label class=\"f\"><span>รายละเอียด <i>*</i></span><textarea name=\"detail\" placeholder=\"ระบุวัน เวลา ห้อง/อุปกรณ์ จำนวน และเหตุผลความจำเป็น\"></textarea></label>\n          <div class=\"fgrid\"><label class=\"f\"><span>วันที่ต้องการ</span><input type=\"date\" name=\"needDate\" min=\"${today()}\"></label>\n            <label class=\"f\"><span>อ้างอิงรหัสการจอง (ถ้ามี)</span><input type=\"text\" name=\"refCode\" placeholder=\"MT…\"></label></div>\n          <label class=\"f\"><span>ลิงก์เอกสารแนบ (Google Drive, ถ้ามี)</span><input type=\"url\" name=\"link\" placeholder=\"https://drive.google.com/…\"></label>\n          <input type=\"text\" name=\"website\" tabindex=\"-1\" autocomplete=\"off\" style=\"position:absolute;left:-9999px\" aria-hidden=\"true\">\n          <button class=\"btn block\" type=\"submit\">ส่งคำร้อง</button></form></div>\n        <div class=\"card\"><h3>📂 เอกสารดาวน์โหลด</h3>${Object.keys(cats).length ? Object.keys(cats).map(c => `<h4 class=\"mt\">${esc(c)}</h4><div class=\"doclist\">${cats[c].map(d =>\n          `<a href=\"${d.url ? link(d.url) : '#'}\" ${d.url ? 'target=\"_blank\" rel=\"noopener\"' : 'data-nofile'}><span class=\"ic\">${/ประเมิน/.test(c) ? '📊' : /ระเบียบ/.test(c) ? '📜' : /คู่มือ/.test(c) ? '📘' : '📄'}</span><span class=\"grow\"><b>${esc(d.title)}</b><div class=\"xs muted\">${esc(d.description)}${d.url ? '' : ' · (ยังไม่ได้แนบไฟล์)'}</div></span><span>${d.url ? '⬇' : ''}</span></a>`).join('')}</div>`).join('') : '<div class=\"muted\">ยังไม่มีเอกสาร</div>'}\n          <div class=\"mt small\"><a href=\"#page/rules\">📋 อ่านระเบียบการใช้ห้อง</a> · <a href=\"#page/faq\">❓ คำถามที่พบบ่อย</a></div></div>\n      </div></div>`;\n    $('#toReq').onclick = e => { e.preventDefault(); $('#reqCard').scrollIntoView({ behavior: 'smooth' }); };\n    $$('[data-nofile]').forEach(a => a.onclick = e => { e.preventDefault(); toast('ยังไม่ได้แนบไฟล์ — ติดต่อเจ้าหน้าที่ หรือใช้แบบฟอร์มออนไลน์'); });\n    const f = $('#rf');\n    f.onsubmit = e => {\n      e.preventDefault();\n      const o = formData(f);\n      if (!o.name.trim() || !o.phone.trim() || !o.subject.trim() || !o.detail.trim()) return toast('กรุณากรอกข้อมูลที่มีเครื่องหมาย * ให้ครบ', 'err');\n      const btn = f.querySelector('[type=submit]'); btn.disabled = true;\n      call('submitRequest', o).then(res => {\n        $('#reqCard').innerHTML = `<div class=\"center\"><div style=\"font-size:48px\">📨</div><h3>ส่งคำร้องเรียบร้อย</h3><p>${esc(res.typeLabel)}</p><div class=\"codebox\">${esc(res.code)}</div>\n          <p class=\"small muted mt\">ติดตามผลได้ที่เมนู ตรวจสอบสถานะ ด้วยรหัสนี้และเบอร์โทรที่กรอก</p><a class=\"btn\" href=\"#status/${encodeURIComponent(res.code)}\">ตรวจสอบสถานะ</a></div>`;\n        LS.set('last', { code: res.code, contact: o.phone });\n      }).catch(err => { toast(err.message, 'err'); btn.disabled = false; });\n    };\n  }\n\n  /* ================= ประเมินการสอน ================= */\n  function vEvaluate(el, arg) {\n    el.innerHTML = `<div class=\"wrap page\" style=\"max-width:900px\"><h1>📝 แบบประเมินทักษะการสอนแบบจุลภาค</h1>\n      <p class=\"muted mt0\">ใช้รหัสการจองที่ผู้สอนแชร์ให้ ประเมินได้ทั้งตนเอง เพื่อน และอาจารย์ · ให้คะแนน 1 (ต้องปรับปรุงมาก) – 5 (ดีมาก)</p>\n      <div class=\"card\"><form id=\"ef0\" class=\"row\"><input type=\"text\" name=\"code\" placeholder=\"รหัสการจอง เช่น MT6911-K7Q2\" value=\"${esc(arg || '')}\" class=\"grow\" style=\"text-transform:uppercase;max-width:340px\"><button class=\"btn\" type=\"submit\">เริ่มประเมิน</button></form></div>\n      <div id=\"evBox\"></div></div>`;\n    const f0 = $('#ef0');\n    f0.onsubmit = e => { e.preventDefault(); const code = f0.code.value.trim(); if (!code) return toast('กรุณากรอกรหัสการจอง', 'err'); call('getEvalTarget', code).then(drawEvalForm).catch(err => toast(err.message, 'err')); };\n    if (arg) f0.onsubmit(new Event('submit'));\n  }\n  function drawEvalForm(t) {\n    const box = $('#evBox');\n    box.innerHTML = `<div class=\"card\"><div class=\"row between\"><div><h3 class=\"mt0\">${esc(t.title)}</h3><div class=\"small muted\">ผู้สอน: <b>${esc(t.teacher)}</b>${t.course ? ' · ' + esc(t.course) : ''} · ${esc(t.roomName)} · ${esc(t.dateText)} ${t.start}–${t.end} น.</div></div><span class=\"badge b-approved\">${esc(t.code)}</span></div></div>\n      <form id=\"ef\" class=\"card\"><div class=\"fgrid\"><label class=\"f\"><span>ประเมินในฐานะ</span><select name=\"role\"><option value=\"peer\">เพื่อน / ผู้สังเกต</option><option value=\"lecturer\">อาจารย์ / ผู้นิเทศ</option><option value=\"self\">ตนเอง (ผู้สอน)</option></select></label>\n        <label class=\"f\" id=\"evName\"><span>ชื่อผู้ประเมิน <i>*</i></span><input type=\"text\" name=\"evaluator\"></label></div>\n        <div class=\"small\" style=\"font-weight:600\">เลือกทักษะที่จะประเมิน (ไมโครทีชชิ่งมักเน้น 1–2 ทักษะต่อรอบ)</div>\n        <div class=\"chips mt mb\">${P.skills.map((s, i) => `<label class=\"chip\"><input type=\"checkbox\" data-skill=\"${s.key}\" ${i < 2 ? 'checked' : ''}>${i + 1}. ${esc(s.name.replace('ทักษะการ', '').replace('ทักษะ', ''))}</label>`).join('')}</div>\n        <div id=\"skillForms\"></div>\n        <div class=\"fgrid mt\"><label class=\"f\"><span>👍 จุดเด่น</span><textarea name=\"strengths\"></textarea></label><label class=\"f\"><span>🔧 สิ่งที่ควรปรับปรุง / ข้อเสนอแนะ</span><textarea name=\"improve\"></textarea></label></div>\n        <button class=\"bigbtn\" type=\"submit\">ส่งผลการประเมิน</button></form>`;\n    const f = $('#ef');\n    f.role.onchange = () => { $('#evName').hidden = f.role.value === 'self'; };\n    const drawSkills = () => {\n      const keep = {};\n      $$('[data-sc]', f).forEach(i => { if (i.checked) keep[i.name] = i.value; });\n      $('#skillForms').innerHTML = P.skills.filter(s => $(`[data-skill=${s.key}]`, f).checked).map(s => `<div class=\"card\" style=\"box-shadow:none;background:var(--bg-2)\"><h4>${esc(s.name)}</h4>\n        ${s.items.map((it, j) => `<div class=\"row between\" style=\"padding:5px 0;border-bottom:1px dashed var(--line)\"><span class=\"grow small\">${j + 1}) ${esc(it)}</span><span class=\"scale\">${[1, 2, 3, 4, 5].map(n => `<label><input type=\"radio\" data-sc name=\"${s.key}_${j}\" value=\"${n}\" ${keep[s.key + '_' + j] == n ? 'checked' : ''}>${n}</label>`).join('')}</span></div>`).join('')}</div>`).join('') || '<div class=\"muted small\">ยังไม่ได้เลือกทักษะ</div>';\n    };\n    $$('[data-skill]', f).forEach(c => c.onchange = drawSkills); drawSkills();\n    f.onsubmit = e => {\n      e.preventDefault();\n      const o = formData(f), scores = {};\n      let missing = 0;\n      P.skills.forEach(s => {\n        if (!$(`[data-skill=${s.key}]`, f).checked) return;\n        scores[s.key] = s.items.map((_, j) => { const v = (f.querySelector(`[name=\"${s.key}_${j}\"]:checked`) || {}).value; if (!v) missing++; return Number(v || 0); });\n      });\n      if (!Object.keys(scores).length) return toast('กรุณาเลือกทักษะอย่างน้อย 1 ทักษะ', 'err');\n      if (missing) return toast('ยังให้คะแนนไม่ครบ ' + missing + ' ข้อ', 'err');\n      if (o.role !== 'self' && !o.evaluator.trim()) return toast('กรุณากรอกชื่อผู้ประเมิน', 'err');\n      call('submitEvaluation', t.code, { role: o.role, evaluator: o.evaluator, scores: scores, strengths: o.strengths, improve: o.improve }).then(res => {\n        $('#evBox').innerHTML = `<div class=\"card center\"><div style=\"font-size:50px\">🙏</div><h3>ส่งผลการประเมินแล้ว</h3><p>คะแนนเฉลี่ยที่คุณให้: <b>${res.avg.toFixed(2)}</b> / 5</p><button class=\"btn ghost\" id=\"evAgain\">ประเมินอีกครั้ง (ผู้ประเมินคนอื่น)</button></div>`;\n        $('#evAgain').onclick = () => drawEvalForm(t);\n        window.scrollTo(0, 0);\n      }).catch(err => toast(err.message, 'err'));\n    };\n  }\n\n  /* ================= หน้าเนื้อหา / ติดต่อ ================= */\n  function vPage(el, key) {\n    const p = page(key);\n    el.innerHTML = `<div class=\"wrap page\" style=\"max-width:960px\"><div class=\"card md\">${p ? md(p.body) : '<h1>ไม่พบหน้านี้</h1>'}</div>\n      ${key === 'services' || key === 'teaching' ? '<div class=\"grid g2 mt\"><a class=\"bigbtn\" href=\"#book\"><span class=\"e\">📅</span>จองห้อง</a><a class=\"bigbtn alt\" href=\"#evaluate\"><span class=\"e\">📝</span>แบบประเมินทักษะการสอน</a></div>' : ''}\n      ${key === 'about' ? `<div class=\"sec-title\">🏫 ห้องและสิ่งอำนวยความสะดวก</div><div class=\"grid g2\">${rooms().map(roomCard).join('')}</div>` : ''}</div>`;\n  }\n  function vContact(el) {\n    const s = P.site;\n    const item = (ic, t, v, href) => v ? `<div class=\"row\" style=\"align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)\"><span style=\"font-size:24px\">${ic}</span><div class=\"grow\"><div class=\"small muted\">${t}</div><div>${href ? `<a href=\"${href}\" target=\"_blank\" rel=\"noopener\">${esc(v)}</a>` : esc(v)}</div></div></div>` : '';\n    el.innerHTML = `<div class=\"wrap page\"><h1>☎️ ช่องทางติดต่อ</h1><div class=\"grid g2\" style=\"align-items:start\">\n      <div class=\"card\"><h3>${esc(s.appName)}</h3><div class=\"muted\">${esc(s.org)}</div>\n        ${item('📍', 'ที่ตั้ง', [s.building, s.address].filter(Boolean).join(' · '))}${item('☎️', 'โทรศัพท์', s.phone, s.phone ? 'tel:' + s.phone.replace(/[^0-9+]/g, '') : '')}\n        ${item('✉️', 'อีเมล', s.email, s.email ? 'mailto:' + s.email : '')}${item('💬', 'LINE', s.line)}${item('📘', 'Facebook', s.facebook ? 'เพจ Facebook' : '', link(s.facebook))}${item('🕘', 'เวลาให้บริการ', s.hoursText)}\n        ${s.mapUrl ? `<a class=\"btn mt\" href=\"${link(s.mapUrl)}\" target=\"_blank\" rel=\"noopener\">🗺️ เปิดแผนที่</a>` : ''}\n        ${s.staffText ? `<h4 class=\"mt\">ผู้รับผิดชอบ</h4><div class=\"small\">${esc(s.staffText).replace(/\\n/g, '<br>')}</div>` : ''}</div>\n      <div class=\"card\"><h3>ส่งข้อความถึงเจ้าหน้าที่</h3><p class=\"small muted mt0\">สอบถาม แจ้งปัญหา หรือข้อเสนอแนะ ระบบจะออกรหัสคำร้องให้ติดตามผลได้</p>\n        <form id=\"cf\"><input type=\"hidden\" name=\"type\" value=\"other\"><div class=\"fgrid\"><label class=\"f\"><span>ชื่อ-นามสกุล *</span><input type=\"text\" name=\"name\"></label><label class=\"f\"><span>เบอร์โทร *</span><input type=\"tel\" name=\"phone\"></label></div>\n        <label class=\"f\"><span>อีเมล</span><input type=\"email\" name=\"email\"></label><label class=\"f\"><span>เรื่อง *</span><input type=\"text\" name=\"subject\"></label><label class=\"f\"><span>ข้อความ *</span><textarea name=\"detail\"></textarea></label>\n        <input type=\"text\" name=\"website\" tabindex=\"-1\" autocomplete=\"off\" style=\"position:absolute;left:-9999px\" aria-hidden=\"true\"><button class=\"btn block\">ส่งข้อความ</button></form></div></div></div>`;\n    const f = $('#cf');\n    f.onsubmit = e => { e.preventDefault(); const o = formData(f); call('submitRequest', o).then(res => { f.innerHTML = `<div class=\"center\"><h3>ส่งข้อความแล้ว</h3><div class=\"codebox\">${esc(res.code)}</div><p class=\"small muted mt\">ติดตามผลที่เมนู ตรวจสอบสถานะ</p></div>`; }).catch(err => toast(err.message, 'err')); };\n  }\n\n  /* ================= ป้ายหน้าห้อง ================= */\n  let dispTimer = null;\n  function renderDisplay(roomId) {\n    if (!roomId) { app.innerHTML = `<div class=\"display\"><div class=\"big\">เลือกห้องสำหรับป้ายหน้าห้อง</div>${P.rooms.map(r => `<a class=\"bigbtn\" href=\"#display/${esc(r.id)}\">${esc(r.name)}</a>`).join('')}</div>`; return; }\n    const draw = () => call('getDisplay', roomId).then(d => {\n      if (location.hash.indexOf('#display') !== 0) return;\n      const nm = mins(nowLocal().substr(11));\n      const cur = d.items.find(i => mins(i.start) <= nm && nm < mins(i.end));\n      const next = d.items.filter(i => mins(i.start) > nm);\n      app.innerHTML = `<div class=\"display\"><div class=\"row between\"><div><div class=\"big\">${esc(d.room.name)}</div><div style=\"opacity:.7;font-size:20px\">${esc(d.todayText)}</div></div><div class=\"clock\" id=\"clk\">${nowLocal().substr(11)}</div></div>\n        ${d.closed ? `<div class=\"state closedst\"><div style=\"font-size:44px\">⛔ ปิดให้บริการ</div><div style=\"font-size:22px\">${esc(d.closed)}</div></div>` :\n          cur ? `<div class=\"state busyst\"><div style=\"font-size:22px;opacity:.85\">กำลังใช้งาน · ${cur.start}–${cur.end} น.</div><div style=\"font-size:42px;font-weight:700\">${esc(cur.label)}</div><div style=\"font-size:22px\">${esc(cur.course || '')} ${esc(cur.who || '')}</div></div>` :\n          `<div class=\"state free\"><div style=\"font-size:48px;font-weight:700\">✅ ว่าง</div><div style=\"font-size:22px\">${next[0] ? 'การใช้ครั้งถัดไป ' + next[0].start + ' น.' : 'ไม่มีการจองต่อจากนี้ในวันนี้'}</div></div>`}\n        <div class=\"nx\"><div style=\"opacity:.7;margin-bottom:8px\">ตารางวันนี้</div>${d.items.length ? d.items.map(i => `<div style=\"padding:6px 0;border-bottom:1px solid #333;${mins(i.end) <= nm ? 'opacity:.4' : ''}\"><b>${i.start}–${i.end}</b> · ${esc(i.label)} <span style=\"opacity:.6\">${esc(i.course || '')}</span></div>`).join('') : '<div>— ไม่มีการจอง —</div>'}</div>\n        <div style=\"opacity:.6;font-size:16px\">จองห้องออนไลน์: ${esc(CFG.baseUrl || P.site.appName)}</div></div>`;\n    }).catch(e => { app.innerHTML = `<div class=\"display\"><div class=\"big\">${esc(e.message)}</div></div>`; });\n    draw();\n    clearInterval(dispTimer);\n    dispTimer = setInterval(() => { if (location.hash.indexOf('#display') !== 0) { clearInterval(dispTimer); return; } draw(); }, 60000);\n  }\n\n  /* =====================================================================\n   *  ระบบหลังบ้าน\n   * ===================================================================== */\n  const isAdmin = () => A && A.me.role === 'admin';\n  function reloadAdmin() {\n    return api('getAdminData').then(d => {\n      A = d; P.rules = d.rules;\n      // บันทึกที่อยู่เว็บไซต์ (ใช้สร้างลิงก์ในอีเมล) อัตโนมัติเมื่อผู้ดูแลเข้าระบบครั้งแรก\n      if (isAdmin() && !d.settings.siteUrl && /^https:/.test(CFG.baseUrl)) api('saveSettings', { siteUrl: CFG.baseUrl }).then(st => { A.settings = st; }).catch(() => { });\n      return d;\n    });\n  }\n\n  function renderAdmin(tab) {\n    if (!TOKEN) return adminLogin();\n    if (!A) { app.innerHTML = shell('<div class=\"spinner\">กำลังโหลดข้อมูลหลังบ้าน…</div>', ''); bindShell(); reloadAdmin().then(() => renderAdmin(tab)).catch(e => { toast(e.message, 'err'); if (!TOKEN) adminLogin(); }); return; }\n    ST.admTab = tab || ST.admTab || 'dash';\n    const pend = A.bookings.filter(b => b.status === 'pending').length, rq = A.requests.filter(q => q.status === 'new').length;\n    const tabs = [['dash', '📊', 'แดชบอร์ด'], ['bookings', '📋', 'การจอง', pend], ['calendar', '🗓️', 'ปฏิทินห้อง'], ['requests', '✉️', 'คำร้อง', rq], ['equipment', '🎛️', 'อุปกรณ์'],\n      ['closures', '⛔', 'วันปิดห้อง'], ['evals', '⭐', 'ผลประเมิน'], ['reports', '📈', 'รายงาน'], ['content', '📝', 'เนื้อหาเว็บ'], ['rooms', '🏫', 'ห้อง']];\n    if (isAdmin()) tabs.push(['users', '👥', 'ผู้ใช้งาน'], ['settings', '⚙️', 'ตั้งค่า'], ['log', '🧾', 'บันทึกระบบ']);\n    app.innerHTML = shell(`<div class=\"wrap\"><div class=\"adm\"><aside class=\"side\">\n        <div class=\"small muted sep\" style=\"padding:0 12px 8px\">👤 ${esc(A.me.name)} · ${A.me.role === 'admin' ? 'ผู้ดูแลระบบ' : 'เจ้าหน้าที่'}</div>\n        ${tabs.map(t => `<a href=\"#admin/${t[0]}\" class=\"${ST.admTab === t[0] ? 'on' : ''}\">${t[1]} ${t[2]}${t[3] ? `<span class=\"n\">${t[3]}</span>` : ''}</a>`).join('')}\n        <div class=\"sep\" style=\"height:1px;background:var(--line);margin:8px 0\"></div>\n        <a href=\"#\" id=\"chpw\">🔑 เปลี่ยนรหัสผ่าน</a><a href=\"#\" id=\"lout\">🚪 ออกจากระบบ</a></aside>\n      <section id=\"adm\"></section></div></div>`, '');\n    bindShell();\n    $('#lout').onclick = e => { e.preventDefault(); call('logout', TOKEN).catch(() => { }); TOKEN = null; A = null; try { sessionStorage.removeItem('mt_token'); } catch (x) { } go('#home'); };\n    $('#chpw').onclick = e => { e.preventDefault(); changePw(); };\n    const views = { dash: aDash, bookings: aBookings, calendar: aCalendar, requests: aRequests, equipment: aEquipment, closures: aClosures, evals: aEvals, reports: aReports, content: aContent, rooms: aRooms, users: aUsers, settings: aSettings, log: aLog };\n    (views[ST.admTab] || aDash)($('#adm'));\n  }\n  function adminLogin() {\n    app.innerHTML = shell(`<div class=\"wrap page\" style=\"max-width:420px\"><div class=\"card\"><h2>🔐 เข้าสู่ระบบเจ้าหน้าที่</h2><form id=\"lf\">\n      <label class=\"f\"><span>ชื่อผู้ใช้</span><input type=\"text\" name=\"u\" autocomplete=\"username\"></label><label class=\"f\"><span>รหัสผ่าน</span><input type=\"password\" name=\"p\" autocomplete=\"current-password\"></label>\n      <button class=\"btn block\">เข้าสู่ระบบ</button></form><p class=\"xs muted mt\">สำหรับเจ้าหน้าที่ห้องและผู้ดูแลระบบเท่านั้น ผู้ขอใช้ห้องไม่ต้องเข้าสู่ระบบ</p></div></div>`, '');\n    bindShell();\n    const f = $('#lf');\n    f.onsubmit = e => { e.preventDefault(); call('staffLogin', f.u.value, f.p.value).then(r => { TOKEN = r.token; try { sessionStorage.setItem('mt_token', TOKEN); } catch (x) { } A = null; renderAdmin(route().a); }).catch(err => toast(err.message, 'err')); };\n  }\n  function changePw() {\n    const m = modal('เปลี่ยนรหัสผ่าน', `<label class=\"f\"><span>รหัสผ่านเดิม</span><input type=\"password\" id=\"pw0\"></label><label class=\"f\"><span>รหัสผ่านใหม่ (อย่างน้อย 8 ตัว)</span><input type=\"password\" id=\"pw1\"></label><label class=\"f\"><span>ยืนยันรหัสผ่านใหม่</span><input type=\"password\" id=\"pw2\"></label>`,\n      '<button class=\"btn ghost\" data-x>ยกเลิก</button><button class=\"btn\" id=\"pwOk\">บันทึก</button>');\n    $('#pwOk', m).onclick = () => { if ($('#pw1', m).value !== $('#pw2', m).value) return toast('รหัสผ่านใหม่ไม่ตรงกัน', 'err'); api('changePassword', $('#pw0', m).value, $('#pw1', m).value).then(() => { m.close(); toast('เปลี่ยนรหัสผ่านแล้ว', 'ok'); }).catch(e => toast(e.message, 'err')); };\n  }\n  const refresh = () => reloadAdmin().then(() => { clearSched(); renderAdmin(ST.admTab); });\n  const hours = b => (mins(b.end) - mins(b.start)) / 60;\n\n  /* ---------- แดชบอร์ด ---------- */\n  function aDash(el) {\n    const t = A.today, ym = t.substr(0, 7), B = A.bookings;\n    const todayB = B.filter(b => b.date === t && ACTIVE.concat(['noshow']).indexOf(b.status) !== -1).sort((a, b) => a.start.localeCompare(b.start));\n    const pending = B.filter(b => b.status === 'pending').sort((a, b) => (a.date + a.start).localeCompare(b.date + b.start));\n    const month = B.filter(b => b.date.substr(0, 7) === ym && ['approved', 'checkedin', 'completed'].indexOf(b.status) !== -1);\n    const mHours = month.reduce((s, b) => s + hours(b), 0);\n    const util = utilization(ym + '-01', lastDay(ym));\n    const fbAll = A.feedback.map(f => num(f.q6)).filter(Boolean);\n    const sat = fbAll.length ? fbAll.reduce((a, b) => a + b, 0) / fbAll.length : 0;\n    const noVideo = B.filter(b => truthy(b.record) && b.status === 'completed' && !b.videoUrl).length;\n    const months = Array.from({ length: 12 }, (_, i) => { const d = D0(ym + '-01'); d.setUTCMonth(d.getUTCMonth() - 11 + i); return iso(d).substr(0, 7); });\n    const perM = months.map(m => B.filter(b => b.date.substr(0, 7) === m && ['approved', 'checkedin', 'completed'].indexOf(b.status) !== -1).length);\n    const maxM = Math.max(1, ...perM);\n    el.innerHTML = `<div class=\"row between\"><h2 class=\"mt0\">📊 แดชบอร์ด</h2><div class=\"row\"><span class=\"muted small\">${thL(t)}</span><button class=\"btn sm ghost\" id=\"rf\">↻ รีเฟรช</button><button class=\"btn sm\" id=\"nb\">＋ เพิ่มการจอง</button></div></div>\n      <div class=\"grid kpis\">\n        <div class=\"kpi hl\"><div class=\"v\">${todayB.length}</div><div class=\"l\">การใช้ห้องวันนี้</div></div>\n        <div class=\"kpi\"><div class=\"v\" style=\"color:var(--warn)\">${pending.length}</div><div class=\"l\">รออนุมัติ</div></div>\n        <div class=\"kpi\"><div class=\"v\" style=\"color:var(--info)\">${A.requests.filter(q => q.status === 'new' || q.status === 'progress').length}</div><div class=\"l\">คำร้องค้างดำเนินการ</div></div>\n        <div class=\"kpi\"><div class=\"v\">${fmt(mHours)}</div><div class=\"l\">ชั่วโมงใช้งานเดือนนี้ (${month.length} ครั้ง)</div></div>\n        <div class=\"kpi\"><div class=\"v\">${fmt(util.pct)}%</div><div class=\"l\">อัตราการใช้ห้องเดือนนี้</div></div>\n        <div class=\"kpi\"><div class=\"v\">${sat ? sat.toFixed(2) : '-'}</div><div class=\"l\">ความพึงพอใจโดยรวม (เต็ม 5) · ${fbAll.length} คน</div></div>\n        <div class=\"kpi\"><div class=\"v\" style=\"color:${noVideo ? 'var(--danger)' : 'inherit'}\">${noVideo}</div><div class=\"l\">รอแนบไฟล์วิดีโอ</div></div>\n        <div class=\"kpi\"><div class=\"v\">${A.equipment.filter(e => e.status === 'repair' || e.status === 'broken').length}</div><div class=\"l\">อุปกรณ์ชำรุด/ส่งซ่อม</div></div>\n      </div>\n      <div class=\"grid g2 mt\" style=\"align-items:start\">\n        <div class=\"card\"><h3>🕘 วันนี้</h3>${todayB.length ? todayB.map(b => bkRow(b, true)).join('') : '<div class=\"empty\">ไม่มีการใช้ห้องวันนี้</div>'}</div>\n        <div class=\"card\"><div class=\"row between\"><h3 class=\"mt0\">⏳ รออนุมัติ</h3>${pending.length > 1 ? '<button class=\"btn sm ok\" id=\"apAll\">อนุมัติทั้งหมด</button>' : ''}</div>${pending.length ? pending.slice(0, 12).map(b => bkRow(b, false)).join('') : '<div class=\"empty\">ไม่มีรายการรออนุมัติ 🎉</div>'}</div>\n      </div>\n      <div class=\"card mt\"><h3>การใช้ห้อง 12 เดือนล่าสุด (ครั้ง)</h3><div class=\"vbars\">${months.map((m, i) => `<div><em>${perM[i] || ''}</em><i style=\"height:${perM[i] / maxM * 100}%\"></i>${TM[Number(m.substr(5)) - 1]}</div>`).join('')}</div></div>`;\n    $('#rf').onclick = refresh;\n    $('#nb').onclick = () => bookingForm({});\n    const ap = $('#apAll'); if (ap) ap.onclick = () => confirmBox('อนุมัติรายการที่รออนุมัติทั้งหมด ' + pending.length + ' รายการ?', 'อนุมัติทั้งหมด', 'ok').then(ok => ok && api('approveMany', pending.map(b => b.id)).then(r => { toast('อนุมัติ ' + r.ok.length + ' รายการ' + (r.fail.length ? ' · ไม่สำเร็จ ' + r.fail.length : ''), r.fail.length ? 'err' : 'ok'); refresh(); }).catch(e => toast(e.message, 'err')));\n    bindBkRows(el);\n  }\n  function bkRow(b, actions) {\n    const r = roomOf(b.roomId);\n    const act = b.status === 'pending' ? `<button class=\"btn sm ok\" data-act=\"approve\" data-id=\"${b.id}\">อนุมัติ</button><button class=\"btn sm ghost\" data-act=\"reject\" data-id=\"${b.id}\">ไม่อนุมัติ</button>` :\n      b.status === 'approved' ? `<button class=\"btn sm info\" data-act=\"checkin\" data-id=\"${b.id}\">เช็กอิน</button>` : b.status === 'checkedin' ? `<button class=\"btn sm dark\" data-act=\"checkout\" data-id=\"${b.id}\">เช็กเอาต์</button>` : '';\n    return `<div class=\"ag row\" style=\"padding:9px 0;border-bottom:1px solid var(--line);align-items:flex-start;--c:${esc(r.color)}\"><div class=\"grow\" data-open=\"${b.id}\" style=\"cursor:pointer\">\n      <div><b>${actions ? '' : thD(b.date) + ' · '}${b.start}–${b.end}</b> <span class=\"dot\" style=\"margin-left:6px\"></span>${esc(r.code || r.name)} ${stBadge(b.status)} ${truthy(b.record) ? '🎥' : ''}</div>\n      <div class=\"small\">${esc(b.title)}</div><div class=\"xs muted\">${esc(b.name)} · ${esc(P.userTypes[b.userType] || '')}${b.course ? ' · ' + esc(b.course) : ''} · ${esc(b.code)}</div></div>\n      <div class=\"row\" style=\"gap:6px\">${act}</div></div>`;\n  }\n  function bindBkRows(el) {\n    $$('[data-open]', el).forEach(x => x.onclick = () => bookingDetail(x.dataset.open));\n    $$('[data-act]', el).forEach(x => x.onclick = e => { e.stopPropagation(); doAction(x.dataset.id, x.dataset.act); });\n  }\n  function doAction(id, act) {\n    const b = A.bookings.find(x => x.id === id);\n    const run = p => api('setBookingStatus', id, act, p || {}).then(() => { toast('บันทึกแล้ว', 'ok'); const m = $('.modal-bg'); if (m) m.remove(); refresh(); }).catch(e => toast(e.message, 'err'));\n    if (act === 'reject') return promptBox('ไม่อนุมัติ ' + b.code, 'เหตุผล (แจ้งผู้จอง)', '', true).then(v => v && run({ staffNote: v }));\n    if (act === 'cancel') return promptBox('ยกเลิก ' + b.code, 'เหตุผลการยกเลิก', '', true).then(v => v && run({ reason: v }));\n    if (act === 'checkout') {\n      const m = modal('เช็กเอาต์ ' + esc(b.code), `<label class=\"f\"><span>สภาพห้อง/อุปกรณ์หลังใช้งาน</span><select id=\"cond\"><option>ปกติ เรียบร้อย</option><option>ห้องไม่เรียบร้อย (แจ้งเตือนผู้ใช้)</option><option>อุปกรณ์มีปัญหา (ดูหมายเหตุ)</option></select></label>\n        <label class=\"f\"><span>หมายเหตุ</span><input type=\"text\" id=\"condNote\"></label>${truthy(b.record) ? `<label class=\"f\"><span>ลิงก์ไฟล์วิดีโอ (แนบภายหลังได้)</span><input type=\"url\" id=\"vurl\" value=\"${esc(b.videoUrl)}\" placeholder=\"https://drive.google.com/…\"></label>` : ''}`,\n        '<button class=\"btn ghost\" data-x>ยกเลิก</button><button class=\"btn dark\" id=\"coOk\">เช็กเอาต์</button>');\n      $('#coOk', m).onclick = () => { const p = { condition: $('#cond', m).value + ($('#condNote', m).value ? ' — ' + $('#condNote', m).value : '') }; if ($('#vurl', m)) p.videoUrl = $('#vurl', m).value; m.close(); run(p); };\n      return;\n    }\n    if (act === 'delete') return confirmBox('ลบรายการ ' + b.code + ' ถาวร? (แนะนำใช้ “ยกเลิก” แทนเพื่อเก็บประวัติ)', 'ลบถาวร').then(ok => ok && api('deleteBooking', id).then(() => { toast('ลบแล้ว', 'ok'); const m = $('.modal-bg'); if (m) m.remove(); refresh(); }).catch(e => toast(e.message, 'err')));\n    if (act === 'noshow') return confirmBox('บันทึกว่า “ไม่มาใช้ห้อง” สำหรับ ' + b.code + '?', 'บันทึก', 'warn').then(ok => ok && run());\n    run();\n  }\n  function bookingDetail(id) {\n    const b = A.bookings.find(x => x.id === id); if (!b) return;\n    const r = roomOf(b.roomId);\n    const fb = A.feedback.find(f => f.bookingId === b.id);\n    const evs = A.evaluations.filter(e => e.bookingId === b.id);\n    const acts = [];\n    if (b.status === 'pending') acts.push(['approve', 'ok', 'อนุมัติ'], ['reject', 'ghost', 'ไม่อนุมัติ']);\n    if (b.status === 'approved') acts.push(['checkin', 'info', 'เช็กอิน'], ['noshow', 'warn', 'ไม่มาใช้ห้อง']);\n    if (b.status === 'checkedin') acts.push(['checkout', 'dark', 'เช็กเอาต์']);\n    if (['pending', 'approved'].indexOf(b.status) !== -1) acts.push(['cancel', 'red', 'ยกเลิก']);\n    if (['rejected', 'cancelled', 'noshow'].indexOf(b.status) !== -1) acts.push(['reopen', 'ghost', 'เปิดพิจารณาใหม่']);\n    const m = modal(`${esc(b.code)} ${stBadge(b.status)}`, `\n      <dl class=\"kv\"><dt>ห้อง</dt><dd><span class=\"dot\" style=\"--c:${esc(r.color)}\"></span>${esc(r.name)}</dd><dt>วันเวลา</dt><dd>${thL(b.date)} · <b>${b.start}–${b.end} น.</b> (${fmt(hours(b))} ชม.)</dd>\n        <dt>หัวข้อ</dt><dd>${esc(b.title)}</dd><dt>วัตถุประสงค์</dt><dd>${esc(P.purposes[b.purpose] || '')}</dd><dt>ผู้จอง</dt><dd>${esc(b.name)} (${esc(P.userTypes[b.userType] || '')})${b.studentId ? ' · ' + esc(b.studentId) : ''}</dd>\n        <dt>ติดต่อ</dt><dd>${b.phone ? `<a href=\"tel:${esc(b.phone)}\">${esc(b.phone)}</a>` : '-'} ${b.email ? ' · <a href=\"mailto:' + esc(b.email) + '\">' + esc(b.email) + '</a>' : ''}</dd>\n        <dt>คณะ/สาขา</dt><dd>${esc(b.faculty || '-')} ${esc(b.major || '')}</dd><dt>รายวิชา</dt><dd>${esc(b.course || '-')}</dd><dt>อาจารย์</dt><dd>${esc(b.advisor || '-')}</dd>\n        <dt>จำนวน</dt><dd>${esc(b.participants)} คน</dd><dt>อุปกรณ์</dt><dd>${esc(b.equipment || '-')}</dd><dt>บริการ</dt><dd>${truthy(b.record) ? '🎥 บันทึกวิดีโอ ' : ''}${truthy(b.support) ? '🙋 ต้องการเจ้าหน้าที่ช่วย' : ''}${!truthy(b.record) && !truthy(b.support) ? '-' : ''}</dd>\n        ${b.note ? `<dt>หมายเหตุผู้จอง</dt><dd>${esc(b.note)}</dd>` : ''}${b.cancelReason ? `<dt>ยกเลิก</dt><dd>${esc(b.cancelReason)}</dd>` : ''}\n        <dt>เช็กอิน/เอาต์</dt><dd>${b.checkinAt ? thDT(b.checkinAt) : '-'} / ${b.checkoutAt ? thDT(b.checkoutAt) : '-'} ${b.condition ? '· ' + esc(b.condition) : ''}</dd>\n        <dt>ที่มา</dt><dd>${b.source === 'staff' ? 'เจ้าหน้าที่บันทึก' : 'จองออนไลน์'} · ${thDT(b.createdAt)}${b.decidedBy ? ' · พิจารณาโดย ' + esc(b.decidedBy) : ''}${b.series ? ' · 🔁 จองซ้ำรายสัปดาห์' : ''}</dd>\n        <dt>ประเมิน</dt><dd>${fb ? '⭐ ความพึงพอใจ ' + esc(fb.q6) + '/5' : 'ยังไม่ประเมินความพึงพอใจ'} · 📝 ประเมินการสอน ${evs.length} คน</dd></dl>\n      <div class=\"card mt\" style=\"box-shadow:none;background:var(--bg-2)\"><label class=\"f\"><span>หมายเหตุถึงผู้จอง (แสดงในหน้าตรวจสอบสถานะ)</span><input type=\"text\" id=\"sn\" value=\"${esc(b.staffNote)}\"></label>\n        <label class=\"f\"><span>ลิงก์ไฟล์วิดีโอการสอน (Google Drive)</span><input type=\"url\" id=\"vu\" value=\"${esc(b.videoUrl)}\" placeholder=\"https://drive.google.com/…\"></label><button class=\"btn sm\" id=\"saveNote\">บันทึกหมายเหตุ/ลิงก์ (แจ้งผู้จองทางอีเมล)</button></div>`,\n      acts.map(a => `<button class=\"btn ${a[1]}\" data-a=\"${a[0]}\">${a[2]}</button>`).join('') + `<button class=\"btn ghost\" id=\"editBk\">✎ แก้ไข</button>${isAdmin() ? '<button class=\"btn ghost\" data-a=\"delete\">🗑</button>' : ''}`, { wide: true });\n    $$('[data-a]', m).forEach(x => x.onclick = () => doAction(b.id, x.dataset.a));\n    $('#editBk', m).onclick = () => { m.close(); bookingForm(b); };\n    $('#saveNote', m).onclick = () => api('setBookingStatus', b.id, 'note', { staffNote: $('#sn', m).value, videoUrl: $('#vu', m).value }).then(() => { toast('บันทึกแล้ว', 'ok'); m.close(); refresh(); }).catch(e => toast(e.message, 'err'));\n  }\n  function bookingForm(b) {\n    const isNew = !b.id;\n    const m = modal(isNew ? '＋ เพิ่มการจอง (โดยเจ้าหน้าที่)' : '✎ แก้ไขการจอง ' + esc(b.code), `<form id=\"sbf\">\n      <div class=\"fgrid\"><label class=\"f\"><span>ห้อง *</span><select name=\"roomId\">${A.rooms.filter(r => truthy(r.active)).map(r => `<option value=\"${r.id}\" ${r.id === b.roomId ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select></label>\n        <label class=\"f\"><span>วันที่ *</span><input type=\"date\" name=\"date\" value=\"${esc(b.date || A.today)}\"></label>\n        <label class=\"f\"><span>เวลาเริ่ม *</span><input type=\"time\" name=\"start\" value=\"${e      if (F.room && b.roomId !== F.room) return false;\n        if (F.from && b.date < F.from) return false; if (F.to && b.date > F.to) return false;\n        if (q && [b.code, b.name, b.title, b.course, b.phone, b.studentId, b.advisor, b.email].join(' ').toLowerCase().indexOf(q) === -1) return false;\n        return true;\n      }).sort((a, b) => F.status === 'active' || F.status === 'pending' ? (a.date + a.start).localeCompare(b.date + b.start) : (b.date + b.start).localeCompare(a.date + a.start));\n    };\n    const draw = () => {\n      const rows = list();\n      $('#cnt').textContent = 'พบ ' + rows.length + ' รายการ · ' + fmt(rows.reduce((s, b) => s + hours(b), 0)) + ' ชั่วโมง';\n      $('#tbl').innerHTML = `<tr><th><input type=\"checkbox\" id=\"ckAll\"></th><th>วันเวลา</th><th>ห้อง</th><th>หัวข้อ / ผู้จอง</th><th>สถานะ</th><th></th></tr>` + (rows.slice(0, 400).map(b => {\n        const r = roomOf(b.roomId);\n        return `<tr class=\"click\" data-open=\"${b.id}\"><td onclick=\"event.stopPropagation()\">${b.status === 'pending' ? `<input type=\"checkbox\" class=\"ck\" value=\"${b.id}\">` : ''}</td><td class=\"nowrap\">${thD(b.date)}<div class=\"small\"><b>${b.start}–${b.end}</b></div></td>\n          <td><span class=\"dot\" style=\"--c:${esc(r.color)}\"></span>${esc(r.code || r.name)}</td><td>${esc(b.title)} ${truthy(b.record) ? (b.videoUrl ? '🎬' : '🎥') : ''}<div class=\"xs muted\">${esc(b.name)} · ${esc(P.userTypes[b.userType] || '')}${b.course ? ' · ' + esc(b.course) : ''} · ${esc(b.code)}</div></td>\n          <td>${stBadge(b.status)}</td><td class=\"nowrap\">${b.status === 'pending' ? `<button class=\"btn sm ok\" data-act=\"approve\" data-id=\"${b.id}\">✓</button>` : b.status === 'approved' && b.date === A.today ? `<button class=\"btn sm info\" data-act=\"checkin\" data-id=\"${b.id}\">เช็กอิน</button>` : b.status === 'checkedin' ? `<button class=\"btn sm dark\" data-act=\"checkout\" data-id=\"${b.id}\">เช็กเอาต์</button>` : ''}</td></tr>`;\n      }).join( lass=\"mt0\">🗓️ ปฏิทินห้อง</h2><button class=\"btn sm\" id=\"nb\">＋ เพิ่มการจอง</button></div><div id=\"calBox\"></div>`;\n    $('#nb').onclick = () => bookingForm({});\n    const adminLoad = (from, to) => Promise.resolve({\n      items: A.bookings.filter(b => b.date >= from && b.date <= to && ACTIVE.indexOf(b.status) !== -1).map(b => ({ id: b.id, roomId: b.roomId, date: b.date, start: b.start, end: b.end, status: b.status, purpose: b.purpose, label: b.title, who: b.name, course: b.course })),\n      closures: A.closures.filter(c => c.date <= to && (c.endDate || c.date) >= from)\n    });\n    calendar($('#calBox'), { state: ST.calA || (ST.calA = { mode: 'week', date: A.today, room: 'all' }), admin: true, load: adminLoad,\n      onSlot: (roomId, date, time) => bookingForm({ roomId: roomId, date: date, start: time, end: hhmm(mins(time) + 60) }), onItem: it => bookingDetail(it.id) });\n  }\n\n  /* ---------- คำร้อง ---------- */\n  function aRequests(el) {\n    let fs = ST.rqF || 'open';\n    el.innerHTML = `<div class=\"row between\"><h2 class=\"mt0\">✉️ คำร้อง</h2><button class=\"btn sm ghost\" id=\"exp\">⬇ CSV</button></div>\n      <div class=\"filters\"><select id=\"fs\"><option value=\"open\">ค้างดำเนินการ</option><option value=\"\">ทั้งหมด</option>${Object.keys(P.requestStatus).map(k => `<option value=\"${k}\">${esc(P.requestStatus[k])}</option>`).join('')}</select>\n      <select id=\"ft\"><option value=\"\">ทุกประเภท</option>${Object.keys(P.requestTypes).map(k => `<option value=\"${k}\">${esc(P.requestTypes[k])}</option>`).join('')}</select></div><div class=\"card tscroll\" style=\"padding:0\"><table class=\"t\" id=\"tbl\"></table></div>`;\n    $('#fs').value = fs;\n    const list = () => A.requests.filter(q => (fs === 'open' ? (q.status === 'new' || q.status === 'progress') : !fs || q.status === fs) && (!$('#ft').value || q.type === $('#ft').value)).sort((a, b) => b.createdAt.localeCompare(a.createdAt));\n    const draw = () => {\n      $('#tbl').innerHTML = '<tr><th>วันที่</th><th>ประเภท / เรื่อง</th><th>ผู้ยื่น</th><th>สถานะ</th></tr>' + (list().map(q => `<tr class=\"click\" data-q=\"${q.id}\"><td class=\"nowrap\">${thDT(q.createdAt)}<div class=\"xs muted\">${esc(q.code)}</div></td>\n        <td><div class=\"xs muted\">${esc(P.requestTypes[q.type])}</div>${esc(q.subject)}${q.needDate ? `<div class=\"xs\">ต้องการ ${thD(q.needDate)}</div>` : ''}</td><td>${esc(q.name)}<div class=\"xs muted\">${esc(q.phone)}</div></td><td>${rqBadge(q.status)}</td></tr>`).join('') || '<tr><td colspan=\"4\" class=\"empty\">ไม่มีคำร้อง</td></tr>');\n      $$('[data-q]').forEach(tr => tr.onclick = () => reqDetail(tr.dataset.q));\n    };\n    $('#fs').onchange = e => { fs = ST.rqF = e.target.value; draw(); };\n    $('#ft').onchange = draw;\n    $('#exp').onclick = () => download('requests-' + A.today + '.csv', csv(list(), [['code', 'รหัส'], ['createdAt', 'วันที่ยื่น'], [q => P.requestTypes[q.type], 'ประเภท'], ['subject', 'เรื่อง'], ['detail', 'รายละเอียด'], ['name', 'ผู้ยื่น'], ['phone', 'โทร'], ['email', 'อีเมล'], [q => P.requestStatus[q.status], 'สถานะ'], ['response', 'คำตอบ'], ['handledBy', 'ผู้ดำเนินการ']]));\n    draw();\n  }\n  function reqDetail(id) {\n    const q = A.requests.find(x => x.id === id);\n    const m = modal(esc(q.code) + ' · ' + esc(P.requestTypes[q.type]), `<dl class=\"kv\"><dt>เรื่อง</dt><dd><b>${esc(q.subject)}</b></dd><dt>รายละเอียด</dt><dd>${esc(q.detail).replace(/\\n/g, '<br>')}</dd>\n      <dt>ผู้ยื่น</dt><dd>${esc(q.name)} (${esc(P.userTypes[q.userType] || '')}) ${esc(q.studentId)} ${esc(q.faculty)}</dd><dt>ติดต่อ</dt><dd>${esc(q.phone)} ${q.email ? '· ' + esc(q.email) : ''}</dd>\n      ${q.needDate ? `<dt>วันที่ต้องการ</dt><dd>${thL(q.needDate)}</dd>` : ''}${q.refCode ? `<dt>อ้างอิง</dt><dd>${esc(q.refCode)}</dd>` : ''}${q.link ? `<dt>แนบ</dt><dd><a href=\"${link(q.link)}\" target=\"_blank\" rel=\"noopener\">เปิดเอกสารแนบ</a></dd>` : ''}\n      <dt>ยื่นเมื่อ</dt><dd>${thDT(q.createdAt)}</dd>${q.handledBy ? `<dt>ดำเนินการโดย</dt><dd>${esc(q.handledBy)} · ${thDT(q.updatedAt)}</dd>` : ''}</dl>\n      <label class=\"f mt\"><span>สถานะ</span><select id=\"qs\">${Object.keys(P.requestStatus).map(k => `<option value=\"${k}\" ${k === q.status ? 'selected' : ''}>${esc(P.requestStatus[k])}</option>`).join('')}</select></label>\n      <label class=\"f\"><span>คำตอบ / ผลการดำเนินการ (ผู้ยื่นเห็นในหน้าตรวจสอบสถานะ)</span><textarea id=\"qr\">${esc(q.response)}</textarea></label>`,\n      `${isAdmin() ? '<button class=\"btn ghost\" id=\"qd\">🗑</button>' : ''}<button class=\"btn ghost\" data-x>ปิด</button><button class=\"btn\" id=\"qok\">บันทึก</button>`, { wide: true });\n    $('#qok', m).onclick = () => api('updateRequest', q.id, { status: $('#qs', m).value, response: $('#qr', m).value }).then(() => { m.close(); toast('บันทึกแล้ว', 'ok'); refresh(); }).catch(e => toast(e.message, 'err'));\n    const qd = $('#qd', m); if (qd) qd.onclick = () => confirmBox('ลบคำร้องนี้?', 'ลบ').then(ok => ok && api('deleteItem', 'Requests', q.id).then(() => { m.close(); refresh(); }));\n  }\n\n  /* ---------- ตัวแก้ไขแบบรวม (อุปกรณ์ วันปิด ห้อง ข่าว เอกสาร) ---------- */\n  function itemForm(table, item, fields, title) {\n    const m = modal(title, `<form id=\"itf\"><div class=\"fgrid\">${fields.map(fd => {\n      const v = item[fd.k] != null && item[fd.k] !== '' ? item[fd.k] : (fd.def != null ? fd.def : '');\n      if (fd.t === 'check') return `<label class=\"check\" style=\"grid-column:1/-1\"><input type=\"checkbox\" name=\"${fd.k}\" ${truthy(v) ? 'checked' : ''}> ${fd.l}</label>`;\n      if (fd.t === 'select') return `<label class=\"f\"><span>${fd.l}</span><select name=\"${fd.k}\">${fd.o.map(o => `<option value=\"${esc(o[0])}\" ${String(o[0]) === String(v) ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select></label>`;\n      if (fd.t === 'area') return `<label class=\"f\" style=\"grid-column:1/-1\"><span>${fd.l}</span><textarea name=\"${fd.k}\" rows=\"${fd.rows || 4}\">${esc(v)}</textarea></label>`;\n      return `<label class=\"f\" ${fd.wide ? 'style=\"grid-column:1/-1\"' : ''}><span>${fd.l}</span><input type=\"${fd.t || 'text'}\" name=\"${fd.k}\" value=\"${esc(v)}\" ${fd.ph ? `placeholder=\"${esc(fd.ph)}\"` : ''}></label>`;\n    }).join('')}</div></form>`, `${item.id || item.key ? '<button class=\"btn ghost\" id=\"itDel\">🗑 ลบ</button>' : ''}<button class=\"btn ghost\" data-x>ยกเลิก</button><button class=\"btn\" id=\"itOk\">บันทึก</button>`, { wide: true });\n    $('#itOk', m).onclick = () => { const o = formData($('#itf', m)); if (item.id) o.id = item.id; if (item.key && !o.key) o.key = item.key; api('saveItem', table, o).then(() => { m.close(); toast('บันทึกแล้ว', 'ok'); refresh(); }).catch(e => toast(e.message, 'err')); };\n    const d = $('#itDel', m); if (d) d.onclick = () => confirmBox('ลบรายการนี้?', 'ลบ').then(ok => ok && api('deleteItem', table, item.id || item.key).then(() => { m.close(); toast('ลบแล้ว', 'ok'); refresh(); }).catch(e => toast(e.message, 'err')));\n  }\n  const roomOpts = (blank) => (blank ? [['', blank]] : []).concat(A.rooms.map(r => [r.id, r.name]));\n\n  /* ---------- อุปกรณ์ ---------- */\n  function aEquipment(el) {\n    const F = ST.eqF || (ST.eqF = { room: '', status: '' });\n    const fields = [{ k: 'code', l: 'รหัสครุภัณฑ์' }, { k: 'name', l: 'ชื่ออุปกรณ์ *' }, { k: 'category', l: 'หมวด', ph: 'เช่น กล้อง/บันทึกภาพ' }, { k: 'roomId', l: 'ประจำห้อง', t: 'select', o: roomOpts('— ไม่ระบุ —') },\n      { k: 'qty', l: 'จำนวน', t: 'number', def: 1 }, { k: 'status', l: 'สถานะ', t: 'select', o: Object.keys(P.equipStatus).map(k => [k, P.equipStatus[k]]) }, { k: 'serial', l: 'หมายเลขเครื่อง (S/N)' }, { k: 'acquired', l: 'ปีที่ได้มา' },\n      { k: 'lendable', l: 'ยืมออกนอกห้องได้ (แสดงให้เลือกในการจองทุกห้อง)', t: 'check' }, { k: 'note', l: 'หมายเหตุ / ประวัติซ่อม', t: 'area', rows: 3 }];\n    el.innerHTML = `<div class=\"row between\"><h2 class=\"mt0\">🎛️ อุปกรณ์และครุภัณฑ์</h2><div class=\"row\"><button class=\"btn sm ghost\" id=\"exp\">⬇ CSV</button><button class=\"btn sm\" id=\"add\">＋ เพิ่มอุปกรณ์</button></div></div>\n      <div class=\"grid kpis mb\" style=\"grid-template-columns:repeat(auto-fit,minmax(130px,1fr))\">${Object.keys(P.equipStatus).map(k => `<div class=\"kpi\"><div class=\"v\">${A.equipment.filter(e => e.status === k).reduce((s, e) => s + num(e.qty), 0)}</div><div class=\"l\">${eqBadge(k)}</div></div>`).join('')}</div>\n      <div class=\"filters\"><select id=\"fr\"><option value=\"\">ทุกห้อง</option>${A.rooms.map(r => `<option value=\"${r.id}\" ${F.room === r.id ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select>\n        <select id=\"fs\"><option value=\"\">ทุกสถานะ</option>${Object.keys(P.equipStatus).map(k => `<option value=\"${k}\" ${F.status === k ? 'selected' : ''}>${esc(P.equipStatus[k])}</option>`).join('')}</select></div>\n      <div class=\"card tscroll\" style=\"padding:0\"><table class=\"t\" id=\"tbl\"></table></div>`;\n    const list = () => A.equipment.filter(e => (!F.room || e.roomId === F.room) && (!F.status || e.status === F.status)).sort((a, b) => String(a.code).localeCompare(String(b.code)));\n    const draw = () => {\n      $('#tbl').innerHTML = '<tr><th>รหัส</th><th>อุปกรณ์</th><th>ห้อง</th><th class=\"right\">จำนวน</th><th>สถานะ</th></tr>' + (list().map(e => `<tr class=\"click\" data-e=\"${e.id}\"><td>${esc(e.code)}</td><td>${esc(e.name)} ${truthy(e.lendable) ? '<span class=\"badge\">ยืมได้</span>' : ''}<div class=\"xs muted\">${esc(e.category)}${e.note ? ' · ' + esc(e.note) : ''}</div></td>\n        <td class=\"small\">${esc(roomOf(e.roomId).name)}</td><td class=\"right\">${esc(e.qty)}</td><td>${eqBadge(e.status)}</td></tr>`).join('') || '<tr><td colspan=\"5\" class=\"empty\">ไม่มีข้อมูล</td></tr>');\n      $$('[data-e]').forEach(tr => tr.onclick = () => itemForm('Equipment', A.equipment.find(x => x.id === tr.dataset.e), fields, '✎ แก้ไขอุปกรณ์'));\n    };\n    $('#fr').onchange = e => { F.room = e.target.value; draw(); };\n    $('#fs').onchange = e => { F.status = e.target.value; draw(); };\n    $('#add').onclick = () => itemForm('Equipment', {}, fields, '＋ เพิ่มอุปกรณ์');\n    $('#exp').onclick = () => download('equipment-' + A.today + '.csv', csv(list(), [['code', 'รหัส'], ['name', 'ชื่อ'], ['category', 'หมวด'], [e => roomOf(e.roomId).name, 'ห้อง'], ['qty', 'จำนวน'], [e => P.equipStatus[e.status], 'สถานะ'], ['serial', 'S/N'], ['acquired', 'ปีที่ได้มา'], ['lendable', 'ยืมได้'], ['note', 'หมายเหตุ']]));\n    draw();\n  }\n\n  /* ---------- วันปิดห้อง ---------- */\n  function aClosures(el) {\n    const fields = [{ k: 'date', l: 'ตั้งแต่วันที่ *', t: 'date', def: A.today }, { k: 'endDate', l: 'ถึงวันที่ (เว้นว่าง = วันเดียว)', t: 'date' }, { k: 'roomId', l: 'ห้อง', t: 'select', o: roomOpts('ทุกห้อง') },\n      { k: 'start', l: 'เวลาเริ่ม (เว้นว่าง = ทั้งวัน)', t: 'time' }, { k: 'end', l: 'เวลาสิ้นสุด', t: 'time' }, { k: 'reason', l: 'เหตุผล', wide: true, ph: 'เช่น วันหยุดราชการ / ซ่อมบำรุง / สอบปลายภาค' }];\n    const rows = A.closures.slice().sort((a, b) => b.date.localeCompare(a.date));\n    el.innerHTML = `<div class=\"row between\"><h2 class=\"mt0\">⛔ วันปิดห้อง / วันหยุด</h2><button class=\"btn sm\" id=\"add\">＋ เพิ่ม</button></div>\n      <p class=\"small muted mt0\">ช่วงเวลาที่ปิดจะจองไม่ได้ และแสดงในตารางการใช้ห้อง (การจองเดิมไม่ถูกยกเลิกอัตโนมัติ — ตรวจและแจ้งผู้จองในเมนูการจอง)</p>\n      <div class=\"card tscroll\" style=\"padding:0\"><table class=\"t\"><tr><th>วันที่</th><th>ห้อง</th><th>เวลา</th><th>เหตุผล</th></tr>${rows.map(c => `<tr class=\"click\" data-c=\"${c.id}\" style=\"${(c.endDate || c.date) < A.today ? 'opacity:.5' : ''}\"><td class=\"nowrap\">${thD(c.date)}${c.endDate ? ' – ' + thD(c.endDate) : ''}</td><td>${c.roomId ? esc(roomOf(c.roomId).name) : 'ทุกห้อง'}</td><td>${c.start ? c.start + '–' + c.end : 'ทั้งวัน'}</td><td>${esc(c.reason)}</td></tr>`).join('') || '<tr><td colspan=\"4\" class=\"empty\">ไม่มีข้อมูล</td></tr>'}</table></div>`;\n    $('#add').onclick = () => itemForm('Closures', {}, fields, '＋ เพิ่มวันปิดห้อง');\n    $$('[data-c]').forEach(tr => tr.onclick = () => itemForm('Closures', A.closures.find(x => x.id === tr.dataset.c), fields, '✎ แก้ไขวันปิดห้อง'));\n  }\n\n  /* ---------- ห้อง ---------- */\n  function aRooms(el) {\n    const fields = [{ k: 'code', l: 'รหัสห้อง' }, { k: 'name', l: 'ชื่อห้อง *' }, { k: 'kind', l: 'ประเภท' }, { k: 'building', l: 'อาคาร' }, { k: 'floor', l: 'ชั้น' }, { k: 'capacity', l: 'ความจุ (คน)', t: 'number' },\n      { k: 'color', l: 'สีในตาราง', t: 'color', def: '#c2185b' }, { k: 'order', l: 'ลำดับ', t: 'number' }, { k: 'image', l: 'ลิงก์รูปภาพ (https://…)', wide: true }, { k: 'description', l: 'รายละเอียด', t: 'area' },\n      { k: 'features', l: 'สิ่งอำนวยความสะดวก (บรรทัดละ 1 รายการ)', t: 'area', rows: 5 }, { k: 'bookable', l: 'เปิดให้จองออนไลน์', t: 'check', def: 'TRUE' }, { k: 'active', l: 'เปิดใช้งาน (แสดงบนเว็บ)', t: 'check', def: 'TRUE' }];\n    el.innerHTML = `<div class=\"row between\"><h2 class=\"mt0\">🏫 ห้อง</h2>${isAdmin() ? '<button class=\"btn sm\" id=\"add\">＋ เพิ่มห้อง</button>' : ''}</div>\n      <div class=\"grid g2\">${A.rooms.map(r => `<div class=\"card roomcard\" style=\"--c:${esc(r.color)}\"><div class=\"row between\"><h3 class=\"mt0\">${esc(r.name)}</h3>${truthy(r.active) ? '' : '<span class=\"badge\">ปิดใช้งาน</span>'}</div>\n        <div class=\"small muted\">${esc(r.code)} · ${esc(r.kind)} · ${fmt(r.capacity, 0)} ที่นั่ง · ${truthy(r.bookable) ? 'จองออนไลน์ได้' : 'เฉพาะเจ้าหน้าที่'}</div>\n        <div class=\"small mt\">📺 ป้ายหน้าห้อง: <code style=\"word-break:break-all\">${esc((CFG.baseUrl || '') + '?view=display&room=' + r.id)}</code></div>\n        <div class=\"row mt\">${isAdmin() ? `<button class=\"btn sm\" data-r=\"${r.id}\">✎ แก้ไข</button>` : ''}<button class=\"btn sm ghost\" data-cp=\"${esc((CFG.baseUrl || '') + '?view=display&room=' + r.id)}\">📋 คัดลอกลิงก์ป้าย</button><a class=\"btn sm ghost\" href=\"#display/${esc(r.id)}\">เปิดป้าย</a></div></div>`).join('')}</div>`;\n    const add = $('#add'); if (add) add.onclick = () => itemForm('Rooms', {}, fields, '＋ เพิ่มห้อง');\n    $$('[data-r]').forEach(b => b.onclick = () => itemForm('Rooms', A.rooms.find(x => x.id === b.dataset.r), fields, '✎ แก้ไขห้อง'));\n    $$('[data-cp]').forEach(b => b.onclick = () => copy(b.dataset.cp));\n  }\n\n  /* ---------- ผลประเมิน ---------- */\n  function aEvals(el) {\n    const fb = A.feedback;\n    const avg = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : 0;\n    const items = P.feedbackItems.map((q, i) => ({ q: q, v: avg(fb.map(f => num(f['q' + (i + 1)])).filter(Boolean)) }));\n    const all = {};\n    A.evaluations.forEach(e => { let sc = {}; try { sc = JSON.parse(e.scores || '{}'); } catch (x) { } Object.keys(sc).forEach(k => { const v = sc[k].filter(n => n > 0); if (v.length) { all[k] = all[k] || []; all[k].push(avg(v)); } }); });\n    const byB = {};\n    A.evaluations.forEach(e => { (byB[e.bookingId] = byB[e.bookingId] || []).push(e); });\n    el.innerHTML = `<h2 class=\"mt0\">⭐ ผลการประเมิน</h2><div class=\"tabs\"><button data-t=\"fb\" class=\"on\">ความพึงพอใจการใช้บริการ (${fb.length})</button><button data-t=\"ev\">ทักษะการสอน (${A.evaluations.length})</button></div><div id=\"evBody\"></div>`;\n    const drawFb = () => { $('#evBody').innerHTML = `<div class=\"grid g2\" style=\"align-items:start\"><div class=\"card\"><h3>ค่าเฉลี่ยรายข้อ (เต็ม 5)</h3>${items.map(x => `<div class=\"hbar\"><span class=\"small\">${esc(x.q)}</span><div class=\"bar\"><i style=\"width:${x.v / 5 * 100}%\"></i></div><b class=\"small right\">${x.v ? x.v.toFixed(2) : '-'}</b></div>`).join('')}\n        <div class=\"small muted mt\">ระดับ: 4.51–5.00 มากที่สุด · 3.51–4.50 มาก · 2.51–3.50 ปานกลาง · 1.51–2.50 น้อย · 1.00–1.50 น้อยที่สุด</div><button class=\"btn sm ghost mt\" id=\"expFb\">⬇ CSV</button></div>\n      <div class=\"card\"><h3>ข้อเสนอแนะล่าสุด</h3>${fb.filter(f => f.comment).slice(-30).reverse().map(f => `<div class=\"newsitem small
