  var props = PropertiesService.getScriptProperties();
  if (!props.getProperty('SETUP_DONE')) {
    var lock = LockService.getScriptLock();
    lock.waitLock(60000);
    try { if (!props.getProperty('SETUP_DONE')) setup(); } finally { lock.releaseLock(); }
  }
  try { ensureSchema_(); } catch (err) { }
}

function json_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj)).setMimeType(ContentService.MimeType.JSON);

/** เว็บไซต์ส่งคำขอมาที่นี่: body = {"fn": "ชื่อฟังก์ชัน", "args": [...]} */
function doPost(e) {
  try {
    var req = JSON.parse((e && e.postData && e.postData.contents) || '{}');
    var fns = apiFunctions_();
    if (!req.fn || !Object.prototype.hasOwnProperty.call(fns, req.fn)) throw new Error('ไม่รู้จักคำสั่ง');
    ensureReady_();
    var args = Array.isArray(req.args) ? req.args.slice(0, 5) : [];
    return json_({ ok: true, data: fns[req.fn].apply(null, args) });
  } catch (err) {
    return json_({ ok: false, error: String((err && err.message) || err) });
  }
}

function ensureSheet_(ss, name) {
  var headers = SCHEMA[name];
  var sh = ss.getSheetByName(name) || ss.insertSheet(name);
  var lastCol = sh.getLastColumn();
  if (sh.getLastRow() === 0 || lastCol === 0) {
    sh.getRange(1, 1, 1, headers.length).setValues([headers]);
  } else {
    var existing = sh.getRange(1, 1, 1, lastCol).getValues()[0];
    var missing = headers.filter(function (h) { return existing.indexOf(h) === -1; });
    if (missing.length) sh.getRange(1, lastCol + 1, 1, missing.length).setValues([missing]);
  }
  var width = Math.max(headers.length, sh.getLastColumn());
  sh.setFrozenRows(1);
  sh.getRange(1, 1, 1, width).setFontWeight('bold').setBackground('#fbe3ee');
  sh.getRange(1, 1, sh.getMaxRows(), width).setNumberFormat('@');
  return sh;
}

/* ============================================================
 *  DATABASE HELPERS
 * ============================================================ */

var _ss = null;
function db_() {
  if (_ss) return _ss;
  var id = SHEET_ID || PropertiesService.getScriptProperties().getProperty('DB_ID');
  if (!id) throw new Error('ยังไม่ได้ติดตั้งระบบ (รัน setup ก่อน)');
  _ss = SpreadsheetApp.openById(id);
  return _ss;
}

function sheet_(name) {
  if (!SCHEMA[name]) throw new Error('ไม่รู้จักตาราง: ' + name);
  return db_().getSheetByName(name) || ensureSheet_(db_(), name);
}

function headers_(sh) {
  var c = sh.getLastColumn();
  return c ? sh.getRange(1, 1, 1, c).getValues()[0].map(String) : [];
}

var _tableCache = {};
function readTable_(name) {
  if (_tableCache[name]) return _tableCache[name].map(function (r) { var o = {}; for (var k in r) o[k] = r[k]; return o; });
  var values = sheet_(name).getDataRange().getValues();
  var out = [];
  if (values.length >= 2) {
    var head = values[0].map(String);
    for (var r = 1; r < values.length; r++) {
      if (values[r].join('') === '') continue;
      var o = {};
      for (var c = 0; c < head.length; c++) {
        if (!head[c]) continue;
        var v = values[r][c];
        if (v instanceof Date) v = v.toISOString();
        o[head[c]] = v === null || v === undefined ? '' : String(v);
      }
      out.push(o);
    }
  }
  _tableCache[name] = out;
  return readTable_(name);
}

function rowIndex_(sh, id) {
  var last = sh.getLastRow();
  if (last < 2) return -1;
  var ids = sh.getRange(2, 1, last - 1, 1).getValues();
  for (var i = 0; i < ids.length; i++) if (String(ids[i][0]) === String(id)) return i + 2;
  return -1;
}

function toRow_(head, obj) {
  return head.map(function (h) {
    var v = obj[h];
    if (v === undefined || v === null) return '';
    if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
    if (typeof v === 'object') return JSON.stringify(v);
    return String(v);
  });
}

function insertRow_(name, obj) {
  var sh = sheet_(name), head = headers_(sh), target = sh.getLastRow() + 1;
  if (target > sh.getMaxRows()) sh.insertRowsAfter(sh.getMaxRows(), 500);
  sh.getRange(target, 1, 1, head.length).setNumberFormat('@').setValues([toRow_(head, obj)]);
  delete _tableCache[name];
  return fill_(name, obj);
}

/** เพิ่มหลายแถวในครั้งเดียว (เร็วกว่าเพิ่มทีละแถวมาก) */
function appendRows_(name, objs) {
  if (!objs || !objs.length) return;
  var sh = sheet_(name), head = headers_(sh), start = sh.getLastRow() + 1;
  var need = start + objs.length - 1 - sh.getMaxRows();
  if (need > 0) sh.insertRowsAfter(sh.getMaxRows(), need + 200);
  sh.getRange(start, 1, objs.length, head.length).setNumberFormat('@').setValues(objs.map(function (o) { return toRow_(head, o); }));
  delete _tableCache[name];
}

function updateRow_(name, obj) {
  var sh = sheet_(name), head = headers_(sh), idx = rowIndex_(sh, obj[head[0]]);
  if (idx === -1) return insertRow_(name, obj);
  var cur = sh.getRange(idx, 1, 1, head.length).getValues()[0], merged = {};
  head.forEach(function (h, i) { merged[h] = cur[i]; });
  Object.keys(obj).forEach(function (k) { if (head.indexOf(k) !== -1) merged[k] = obj[k]; });
  sh.getRange(idx, 1, 1, head.length).setNumberFormat('@').setValues([toRow_(head, merged)]);
  delete _tableCache[name];
  var out = {};
  head.forEach(function (h) { out[h] = merged[h] === undefined || merged[h] === null ? '' : String(merged[h]); });
  return fill_(name, out);
}

function deleteRow_(name, id) {
  var sh = sheet_(name), idx = rowIndex_(sh, id);
  if (idx === -1) return false;
  sh.deleteRow(idx);
  delete _tableCache[name];
  return true;
}

function getRow_(name, id) {
  var rows = readTable_(name), k = SCHEMA[name][0];
  for (var i = 0; i < rows.length; i++) if (String(rows[i][k]) === String(id)) return rows[i];

}

/* ============================================================
 *  AUTH — เจ้าหน้าที่ (ชื่อผู้ใช้/รหัสผ่าน)
 *  role: admin = ผู้ดูแลระบบ (ทุกเมนู), staff = เจ้าหน้าที่ประจำห้อง (อนุมัติ เช็กอิน อุปกรณ์ คำร้อง)
 *  ผู้ใช้ทั่วไป (นักศึกษา/อาจารย์) ไม่ต้องเข้าสู่ระบบ — ใช้ "รหัสการจอง + เบอร์โทรหรืออีเมล" ติดตามรายการ
 * ============================================================ */

function hashPassword_(password, salt) {
  var raw = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, salt + '::' + password, Utilities.Charset.UTF_8);
  return raw.map(function (b) { var v = (b < 0 ? b + 256 : b).toString(16); return v.length === 1 ? '0' + v : v; }).join('');
}

function checkLockout_(key) {
  var cache = CacheService.getScriptCache();
  if (Number(cache.get('fail_' + key) || 0) >= 5) throw new Error('กรอกข้อมูลผิดหลายครั้ง กรุณารอ 15 นาทีแล้วลองใหม่');
  if (Number(cache.get('fail_all') || 0) >= 80) throw new Error('มีการกรอกผิดจำนวนมาก กรุณาลองใหม่ภายหลัง');
}

function recordFail_(key) {
  var cache = CacheService.getScriptCache();
  cache.put('fail_' + key, String(Number(cache.get('fail_' + key) || 0) + 1), 900);
  cache.put('fail_all', String(Number(cache.get('fail_all') || 0) + 1), 600);
}

function newSession_(sess) {
  var token = Utilities.getUuid() + Utilities.getUuid().replace(/-/g, '');
  CacheService.getScriptCache().put('s_' + token, JSON.stringify(sess), SESSION_TTL);
  return token;
}

/** เข้าสู่ระบบเจ้าหน้าที่ */
function staffLogin(username, password) {
  username = String(username || '').trim().toLowerCase();
  password = String(password || '');
  if (!username || !password) throw new Error('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');
  var key = 'u_' + username.replace(/[^a-z0-9._-]/g, '');
  checkLockout_(key);
  var u = readTable_('Users').filter(function (x) { return String(x.username).toLowerCase() === username; })[0];
  if (!u || hashPassword_(password, u.salt) !== u.passwordHash) { recordFail_(key); throw new Error('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'); }
  if (!isTrue_(u.active)) throw new Error('บัญชีนี้ถูกระงับการใช้งาน');
  CacheService.getScriptCache().remove('fail_' + key);
  updateRow_('Users', { id: u.id, lastLogin: nowIso_() });
  var sess = { id: u.id, role: u.role === 'admin' ? 'admin' : 'staff', name: u.name, username: u.username };
  log_(u.username, 'login', '', '');
  return { token: newSession_(sess), user: sess };
}

function logout(token) {
  try { CacheService.getScriptCache().remove('s_' + token); } catch (err) { }
  return true;
}

/** ตรวจ token → ข้อมูลผู้ใช้ (โยน error ถ้าไม่ผ่าน) */
function requireSession_(token, roles) {
  if (!token || !/^[a-zA-Z0-9-]{20,100}$/.test(String(token))) throw new Error('AUTH: กรุณาเข้าสู่ระบบ');
  var cache = CacheService.getScriptCache();
  var raw = cache.get('s_' + token);
  if (!raw) throw new Error('AUTH: หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบใหม่');
  var s = JSON.parse(raw);
  var rec = getRow_('Users', s.id);
  if (!rec || !isTrue_(rec.active)) { cache.remove('s_' + token); throw new Error('AUTH: บัญชีนี้ถูกระงับการใช้งาน'); }
  s.role = rec.role === 'admin' ? 'admin' : 'staff';
  s.name = rec.name;
  cache.put('s_' + token, JSON.stringify(s), SESSION_TTL);
  if (roles && roles.indexOf(s.role) === -1) throw new Error('ไม่มีสิทธิ์ทำรายการนี้ (เฉพาะผู้ดูแลระบบ)');
  return s;
}

function newId_() { return Utilities.getUuid().replace(/-/g, '').substr(0, 12); }
function nowIso_() { return new Date().toISOString(); }
function todayIso_() { return Utilities.formatDate(new Date(), 'Asia/Bangkok', 'yyyy-MM-dd'); }
function nowLocal_() { return Utilities.formatDate(new Date(), 'Asia/Bangkok', 'yyyy-MM-dd HH:mm'); }
function isTrue_(v) { return v === true || String(v).toUpperCase() === 'TRUE' || v === '1' || v === 1; }

function num_(v) {
  var n = Number(String(v == null ? '' : v).replace(/[, ]/g, ''));
  return isNaN(n) ? NaN : Math.round(n * 100) / 100;
}

function normDate_(v) {
  var s = String(v || '').substr(0, 10);
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s)) return '';
  var d = new Date(s + 'T00:00:00Z');
  return isNaN(d.getTime()) || d.toISOString().substr(0, 10) !== s ? '' : s;
}

function normTime_(v) {
  var m = String(v || '').trim().match(/^(\d{1,2})[:.](\d{2})/);
  if (!m) return '';
  var h = Number(m[1]), mi = Number(m[2]);
  if (h > 23 || mi > 59) return '';
  return ('0' + h).slice(-2) + ':' + ('0' + mi).slice(-2);
}

function minutes_(t) { var p = String(t).split(':'); return Number(p[0]) * 60 + Number(p[1]); }
function hhmm_(m) { return ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + (m % 60)).slice(-2); }

/** วันในสัปดาห์ของวันที่ YYYY-MM-DD (0 = อาทิตย์) */
function dow_(date) { return new Date(date + 'T00:00:00Z').getUTCDay(); }

function addDays_(date, n) {
  var d = new Date(date + 'T00:00:00Z');
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().substr(0, 10);
}

function daysBetween_(a, b) { return Math.round((new Date(b + 'T00:00:00Z') - new Date(a + 'T00:00:00Z')) / 86400000); }

function text_(v, max) { return String(v == null ? '' : v).trim().substr(0, max || 300); }

function phoneDigits_(v) { return String(v || '').replace(/\D/g, ''); }

function validEmail_(v) { return /^[^\s@<>]+@[^\s@<>]+\.[^\s@<>]+$/.test(String(v || '')); }

function safeUrl_(v) {
  var s = text_(v, 500);
  return /^https:\/\/[^\s<>"']+$/i.test(s) ? s : '';
}

function esc_(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
}

function thaiDate_(date) {
  if (!normDate_(date)) return String(date || '');

/** สร้างรหัสอ้างอิงที่เดายาก เช่น MT6911-K7Q2 */
function newCode_(prefix, table) {
  var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  var ym = Utilities.formatDate(new Date(), 'Asia/Bangkok', 'yyyy-MM').split('-');
  var head = prefix + String(Number(ym[0]) + 543).substr(2) + ym[1] + '-';
  var used = {};
  readTable_(table).forEach(function (r) { used[r.code] = 1; });
  for (var tries = 0; tries < 50; tries++) {
    var c = head;
    for (var i = 0; i < 4; i++) c += chars.charAt(Math.floor(Math.random() * chars.length));
    if (!used[c]) return c;
  }
  return head + newId_().toUpperCase();
}

/**
 * ============================================================
 *  API สาธารณะ — ฟังก์ชันที่หน้าเว็บเรียกผ่าน google.script.run
 *  (ฟังก์ชันที่ลงท้ายด้วย _ เรียกจากหน้าเว็บไม่ได้)
 *  ผู้ใช้ทั่วไปไม่ต้องเข้าสู่ระบบ: จองห้อง → ได้ "รหัสการจอง"
 *  ใช้รหัส + เบอร์โทร/อีเมลที่กรอกไว้ เพื่อดูสถานะ ยกเลิก ประเมินความพึงพอใจ
 * ============================================================
 */

/* ------------------------------------------------------------
 *  ข้อมูลหน้าเว็บ
 * ------------------------------------------------------------ */

function getPublicData() {
  var s = getSettings_();
  var today = todayIso_();
  var rooms = readTable_('Rooms').filter(function (r) { return isTrue_(r.active); }).sort(byOrder_).map(publicRoom_);
  var equipment = readTable_('Equipment').filter(function (e) { return e.status !== 'retired'; }).map(function (e) {
    return { id: e.id, name: e.name, category: e.category, roomId: e.roomId, qty: e.qty, status: e.status, lendable: e.lendable };
  });
  return {
    site: {
      appName: s.appName || APP_NAME, org: s.org || '', building: s.building || '', address: s.address || '', phone: s.phone || '', email: s.email || '',
      line: s.line || '', facebook: s.facebook || '', mapUrl: s.mapUrl || '', hoursText: s.hoursText || '', heroTitle: s.heroTitle || '', heroText: s.heroText || '',
      welcome: s.welcome || '', announce: s.announce || '', staffText: s.staffText || ''
    },
    rules: rules_(s),
    rooms: rooms,
    equipment: equipment,
    pages: readTable_('Pages').sort(byOrder_).map(function (p) { return { key: p.key, title: p.title, icon: p.icon, body: p.body, inMenu: p.inMenu, order: p.order }; }),
    news: readTable_('News').filter(function (n) { return isTrue_(n.active); }).sort(function (a, b) {
      return (isTrue_(b.pinned) - isTrue_(a.pinned)) || String(b.date).localeCompare(String(a.date));
    }).slice(0, 20),
    docs: readTable_('Docs').filter(function (d) { return isTrue_(d.active); }).sort(byOrder_),
    closures: readTable_('Closures').filter(function (c) { return (c.endDate || c.date) >= today; }).sort(function (a, b) { return a.date.localeCompare(b.date); }),
    purposes: PURPOSES, userTypes: USER_TYPES, requestTypes: REQUEST_TYPES, requestStatus: REQUEST_STATUS, bookingStatus: BOOKING_STATUS,
    equipStatus: EQUIP_STATUS, feedbackItems: FEEDBACK_ITEMS, skills: SKILLS,
    today: today, now: nowLocal_()
  };
}

function publicRoom_(r) {
  return { id: r.id, code: r.code, name: r.name, building: r.building, floor: r.floor, capacity: r.capacity, kind: r.kind, description: r.description,
    features: r.features, image: r.image, color: r.color, bookable: r.bookable, order: r.order };
}

function byOrder_(a, b) {
  var d = (Number(a.order) || 0) - (Number(b.order) || 0);
  return d || String(a.createdAt || a.title || '').localeCompare(String(b.createdAt || b.title || ''));
}

/** ตารางการใช้ห้องในช่วงวันที่ (สูงสุด 62 วัน) — ไม่เปิดเผยเบอร์โทร/อีเมล */
function getSchedule(from, to) {
  from = normDate_(from); to = normDate_(to);
  if (!from || !to || to < from) throw new Error('ช่วงวันที่ไม่ถูกต้อง');
  if (daysBetween_(from, to) > 62) to = addDays_(from, 62);
  var r = rules_();
  var rooms = {};
  readTable_('Rooms').forEach(function (x) { rooms[x.id] = x; });
  var items = readTable_('Bookings').filter(function (b) {
    return b.date >= from && b.date <= to && ACTIVE_STATUS.indexOf(b.status) !== -1;
  }).map(function (b) {
    return { roomId: b.roomId, date: b.date, start: b.start, end: b.end, status: b.status, purpose: b.purpose, userType: b.userType,
      label: b.title || PURPOSES[b.purpose] || 'จองแล้ว', who: r.showNames ? b.name : '', course: b.course };
  }).sort(function (a, b) { return (a.date + a.start).localeCompare(b.date + b.start); });
  var closures = readTable_('Closures').filter(function (c) { return c.date <= to && (c.endDate || c.date) >= from; });
  return { from: from, to: to, items: items, closures: closures };
}

/** คืนข้อความเหตุผลถ้าช่วงเวลานี้ใช้ไม่ได้ ('' = ว่าง) */
function slotProblem_(roomId, date, start, end, excludeId, bufferMin) {
  var s = minutes_(start), e = minutes_(end), buf = bufferMin || 0;
  var closures = readTable_('Closures');
  for (var i = 0; i < closures.length; i++) {
    var c = closures[i];
    if (date < c.date || date > (c.endDate || c.date)) continue;
    if (c.roomId && c.roomId !== roomId) continue;
    if (c.start && c.end && !(e <= minutes_(c.start) || s >= minutes_(c.end))) return 'ห้องปิด ' + c.start + '–' + c.end + ' น. (' + c.reason + ')';
    if (!c.start || !c.end) return 'ห้องปิดให้บริการวันนี้ (' + (c.reason || 'วันหยุด') + ')';
  }
  var rows = readTable_('Bookings');
  for (var j = 0; j < rows.length; j++) {
    var b = rows[j];
    if (b.id === excludeId || b.roomId !== roomId || b.date !== date || ACTIVE_STATUS.indexOf(b.status) === -1) continue;
    if (s < minutes_(b.end) + buf && e + buf > minutes_(b.start)) return 'เวลาซ้อนกับการจอง ' + b.start + '–' + b.end + ' น.';
  }
  return '';
}

/** ตรวจความถูกต้องของข้อมูลการจอง (ใช้ทั้งหน้าบ้านและหลังบ้าน) → คืนอ็อบเจกต์ที่พร้อมบันทึก */
function cleanBooking_(f, isStaff) {
  f = f || {};
  var r = rules_();
  var room = getRow_('Rooms', f.roomId);
  if (!room || !isTrue_(room.active)) throw new Error('กรุณาเลือกห้อง');
  if (!isStaff && !isTrue_(room.bookable)) throw new Error('ห้องนี้ไม่เปิดให้จองออนไลน์ กรุณาติดต่อเจ้าหน้าที่');
  var date = normDate_(f.date), start = normTime_(f.start), end = normTime_(f.end);
  if (!date) throw new Error('กรุณาเลือกวันที่');
  if (!start || !end || minutes_(end) <= minutes_(start)) throw new Error('กรุณาเลือกเวลาเริ่มและเวลาสิ้นสุดให้ถูกต้อง');
  var b = {
    roomId: room.id, date: date, start: start, end: end,
    title: text_(f.title, 150), purpose: PURPOSES[f.purpose] ? f.purpose : 'other',
    userType: USER_TYPES[f.userType] ? f.userType : 'student',
    name: text_(f.name, 100), studentId: text_(f.studentId, 20).replace(/[^0-9A-Za-z-]/g, ''),
    faculty: text_(f.faculty, 100), major: text_(f.major, 100),
    phone: text_(f.phone, 20), email: text_(f.email, 120).toLowerCase(),
    course: text_(f.course, 150), advisor: text_(f.advisor, 100),
    participants: String(Math.max(1, Math.min(500, Math.round(Number(f.participants) || 1)))),
    equipment: (Array.isArray(f.equipment) ? f.equipment : String(f.equipment || '').split(','))
      .map(function (x) { return text_(x, 60).replace(/,/g, ' '); }).filter(String).slice(0, 15).join(', '),
    record: isTrue_(f.record) ? 'TRUE' : 'FALSE', support: isTrue_(f.support) ? 'TRUE' : 'FALSE',
    note: text_(f.note, 600)
  };
  if (!b.title) throw new Error('กรุณากรอกหัวข้อ / เรื่องที่สอน');
  if (!b.name) throw new Error('กรุณากรอกชื่อ-นามสกุลผู้จอง');
  if (!isStaff) {
    if (phoneDigits_(b.phone).length < 9 || phoneDigits_(b.phone).length > 10) throw new Error('กรุณากรอกเบอร์โทรศัพท์ 9–10 หลัก');
    if (b.email && !validEmail_(b.email)) throw new Error('รูปแบบอีเมลไม่ถูกต้อง');
    if (b.userType === 'student' && !b.studentId) throw new Error('กรุณากรอกรหัสนักศึกษา');
    if (b.userType === 'student' && r.requireAdvisor && !b.advisor) throw new Error('กรุณากรอกชื่ออาจารย์ผู้สอน / อาจารย์ที่ปรึกษารายวิชา');
    if (!isTrue_(f.consent)) throw new Error('กรุณายอมรับระเบียบการใช้ห้องและนโยบายข้อมูลส่วนบุคคล');
    var cap = Number(room.capacity) || 0;
    if (cap && Number(b.participants) > cap) throw new Error('จำนวนผู้เข้าใช้เกินความจุห้อง (' + cap + ' คน)');
    // กฎเวลา
    if (r.openDays.indexOf(dow_(date)) === -1) throw new Error('วัน' + THAI_DAYS[dow_(date)] + 'ไม่เปิดให้จองออนไลน์ หากจำเป็นกรุณายื่นคำร้องขอใช้นอกเวลา');
    if (minutes_(start) < minutes_(r.openTime) || minutes_(end) > minutes_(r.closeTime)) throw new Error('เวลาให้บริการ ' + r.openTime + '–' + r.closeTime + ' น. (นอกเวลากรุณายื่นคำร้อง)');
    if ((minutes_(end) - minutes_(start)) > r.maxHours * 60) throw new Error('จองได้ไม่เกินครั้งละ ' + r.maxHours + ' ชั่วโมง');
    var now = nowLocal_();
    var hoursAhead = (new Date(date + 'T' + start + ':00Z') - new Date(now.replace(' ', 'T') + ':00Z')) / 3600000;
    if (hoursAhead < r.minLeadHours) throw new Error(r.minLeadHours > 0 ? 'ต้องจองล่วงหน้าอย่างน้อย ' + r.minLeadHours + ' ชั่วโมง' : 'ไม่สามารถจองเวลาที่ผ่านมาแล้ว');
    if (daysBetween_(todayIso_(), date) > r.maxAdvanceDays) throw new Error('จองล่วงหน้าได้ไม่เกิน ' + r.maxAdvanceDays + ' วัน');
  }
  return b;
}

/* ------------------------------------------------------------
 *  จองห้อง (หน้าบ้าน)
 * ------------------------------------------------------------ */

function submitBooking(f) {
  f = f || {};
  if (f.website) throw new Error('ไม่สามารถส่งข้อมูลได้'); // honeypot กันบอต
  var cache = CacheService.getScriptCache();
  var burst = Number(cache.get('book_burst') || 0);
  if (burst > 40) throw new Error('มีการจองจำนวนมากในขณะนี้ กรุณาลองใหม่อีกครั้งใน 10 นาที');
  var b = cleanBooking_(f, false);
  var r = rules_();
  var saved = withLock_(function () {
    var today = todayIso_(), digits = phoneDigits_(b.phone);
    var mine = readTable_('Bookings').filter(function (x) {
      return phoneDigits_(x.phone) === digits && x.date >= today && (x.status === 'pending' || x.status === 'approved');
    });
    if (r.maxActivePerPerson > 0 && mine.length >= r.maxActivePerPerson) throw new Error('คุณมีรายการจองที่ยังไม่ถึงกำหนด ' + mine.length + ' รายการ (จองได้สูงสุด ' + r.maxActivePerPerson + ' รายการ)');
    var problem = slotProblem_(b.roomId, b.date, b.start, b.end, '', r.bufferMinutes);
    if (problem) throw new Error('ช่วงเวลานี้ไม่ว่าง: ' + problem + ' กรุณาเลือกเวลาอื่น');
    var now = nowIso_();
    b.id = newId_();
    b.code = newCode_('MT', 'Bookings');
    b.status = r.autoApprove ? 'approved' : 'pending';
    b.source = 'online';
    b.createdAt = now; b.updatedAt = now;
    if (r.autoApprove) { b.decidedBy = 'auto'; b.decidedAt = now; }
    return insertRow_('Bookings', b);
  });
  cache.put('book_burst', String(burst + 1), 600);
  log_('public', 'booking.create', saved.code, saved.name + ' · ' + saved.date + ' ' + saved.start + '-' + saved.end);
  notifyNewBooking_(saved);
  return { code: saved.code, status: saved.status, statusLabel: BOOKING_STATUS[saved.status], date: saved.date, start: saved.start, end: saved.end,
    roomName: (getRow_('Rooms', saved.roomId) || {}).name || '', hasEmail: !!saved.email };
}

/** หา booking จากรหัส + ตรวจเบอร์โทร/อีเมล */
function findMine_(table, code, contact) {
  code = String(code || '').trim().toUpperCase().replace(/\s/g, '');
  contact = String(contact || '').trim().toLowerCase();
  if (!code || !contact) throw new Error('กรุณากรอกรหัสอ้างอิง และเบอร์โทรศัพท์หรืออีเมลที่ใช้ตอนส่งข้อมูล');
  var key = 'c_' + code.replace(/[^A-Z0-9]/g, '');
  checkLockout_(key);
  var row = readTable_(table).filter(function (x) { return String(x.code).toUpperCase() === code; })[0];
  var ok = row && ((contact.indexOf('@') !== -1 && row.email && row.email.toLowerCase() === contact) ||
    (phoneDigits_(contact).length >= 9 && phoneDigits_(contact) === phoneDigits_(row.phone)));
  if (!ok) { recordFail_(key); throw new Error('ไม่พบรายการ หรือเบอร์โทร/อีเมลไม่ตรงกับที่บันทึกไว้'); }
  return row;
}

function bookingView_(b) {
  var room = getRow_('Rooms', b.roomId) || {};
  var now = nowLocal_();
  var startAt = b.date + ' ' + b.start, endAt = b.date + ' ' + b.end;
  var fb = readTable_('Feedback').filter(function (x) { return x.bookingId === b.id; })[0];
  var evs = readTable_('Evaluations').filter(function (x) { return x.bookingId === b.id; });
  return {
    code: b.code, roomId: b.roomId, roomName: room.name || '', building: room.building || '', date: b.date, dateText: thaiDate_(b.date), start: b.start, end: b.end,
    title: b.title, purpose: b.purpose, purposeLabel: PURPOSES[b.purpose] || '', userType: b.userType, name: b.name, course: b.course, advisor: b.advisor,
    participants: b.participants, equipment: b.equipment, record: b.record, support: b.support, note: b.note,
    status: b.status, statusLabel: BOOKING_STATUS[b.status] || b.status, staffNote: b.staffNote, videoUrl: b.videoUrl, cancelReason: b.cancelReason,
    checkinAt: b.checkinAt, checkoutAt: b.checkoutAt, createdAt: b.createdAt, decidedAt: b.decidedAt,
    canCancel: (b.status === 'pending' || b.status === 'approved') && startAt > now,
    canFeedback: !fb && (b.status === 'completed' || b.status === 'checkedin' || (b.status === 'approved' && endAt <= now)),
    feedbackDone: !!fb,
    evaluations: evalSummary_(evs)
  };
}

/** สรุปผลประเมินทักษะการสอนของการจองหนึ่งรายการ */
function evalSummary_(evs) {
  var bySkill = {};
  evs.forEach(function (e) {
    var sc = {};
    try { sc = JSON.parse(e.scores || '{}'); } catch (err) { sc = {}; }
    Object.keys(sc).forEach(function (k) {
      var arr = sc[k] || [], v = arr.filter(function (x) { return Number(x) > 0; });
      if (!v.length) return;
      var avg = v.reduce(function (s, x) { return s + Number(x); }, 0) / v.length;
      bySkill[k] = bySkill[k] || { sum: 0, n: 0 };
      bySkill[k].sum += avg; bySkill[k].n++;
    });
  });
  var skills = SKILLS.filter(function (s) { return bySkill[s.key]; }).map(function (s) {
    return { key: s.key, name: s.name, avg: Math.round(bySkill[s.key].sum / bySkill[s.key].n * 100) / 100, n: bySkill[s.key].n };
  });
  var roles = { self: 0, peer: 0, lecturer: 0 };
  evs.forEach(function (e) { roles[e.role] = (roles[e.role] || 0) + 1; });
  return {
    count: evs.length, roles: roles, skills: skills,
    comments: evs.filter(function (e) { return e.strengths || e.improve; }).slice(-30).map(function (e) {
      return { role: e.role, evaluator: e.role === 'lecturer' ? e.evaluator : '', strengths: e.strengths, improve: e.improve, createdAt: e.createdAt };
    })
  };
}

function checkBooking(code, contact) {
  var b = findMine_('Bookings', code, contact);
  return bookingView_(b);
}

function cancelBooking(code, contact, reason) {
  var res = withLock_(function () {
    var b = findMine_('Bookings', code, contact);
    if (b.status !== 'pending' && b.status !== 'approved') throw new Error('รายการนี้ยกเลิกไม่ได้ (สถานะ: ' + (BOOKING_STATUS[b.status] || b.status) + ')');
    if ((b.date + ' ' + b.start) <= nowLocal_()) throw new Error('เลยเวลาเริ่มใช้ห้องแล้ว กรุณาติดต่อเจ้าหน้าที่');
    return updateRow_('Bookings', { id: b.id, status: 'cancelled', cancelReason: 'ผู้จองยกเลิก: ' + text_(reason, 200), updatedAt: nowIso_() });
  });
  log_('public', 'booking.cancel', res.code, res.cancelReason);
  notifyStaff_('ยกเลิกการจอง ' + res.code, '<p>ผู้จองยกเลิกรายการ <b>' + esc_(res.code) + '</b> ' + esc_(thaiDate_(res.date)) + ' ' + res.start + '–' + res.end + ' น.</p><p>' + esc_(res.cancelReason) + '</p>');
  return bookingView_(res);
}

/* ------------------------------------------------------------
 *  แบบประเมินความพึงพอใจ (หลังใช้ห้อง)
 * ------------------------------------------------------------ */

function submitFeedback(code, contact, answers, comment) {
  var b = findMine_('Bookings', code, contact);
  var v = bookingView_(b);
  if (v.feedbackDone) throw new Error('รายการนี้ส่งแบบประเมินแล้ว ขอบคุณค่ะ');
  if (!v.canFeedback) throw new Error('ประเมินได้หลังใช้ห้องแล้วเท่านั้น');
  answers = Array.isArray(answers) ? answers : [];
  var q = {};
  for (var i = 0; i < FEEDBACK_ITEMS.length; i++) {
    var n = Math.round(Number(answers[i]));
    if (!(n >= 1 && n <= 5)) throw new Error('กรุณาให้คะแนนให้ครบทุกข้อ');
    q['q' + (i + 1)] = String(n);
  }
  insertRow_('Feedback', Object.assign({ id: newId_(), bookingId: b.id, bookingCode: b.code, roomId: b.roomId, userType: b.userType, comment: text_(comment, 600), createdAt: nowIso_() }, q));
  return bookingView_(getRow_('Bookings', b.id));
}

/* ------------------------------------------------------------
 *  แบบประเมินทักษะการสอน (ตนเอง / เพื่อน / อาจารย์) — ใช้รหัสการจองที่ผู้สอนแชร์ให้
 * ------------------------------------------------------------ */

function getEvalTarget(code) {
  code = String(code || '').trim().toUpperCase();
  var key = 'e_' + code.replace(/[^A-Z0-9]/g, '');
  checkLockout_(key);
  var b = readTable_('Bookings').filter(function (x) { return String(x.code).toUpperCase() === code; })[0];
  if (!b || ['approved', 'checkedin', 'completed'].indexOf(b.status) === -1) { recordFail_(key); throw new Error('ไม่พบรหัสการจองนี้ หรือรายการยังไม่ได้รับอนุมัติ'); }
  var room = getRow_('Rooms', b.roomId) || {};
  return { code: b.code, title: b.title, teacher: b.name, course: b.course, date: b.date, dateText: thaiDate_(b.date), start: b.start, end: b.end, roomName: room.name || '' };
}

function submitEvaluation(code, f) {
  f = f || {};
  var t = getEvalTarget(code);
  var b = readTable_('Bookings').filter(function (x) { return x.code === t.code; })[0];
  var role = ['self', 'peer', 'lecturer'].indexOf(f.role) !== -1 ? f.role : 'peer';
  var evaluator = text_(f.evaluator, 100);
  if (role !== 'self' && !evaluator) throw new Error('กรุณากรอกชื่อผู้ประเมิน');
  var src = f.scores || {}, scores = {}, all = [];
  SKILLS.forEach(function (s) {
    var arr = Array.isArray(src[s.key]) ? src[s.key] : [];
    var clean = s.items.map(function (_, i) { var n = Math.round(Number(arr[i])); return n >= 1 && n <= 5 ? n : 0; });
    if (clean.some(function (x) { return x > 0; })) { scores[s.key] = clean; all = all.concat(clean.filter(function (x) { return x > 0; })); }
  });
  if (!all.length) throw new Error('กรุณาให้คะแนนอย่างน้อย 1 ทักษะ');
  var cache = CacheService.getScriptCache(), ck = 'ev_' + b.id, cnt = Number(cache.get(ck) || 0);
  if (cnt > 80) throw new Error('มีการส่งแบบประเมินรายการนี้จำนวนมาก กรุณาลองใหม่ภายหลัง');
  cache.put(ck, String(cnt + 1), 21600);
  var avg = Math.round(all.reduce(function (s, x) { return s + x; }, 0) / all.length * 100) / 100;
  insertRow_('Evaluations', { id: newId_(), bookingId: b.id, bookingCode: b.code, evaluator: role === 'self' ? b.name : evaluator, role: role,
    skill: Object.keys(scores).join(','), scores: JSON.stringify(scores), avg: String(avg), strengths: text_(f.strengths, 600), improve: text_(f.improve, 600), createdAt: nowIso_() });
  return { ok: true, avg: avg };
}

/* ------------------------------------------------------------
 *  แบบฟอร์ม / คำร้อง
 * ------------------------------------------------------------ */

function submitRequest(f) {
  f = f || {};
  if (f.website) throw new Error('ไม่สามารถส่งข้อมูลได้');
  var cache = CacheService.getScriptCache(), burst = Number(cache.get('req_burst') || 0);
  if (burst > 40) throw new Error('มีคำร้องจำนวนมากในขณะนี้ กรุณาลองใหม่ภายหลัง');
  var q = {
    type: REQUEST_TYPES[f.type] ? f.type : 'other', name: text_(f.name, 100), userType: USER_TYPES[f.userType] ? f.userType : 'student',
    studentId: text_(f.studentId, 20), faculty: text_(f.faculty, 100), phone: text_(f.phone, 20), email: text_(f.email, 120).toLowerCase(),
    subject: text_(f.subject, 150), detail: text_(f.detail, 2000), refCode: text_(f.refCode, 30).toUpperCase(), needDate: normDate_(f.needDate), link: safeUrl_(f.link)
  };
  if (!q.name) throw new Error('กรุณากรอกชื่อ-นามสกุล');
  if (phoneDigits_(q.phone).length < 9) throw new Error('กรุณากรอกเบอร์โทรศัพท์');
  if (q.email && !validEmail_(q.email)) throw new Error('รูปแบบอีเมลไม่ถูกต้อง');
  if (!q.subject || !q.detail) throw new Error('กรุณากรอกเรื่องและรายละเอียดคำร้อง');
  var saved = withLock_(function () {
    var now = nowIso_();
    q.id = newId_(); q.code = newCode_('RQ', 'Requests'); q.status = 'new'; q.createdAt = now; q.updatedAt = now;
    return insertRow_('Requests', q);
  });
  cache.put('req_burst', String(burst + 1), 600);
  log_('public', 'request.create', saved.code, REQUEST_TYPES[saved.type] + ' · ' + saved.subject);
  notifyStaff_('คำร้องใหม่ ' + saved.code + ' — ' + REQUEST_TYPES[saved.type],
    '<p><b>' + esc_(saved.subject) + '</b></p><p>' + esc_(saved.detail).replace(/\n/g, '<br>') + '</p><p>ผู้ยื่น: ' + esc_(saved.name) + ' · ' + esc_(saved.phone) + '</p>');
  if (saved.email) sendMail_(saved.email, 'รับคำร้อง ' + saved.code + ' แล้ว', mailFrame_('ได้รับคำร้องของท่านแล้ว',
    '<p>รหัสคำร้อง <b style="font-size:18px">' + saved.code + '</b></p><p>เรื่อง: ' + esc_(saved.subject) + '</p><p>ติดตามผลได้ที่เมนู “ตรวจสอบสถานะ” โดยใช้รหัสคำร้องและเบอร์โทร/อีเมลนี้</p>'));
  return { code: saved.code, typeLabel: REQUEST_TYPES[saved.type] };
}

function checkRequest(code, contact) {
  var q = findMine_('Requests', code, contact);
  return { code: q.code, type: q.type, typeLabel: REQUEST_TYPES[q.type], subject: q.subject, detail: q.detail, status: q.status, statusLabel: REQUEST_STATUS[q.status] || q.status,
    response: q.response, createdAt: q.createdAt, updatedAt: q.updatedAt, refCode: q.refCode, needDate: q.needDate };
}

/* ------------------------------------------------------------
 *  ป้ายหน้าห้อง (เปิดบนแท็บเล็ต/ทีวีหน้าห้อง: ?view=display&room=ID)
 * ------------------------------------------------------------ */

function getDisplay(roomId) {
  var room = getRow_('Rooms', roomId);
  if (!room || !isTrue_(room.active)) throw new Error('ไม่พบห้อง');
  var today = todayIso_(), r = rules_();
  var items = readTable_('Bookings').filter(function (b) {
    return b.roomId === room.id && b.date === today && ['approved', 'checkedin', 'completed'].indexOf(b.status) !== -1;
  }).sort(function (a, b) { return a.start.localeCompare(b.start); }).map(function (b) {
    return { start: b.start, end: b.end, label: b.title || PURPOSES[b.purpose], course: b.course, who: r.showNames ? b.name : USER_TYPES[b.userType], status: b.status };
  });
  var closed = slotProblem_(room.id, today, '00:00', '23:59', '__none__', 0);
  return { room: publicRoom_(room), today: today, todayText: thaiDate_(today), now: nowLocal_(), items: items, closed: /ปิด/.test(closed) ? closed : '' };
}

/* ------------------------------------------------------------
 *  อีเมลแจ้งเตือน (ปิดได้ที่ ตั้งค่า › การแจ้งเตือน)
 * ------------------------------------------------------------ */

function mailEnabled_() { var s = getSettings_(); return s.mailEnabled === undefined || s.mailEnabled === '' ? true : isTrue_(s.mailEnabled); }

function sendMail_(to, subject, html) {
  if (!to || !mailEnabled_()) return false;
  try {
    var s = getSettings_();
    MailApp.sendEmail({ to: to, subject: '[' + (s.appName || APP_NAME) + '] ' + subject, htmlBody: html, name: s.appName || APP_NAME, replyTo: validEmail_(s.email) ? s.email : undefined });
    return true;

/**

 * repeat = { until: 'YYYY-MM-DD', every: 1 } → จองซ้ำทุกสัปดาห์ (ตารางเรียนทั้งภาคเรียน) เฉพาะการเพิ่มใหม่
 */
function saveBooking(token, f, repeat) {
  var s = requireSession_(token);
  f = f || {};
  var b = cleanBooking_(f, true);
  var status = BOOKING_STATUS[f.status] ? f.status : 'approved';
  return withLock_(function () {
    var now = nowIso_();
    if (f.id) {
      var cur = getRow_('Bookings', f.id);
      if (!cur) throw new Error('ไม่พบรายการ');
      if (ACTIVE_STATUS.indexOf(status) !== -1) {
        var p = slotProblem_(b.roomId, b.date, b.start, b.end, cur.id, 0);
        if (p) throw new Error('บันทึกไม่ได้: ' + p);
      }
      b.id = cur.id; b.status = status; b.staffNote = text_(f.staffNote, 600); b.videoUrl = safeUrl_(f.videoUrl); b.updatedAt = now;
      var out = updateRow_('Bookings', b);
      log_(s.username, 'booking.edit', out.code, out.date + ' ' + out.start + '-' + out.end);
      if (cur.status !== out.status) notifyStatus_(out);
      return { saved: [out], skipped: [] };
    }
    var dates = [b.date];
    if (repeat && normDate_(repeat.until) && repeat.until > b.date) {
      var step = Math.max(1, Math.min(4, Math.round(Number(repeat.every) || 1))) * 7;
      for (var d = addDays_(b.date, step); d <= repeat.until && dates.length < 60; d = addDays_(d, step)) dates.push(d);
    }
    var series = dates.length > 1 ? newId_() : '';
    var saved = [], skipped = [], rows = [];
    dates.forEach(function (d) {
      var p = slotProblem_(b.roomId, d, b.start, b.end, '', 0);
      if (p) { skipped.push({ date: d, reason: p }); return; }
      var row = Object.assign({}, b, { id: newId_(), date: d, status: status, source: 'staff', series: series, staffNote: text_(f.staffNote, 600),
        decidedBy: s.username, decidedAt: now, createdAt: now, updatedAt: now });
      row.code = newCode_('MT', 'Bookings');
      insertRow_('Bookings', row);
      saved.push(fill_('Bookings', row));
    });
    log_(s.username, 'booking.create', saved.map(function (x) { return x.code; }).join(' '), saved.length + ' รายการ ข้าม ' + skipped.length);
    if (saved[0] && saved[0].email) notifyNewBooking_(saved[0]);
    return { saved: saved, skipped: skipped };
  });
}

/**
 * เปลี่ยนสถานะการจอง
 * action: approve | reject | cancel | checkin | checkout | noshow | reopen | note
 * p: { staffNote, condition, videoUrl, reason }
 */
function setBookingStatus(token, id, action, p) {
  var s = requireSession_(token);
  p = p || {};
  var out = withLock_(function () {
    var b = getRow_('Bookings', id);
    if (!b) throw new Error('ไม่พบรายการ');
    var now = nowIso_(), u = { id: b.id, updatedAt: now };
    if (p.staffNote !== undefined) u.staffNote = text_(p.staffNote, 600);
    if (p.videoUrl !== undefined) {
      u.videoUrl = safeUrl_(p.videoUrl);
      if (String(p.videoUrl).trim() && !u.videoUrl) throw new Error('ลิงก์วิดีโอต้องขึ้นต้นด้วย https://');
    }
    switch (action) {
      case 'approve':
        if (['pending', 'rejected', 'cancelled', 'noshow'].indexOf(b.status) === -1) throw new Error('อนุมัติได้เฉพาะรายการที่รออนุมัติ');
        var pr = slotProblem_(b.roomId, b.date, b.start, b.end, b.id, 0);
        if (pr) throw new Error('อนุมัติไม่ได้: ' + pr);
        u.status = 'approved'; u.decidedBy = s.username; u.decidedAt = now; break;
      case 'reject':
        if (!text_(p.staffNote || p.reason, 600)) throw new Error('กรุณาระบุเหตุผลที่ไม่อนุมัติ');
        u.status = 'rejected'; u.decidedBy = s.username; u.decidedAt = now; u.staffNote = text_(p.staffNote || p.reason, 600); break;
      case 'cancel':
        u.status = 'cancelled'; u.cancelReason = 'เจ้าหน้าที่ยกเลิก: ' + text_(p.reason, 200); break;
      case 'checkin':
        if (['approved', 'pending'].indexOf(b.status) === -1) throw new Error('เช็กอินได้เฉพาะรายการที่อนุมัติแล้ว');
        u.status = 'checkedin'; u.checkinAt = now; if (b.status === 'pending') { u.decidedBy = s.username; u.decidedAt = now; } break;
      case 'checkout':
        if (['checkedin', 'approved'].indexOf(b.status) === -1) throw new Error('รายการนี้ยังไม่ได้เช็กอิน');
        u.status = 'completed'; u.checkoutAt = now; if (!b.checkinAt) u.checkinAt = now;
        u.condition = text_(p.condition, 300) || 'ปกติ'; break;
      case 'noshow':
        u.status = 'noshow'; break;
      case 'reopen':
        u.status = 'pending'; break;
      case 'note':
        break;
      default:
        throw new Error('คำสั่งไม่ถูกต้อง');
    }
    return updateRow_('Bookings', u);
  });
  log_(s.username, 'booking.' + action, out.code, out.staffNote || out.condition || '');
  if (['approve', 'reject', 'cancel', 'checkout'].indexOf(action) !== -1) notifyStatus_(out);
  if (action === 'note' && p.videoUrl && out.email) sendMail_(out.email, 'ไฟล์วิดีโอการสอนพร้อมแล้ว (' + out.code + ')', mailFrame_('ไฟล์วิดีโอการสอนของท่านพร้อมแล้ว', bookingMailBody_(out)));
  return out;
}

function saveItem(token, table, o) {

function saveUser(token, o) {

  var name = text_(o.name, 100);

  var dup = readTable_('Users').filter(function (u) { return u.username === username && u.id !== o.id; })[0];
  if (dup) throw new Error('ชื่อผู้ใช้นี้มีอยู่แล้ว');
  var data = { username: username, name: name, role: o.role === 'admin' ? 'admin' : 'staff', email: validEmail_(o.email) ? text_(o.email, 120) : '', phone: text_(o.phone, 20),
    active: isTrue_(o.active) ? 'TRUE' : 'FALSE' };

  var pw = String(o.password || '');
  if (pw && pw.length < 8) throw new Error('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร');
  if (pw) { data.salt = Utilities.getUuid(); data.passwordHash = hashPassword_(pw, data.salt); }
  var out = withLock_(function () {
    if (o.id && getRow_('Users', o.id)) { data.id = o.id; return updateRow_('Users', data); }
    if (!pw) throw new Error('กรุณาตั้งรหัสผ่านเริ่มต้น');

rgs) => call(fn, TOKEN, ...args);\n\n  /** อ่านค่าจากฟอร์ม: checkbox เดี่ยว → 'TRUE'/'FALSE', ชื่อที่ลงท้าย [] → array */\n  function formData(el) {\n    const o = {};\n    $$('input, select, textarea', el).forEach(i => {\n      if (!i.name) return;\n      if (i.name.slice(-2) === '[]') { const k = i.name.slice(0, -2); o[k] = o[k] || []; if (i.checked) o[k].push(i.value); return; }\n      if (i.type === 'checkbox') o[i.name] = i.checked ? 'TRUE' : 'FALSE';\n      else if (i.type === 'radio') { if (i.checked) o[i.name] = i.value; else if (!(i.name in o)) o[i.name] = ''; }\n      else o[i.name] = i.value;\n    });\n    return o;\n  }\n\n  function modal(title, body, foot, opts) {\n    opts = opts || {};\n    const bg = document.createElement('div');\n    bg.className = 'modal-bg';\n    bg.innerHTML = `<div class=\"modal ${opts.wide ? 'wide' : ''}\"><div class=\"mh\"><h3>${title}</h3><button class=\"x\" data-x>×</button></div><div class=\"mb\">${body}</div>${foot ? `<div class=\"mf\">${foot}</div>` : ''}</div>`;\n    document.body.appendChild(bg);\n    const close = () => bg.remove();\n    bg.addEventListener('click', e => { if (e.target === bg || e.target.hasAttribute('data-x')) close(); });\n    bg.close = close;\n    return bg;\n  }\n  function confirmBox(msg, okText, cls) {\n    return new Promise(res => {\n      const m = modal('ยืนยัน', `<p class=\"mt0\">${msg}</p>`, `<button class=\"btn ghost\" data-x>ยกเลิก</button><button class=\"btn ${cls || 'red'}\" id=\"cfOk\">${okText || 'ยืนยัน'}</button>`);\n      $('#cfOk', m).onclick = () => { m.close(); res(true); };\n      m.addEventListener('click', e => { if (e.target.hasAttribute('data-x')) res(false); });\n    });\n  }\n  function promptBox(title, label, def, required) {\n    return new Promise(res => {\n      const m = modal(title, `<label class=\"f\"><span>${label}</span><textarea id=\"pbV\">${esc(def || '')}</textarea></label>`, `<button class=\"btn ghost\" data-x>ยกเลิก</button><button class=\"btn\" id=\"pbOk\">ตกลง</button>`);\n      $('#pbOk', m).onclick = () => { const v = $('#pbV', m).value.trim(); if (required && !v) { toast('กรุณากรอกข้อมูล', 'err'); return; } m.close(); res(v); };\n      m.addEventListener('click', e => { if (e.target.hasAttribute('data-x')) res(null); });\n    });\n  }\n  function copy(text) {\n    const done = () => toast('คัดลอกแล้ว', 'ok');\n    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallback());\n    else fallback();\n    function fallback() { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch (e) { prompt('คัดลอกข้อความนี้', text); } t.remove(); }\n  }\n  function download(name, text, type) {\n    const blob = new Blob(['﻿' + text], { type: type || 'text/csv;charset=utf-8' });\n    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);\n  }\n  function csv(rows, cols) {\n    const q = v => { v = String(v == null ? '' : v); return /[\",\\n]/.test(v) ? '\"' + v.replace(/\"/g, '\"\"') + '\"' : v; };\n    return [cols.map(c => q(c[1])).join(',')].concat(rows.map(r => cols.map(c => q(typeof c[0] === 'function' ? c[0](r) : r[c[0]])).join(','))).join('\\n');\n  }\n  const link = u => /^https:\\/\\//i.test(u || '') ? esc(u) : '#';\n\n  /** Markdown อย่างง่าย → HTML (escape ก่อนเสมอ) */\n  function md(src) {\n    const lines = String(src || '').replace(/\\r/g, '').split('\\n');\n    let out = '', list = null, table = null, para = [];\n    const inline = s => esc(s).replace(/\\*\\*(.+?)\\*\\*/g, '<b>$1</b>').replace(/\\[([^\\]]+)\\]\\((https?:\\/\\/[^)\\s]+)\\)/g, '<a href=\"$2\" target=\"_blank\" rel=\"noopener\">$1</a>');\n    const flushP = () => { if (para.length) { out += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; } };\n    const flushL = () => { if (list) { out += `<${list.t}>` + list.items.map(i => '<li>' + inline(i) + '</li>').join('') + `</${list.t}>`; list = null; } };\n    const flushT = () => {\n      if (table) {\n        const rows = table.filter(r => !/^[\\s|:-]+$/.test(r));\n        const cells = r => r.replace(/^\\||\\|$/g, '').split('|').map(c => c.trim());\n        out += '<div class=\"tscroll\"><table>' + rows.map((r, i) => '<tr>' + cells(r).map(c => i === 0 ? '<th>' + inline(c) + '</th>' : '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</table></div>';\n        table = null;\n      }\n    };\n    const flush = () => { flushP(); flushL(); flushT(); };\n    lines.forEach(raw => {\n      const l = raw.trim();\n      let m;\n      if (!l) { flush(); return; }\n      if (l.charAt(0) === '|') { flushP(); flushL(); (table = table || []).push(l); return; }\n      flushT();\n      if ((m = l.match(/^(#{1,3})\\s+(.*)$/))) { flush(); out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; return; }\n      if (l === '---') { flush(); out += '<hr>'; return; }\n      if ((m = l.match(/^>\\s?(.*)$/))) { flush(); out += '<blockquote>' + inline(m[1]) + '</blockquote>'; return; }\n      if ((m = l.match(/^[-*]\\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ul') { flushL(); list = { t: 'ul', items: [] }; } list.items.push(m[1]); return; }\n      if ((m = l.match(/^\\d+[.)]\\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ol') { flushL(); list = { t: 'ol', items: [] }; } list.items.push(m[1]); return; }\n      flushL(); para.push(l);\n    });\n    flush();\n    return out;\n  }\n\n  /* ================= lookups ================= */\n  const rooms = () => (A ? A.rooms : P.rooms).filter(r => truthy(r.active === undefined ? 'TRUE' : r.active));\n  const roomOf = id => ((A && A.rooms) || P.rooms).find(r => r.id === id) || { name: '-', color: '#888' };\n  const page = key => P.pages.find(p => p.key === key);\n  const stBadge = s => `<span class=\"badge b-$ ass=\"emoji\" style=\"right:5%;top:40%\">🧑‍🏫</span><span class=\"emoji\" style=\"right:20%;bottom:8%\">🎥</span>\n        <div class=\"inner\"><div class=\"w\">${esc(s.heroTitle || 'WELCOME')}</div><div class=\"s\">${esc(s.heroText || 'Micro Teaching')}</div></div></section>\n      <div class=\"wrap\">\n        <div class=\"welcome\">${esc(s.welcome)}</div>\n        ${s.announce ? `<div class=\"announce\">📢 ${esc(s.announce)}</div>` : ''}\n        <div class=\"chalk mt\"><h3>MICRO TEACHING</h3><p>Micro Teaching เป็นวิธีสอนที่ยึดหลักการย่อส่วนทั้งขนาดของชั้นเรียน ระยะเวลาที่สอน และชนิดของทักษะ วิธีสอนแบบจุลภาคใช้เวลาประมาณ 10–15 นาที ในการฝึกทักษะแต่ละชนิด เมื่อสอนเสร็จจึงมีการวิเคราะห์และประเมินผลการสอนจากภาพและเสียงที่บันทึกไว้ในวิดีโอ แล้วนำผลไปปรับปรุงพัฒนาการสอน การสอนแบบจุลภาคจึงเป็นการฝึกทักษะการสอนในสถานการณ์ย่อส่วนจากสถานการณ์จริง เพื่อง่ายแก่การฝึกภายใต้การควบคุมอย่างมีประสิทธิภาพ ผู้ฝึกได้มีโอกาสตรวจสอบและปรับปรุงการสอนของตน</p></div>\n        <div class=\"grid g3 mt\">\n          <a class=\"bigbtn\" href=\"#book\"><span class=\"e\">📅</span>ระบบจองห้อง</a>\n          <a class=\"bigbtn\" href=\"#schedule\"><span class=\"e\">🗓️</span>ตารางการใช้ห้อง</a>\n          <a class=\"bigbtn\" href=\"#status\"><span class=\"e\">🔎</span>ตรวจสอบสถานะการจอง</a>\n          <a class=\"bigbtn\" href=\"#evaluate\"><span class=\"e\">📝</span>ประเมินการสอน</a>\n          <a class=\"bigbtn\" href=\"#forms\"><span class=\"e\">📄</span>แบบฟอร์ม/คำร้อง</a>\n          <a class=\"bigbtn\" href=\"#contact\"><span class=\"e\">☎️</span>ช่องทางติดต่อ</a>\n        </div>\n        <div class=\"sec-title\">🗓️ การใช้ห้องวันนี้ <span class=\"muted small\" style=\"font-weight:400\">${thL(today())}</span></div>\n        <div class=\"card\" id=\"todayBox\"><div class=\"muted\">กำลังโหลด…</div></div>\n        <div class=\"sec-title\">🏫 ห้องให้บริการ</div>\n        <div class=\"grid g2\">${rooms().map(roomCard).join('')}</div>\n        ${P.news.length ? `<div class=\"sec-title\">📰 ข่าวประชาสัมพันธ์</div><div class=\"card\">${P.news.map(n => `<div class=\"newsitem\">${truthy(n.pinned) ? '📌 ' : ''}<b>${esc(n.title)}</b> <span class=\"muted xs\">${thD(n.date)}</span><div class=\"small\">${esc(n.body).replace(/\\n/g, '<br>')}</div></div>`).join('')}</div>` : ''}\n        <div class=\"sec-title\">🔄 วงจรการสอนแบบจุลภาค</div>\n        <div class=\"grid g4\">${[['📝', 'วางแผน', 'เลือกทักษะ เขียนแผน 1 หน้า'], ['🧑‍🏫', 'สอน', 'สอนจริง 5–15 นาที พร้อมบันทึกวิดีโอ'], ['🎥', 'สะท้อนผล', 'ดูวิดีโอ ประเมินตนเอง/เพื่อน/อาจารย์'], ['🔁', 'ปรับแผน & สอนซ้ำ', 'ปรับปรุงจนผ่านเกณฑ์']]\n          .map((x, i) => `<div class=\"card center\"><div style=\"font-size:34px\">${x[0]}</div><h4>${i + 1}. ${x[1]}</h4><div class=\"small muted\">${x[2]}</div></div>`).join('')}</div>\n        <div class=\"center mt\"><a class=\"btn ghost\" href=\"#page/teaching\">อ่านเพิ่มเติม: การจัดการเรียนการสอน →</a></div>\n      </div>`;\n    loadSchedule(today(), today()).then(d => {\n      const box = $('#todayBox'); if (!box) return;\n      const items = d.items, cl = d.closures;\n      box.innerHTML = (cl.length ? cl.map(c => `<div class=\"announce mt0 mb\">⛔ ${c.roomId ? esc(roomOf(c.roomId).name) + ' ' : 'ทุกห้อง '}ปิด${c.start ? ' ' + c.start + '–' + c.end + ' น.' : 'ทั้งวัน'} — ${esc(c.reason)}</div>`).join('') : '') +\n        (items.length ? `<div class=\"agenda\">${items.map(agendaRow).join('')}</div>` : '<div class=\"muted\">ยังไม่มีการจองวันนี้ — <a href=\"#book\">จองห้องได้เลย</a></div>');\n    }).catch(e => { const box = $('#todayBox'); if (box) box.innerHTML = `<div class=\"muted\">${esc(e.message)}</div>`; });\n  }\n  function roomCard(r) {\n    const feats = String(r.features || '').split('\\n').filter(Boolean);\n    return `<div class=\"card roomcard\" style=\"--c:${esc(r.color)}\"><div class=\"ph\" style=\"${r.image ? `background-image:url('${link(r.image)}')` : ''}\"><span>${esc(r.code)} · ${fmt(r.capacity, 0)} ที่นั่ง</span></div>\n      <h3>${esc(r.name)}</h3><div class=\"small muted\">${esc(r.kind)}${r.building ? ' · ' + esc(r.building) : ''}${r.floor ? ' ชั้น ' + esc(r.floor) : ''}</div>\n      <p class=\"small\">${esc(r.description)}</p>${feats.length ? `<ul class=\"feat\">${feats.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}\n      <div class=\"row mt\">${truthy(r.bookable) ? `<a class=\"btn sm\" href=\"#book/${esc(r.id)}\">จองห้องนี้</a>` : '<span class=\"badge\">ใช้งานผ่านเจ้าหน้าที่</span>'}<a class=\"btn sm ghost\" href=\"#schedule/${esc(r.id)}\">ดูตาราง</a></div></div>`;\n  }\n  function agendaRow(it) {\n    const r = roomOf(it.roomId);\n    return `<div class=\"ag\" style=\"--c:${esc(r.color)}\"><div class=\"tm\">${it.start}–${it.end}</div><div class=\"grow\"><div><span class=\"dot\"></span><b>${esc(it.label)}</b> ${it.status === 'pending' ? '<span class=\"badge b-pending\">รออนุมัติ</span>' : it.status === 'checkedin' ? '<span class=\"badge b-checkedin\">กำลังใช้</span>' : ''}</div>\n      <div class=\"small muted\">${esc(r.name)}${it.course ? ' · ' + esc(it.course) : ''}${it.who ? ' · ' + esc(it.who) : ''}</div></div></div>`;\n  }\n\n  /* ================= ตารางการใช้ห้อง ================= */\n  function loadSchedule(from, to, force) {\n    const k = from + '|' + to;\n    if (SCHED[k] && !force && Date.now() - SCHED[k].t < 60000) return Promise.resolve(SCHED[k].d);\n    return call('getSchedule', from, to).then(d => { SCHED[k] = { d: d, t: Date.now() }; return d; });\n  }\n  function clearSched() { Object.keys(SCHED).forEach(k => delete SCHED[k]); }\n\n  function calRange(c) {\n    if (c.mode === 'day') return [c.date, c.date];\n    if (c.mode === 'week') { const s = weekStart(c.date); return [s, addDays(s, 6)]; }\n    const first = c.date.substr(0, 8) + '01'; const gs = weekStart(first);\n    return [gs, addDays(gs, 41)];\n  }\n  function calTitle(c) {\n    if (c.mode === 'day') return thL(c.date);\n    if (c.mode === 'week') { const s = weekStart(c.date), e = addDays(s, 6); return thD(s) + ' – ' + thD(e); }\n    const d = D0(c.date); return TML[d.getUTCMonth()] + ' ' + (d.getUTCFullYear() + 543);\n  }\n  function vSchedule(el, arg) {\n    const c = ST.cal;\n    if (!c.date) c.date = today();\n    if (arg) { c.room = arg; if (c.mode === 'day') c.mode = 'week'; }\n    el.innerHTML = `<div class=\"wrap page\"><h1>🗓️ ตารางการใช้ห้อง</h1><p class=\"muted mt0\">แตะช่องว่างในตารางเพื่อจองช่วงเวลานั้น · แถบลายทาง = รออนุมัติ · พื้นลาย = ปิดให้บริการ</p>\n      <div id=\"calBox\"></div></div>`;\n    calendar($('#calBox'), {\n      state: c, admin: false,\n      load: (f, t) => loadSchedule(f, t),\n      onSlot: (roomId, date, time) => { LS.set('prefill', { roomId: roomId, date: date, start: time }); go('#book'); },\n      onItem: it => { const r = roomOf(it.roomId); modal(esc(it.label), `<dl class=\"kv\"><dt>ห้อง</dt><dd>${esc(r.name)}</dd><dt>วันที่</dt><dd>${thL(it.date)}</dd><dt>เวลา</dt><dd>${it.start}–${it.end} น.</dd><dt>สถานะ</dt><dd>${stBadge(it.status)}</dd>${it.course ? `<dt>รายวิชา</dt><dd>${esc(it.course)}</dd>` : ''}${it.who ? `<dt>ผู้จอง</dt><dd>${esc(it.who)}</dd>` : ''}<dt>วัตถุประสงค์</dt><dd>${esc(P.purposes[it.purpose] || '-')}</dd></dl>`); }\n    });\n  }\n\n  /**\n   * ปฏิทินแบบใช้ซ้ำ (หน้าบ้าน + หลังบ้าน)\n   * opts: { state:{mode,date,room}, admin, load(from,to)->Promise<{items,closures}>, onSlot(roomId,date,time), onItem(item) }\n   */\n  function calendar(box, opts) {\n    const c = opts.state;\n    const rs = rooms();\n    const draw = () => {\n      const [from, to] = calRange(c);\n      box.innerHTML = `<div class=\"cal-bar noprint\">\n          <div class=\"seg\">${[['day', 'วัน'], ['week', 'สัปดาห์'], ['month', 'เดือน'], ['list', 'รายการ']].map(m => `<button data-mode=\"${m[0]}\" class=\"${c.mode === m[0] ? 'on' : ''}\">${m[1]}</button>`).join('')}</div>\n          <button class=\"btn sm ghost\" data-nav=\"-1\">‹</button><button class=\"btn sm ghost\" data-nav=\"0\">วันนี้</button><button class=\"btn sm ghost\" data-nav=\"1\">›</button>\n          <input type=\"date\" id=\"calDate\" value=\"${c.date}\" style=\"width:auto;min-height:34px;padding:4px 8px\">\n          <select id=\"calRoom\" style=\"width:auto;min-height:34px;padding:4px 8px\"><option value=\"all\">ทุกห้อง</option>${rs.map(r => `<option value=\"${esc(r.id)}\" ${c.room === r.id ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select>\n          <span class=\"cal-title\">${calTitle(c)}</span></div>\n        <div class=\"legend mb\">${rs.map(r => `<span><i style=\"background:${esc(r.color)}\"></i>${esc(r.code || r.name)}</span>`).join('')}</div>\n        <div id=\"calBody\"><div class=\"spinner\">กำลังโหลดตาราง…</div></div>`;\n      $$('[data-mode]', box).forEach(b => b.onclick = () => { c.mode = b.dataset.mode; draw(); });\n      $$('[data-nav]', box).forEach(b => b.onclick = () => {\n        const n = Number(b.dataset.nav);\n        if (!n) c.date = today();\n        else if (c.mode === 'day') c.date = addDays(c.date, n);\n        else if (c.mode === 'week' || c.mode === 'list') c.date = addDays(c.date, 7 * n);\n        else { const d = D0(c.date); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + n); c.date = iso(d); }\n        draw();\n      });\n      $('#calDate', box).onchange = e => { if (e.target.value) { c.date = e.target.value; draw(); } };\n      $('#calRoom', box).onchange = e => { c.room = e.target.value; draw(); };\n      const lf = c.mode === 'list' ? weekStart(c.date) : from, lt = c.mode === 'list' ? addDays(weekStart(c.date), 13) : to;\n      opts.load(lf, lt).then(d => {\n        const items = d.items.filter(it => c.room === 'all' || it.roomId === c.room);\n        const closures = d.closures;\n        const body = $('#calBody', box); if (!body) return;\n        if (c.mode === 'month') body.innerHTML = monthGrid(from, items, closures);\n        else if (c.mode === 'list') body.innerHTML = listView(lf, lt, items, closures);\n        else body.innerHTML = timeGrid(c, from, items, closures, rs);\n        $$('[data-item]', body).forEach(x => x.onclick = e => { e.stopPropagation(); const it = items[Number(x.dataset.item)]; if (it && opts.onItem) opts.onItem(it); });\n        $$('.cal-col', body).forEach(col => col.onclick = e => {\n          if (col.classList.contains('closed') || !opts.onSlot) return;\n          const r = R(), y = e.offsetY, step = r.slotMinutes || 30;\n          const m = mins(r.openTime) + Math.floor(y / PXM / step) * step;\n          if (m >= mins(r.closeTime)) return;\n          opts.onSlot(col.dataset.room || (c.room !== 'all' ? c.room : ''), col.dataset.date, hhmm(m));\n        });\n        $$('[data-day]', body).forEach(x => x.onclick = () => { c.date = x.dataset.day; c.mode = 'day'; draw(); });\n      }).catch(e => { const b = $('#calBody', box); if (b) b.innerHTML = `<div class=\"empty\">${esc(e.message)}</div>`; });\n    };\n    draw();\n    return draw;\n  }\n  const PXM = 1.1; // พิกเซลต่อนาที\n  function closedInfo(date, roomId, closures) {\n    const r = R();\n    if (r.openDays.indexOf(dow(date)) === -1) return { all: true, reason: 'ไม่เปิดให้จอง' };\n    const c = closures.find(x => date >= x.date && date <= (x.endDate || x.date) && (!x.roomId || !roomId || x.roomId === roomId) && !x.start);\n    return c ? { all: true, reason: c.reason || 'ปิด' } : null;\n  }\n  function timeGrid(c, from, items, closures, rs) {\n    const r = R();\n    let o = mins(r.openTime), e = mins(r.closeTime);\n    items.forEach(it => { o = Math.min(o, mins(it.start)); e = Math.max(e, mins(it.end)); });\n    o = Math.floor(o / 60) * 60; e = Math.ceil(e / 60) * 60;\n    const H = (e - o) * PXM;\n    let cols;\n    if (c.mode === 'day') cols = (c.room === 'all' ? rs : rs.filter(x => x.id === c.room)).map(rm => ({ key: rm.id, label: `<span class=\"dot\" style=\"--c:${esc(rm.color)}\"></span>${esc(rm.code || rm.name)}`, date: c.date, room: rm.id }));\n    else cols = Array.from({ length: 7 }, (_, i) => { const d = addDays(from, i); return { key: d, label: `${TD[dow(d)]} ${D0(d).getUTCDate()}`, date: d, room: c.room === 'all' ? '' : c.room }; })\n      .filter(col => r.openDays.indexOf(dow(col.date)) !== -1 || items.some(it => it.date === col.date));\n    const laneRooms = c.mode === 'week' && c.room === 'all' ? rs.filter(x => truthy(x.bookable) || items.some(it => it.roomId === x.id)) : null;\n    const nowS = nowLocal(), nowD = nowS.substr(0, 10), nowM = mins(nowS.substr(11));\n    let html = `<div class=\"cal\"><div class=\"cal-grid\" style=\"grid-template-columns:52px repeat(${cols.length}, minmax(${c.mode === 'day' ? 150 : 110}px, 1fr))\">`;\n    html += `<div class=\"cal-head corner\"></div>` + cols.map(col => `<div class=\"cal-head ${col.date === today() && c.mode === 'week' ? 'today' : ''}\">${col.label}</div>`).join('');\n    html += `<div class=\"cal-times\" style=\"height:${H}px\">` + Array.from({ length: (e - o) / 60 + 1 }, (_, i) => `<div style=\"height:${i === (e - o) / 60 ? 0 : 60 * PXM}px\">${hhmm(o + i * 60)}</div>`).join('') + '</div>';\n    cols.forEach(col => {\n      const ci = closedInfo(col.date, col.room, closures);\n      html += `<div class=\"cal-col ${ci ? 'closed' : ''}\" data-date=\"${col.date}\" data-room=\"${esc(col.room)}\" style=\"height:${H}px\" title=\"${ci ? esc(ci.reason) : 'แตะเพื่อจอง'}\">`;\n      for (let m = o; m < e; m += 30) html += `<div class=\"ln ${m % 60 === 0 ? 'h' : ''}\" style=\"top:${(m - o) * PXM}px\"></div>`;\n      closures.filter(x => x.start && col.date >= x.date && col.date <= (x.endDate || x.date) && (!x.roomId || !col.room || x.roomId === col.room))\n        .forEach(x => { html += `<div class=\"ev closure\" style=\"top:${(mins(x.start) - o) * PXM}px;height:${(mins(x.end) - mins(x.start)) * PXM}px;left:2px;right:2px\"><b>ปิด</b>${esc(x.reason)}</div>`; });\n      items.forEach((it, idx) => {\n        if (it.date !== col.date) return;\n        if (c.mode === 'day' && it.roomId !== col.room) return;\n        const rm = roomOf(it.roomId);\n        let left = 2, width = 'calc(100% - 4px)';\n        if (laneRooms) { const li = Math.max(0, laneRooms.findIndex(x => x.id === it.roomId)), n = laneRooms.length; left = `calc(${li * 100 / n}% + 1px)`; width = `calc(${100 / n}% - 2px)`; }\n        const top = (mins(it.start) - o) * PXM, h = Math.max(18, (mins(it.end) - mins(it.start)) * PXM - 2);\n        html += `<div class=\"ev ${it.status === 'pending' ? 'pending' : ''}\" data-item=\"${idx}\" style=\"--c:${esc(rm.color)};top:${top}px;height:${h}px;left:${typeof left === 'number' ? left + 'px' : left};width:${width}\" title=\"${esc(it.start + '–' + it.end + ' ' + it.label)}\">\n          <b>${it.start}–${it.end}</b>${esc(it.label)}${laneRooms ? '' : it.who ? '<br>' + esc(it.who) : ''}</div>`;\n      });\n      if (col.date === nowD && nowM >= o && nowM <= e) html += `<div class=\"nowline\" style=\"top:${(nowM - o) * PXM}px\"></div>`;\n      html += '</div>';\n    });\n    return html + '</div></div>';\n  }\n  function monthGrid(from, items, closures) {\n    const cur = ST.cal.date.substr(0, 7);\n    let h = '<div class=\"month\">' + ['จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.', 'อา.'].map(d => `<div class=\"mh\">${d}</div>`).join('');\n    for (let i = 0; i < 42; i++) {\n      const d = addDays(from, i), its = items.map((x, k) => [x, k]).filter(p => p[0].date === d);\n      const ci = closedInfo(d, ST.cal.room === 'all' ? '' : ST.cal.room, closures);\n      h += `<div data-day=\"${d}\" class=\"${d.substr(0, 7) !== cur ? 'out' : ''} ${d === today() ? 'td' : ''} ${ci ? 'cls' : ''}\"><span class=\"dn\">${D0(d).getUTCDate()}</span>${ci && d.substr(0, 7) === cur ? ` <span class=\"xs muted\">${esc(ci.reason)}</span>` : ''}\n        ${its.slice(0, 4).map(p => `<span class=\"mchip\" data-item=\"${p[1]}\" style=\"--c:${esc(roomOf(p[0].roomId).color)}\">${p[0].start} ${esc(p[0].label)}</span>`).join('')}${its.length > 4 ? `<span class=\"xs muted\">+${its.length - 4} รายการ</span>` : ''}</div>`;\n    }\n    return h + '</div>';\n  }\n  function listView(from, to, items, closures) {\n    let h = '<div class=\"card agenda\">', any = false;\n    for (let d = from; d <= to; d = addDays(d, 1)) {\n      const its = items.map((x, k) => [x, k]).filter(p => p[0].date === d);\n      const cl = closures.filter(x => d >= x.date && d <= (x.endDate || x.date));\n      if (!its.length && !cl.length) continue;\n      any = true;\n      h += `<h4 class=\"mt\">${thL(d)}</h4>` + cl.map(x => `<div class=\"small\" style=\"color:var(--danger)\">⛔ ${x.roomId ? esc(roomOf(x.roomId).name) : 'ทุกห้อง'} ปิด${x.start ? ' ' + x.start + '–' + x.end : 'ทั้งวัน'} — ${esc(x.reason)}</div>`).join('') +\n        its.map(p => `<div data-item=\"${p[1]}\" style=\"cursor:pointer\">${agendaRow(p[0])}</div>`).join('');\n    }\n    return any ? h + '</div>' : '<div class=\"card empty\">ไม่มีรายการในช่วง 2 สัปดาห์นี้</div>';\n  }\n\n  /* ================= จองห้อง ================= */\n  function vBook(el, arg) {\n    const r = R();\n    const pre = LS.get('prefill') || {};\n    LS.set('prefill', null);\n    const me = LS.get('me') || {};\n    const bookable = rooms().filter(x => truthy(x.bookable));\n    const roomId = arg || pre.roomId || (bookable[0] && bookable[0].id) || '';\n    const minDate = today(), maxDate = addDays(today(), r.maxAdvanceDays);\n    let date = pre.date && pre.date >= minDate ? pre.date : (function () { let d = addDays(today(), r.minLeadHours >= 24 ? Math.ceil(r.minLeadHours / 24) : 0); for (let i = 0; i < 14 && r.openDays.indexOf(dow(d)) === -1; i++) d = addDays(d, 1); return d; })();\n    const sel = { start: pre.start || '', end: '' };\n    if (sel.start) sel.end = hhmm(Math.min(mins(sel.start) + 60, mins(r.closeTime)));\n    el.innerHTML = `<div class=\"wrap page\"><h1>📅 จองห้องทดลองสอน</h1>\n      <p class=\"muted mt0\">ไม่ต้องเข้าสู่ระบบ · จองล่วงหน้า ${r.minLeadHours >= 24 ? Math.round(r.minLeadHours / 24) + ' วัน' : r.minLeadHours + ' ชม.'} – ${r.maxAdvanceDays} วัน · ครั้งละไม่เกิน ${r.maxHours} ชม. · เวลาให้บริการ ${r.openTime}–${r.closeTime} น. ${r.autoApprove ? '· ยื == last.code ? '' : last.contact || '')}\"></label>\n        <label class=\"f\"><button class=\"btn block\" type=\"submit\">ตรวจสอบ</button></label></form></div>\n      <div id=\"res\"></div></div>`;\n    const f = $('#sf');\n    f.code.oninput = () => { if (/^RQ/i.test(f.code.value)) f.kind.value = 'r'; else if (/^MT/i.test(f.code.value)) f.kind.value = 'b'; };\n    f.onsubmit = e => {\n      e.preventDefault();\n      const o = formData(f);\n      if (!o.code || !o.contact) return toast('กรุณากรอกรหัสและเบอร์โทร/อีเมล', 'err');\n      if (o.kind === 'r') call('checkRequest', o.code, o.contact).then(showReq).catch(err => toast(err.message, 'err'));\n      else call('checkBooking', o.code, o.contact).then(v => { LS.set('last', { code: v.code, contact: o.contact }); showBk(v, o.contact); }).catch(err => toast(err.message, 'err'));\n    };\n    if ((arg || last.code) && f.contact.value) f.requestSubmit ? f.requestSubmit() : f.onsubmit(new Event('submit'));\n  }\n  function showReq(q) {\n    $('#res').innerHTML = `<div class=\"card mt\"><div class=\"row between\"><h3 class=\"mt0\">${esc(q.code)} · ${esc(q.typeLabel)}</h3>${rqBadge(q.status)}</div>\n      <dl class=\"kv\"><dt>เรื่อง</dt><dd>${esc(q.subject)}</dd><dt>รายละเอียด</dt><dd>${esc(q.detail).replace(/\\n/g, '<br>')}</dd>${q.refCode ? `<dt>อ้างอิง</dt><dd>${esc(q.refCode)}</dd>` : ''}${q.needDate ? `<dt>วันที่ต้องการ</dt><dd>${thL(q.needDate)}</dd>` : ''}\n      <dt>ยื่นเมื่อ</dt><dd>${thDT(q.createdAt)}</dd><dt>อัปเดตล่าสุด</dt><dd>${thDT(q.updatedAt)}</dd></dl>\n      ${q.response ? `<div class=\"announce\" style=\"background:var(--info-soft);border-color:#bcd4ef;color:#1d3f66\"><b>คำตอบจากเจ้าหน้าที่:</b><br>${esc(q.response).replace(/\\n/g, '<br>')}</div>` : ''}</div>`;\n  }\n  function showBk(v, contact) {\n    const stepIdx = { pending: 1, approved: 2, checkedin: 3, completed: 4 }[v.status] || 0;\n    const bad = ['rejected', 'cancelled', 'noshow'].indexOf(v.status) !== -1;\n    const evalUrl = (CFG.baseUr
