<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1f26">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&family=Fredoka:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #c2185b; --brand-2: #e0457b; --brand-ink: #8c0f42; --brand-soft: #fde7ef;
    --head: #1f1f26; --head-ink: #ffffff; --sky: #4f8fc0; --sun: #f2b230; --leaf: #6aa84f;
    --bg: #ffffff; --bg-2: #f8f6f8; --surface: #ffffff; --ink: #1f1d22; --ink-2: #45414b; --muted: #75707c; --line: #e8e4ea;
    --ok: #1e7d4f; --ok-soft: #e0f3e8; --warn: #a96800; --warn-soft: #fdf0d5; --danger: #b3382c; --danger-soft: #fbe6e3; --info: #2563a8; --info-soft: #e5effa;
    --radius: 14px; --shadow: 0 6px 24px rgba(40, 20, 40, .08);
    --font: 'Sarabun', 'Noto Sans Thai', Tahoma, sans-serif; --font-head: 'Prompt', 'Sarabun', sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.6; }
  [hidden] { display: none !important; }
  h1, h2, h3, h4 { font-family: var(--font-head); font-weight: 600; line-height: 1.3; margin: 0 0 10px; }
  h1 { font-size: 26px; } h2 { font-size: 22px; } h3 { font-size: 18px; } h4 { font-size: 16px; }
  a { color: var(--brand); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .muted { color: var(--muted); } .small { font-size: 14px; } .xs { font-size: 12.5px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; } .between { justify-content: space-between; } .grow { flex: 1; min-width: 0; }
  .center { text-align: center; } .right { text-align: right; } .nowrap { white-space: nowrap; }
  .mt { margin-top: 14px; } .mb { margin-bottom: 14px; } .mt0 { margin-top: 0; }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }

  /* ---------- header ---------- */
  header.top { background: var(--head); color: var(--head-ink); position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 10px rgba(0,0,0,.18); }
  header.top .wrap { display: flex; align-items: center; gap: 14px; min-height: 64px; max-width: 1440px; }
  .brand { font-family: 'Prompt', serif; font-size: 21px; font-weight: 600; color: #fff; text-decoration: none; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
  .brand small { display: block; font: 400 11.5px/1.2 var(--font); opacity: .7; }
  nav.menu { display: flex; gap: 2px; margin-left: auto; overflow-x: auto; scrollbar-width: none; }
  nav.menu::-webkit-scrollbar { display: none; }
  nav.menu a { color: #fff; text-decoration: none; padding: 8px 9px; border-radius: 8px; font-family: var(--font-head); font-weight: 500; font-size: 14.5px; white-space: nowrap; }
  nav.menu a:hover { background: rgba(255,255,255,.08); }
  nav.menu a.on { color: #ff6fa3; }
  nav.menu a.cta { background: var(--brand); margin-left: 6px; } nav.menu a.cta.on { color: #fff; background: var(--brand-ink); }
  .burger { display: none; margin-left: auto; background: none; border: 0; color: #fff; font-size: 26px; cursor: pointer; padding: 6px 8px; }
  @media (max-width: 1300px) {
    .burger { display: block; }
    nav.menu { display: none; position: absolute; left: 0; right: 0; top: 64px; background: var(--head); flex-direction: column; padding: 8px 16px 16px; margin: 0; }
    nav.menu.open { display: flex; }
    nav.menu a { padding: 11px 12px; } nav.menu a.cta { margin: 6px 0 0; text-align: center; }
  }

  /* ---------- hero ---------- */
  .hero { position: relative; overflow: hidden; background: linear-gradient(180deg, #fffaf0 0%, #fff 70%); border-bottom: 1px solid var(--line); }
  .hero .inner { position: relative; text-align: center; padding: 38px 16px 30px; z-index: 1; }
  .hero .w { font-family: 'Fredoka', 'Prompt', sans-serif; font-weight: 700; font-size: clamp(54px, 12vw, 132px); line-height: .95; color: var(--sky); letter-spacing: 2px;
    text-shadow: 0 4px 0 #3a6f99, 0 10px 18px rgba(40, 80, 120, .18); }
  .hero .s { font-family: 'Fredoka', 'Prompt', sans-serif; font-weight: 700; font-size: clamp(30px, 6vw, 62px); color: var(--sun); text-shadow: 0 3px 0 #c98a12; margin-top: 4px; }
  .hero .deco { position: absolute; border-radius: 50%; opacity: .9; }
  .hero .d1 { width: 120px; height: 120px; background: #ffd6e5; left: -30px; top: 20px; }
  .hero .d2 { width: 70px; height: 70px; background: #d7ecff; right: 8%; top: 18px; }
  .hero .d3 { width: 180px; height: 180px; background: #e6f4dc; right: -60px; bottom: -80px; }
  .hero .d4 { width: 60px; height: 60px; background: #fff0c7; left: 12%; bottom: 10px; }
  .hero .emoji { position: absolute; font-size: clamp(30px, 5vw, 56px); z-index: 0; }
  .welcome { color: #e0115f; font-family: var(--font-head); font-weight: 700; font-size: clamp(22px, 3.2vw, 32px); text-align: center; margin: 28px 0 8px; }

  /* ---------- sections / cards ---------- */
  main { min-height: 60vh; padding-bottom: 40px; }
  .page { padding-top: 22px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 14px; }
  .grid { display: grid; gap: 14px; }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
  .g3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
  .g4 { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
  .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  @media (max-width: 700px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .sec-title { font-family: var(--font-head); color: var(--brand); font-size: 22px; margin: 26px 0 12px; display: flex; align-items: center; gap: 8px; }
  .chalk { background: #2f5b3e; color: #f7f3e8; border-radius: var(--radius); padding: 22px; border: 6px solid #8a5a2b; box-shadow: inset 0 0 40px rgba(0,0,0,.25), var(--shadow); }
  .chalk h3 { color: #ffb3c9; font-family: 'Fredoka', var(--font-head); font-size: 28px; letter-spacing: 1px; margin-bottom: 6px; }
  .chalk p { margin: 0; line-height: 1.85; }
  .bigbtn { display: flex; align-items: center; justify-content: center; gap: 10px; background: #b9246f; color: #fff; text-decoration: none; border-radius: 8px; padding: 14px 18px;
    font-family: var(--font-head); font-weight: 600; font-size: 17px; border: 0; width: 100%; cursor: pointer; box-shadow: 0 3px 0 #87124d; }
  .bigbtn:hover { background: #a01d5f; } .bigbtn .e { font-size: 22px; }
  .bigbtn.alt { background: #fff; color: #b9246f; border: 2px solid #b9246f; box-shadow: none; }
  .roomcard { border-top: 5px solid var(--c, var(--brand)); }
  .roomcard .ph { height: 120px; border-radius: 10px; background: linear-gradient(135deg, var(--c, var(--brand)), #2b2b38); color: #fff; display: flex; align-items: flex-end; padding: 12px; margin-bottom: 12px;
    font-family: var(--font-head); font-size: 15px; background-size: cover; background-position: center; position: relative; }
  .roomcard .ph span { background: rgba(0,0,0,.4); padding: 2px 10px; border-radius: 999px; }
  .feat { margin: 8px 0 0; padding-left: 18px; font-size: 14.5px; color: var(--ink-2); }
  .newsitem { border-left: 4px solid var(--sun); padding: 6px 0 6px 12px; }
  .newsitem + .newsitem { margin-top: 12px; }
  .announce { background: var(--warn-soft); border: 1px solid #f3d38f; color: #6b4300; border-radius: 12px; padding: 10px 14px; margin-top: 16px; }

  /* ---------- buttons / forms ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 10px; padding: 9px 16px; background: var(--brand); color: #fff;
    font-family: var(--font-head); font-size: 15px; font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap; min-height: 40px; }
  .btn:hover { filter: brightness(.94); } .btn:disabled { opacity: .5; cursor: default; }
  .btn.sm { padding: 5px 11px; font-size: 13.5px; min-height: 32px; border-radius: 8px; }
  .btn.ghost { background: #fff; color: var(--ink-2); border: 1.5px solid var(--line); }
  .btn.ok { background: var(--ok); } .btn.red { background: var(--danger); } .btn.warn { background: #d08a00; } .btn.info { background: var(--info); } .btn.dark { background: var(--head); }
  .btn.block { width: 100%; }
  label.f { display: block; margin-bottom: 12px; }
  label.f > span { display: block; font-size: 14px; font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
  label.f > span i { color: var(--danger); font-style: normal; }
  input[type=text], input[type=tel], input[type=email], input[type=password], input[type=number], input[type=date], input[type=time], input[type=url], input[type=search], select, textarea {
    width: 100%; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; background: #fff; min-height: 42px; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--brand-2); box-shadow: 0 0 0 3px var(--brand-soft); }
  textarea { min-height: 90px; resize: vertical; }
  .fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0 14px; }
  .check { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; cursor: pointer; }
  .check input { width: 18px; height: 18px; margin-top: 3px; accent-color: var(--brand); flex: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1.5px solid var(--line); border-radius: 999px; padding: 5px 12px; background: #fff; cursor: pointer; font-size: 14px; display: inline-flex; gap: 6px; align-items: center; }
  .chip input { accent-color: var(--brand); }
  .chip.on, .chip:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-ink); }
  .seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; }
  .seg button { border: 0; background: #fff; padding: 7px 13px; cursor: pointer; font-size: 14px; }
  .seg button.on { background: var(--head); color: #fff; }
  .step { display: flex; gap: 10px; align-items: center; font-family: var(--font-head); font-size: 17px; margin: 4px 0 12px; }
  .step b { width: 30px; height: 30px; border-radius: 50%; background: var(--brand); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; flex: none; }
  .roompick { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
  .roompick label { border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; cursor: pointer; display: block; border-left: 6px solid var(--c); }
  .roompick label:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); border-left-color: var(--c); }
  .roompick input { display: none; }
  .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 6px; }
  .slot { border: 1.5px solid #cfe8d8; background: #f1faf4; color: #1c5b38; border-radius: 8px; padding: 7px 4px; text-align: center; cursor: pointer; font-size: 14px; font-variant-numeric: tabular-nums; }
  .slot.busy { background: #f4f2f5; color: #aaa3ae; border-color: #ece8ee; cursor: not-allowed; text-decoration: line-through; }
  .slot.past { background: #f7f7f7; color: #c3c3c3; border-color: #eee; cursor: not-allowed; }
  .slot.sel { background: var(--brand); color: #fff; border-color: var(--brand); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 8px; }
  .legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

  /* ---------- status / badges ---------- */
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 600; white-space: nowrap; background: #eee; color: #555; }
  .b-pending { background: var(--warn-soft); color: var(--warn); } .b-approved { background: var(--ok-soft); color: var(--ok); }
  .b-checkedin { background: var(--info-soft); color: var(--info); } .b-completed { background: #ece9f6; color: #4b3d8f; }
  .b-rejected, .b-noshow { background: var(--danger-soft); color: var(--danger); } .b-cancelled { background: #f0eef1; color: #7c7680; }
  .b-new { background: var(--warn-soft); color: var(--warn); } .b-progress { background: var(--info-soft); color: var(--info); } .b-done { background: var(--ok-soft); color: var(--ok); }
  .b-ready { background: var(--ok-soft); color: var(--ok); } .b-inuse { background: var(--info-soft); color: var(--info); } .b-repair { background: var(--warn-soft); color: var(--warn); }
  .b-broken { background: var(--danger-soft); color: var(--danger); } .b-retired { background: #f0eef1; color: #7c7680; }
  .codebox { font-family: 'Fredoka', monospace; font-size: 34px; letter-spacing: 3px; color: var(--brand); background: var(--brand-soft); border: 2px dashed var(--brand-2); border-radius: 14px; padding: 10px 18px; display: inline-block; }
  .timeline { display: flex; gap: 0; margin: 14px 0; }
  .timeline div { flex: 1; text-align: center; font-size: 13px; color: var(--muted); position: relative; padding-top: 30px; }
  .timeline div::before { content: ''; position: absolute; top: 9px; left: 50%; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: #e5e0e8; z-index: 1; }
  .timeline div::after { content: ''; position: absolute; top: 16px; left: -50%; width: 100%; height: 4px; background: #e5e0e8; }
  .timeline div:first-child::after { display: none; }
  .timeline div.on { color: var(--ok); font-weight: 600; } .timeline div.on::before, .timeline div.on::after { background: var(--ok); }
  .timeline div.bad { color: var(--danger); } .timeline div.bad::before { background: var(--danger); }
  dl.kv { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; margin: 0; }
  dl.kv dt { color: var(--muted); font-size: 14px; } dl.kv dd { margin: 0; }
  .stars { display: inline-flex; gap: 4px; flex-direction: row-reverse; }
  .stars input { display: none; }
  .stars label { font-size: 28px; color: #ddd; cursor: pointer; line-height: 1; }
  .stars input:checked ~ label, .stars label:hover, .stars label:hover ~ label { color: #f5b301; }
  .scale { display: inline-flex; gap: 4px; }
  .scale label { width: 34px; height: 34px; border: 1.5px solid var(--line); border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-weight: 600; font-size: 14px; }
  .scale input { display: none; }
  .scale label:has(input:checked) { background: var(--brand); color: #fff; border-color: var(--brand); }
  .bar { height: 10px; border-radius: 999px; background: #eee; overflow: hidden; }
  .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand-2), var(--brand)); border-radius: 999px; }

  /* ---------- content (markdown) ---------- */
  .md h1 { color: var(--brand); font-size: 26px; border-bottom: 3px solid var(--brand-soft); padding-bottom: 8px; margin-bottom: 14px; }
  .md h2 { color: var(--head); font-size: 20px; margin-top: 24px; } .md h3 { font-size: 17px; margin-top: 18px; color: var(--brand-ink); }
  .md p { margin: 0 0 12px; } .md ul, .md ol { margin: 0 0 12px; padding-left: 24px; } .md li { margin: 3px 0; }
  .md blockquote { margin: 12px 0; padding: 10px 14px; background: var(--info-soft); border-left: 4px solid var(--info); border-radius: 8px; color: #1d3f66; }
  .md table, table.t { border-collapse: collapse; width: 100%; margin: 6px 0 14px; font-size: 15px; }
  .md th, .md td, table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 8px 10px; text-align: left; vertical-align: top; }
  .md th, table.t th { background: var(--bg-2); font-family: var(--font-head); font-weight: 500; font-size: 14px; color: var(--ink-2); }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
  .tscroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table.t tr.click { cursor: pointer; } table.t tr.click:hover td { background: #fcf7fa; }
  .doclist a { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; }
  .doclist .ic { width: 40px; height: 40px; border-radius: 10px; background: var(--brand-soft); display: flex; align-items: center; justify-content: center; font-size: 20px; flex: none; }

  /* ---------- schedule ---------- */
  .cal-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .cal-title { font-family: var(--font-head); font-size: 18px; font-weight: 600; margin: 0 6px; }
  .cal { border: 1px solid var(--line); border-radius: 12px; overflow: auto; background: #fff; max-height: 74vh; }
  .cal-grid { display: grid; position: relative; min-width: 100%; }
  .cal-head { position: sticky; top: 0; z-index: 3; background: #fff; border-bottom: 1px solid var(--line); text-align: center; font-size: 13.5px; padding: 6px 4px; font-weight: 600; }
  .cal-head.today { color: var(--brand); background: var(--brand-soft); }
  .cal-head.corner { left: 0; z-index: 4; }
  .cal-times { position: sticky; left: 0; z-index: 2; background: #fff; border-right: 1px solid var(--line); }
  .cal-times div { font-size: 11.5px; color: var(--muted); text-align: right; padding-right: 6px; transform: translateY(-7px); font-variant-numeric: tabular-nums; }
  .cal-col { position: relative; border-right: 1px solid #f1eef2; cursor: copy; }
  .cal-col.closed { background: repeating-linear-gradient(45deg, #faf8fa, #faf8fa 8px, #f2eef3 8px, #f2eef3 16px); cursor: not-allowed; }
  .cal-col .ln { position: absolute; left: 0; right: 0; border-top: 1px solid #f3f0f4; pointer-events: none; }
  .cal-col .ln.h { border-top-color: #e6e1e8; }
  .ev { position: absolute; border-radius: 7px; padding: 3px 6px; font-size: 12px; line-height: 1.3; overflow: hidden; color: #fff; background: var(--c, var(--brand)); cursor: pointer;
    border: 1px solid rgba(255,255,255,.6); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
  .ev.pending { background: repeating-linear-gradient(135deg, var(--c), var(--c) 6px, rgba(255,255,255,.25) 6px, rgba(255,255,255,.25) 10px), var(--c); opacity: .85; }
  .ev b { display: block; font-size: 11.5px; } .ev.closure { background: #9e9aa3; cursor: default; }
  .nowline { position: absolute; left: 0; right: 0; border-top: 2px solid #e53935; z-index: 2; pointer-events: none; }
  .month { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
  .month > div { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); min-height: 96px; padding: 4px; font-size: 12px; background: #fff; cursor: pointer; overflow: hidden; }
  .month .mh { min-height: 0; background: var(--bg-2); text-align: center; font-weight: 600; cursor: default; padding: 6px 2px; }
  .month .out { background: #fbfafb; color: #bbb; } .month .td { background: var(--brand-soft); }
  .month .dn { font-weight: 700; font-size: 13px; } .month .cls { background: repeating-linear-gradient(45deg, #fff, #fff 8px, #f4f1f5 8px, #f4f1f5 16px); }
  .mchip { display: block; border-radius: 5px; padding: 1px 5px; margin-top: 2px; color: #fff; background: var(--c); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .agenda .ag { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
  .agenda .tm { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 96px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--c); margin-right: 6px; }

  /* ---------- admin ---------- */
  .adm { display: grid; grid-template-columns: 220px 1fr; gap: 18px; padding-top: 18px; }
  .side { position: sticky; top: 80px; align-self: start; }
  .side a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 10px; text-decoration: none; color: var(--ink-2); font-family: var(--font-head); font-size: 15px; }
  .side a:hover { background: var(--bg-2); } .side a.on { background: var(--head); color: #fff; }
  .side a .n { margin-left: auto; background: var(--brand); color: #fff; border-radius: 999px; font-size: 12px; padding: 0 8px; }
  @media (max-width: 860px) {
    .adm { grid-template-columns: 1fr; }
    .side { position: static; display: flex; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
    .side a { white-space: nowrap; } .side .sep { display: none; }
  }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .kpi .v { font-family: var(--font-head); font-size: 28px; font-weight: 600; line-height: 1.2; }
  .kpi .l { font-size: 13.5px; color: var(--muted); }
  .kpi.hl { background: linear-gradient(135deg, #2a2a35, #1f1f26); color: #fff; border: 0; } .kpi.hl .l { color: #c9c4cf; }
  .hbar { display: grid; grid-template-columns: minmax(120px, 34%) 1fr 48px; gap: 8px; align-items: center; font-size: 14px; margin: 6px 0; }
  .vbars { display: flex; align-items: flex-end; gap: 6px; height: 160px; padding-top: 10px; }
  .vbars div { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; font-size: 11.5px; color: var(--muted); }

<script>
var CFG = <?!= cfg ?>;
(function () {
  'use strict';
  const hasGas = typeof google !== 'undefined' && google.script && google.script.run;
  let P = null;          // ข้อมูลสาธารณะ
  let A = null;          // ข้อมูลหลังบ้าน
  let TOKEN = null;
  try { TOKEN = sessionStorage.getItem('mt_token'); } catch (e) { }
  const SCHED = {};      // แคชตารางห้อง { 'from|to': data }
  const ST = { cal: { mode: 'day', date: '', room: 'all' }, admTab: 'dash', bk: { status: 'active', room: '', q: '', from: '', to: '' }, rpt: {} };

  /* ================= helpers ================= */
  const $ = (s, c) => (c || document).querySelector(s);
  const $$ = (s, c) => Array.prototype.slice.call((c || document).querySelectorAll(s));
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const truthy = v => v === true || String(v).toUpperCase() === 'TRUE';
  const num = v => { const n = Number(v); return isNaN(n) ? 0 : n; };
  const fmt = (n, d) => num(n).toLocaleString('th-TH', { maximumFractionDigits: d == null ? 1 : d });
  const TM = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  const TML = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  const TD = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
  const TDL = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
  const D0 = s => new Date(s + 'T00:00:00Z');
  const iso = d => d.toISOString().substr(0, 10);
  const addDays = (s, n) => { const d = D0(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
  const dow = s => D0(s).getUTCDay();
  const thD = s => { if (!s) return '-'; const d = D0(String(s).substr(0, 10)); return isNaN(d) ? esc(s) : TD[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + TM[d.getUTCMonth()] + ' ' + String(d.getUTCFullYear() + 543).substr(2); };
  const thL = s => { if (!s) return '-'; const d = D0(s); return 'วัน' + TDL[d.getUTCDay()] + 'ที่ ' + d.getUTCDate() + ' ' + TML[d.getUTCMonth()] + ' ' + (d.getUTCFullYear() + 543); };
  const thDT = s => { if (!s) return '-'; const d = new Date(s); if (isNaN(d)) return esc(s); const b = new Date(d.getTime() + 7 * 3600000); return thD(iso(b)) + ' ' + ('0' + b.getUTCHours()).slice(-2) + ':' + ('0' + b.getUTCMinutes()).slice(-2); };
  const mins = t => { const p = String(t || '0:0').split(':'); return num(p[0]) * 60 + num(p[1]); };
  const hhmm = m => ('0' + Math.floor(m / 60)).slice(-2) + ':' + ('0' + (m % 60)).slice(-2);
  const today = () => (P && P.today) || iso(new Date(Date.now() + 7 * 3600000));
  const nowLocal = () => { const b = new Date(Date.now() + 7 * 3600000); return iso(b) + ' ' + ('0' + b.getUTCHours()).slice(-2) + ':' + ('0' + b.getUTCMinutes()).slice(-2); };
  const weekStart = s => addDays(s, -((dow(s) + 6) % 7));
  const LS = { get(k) { try { return JSON.parse(localStorage.getItem('mt_' + k) || 'null'); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem('mt_' + k, JSON.stringify(v)); } catch (e) { } } };

  function toast(msg, type) { const el = document.createElement('div'); el.className = 'toast ' + (type || ''); el.textContent = msg; $('#toasts').appendChild(el); setTimeout(() => el.remove(), 4200); }
  let busyN = 0;
  function busy(on) { busyN += on ? 1 : -1; let b = $('#busyBar'); if (busyN > 0 && !b) { b = document.createElement('div'); b.id = 'busyBar'; b.className = 'busy'; document.body.appendChild(b); } else if (busyN <= 0 && b) { busyN = 0; b.remove(); } }

  function call(fn, ...args) {
    return new Promise((resolve, reject) => {
      if (!hasGas) { reject(new Error('ต้องเปิดผ่านเว็บแอป Google Apps Script')); return; }
      busy(true);
      const r = google.script.run.withSuccessHandler(v => { busy(false); resolve(v); }).withFailureHandler(err => {
        busy(false);
        let msg = (err && err.message) || String(err);
        if (/AUTH:/.test(msg)) { msg = msg.replace(/.*AUTH:\s*/, ''); TOKEN = null; A = null; try { sessionStorage.removeItem('mt_token'); } catch (e) { } if (location.hash.indexOf('#admin') === 0) setTimeout(render, 10); }
        reject(new Error(msg.replace(/^Error:\s*/, '').replace(/^Exception:\s*/, '')));
      });
      r[fn].apply(r, args);
    });
  }
  const api = (fn, ...args) => call(fn, TOKEN, ...args);

  /** อ่านค่าจากฟอร์ม: checkbox เดี่ยว → 'TRUE'/'FALSE', ชื่อที่ลงท้าย [] → array */
  function formData(el) {
    const o = {};
    $$('input, select, textarea', el).forEach(i => {
      if (!i.name) return;
      if (i.name.slice(-2) === '[]') { const k = i.name.slice(0, -2); o[k] = o[k] || []; if (i.checked) o[k].push(i.value); return; }
      if (i.type === 'checkbox') o[i.name] = i.checked ? 'TRUE' : 'FALSE';
      else if (i.type === 'radio') { if (i.checked) o[i.name] = i.value; else if (!(i.name in o)) o[i.name] = ''; }
      else o[i.name] = i.value;
    });
    return o;
  }

  function modal(title, body, foot, opts) {
    opts = opts || {};
    const bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal ${opts.wide ? 'wide' : ''}"><div class="mh"><h3>${title}</h3><button class="x" data-x>×</button></div><div class="mb">${body}</div>${foot ? `<div class="mf">${foot}</div>` : ''}</div>`;
    document.body.appendChild(bg);
    const close = () => bg.remove();
    bg.addEventListener('click', e => { if (e.target === bg || e.target.hasAttribute('data-x')) close(); });
    bg.close = close;
    return bg;
  }
  function confirmBox(msg, okText, cls) {
    return new Promise(res => {
      const m = modal('ยืนยัน', `<p class="mt0">${msg}</p>`, `<button class="btn ghost" data-x>ยกเลิก</button><button class="btn ${cls || 'red'}" id="cfOk">${okText || 'ยืนยัน'}</button>`);
      $('#cfOk', m).onclick = () => { m.close(); res(true); };
      m.addEventListener('click', e => { if (e.target.hasAttribute('data-x')) res(false); });
    });
  }
  function promptBox(title, label, def, required) {
    return new Promise(res => {
      const m = modal(title, `<label class="f"><span>${label}</span><textarea id="pbV">${esc(def || '')}</textarea></label>`, `<button class="btn ghost" data-x>ยกเลิก</button><button class="btn" id="pbOk">ตกลง</button>`);
      $('#pbOk', m).onclick = () => { const v = $('#pbV', m).value.trim(); if (required && !v) { toast('กรุณากรอกข้อมูล', 'err'); return; } m.close(); res(v); };
      m.addEventListener('click', e => { if (e.target.hasAttribute('data-x')) res(null); });
    });
  }
  function copy(text) {
    const done = () => toast('คัดลอกแล้ว', 'ok');
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, () => fallback());
    else fallback();
    function fallback() { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); done(); } catch (e) { prompt('คัดลอกข้อความนี้', text); } t.remove(); }
  }
  function download(name, text, type) {
    const blob = new Blob(['﻿' + text], { type: type || 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  function csv(rows, cols) {
    const q = v => { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; };
    return [cols.map(c => q(c[1])).join(',')].concat(rows.map(r => cols.map(c => q(typeof c[0] === 'function' ? c[0](r) : r[c[0]])).join(','))).join('\n');
  }
  const link = u => /^https:\/\//i.test(u || '') ? esc(u) : '#';

  /** Markdown อย่างง่าย → HTML (escape ก่อนเสมอ) */
  function md(src) {
    const lines = String(src || '').replace(/\r/g, '').split('\n');
    let out = '', list = null, table = null, para = [];
    const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    const flushP = () => { if (para.length) { out += '<p>' + para.map(inline).join('<br>') + '</p>'; para = []; } };
    const flushL = () => { if (list) { out += `<${list.t}>` + list.items.map(i => '<li>' + inline(i) + '</li>').join('') + `</${list.t}>`; list = null; } };
    const flushT = () => {
      if (table) {
        const rows = table.filter(r => !/^[\s|:-]+$/.test(r));
        const cells = r => r.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
        out += '<div class="tscroll"><table>' + rows.map((r, i) => '<tr>' + cells(r).map(c => i === 0 ? '<th>' + inline(c) + '</th>' : '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</table></div>';
        table = null;
      }
    };
    const flush = () => { flushP(); flushL(); flushT(); };
    lines.forEach(raw => {
      const l = raw.trim();
      let m;
      if (!l) { flush(); return; }
      if (l.charAt(0) === '|') { flushP(); flushL(); (table = table || []).push(l); return; }
      flushT();
      if ((m = l.match(/^(#{1,3})\s+(.*)$/))) { flush(); out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; return; }
      if (l === '---') { flush(); out += '<hr>'; return; }
      if ((m = l.match(/^>\s?(.*)$/))) { flush(); out += '<blockquote>' + inline(m[1]) + '</blockquote>'; return; }
      if ((m = l.match(/^[-*]\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ul') { flushL(); list = { t: 'ul', items: [] }; } list.items.push(m[1]); return; }
      if ((m = l.match(/^\d+[.)]\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ol') { flushL(); list = { t: 'ol', items: [] }; } list.items.push(m[1]); return; }
      flushL(); para.push(l);
    });
    flush();
    return out;
  }

  /* ================= lookups ================= */
  const rooms = () => (A ? A.rooms : P.rooms).filter(r => truthy(r.active === undefined ? 'TRUE' : r.active));

          <div><h4>${esc(s.appName)}</h4><div>${esc(s.org)}</div>${s.building ? `<div>${esc(s.building)}</div>` : ''}<div class="xs" style="opacity:.75">${esc(s.address)}</div></div>
          <div><h4>บริการออนไลน์</h4><div><a href="#book">จองห้อง</a> · <a href="#schedule">ตารางการใช้ห้อง</a></div><div><a href="#status">ตรวจสอบสถานะ</a> · <a href="#evaluate">ประเมินการสอน</a></div>
            <div><a href="#forms">แบบฟอร์ม/คำร้อง</a> · <a href="#page/rules">ระเบียบการใช้ห้อง</a></div><div><a href="#page/privacy">นโยบายข้อมูลส่วนบุคคล</a> · <a href="#page/faq">คำถามที่พบบ่อย</a></div></div>
          <div><h4>ติดต่อ</h4>${s.phone ? `<div>☎ ${esc(s.phone)}</div>` : ''}${s.email ? `<div>✉ ${esc(s.email)}</div>` : ''}<div>🕘 ${esc(s.hoursText)}</div>
            <div class="mt"><a href="#admin" style="opacity:.75">🔐 สำหรับเจ้าหน้าที่</a></div></div>

  function bindShell() {

  /* ================= หน้าแรก ================= */
  function vHome(el) {
    const s = P.site;

      <section class="hero"><span class="deco d1"></span><span class="deco d2"></span><span class="deco d3"></span><span class="deco d4"></span>

        <div class="grid g3 mt">

          .map((x, i) => `<div class="card center"><div style="font-size:34px">${x[0]}</div><h4>${i + 1}. ${x[1]}</h4><div class="small muted">${x[2]}</div></div>`).join('')}</div>

    loadSchedule(today(), today()).then(d => {

      box.innerHTML = (cl.length ? cl.map(c => `<div class="announce mt0 mb">⛔ ${c.roomId ? esc(roomOf(c.roomId).name) + ' ' : 'ทุกห้อง '}ปิด${c.start ? ' ' + c.start + '–' + c.end + ' น.' : 'ทั้งวัน'} — ${esc(c.reason)}</div>`).join('') : '') +
        (items.length ? `<div class="agenda">${items.map(agendaRow).join('')}</div>` : '<div class="muted">ยังไม่มีการจองวันนี้ — <a href="#book">จองห้องได้เลย</a></div>');
    }).catch(e => { const box = $('#todayBox'); if (box) box.innerHTML = `<div class="muted">${esc(e.message)}</div>`; });
  }
  function roomCard(r) {
    const feats = String(r.features || '').split('\n').filter(Boolean);
    return `<div class="card roomcard" style="--c:${esc(r.color)}"><div class="ph" style="${r.image ? `background-image:url('${link(r.image)}')` : ''}"><span>${esc(r.code)} · ${fmt(r.capacity, 0)} ที่นั่ง</span></div>
      <h3>${esc(r.name)}</h3><div class="small muted">${esc(r.kind)}${r.building ? ' · ' + esc(r.building) : ''}${r.floor ? ' ชั้น ' + esc(r.floor) : ''}</div>
      <p class="small">${esc(r.description)}</p>${feats.length ? `<ul class="feat">${feats.map(f => `<li>${esc(f)}</li>`).join('')}</ul>` : ''}
      <div class="row mt">${truthy(r.bookable) ? `<a class="btn sm" href="#book/${esc(r.id)}">จองห้องนี้</a>` : '<span class="badge">ใช้งานผ่านเจ้าหน้าที่</span>'}<a class="btn sm ghost" href="#schedule/${esc(r.id)}">ดูตาราง</a></div></div>`;
  }
  function agendaRow(it) {
    const r = roomOf(it.roomId);
    return `<div class="ag" style="--c:${esc(r.color)}"><div class="tm">${it.start}–${it.end}</div><div class="grow"><div><span class="dot"></span><b>${esc(it.label)}</b> ${it.status === 'pending' ? '<span class="badge b-pending">รออนุมัติ</span>' : it.status === 'checkedin' ? '<span class="badge b-checkedin">กำลังใช้</span>' : ''}</div>
      <div class="small muted">${esc(r.name)}${it.course ? ' · ' + esc(it.course) : ''}${it.who ? ' · ' + esc(it.who) : ''}</div></div></div>`;
  }

  /* ================= ตารางการใช้ห้อง ================= */
  function loadSchedule(from, to, force) {
    const k = from + '|' + to;
    if (SCHED[k] && !force && Date.now() - SCHED[k].t < 60000) return Promise.resolve(SCHED[k].d);
    return call('getSchedule', from, to).then(d => { SCHED[k] = { d: d, t: Date.now() }; return d; });
  }
  function clearSched() { Object.keys(SCHED).forEach(k => delete SCHED[k]); }

  function calRange(c) {
    if (c.mode === 'day') return [c.date, c.date];
    if (c.mode === 'week') { const s = weekStart(c.date); return [s, addDays(s, 6)]; }
    const first = c.date.substr(0, 8) + '01'; const gs = weekStart(first);
    return [gs, addDays(gs, 41)];
  }
  function calTitle(c) {
    if (c.mode === 'day') return thL(c.date);
    if (c.mode === 'week') { const s = weekStart(c.date), e = addDays(s, 6); return thD(s) + ' – ' + thD(e); }
    const d = D0(c.date); return TML[d.getUTCMonth()] + ' ' + (d.getUTCFullYear() + 543);
  }
  function vSchedule(el, arg) {
    const c = ST.cal;
    if (!c.date) c.date = today();
    if (arg) { c.room = arg; if (c.mode === 'day') c.mode = 'week'; }
    el.innerHTML = `<div class="wrap page"><h1>🗓️ ตารางการใช้ห้อง</h1><p class="muted mt0">แตะช่องว่างในตารางเพื่อจองช่วงเวลานั้น · แถบลายทาง = รออนุมัติ · พื้นลาย = ปิดให้บริการ</p>
      <div id="calBox"></div></div>`;
    calendar($('#calBox'), {
      state: c, admin: false,
      load: (f, t) => loadSchedule(f, t),
      onSlot: (roomId, date, time) => { LS.set('prefill', { roomId: roomId, date: date, start: time }); go('#book'); },
      onItem: it => { const r = roomOf(it.roomId); modal(esc(it.label), `<dl class="kv"><dt>ห้อง</dt><dd>${esc(r.name)}</dd><dt>วันที่</dt><dd>${thL(it.date)}</dd><dt>เวลา</dt><dd>${it.start}–${it.end} น.</dd><dt>สถานะ</dt><dd>${stBadge(it.status)}</dd>${it.course ? `<dt>รายวิชา</dt><dd>${esc(it.course)}</dd>` : ''}${it.who ? `<dt>ผู้จอง</dt><dd>${esc(it.who)}</dd>` : ''}<dt>วัตถุประสงค์</dt><dd>${esc(P.purposes[it.purpose] || '-')}</dd></dl>`); }
    });
  }

  /**
   * ปฏิทินแบบใช้ซ้ำ (หน้าบ้าน + หลังบ้าน)
   * opts: { state:{mode,date,room}, admin, load(from,to)->Promise<{items,closures}>, onSlot(roomId,date,time), onItem(item) }
   */
  function calendar(box, opts) {
    const c = opts.state;
    const rs = rooms();
    const draw = () => {
      const [from, to] = calRange(c);
      box.innerHTML = `<div class="cal-bar noprint">
          <div class="seg">${[['day', 'วัน'], ['week', 'สัปดาห์'], ['month', 'เดือน'], ['list', 'รายการ']].map(m => `<button data-mode="${m[0]}" class="${c.mode === m[0] ? 'on' : ''}">${m[1]}</button>`).join('')}</div>
          <button class="btn sm ghost" data-nav="-1">‹</button><button class="btn sm ghost" data-nav="0">วันนี้</button><button class="btn sm ghost" data-nav="1">›</button>
          <input type="date" id="calDate" value="${c.date}" style="width:auto;min-height:34px;padding:4px 8px">
          <select id="calRoom" style="width:auto;min-height:34px;padding:4px 8px"><option value="all">ทุกห้อง</option>${rs.map(r => `<option value="${esc(r.id)}" ${c.room === r.id ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select>
          <span class="cal-title">${calTitle(c)}</span></div>
        <div class="legend mb">${rs.map(r => `<span><i style="background:${esc(r.color)}"></i>${esc(r.code || r.name)}</span>`).join('')}</div>
        <div id="calBody"><div class="spinner">กำลังโหลดตาราง…</div></div>`;
      $$('[data-mode]', box).forEach(b => b.onclick = () => { c.mode = b.dataset.mode; draw(); });
      $$('[data-nav]', box).forEach(b => b.onclick = () => {
        const n = Number(b.dataset.nav);
        if (!n) c.date = today();
        else if (c.mode === 'day') c.date = addDays(c.date, n);
        else if (c.mode === 'week' || c.mode === 'list') c.date = addDays(c.date, 7 * n);
        else { const d = D0(c.date); d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth() + n); c.date = iso(d); }
        draw();
      });
      $('#calDate', box).onchange = e => { if (e.target.value) { c.date = e.target.value; draw(); } };
      $('#calRoom', box).onchange = e => { c.room = e.target.value; draw(); };
      const lf = c.mode === 'list' ? weekStart(c.date) : from, lt = c.mode === 'list' ? addDays(weekStart(c.date), 13) : to;
      opts.load(lf, lt).then(d => {
        const items = d.items.filter(it => c.room === 'all' || it.roomId === c.room);
        const closures = d.closures;
        const body = $('#calBody', box); if (!body) return;
        if (c.mode === 'month') body.innerHTML = monthGrid(from, items, closures);
        else if (c.mode === 'list') body.innerHTML = listView(lf, lt, items, closures);
        else body.innerHTML = timeGrid(c, from, items, closures, rs);
        $$('[data-item]', body).forEach(x => x.onclick = e => { e.stopPropagation(); const it = items[Number(x.dataset.item)]; if (it && opts.onItem) opts.onItem(it); });
        $$('.cal-col', body).forEach(col => col.onclick = e => {
          if (col.classList.contains('closed') || !opts.onSlot) return;
          const r = R(), y = e.offsetY, step = r.slotMinutes || 30;
          const m = mins(r.openTime) + Math.floor(y / PXM / step) * step;
          if (m >= mins(r.closeTime)) return;
          opts.onSlot(col.dataset.room || (c.room !== 'all' ? c.room : ''), col.dataset.date, hhmm(m));
        });
        $$('[data-day]', body).forEach(x => x.onclick = () => { c.date = x.dataset.day; c.mode = 'day'; draw(); });
      }).catch(e => { const b = $('#calBody', box); if (b) b.innerHTML = `<div class="empty">${esc(e.message)}</div>`; });
    };
    draw();
    return draw;
  }
  const PXM = 1.1; // พิกเซลต่อนาที
  function closedInfo(date, roomId, closures) {
    const r = R();
    if (r.openDays.indexOf(dow(date)) === -1) return { all: true, reason: 'ไม่เปิดให้จอง' };
    const c = closures.find(x => date >= x.date && date <= (x.endDate || x.date) && (!x.roomId || !roomId || x.roomId === roomId) && !x.start);
    return c ? { all: true, reason: c.reason || 'ปิด' } : null;
  }
  function timeGrid(c, from, items, closures, rs) {
    const r = R();
    let o = mins(r.openTime), e = mins(r.closeTime);
    items.forEach(it => { o = Math.min(o, mins(it.start)); e = Math.max(e, mins(it.end)); });
    o = Math.floor(o / 60) * 60; e = Math.ceil(e / 60) * 60;
    const H = (e - o) * PXM;
    let cols;
    if (c.mode === 'day') cols = (c.room === 'all' ? rs : rs.filter(x => x.id === c.room)).map(rm => ({ key: rm.id, label: `<span class="dot" style="--c:${esc(rm.color)}"></span>${esc(rm.code || rm.name)}`, date: c.date, room: rm.id }));
    else cols = Array.from({ length: 7 }, (_, i) => { const d = addDays(from, i); return { key: d, label: `${TD[dow(d)]} ${D0(d).getUTCDate()}`, date: d, room: c.room === 'all' ? '' : c.room }; })
      .filter(col => r.openDays.indexOf(dow(col.date)) !== -1 || items.some(it => it.date === col.date));
    const laneRooms = c.mode === 'week' && c.room === 'all' ? rs.filter(x => truthy(x.bookable) || items.some(it => it.roomId === x.id)) : null;
    const nowS = nowLocal(), nowD = nowS.substr(0, 10), nowM = mins(nowS.substr(11));
    let html = `<div class="cal"><div class="cal-grid" style="grid-template-columns:52px repeat(${cols.length}, minmax(${c.mode === 'day' ? 150 : 110}px, 1fr))">`;
    html += `<div class="cal-head corner"></div>` + cols.map(col => `<div class="cal-head ${col.date === today() && c.mode === 'week' ? 'today' : ''}">${col.label}</div>`).join('');
    html += `<div class="cal-times" style="height:${H}px">` + Array.from({ length: (e - o) / 60 + 1 }, (_, i) => `<div style="height:${i === (e - o) / 60 ? 0 : 60 * PXM}px">${hhmm(o + i * 60)}</div>`).join('') + '</div>';
    cols.forEach(col => {
      const ci = closedInfo(col.date, col.room, closures);
      html += `<div class="cal-col ${ci ? 'closed' : ''}" data-date="${col.date}" data-room="${esc(col.room)}" style="height:${H}px" title="${ci ? esc(ci.reason) : 'แตะเพื่อจอง'}">`;
      for (let m = o; m < e; m += 30) html += `<div class="ln ${m % 60 === 0 ? 'h' : ''}" style="top:${(m - o) * PXM}px"></div>`;
      closures.filter(x => x.start && col.date >= x.date && col.date <= (x.endDate || x.date) && (!x.roomId || !col.room || x.roomId === col.room))
        .forEach(x => { html += `<div class="ev closure" style="top:${(mins(x.start) - o) * PXM}px;height:${(mins(x.end) - mins(x.start)) * PXM}px;left:2px;right:2px"><b>ปิด</b>${esc(x.reason)}</div>`; });
      items.forEach((it, idx) => {
        if (it.date !== col.date) return;
        if (c.mode === 'day' && it.roomId !== col.room) return;
        const rm = roomOf(it.roomId);
        let left = 2, width = 'calc(100% - 4px)';
        if (laneRooms) { const li = Math.max(0, laneRooms.findIndex(x => x.id === it.roomId)), n = laneRooms.length; left = `calc(${li * 100 / n}% + 1px)`; width = `calc(${100 / n}% - 2px)`; }
        const top = (mins(it.start) - o) * PXM, h = Math.max(18, (mins(it.end) - mins(it.start)) * PXM - 2);
        html += `<div class="ev ${it.status === 'pending' ? 'pending' : ''}" data-item="${idx}" style="--c:${esc(rm.color)};top:${top}px;height:${h}px;left:${typeof left === 'number' ? left + 'px' : left};width:${width}" title="${esc(it.start + '–' + it.end + ' ' + it.label)}">
          <b>${it.start}–${it.end}</b>${esc(it.label)}${laneRooms ? '' : it.who ? '<br>' + esc(it.who) : ''}</div>`;
      });
      if (col.date === nowD && nowM >= o && nowM <= e) html += `<div class="nowline" style="top:${(nowM - o) * PXM}px"></div>`;
      html += '</div>';
    });
    return html + '</div></div>';
  }
  function monthGrid(from, items, closures) {
    const cur = ST.cal.date.substr(0, 7);
    let h = '<div class="month">' + ['จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.', 'อา.'].map(d => `<div class="mh">${d}</div>`).join('');
    for (let i = 0; i < 42; i++) {
      const d = addDays(from, i), its = items.map((x, k) => [x, k]).filter(p => p[0].date === d);
      const ci = closedInfo(d, ST.cal.room === 'all' ? '' : ST.cal.room, closures);
      h += `<div data-day="${d}" class="${d.substr(0, 7) !== cur ? 'out' : ''} ${d === today() ? 'td' : ''} ${ci ? 'cls' : ''}"><span class="dn">${D0(d).getUTCDate()}</span>${ci && d.substr(0, 7) === cur ? ` <span class="xs muted">${esc(ci.reason)}</span>` : ''}
        ${its.slice(0, 4).map(p => `<span class="mchip" data-item="${p[1]}" style="--c:${esc(roomOf(p[0].roomId).color)}">${p[0].start} ${esc(p[0].label)}</span>`).join('')}${its.length > 4 ? `<span class="xs muted">+${its.length - 4} รายการ</span>` : ''}</div>`;
    }
    return h + '</div>';
  }
  function listView(from, to, items, closures) {
    let h = '<div class="card agenda">', any = false;
    for (let d = from; d <= to; d = addDays(d, 1)) {
      const its = items.map((x, k) => [x, k]).filter(p => p[0].date === d);
      const cl = closures.filter(x => d >= x.date && d <= (x.endDate || x.date));
      if (!its.length && !cl.length) continue;
      any = true;
      h += `<h4 class="mt">${thL(d)}</h4>` + cl.map(x => `<div class="small" style="color:var(--danger)">⛔ ${x.roomId ? esc(roomOf(x.roomId).name) : 'ทุกห้อง'} ปิด${x.start ? ' ' + x.start + '–' + x.end : 'ทั้งวัน'} — ${esc(x.reason)}</div>`).join('') +
        its.map(p => `<div data-item="${p[1]}" style="cursor:pointer">${agendaRow(p[0])}</div>`).join('');
    }
    return any ? h + '</div>' : '<div class="card empty">ไม่มีรายการในช่วง 2 สัปดาห์นี้</div>';
  }

  /* ================= จองห้อง ================= */

      <form id="bf" autocomplete="on" novalidate>
      <div class="card"><div class="step"><b>1</b>เลือกห้อง วันที่ และเวลา</div>
        <div class="roompick">${bookable.map(x => `<label style="--c:${esc(x.color)}"><input type="radio" name="roomId" value="${esc(x.id)}" ${x.id === roomId ? 'checked' : ''}><b>${esc(x.name)}</b><div class="xs muted">${esc(x.kind)} · ${fmt(x.capacity, 0)} ที่นั่ง</div></label>`).join('') || '<div class="muted">ยังไม่มีห้องที่เปิดให้จองออนไลน์</div>'}</div>
        <div class="fgrid mt"><label class="f"><span>วันที่ใช้ห้อง <i>*</i></span><input type="date" name="date" value="${date}" min="${minDate}" max="${maxDate}"></label>
          <label class="f"><span>เวลาเริ่ม <i>*</i></span><select name="start"></select></label><label class="f"><span>เวลาสิ้นสุด <i>*</i></span><select name="end"></select></label></div>
        <div class="small muted mb">แตะช่องเวลาว่าง (สีเขียว) เพื่อเลือกเวลาเริ่ม แล้วแตะอีกครั้งที่ช่องสุดท้ายเพื่อเลือกเวลาสิ้นสุด</div>
        <div id="slots"></div>

      </div>
      <div class="card"><div class="step"><b>2</b>ข้อมูลผู้จอง</div>
        <div class="chips mb">${Object.keys(P.userTypes).map(k => `<label class="chip"><input type="radio" name="userType" value="${k}" ${(me.userType || 'student') === k ? 'checked' : ''}>${esc(P.userTypes[k])}</label>`).join('')}</div>
        <div class="fgrid">
          <label class="f"><span>ชื่อ-นามสกุล <i>*</i></span><input type="text" name="name" value="${esc(me.name || '')}" autocomplete="name"></label>
          <label class="f" data-for="student"><span>รหัสนักศึกษา <i>*</i></span><input type="text" name="studentId" value="${esc(me.studentId || '')}" inputmode="numeric"></label>
          <label class="f"><span>คณะ / หน่วยงาน</span><input type="text" name="faculty" value="${esc(me.faculty || 'คณะครุศาสตร์')}"></label>
          <label class="f"><span>สาขาวิชา / ชั้นปี</span><input type="text" name="major" value="${esc(me.major || '')}"></label>
          <label class="f"><span>เบอร์โทรศัพท์ <i>*</i></span><input type="tel" name="phone" value="${esc(me.phone || '')}" autocomplete="tel" inputmode="tel"></label>
          <label class="f"><span>อีเมล (รับการแจ้งเตือน)</span><input type="email" name="email" value="${esc(me.email || '')}" autocomplete="email"></label>
        </div>
        <label class="check small"><input type="checkbox" id="remember" ${me.name ? 'checked' : ''}> จดจำข้อมูลผู้จองในเครื่องนี้</label>
      </div>
      <div class="card"><div class="step"><b>3</b>รายละเอียดการใช้ห้อง</div>
        <div class="fgrid">
          <label class="f"><span>วัตถุประสงค์ <i>*</i></span><select name="purpose">${Object.keys(P.purposes).map(k => `<option value="${k}">${esc(P.purposes[k])}</option>`).join('')}</select></label>
          <label class="f"><span>หัวข้อ / เรื่องที่สอน <i>*</i></span><input type="text" name="title" placeholder="เช่น ฝึกทักษะการใช้คำถาม เรื่อง ระบบสุริยะ"></label>
          <label class="f"><span>รหัส–ชื่อรายวิชา</span><input type="text" name="course" placeholder="เช่น 1061201 วิธีวิทยาการจัดการเรียนรู้"></label>
          <label class="f"><span>อาจารย์ผู้สอน / ที่ปรึกษารายวิชา <i data-for="student">*</i></span><input type="text" name="advisor"></label>
          <label class="f"><span>จำนวนผู้เข้าใช้ (คน) <i>*</i></span><input type="number" name="participants" min="1" value="10"></label>
        </div>
        <div class="f"><span class="small" style="font-weight:600;color:var(--ink-2)">อุปกรณ์ที่ต้องการใช้</span><div class="chips mt" id="eqChips"></div></div>
        <label class="check mt"><input type="checkbox" name="record"> 🎥 ต้องการบันทึกวิดีโอการสอน (รับไฟล์ทาง Google Drive)</label>
        <label class="check"><input type="checkbox" name="support"> 🙋 ต้องการเจ้าหน้าที่ช่วยควบคุมอุปกรณ์ / ถ่ายทำระหว่างใช้ห้อง</label>
        <label class="f mt"><span>หมายเหตุเพิ่มเติม</span><textarea name="note" placeholder="เช่น ต้องการจัดโต๊ะเป็นกลุ่ม 5 กลุ่ม / มีผู้สังเกตการณ์จากภายนอก"></textarea></label>
        <input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
      </div>
      <div class="card"><label class="check"><input type="checkbox" name="consent"> <span>ข้าพเจ้าได้อ่านและยอมรับ <a href="#" data-pg="rules">ระเบียบการใช้ห้อง</a> และ <a href="#" data-pg="privacy">นโยบายข้อมูลส่วนบุคคล</a> ยินยอมให้บันทึกภาพและเสียงเพื่อการเรียนการสอน (กรณีขอบันทึกวิดีโอ)</span></label>
        <div id="sumBox" class="announce" hidden></div>
        <button class="bigbtn mt" type="submit">ส่งคำขอจอง</button></div>
      </form></div>`;
    const f = $('#bf');
    $$('[data-pg]', f).forEach(a => a.onclick = e => { e.preventDefault(); const p = page(a.dataset.pg); if (p) modal(esc(p.title), `<div class="md">${md(p.body)}</div>`, '', { wide: true }); });
    const ut = () => (f.querySelector('[name=userType]:checked') || {}).value;
    const syncUT = () => $$('[data-for=student]', f).forEach(x => x.hidden = ut() !== 'student');
    $$('[name=userType]', f).forEach(x => x.onchange = syncUT); syncUT();
    let busySlots = [];
    const curRoom = () => (f.querySelector('[name=roomId]:checked') || {}).value;
    const steps = () => { const a = []; for (let m = mins(r.openTime); m < mins(r.closeTime); m += r.slotMinutes) a.push(m); return a; };
    const isBusy = m => busySlots.some(b => m < b[1] && m + r.slotMinutes > b[0]);
    const isPast = m => { const at = new Date(f.date.value + 'T' + hhmm(m) + ':00Z'), nw = new Date(nowLocal().replace(' ', 'T') + ':00Z'); return (at - nw) / 3600000 < r.minLeadHours; };
    function fillSelects() {
      const st = steps();
      f.start.innerHTML = '<option value="">-- เลือก --</option>' + st.map(m => `<option value="${hhmm(m)}" ${hhmm(m) === sel.start ? 'selected' : ''}>${hhmm(m)}</option>`).join('');
      const ends = st.map(m => m + r.slotMinutes).filter(m => !sel.start || (m > mins(sel.start) && m - mins(sel.start) <= r.maxHours * 60));
      f.end.innerHTML = '<option value="">-- เลือก --</option>' + ends.map(m => `<option value="${hhmm(m)}" ${hhmm(m) === sel.end ? 'selected' : ''}>${hhmm(m)}</option>`).join('');
    }
    function drawSlots() {
      const box = $('#slots');
      const d = f.date.value, rm = curRoom();
      if (!d || !rm) { box.innerHTML = ''; return; }
      if (r.openDays.indexOf(dow(d)) === -1) { box.innerHTML = `<div class="announce mt0">วัน${TDL[dow(d)]}ไม่เปิดให้จองออนไลน์ — หากจำเป็น <a href="#forms">ยื่นคำร้องขอใช้นอกเวลา</a></div>`; return; }
      box.innerHTML = '<div class="muted small">กำลังตรวจสอบเวลาว่าง…</div>';
      loadSchedule(d, d, true).then(data => {
        const full = data.closures.find(c => (!c.roomId || c.roomId === rm) && !c.start);
        if (full) { box.innerHTML = `<div class="announce mt0">⛔ ห้องปิดให้บริการวันนี้: ${esc(full.reason)}</div>`; busySlots = [[0, 1440]]; return; }
        busySlots = data.items.filter(it => it.roomId === rm).map(it => [mins(it.start) - r.bufferMinutes, mins(it.end) + r.bufferMinutes])
          .concat(data.closures.filter(c => (!c.roomId || c.roomId === rm) && c.start).map(c => [mins(c.start), mins(c.end)]));
        if (sel.start && (isBusy(mins(sel.start)) || isPast(mins(sel.start)))) { sel.start = ''; sel.end = ''; }
        paint();
      }).catch(e => { box.innerHTML = `<div class="muted">${esc(e.message)}</div>`; });
    }
    function paint() {
      const box = $('#slots'), s = sel.start ? mins(sel.start) : -1, e = sel.end ? mins(sel.end) : -1;
      box.innerHTML = `<div class="slots">${steps().map(m => `<div class="slot ${isPast(m) ? 'past' : isBusy(m) ? 'busy' : ''} ${m >= s && m < e ? 'sel' : ''}" data-m="${m}">${hhmm(m)}</div>`).join('')}</div>`;
      $$('.slot', box).forEach(x => x.onclick = () => {
        if (x.classList.contains('busy') || x.classList.contains('past')) return;
        const m = Number(x.dataset.m), cs = sel.start ? mins(sel.start) : -1;
        if (cs >= 0 && m >= cs && (!sel.end || mins(sel.end) - cs === r.slotMinutes) && m + r.slotMinutes - cs <= r.maxHours * 60) {
          let ok = true; for (let k = cs; k <= m; k += r.slotMinutes) if (isBusy(k)) ok = false;
          if (ok) { sel.end = hhmm(m + r.slotMinutes); fillSelects(); paint(); summary(); return; }
        }
        sel.start = hhmm(m); sel.end = hhmm(m + r.slotMinutes); fillSelects(); paint(); summary();
      });
      fillSelects(); summary();
    }
    function summary() {
      const b = $('#sumBox'); const rm = roomOf(curRoom());
      if (sel.start && sel.end) { b.hidden = false; b.innerHTML = `📌 ${esc(rm.name)} · ${thL(f.date.value)} · <b>${sel.start}–${sel.end} น.</b> (${fmt((mins(sel.end) - mins(sel.start)) / 60)} ชม.)`; }
      else b.hidden = true;
    }
    function drawEquip() {
      const rm = curRoom();
      const eq = P.equipment.filter(e => e.status === 'ready' && (e.roomId === rm || truthy(e.lendable)));
      const names = Array.from(new Set(eq.map(e => e.name)));
      $('#eqChips').innerHTML = names.map(n => `<label class="chip"><input type="checkbox" name="equipment[]" value="${esc(n)}">${esc(n)}</label>`).join('') || '<span class="muted small">-</span>';
    }
    f.start.onchange = () => { sel.start = f.start.value; if (!sel.end || mins(sel.end) <= mins(sel.start)) sel.end = sel.start ? hhmm(mins(sel.start) + r.slotMinutes) : ''; paint(); };
    f.end.onchange = () => { sel.end = f.end.value; paint(); };
    f.date.onchange = drawSlots;
    $$('[name=roomId]', f).forEach(x => x.onchange = () => { drawSlots(); drawEquip(); });
    drawEquip(); fillSelects(); drawSlots();
    f.onsubmit = e => {
      e.preventDefault();
      const o = formData(f);
      o.start = sel.start; o.end = sel.end;
      if (!o.roomId) return toast('กรุณาเลือกห้อง', 'err');
      if (!o.start || !o.end) return toast('กรุณาเลือกช่วงเวลา', 'err');
      for (let k = mins(o.start); k < mins(o.end); k += r.slotMinutes) if (isBusy(k)) return toast('ช่วงเวลาที่เลือกมีบางช่วงไม่ว่าง', 'err');
      if (!o.name.trim() || !o.phone.trim() || !o.title.trim()) return toast('กรุณากรอกข้อมูลที่มีเครื่องหมาย * ให้ครบ', 'err');
      if (o.consent !== 'TRUE') return toast('กรุณายอมรับระเบียบการใช้ห้อง', 'err');
      if ($('#remember').checked) LS.set('me', { userType: o.userType, name: o.name, studentId: o.studentId, faculty: o.faculty, major: o.major, phone: o.phone, email: o.email });
      else LS.set('me', null);
      const btn = f.querySelector('[type=submit]'); btn.disabled = true; btn.textContent = 'กำลังส่ง…';
      call('submitBooking', o).then(res => {
        clearSched();
        LS.set('last', { code: res.code, contact: o.phone });
        const gcal = 'https://calendar.google.com/calendar/render?action=TEMPLATE&ctz=Asia/Bangkok&text=' + encodeURIComponent('ใช้ห้อง ' + res.roomName + ' (' + res.code + ')') +
          '&dates=' + res.date.replace(/-/g, '') + 'T' + res.start.replace(':', '') + '00/' + res.date.replace(/-/g, '') + 'T' + res.end.replace(':', '') + '00&details=' + encodeURIComponent(o.title + '\nรหัสการจอง ' + res.code);
        el.innerHTML = `<div class="wrap page"><div class="card center" style="max-width:640px;margin:auto">
          <div style="font-size:54px">${res.status === 'approved' ? '✅' : '📨'}</div><h2>${res.status === 'approved' ? 'จองสำเร็จ' : 'ส่งคำขอจองเรียบร้อย'}</h2>
          <p class="muted">${res.status === 'approved' ? 'การจองได้รับการยืนยันแล้ว' : 'สถานะ: <b>รออนุมัติ</b> — เจ้าหน้าที่จะพิจารณาภายใน 1 วันทำการ'}</p>
          <p>รหัสการจองของคุณ</p><div class="codebox">${esc(res.code)}</div>
          <p class="small muted mt">${esc(res.roomName)} · ${thL(res.date)} · ${res.start}–${res.end} น.</p>
          <p class="small">โปรดจดรหัสนี้ไว้ ใช้คู่กับเบอร์โทร/อีเมลเพื่อตรวจสอบสถานะ ยกเลิก และให้เพื่อน/อาจารย์ประเมินการสอน${res.hasEmail ? ' · ระบบส่งอีเมลยืนยันให้แล้ว' : ''}</p>
          <div class="row" style="justify-content:center"><button class="btn ghost" id="cpy">📋 คัดลอกรหัส</button><a class="btn ghost" href="${gcal}" target="_blank" rel="noopener">➕ Google Calendar</a><a class="btn" href="#status/${encodeURIComponent(res.code)}">ตรวจสอบสถานะ</a></div>
        </div></div>`;
        $('#cpy').onclick = () => copy(res.code);
        window.scrollTo(0, 0);
      }).catch(err => { toast(err.message, 'err'); btn.disabled = false; btn.textContent = 'ส่งคำขอจอง'; drawSlots(); });
    };
  }

  /* ================= ตรวจสอบสถานะ ================= */
  function vStatus(el, arg) {
    const last = LS.get('last') || {};
    const isReq = /^RQ/i.test(arg || '');
    el.innerHTML = `<div class="wrap page" style="max-width:860px"><h1>🔎 ตรวจสอบสถานะ</h1>
      <div class="card"><form id="sf" class="fgrid" style="align-items:end">
        <label class="f"><span>ประเภท</span><select name="kind"><option value="b">การจองห้อง (MT…)</option><option value="r" ${isReq ? 'selected' : ''}>คำร้อง (RQ…)</option></select></label>
        <label class="f"><span>รหัสอ้างอิง</span><input type="text" name="code" value="${esc(arg || last.code || '')}" placeholder="เช่น MT6911-K7Q2" style="text-transform:uppercase"></label>
        <label class="f"><span>เบอร์โทร หรือ อีเมลที่ใช้ตอนส่ง</span><input type="text" name="contact" value="${esc(arg && arg !== last.code ? '' : last.contact || '')}"></label>
        <label class="f"><button class="btn block" type="submit">ตรวจสอบ</button></label></form></div>
      <div id="res"></div></div>`;
    const f = $('#sf');
    f.code.oninput = () => { if (/^RQ/i.test(f.code.value)) f.kind.value = 'r'; else if (/^MT/i.test(f.code.value)) f.kind.value = 'b'; };
    f.onsubmit = e => {
      e.preventDefault();
      const o = formData(f);
      if (!o.code || !o.contact) return toast('กรุณากรอกรหัสและเบอร์โทร/อีเมล', 'err');
      if (o.kind === 'r') call('checkRequest', o.code, o.contact).then(showReq).catch(err => toast(err.message, 'err'));
      else call('checkBooking', o.code, o.contact).then(v => { LS.set('last', { code: v.code, contact: o.contact }); showBk(v, o.contact); }).catch(err => toast(err.message, 'err'));
    };
    if ((arg || last.code) && f.contact.value) f.requestSubmit ? f.requestSubmit() : f.onsubmit(new Event('submit'));
  }
  function showReq(q) {
    $('#res').innerHTML = `<div class="card mt"><div class="row between"><h3 class="mt0">${esc(q.code)} · ${esc(q.typeLabel)}</h3>${rqBadge(q.status)}</div>
      <dl class="kv"><dt>เรื่อง</dt><dd>${esc(q.subject)}</dd><dt>รายละเอียด</dt><dd>${esc(q.detail).replace(/\n/g, '<br>')}</dd>${q.refCode ? `<dt>อ้างอิง</dt><dd>${esc(q.refCode)}</dd>` : ''}${q.needDate ? `<dt>วันที่ต้องการ</dt><dd>${thL(q.needDate)}</dd>` : ''}
      <dt>ยื่นเมื่อ</dt><dd>${thDT(q.createdAt)}</dd><dt>อัปเดตล่าสุด</dt><dd>${thDT(q.updatedAt)}</dd></dl>
      ${q.response ? `<div class="announce" style="background:var(--info-soft);border-color:#bcd4ef;color:#1d3f66"><b>คำตอบจากเจ้าหน้าที่:</b><br>${esc(q.response).replace(/\n/g, '<br>')}</div>` : ''}</div>`;
  }

    const bad = ['rejected', 'cancelled', 'noshow'].indexOf(v.status) !== -1;
    const evalUrl = (CFG.baseUrl || '') + '?view=evaluate&code=' + encodeURIComponent(v.code);
    const ev = v.evaluations;
    $('#res').innerHTML = `<div class="card mt"><div class="row between"><h3 class="mt0">รหัส ${esc(v.code)}</h3>${stBadge(v.status)}</div>
      ${bad ? `<div class="timeline"><div class="on">ส่งคำขอ</div><div class="bad">${esc(v.statusLabel)}</div></div>` :

        <dt>วัตถุประสงค์</dt><dd>${esc(v.purposeLabel)}</dd>${v.course ? `<dt>รายวิชา</dt><dd>${esc(v.course)}</dd>` : ''}<dt>ผู้จอง</dt><dd>${esc(v.name)}</dd><dt>จำนวน</dt><dd>${esc(v.participants)} คน</dd>
        ${v.equipment ? `<dt>อุปกรณ์</dt><dd>${esc(v.equipment)}</dd>` : ''}<dt>บันทึกวิดีโอ</dt><dd>${truthy(v.record) ? 'ต้องการ' : 'ไม่ต้องการ'}</dd>
        ${v.staffNote ? `<dt>หมายเหตุเจ้าหน้าที่</dt><dd><b>${esc(v.staffNote)}</b></dd>` : ''}${v.cancelReason ? `<dt>การยกเลิก</dt><dd>${esc(v.cancelReason)}</dd>` : ''}
        <dt>ส่งคำขอเมื่อ</dt><dd>${thDT(v.createdAt)}</dd></dl>
      ${v.videoUrl ? `<a class="bigbtn mt" href="${link(v.videoUrl)}" target="_blank" rel="noopener"><span class="e">🎬</span>เปิดไฟล์วิดีโอการสอน</a>` : truthy(v.record) && !bad ? '<div class="small muted mt">🎬 ลิงก์ไฟล์วิดีโอจะแสดงที่นี่หลังเจ้าหน้าที่อัปโหลด (1–3 วันทำการ)</div>' : ''}
      <div class="row mt">${v.canCancel ? '<button class="btn red sm" id="cancelBk">ยกเลิกการจอง</button>' : ''}<button class="btn ghost sm" id="refresh">↻ รีเฟรช</button></div></div>
      ${['approved', 'checkedin', 'completed'].indexOf(v.status) !== -1 ? `<div class="card"><h3>📝 ประเมินการสอน (ตนเอง / เพื่อน / อาจารย์)</h3>
        <p class="small muted mt0">แชร์ลิงก์หรือรหัส <b>${esc(v.code)}</b> ให้เพื่อนและอาจารย์ประเมินทักษะการสอนของคุณ ผลสรุปจะแสดงด้านล่าง</p>
        <div class="row"><a class="btn sm" href="#evaluate/${encodeURIComponent(v.code)}">ประเมินตนเอง</a><button class="btn sm ghost" id="cpyEval">📋 คัดลอกลิงก์ประเมิน</button></div>
        ${ev.count ? `<div class="mt"><div class="small muted">ผู้ประเมิน ${ev.count} คน (ตนเอง ${ev.roles.self || 0} · เพื่อน ${ev.roles.peer || 0} · อาจารย์ ${ev.roles.lecturer || 0})</div>
          ${ev.skills.map(s => `<div class="hbar"><span class="small">${esc(s.name)}</span><div class="bar"><i style="width:${s.avg / 5 * 100}%"></i></div><b class="small right">${s.avg.toFixed(2)}</b></div>`).join('')}
          ${ev.comments.length ? `<h4 class="mt">ข้อเสนอแนะ</h4>${ev.comments.map(cm => `<div class="newsitem small"><b>${{ self: 'ตนเอง', peer: 'เพื่อน', lecturer: 'อาจารย์' }[cm.role] || ''}${cm.evaluator ? ' (' + esc(cm.evaluator) + ')' : ''}</b>${cm.strengths ? `<div>👍 ${esc(cm.strengths)}</div>` : ''}${cm.improve ? `<div>🔧 ${esc(cm.improve)}</div>` : ''}</div>`).join('')}` : ''}</div>` : '<div class="small muted mt">ยังไม่มีผู้ประเมิน</div>'}
      </div>` : ''}
      ${v.canFeedback ? `<div class="card"><h3>⭐ แบบประเมินความพึงพอใจการใช้บริการ</h3><form id="fbf">

  function drawEvalForm(t) {
    const box = $('#evBox');
    box.innerHTML = `<div class="card"><div class="row between"><div><h3 class="mt0">${esc(t.title)}</h3><div class="small muted">ผู้สอน: <b>${esc(t.teacher)}</b>${t.course ? ' · ' + esc(t.course) : ''} · ${esc(t.roomName)} · ${esc(t.dateText)} ${t.start}–${t.end} น.</div></div><span class="badge b-approved">${esc(t.code)}</span></div></div>
      <form id="ef" class="card"><div class="fgrid"><label class="f"><span>ประเมินในฐานะ</span><select name="role"><option value="peer">เพื่อน / ผู้สังเกต</option><option value="lecturer">อาจารย์ / ผู้นิเทศ</option><option value="self">ตนเอง (ผู้สอน)</option></select></label>
        <label class="f" id="evName"><span>ชื่อผู้ประเมิน <i>*</i></span><input type="text" name="evaluator"></label></div>
        <div class="small" style="font-weight:600">เลือกทักษะที่จะประเมิน (ไมโครทีชชิ่งมักเน้น 1–2 ทักษะต่อรอบ)</div>
        <div class="chips mt mb">${P.skills.map((s, i) => `<label class="chip"><input type="checkbox" data-skill="${s.key}" ${i < 2 ? 'checked' : ''}>${i + 1}. ${esc(s.name.replace('ทักษะการ', '').replace('ทักษะ', ''))}</label>`).join('')}</div>
        <div id="skillForms"></div>
        <div class="fgrid mt"><label class="f"><span>👍 จุดเด่น</span><textarea name="strengths"></textarea></label><label class="f"><span>🔧 สิ่งที่ควรปรับปรุง / ข้อเสนอแนะ</span><textarea name="improve"></textarea></label></div>
        <button class="bigbtn" type="submit">ส่งผลการประเมิน</button></form>`;
    const f = $('#ef');
    f.role.onchange = () => { $('#evName').hidden = f.role.value === 'self'; };
    const drawSkills = () => {
      const keep = {};
      $$('[data-sc]', f).forEach(i => { if (i.checked) keep[i.name] = i.value; });
      $('#skillForms').innerHTML = P.skills.filter(s => $(`[data-skill=${s.key}]`, f).checked).map(s => `<div class="card" style="box-shadow:none;background:var(--bg-2)"><h4>${esc(s.name)}</h4>
        ${s.items.map((it, j) => `<div class="row between" style="padding:5px 0;border-bottom:1px dashed var(--line)"><span class="grow small">${j + 1}) ${esc(it)}</span><span class="scale">${[1, 2, 3, 4, 5].map(n => `<label><input type="radio" data-sc name="${s.key}_${j}" value="${n}" ${keep[s.key + '_' + j] == n ? 'checked' : ''}>${n}</label>`).join('')}</span></div>`).join('')}</div>`).join('') || '<div class="muted small">ยังไม่ได้เลือกทักษะ</div>';
    };
    $$('[data-skill]', f).forEach(c => c.onchange = drawSkills); drawSkills();
    f.onsubmit = e => {
      e.preventDefault();
      const o = formData(f), scores = {};
      let missing = 0;
      P.skills.forEach(s => {
        if (!$(`[data-skill=${s.key}]`, f).checked) return;
        scores[s.key] = s.items.map((_, j) => { const v = (f.querySelector(`[name="${s.key}_${j}"]:checked`) || {}).value; if (!v) missing++; return Number(v || 0); });
      });
      if (!Object.keys(scores).length) return toast('กรุณาเลือกทักษะอย่างน้อย 1 ทักษะ', 'err');
      if (missing) return toast('ยังให้คะแนนไม่ครบ ' + missing + ' ข้อ', 'err');
      if (o.role !== 'self' && !o.evaluator.trim()) return toast('กรุณากรอกชื่อผู้ประเมิน', 'err');
      call('submitEvaluation', t.code, { role: o.role, evaluator: o.evaluator, scores: scores, strengths: o.strengths, improve: o.improve }).then(res => {
        $('#evBox').innerHTML = `<div class="card center"><div style="font-size:50px">🙏</div><h3>ส่งผลการประเมินแล้ว</h3><p>คะแนนเฉลี่ยที่คุณให้: <b>${res.avg.toFixed(2)}</b> / 5</p><button class="btn ghost" id="evAgain">ประเมินอีกครั้ง (ผู้ประเมินคนอื่น)</button></div>`;
        $('#evAgain').onclick = () => drawEvalForm(t);
        window.scrollTo(0, 0);
      }).catch(err => toast(err.message, 'err'));
    };
  }

  /* ================= ป้ายหน้าห้อง ================= */
  let dispTimer = null;
  function renderDisplay(roomId) {
    if (!roomId) { app.innerHTML = `<div class="display"><div class="big">เลือกห้องสำหรับป้ายหน้าห้อง</div>${P.rooms.map(r => `<a class="bigbtn" href="#display/${esc(r.id)}">${esc(r.name)}</a>`).join('')}</div>`; return; }
    const draw = () => call('getDisplay', roomId).then(d => {
      if (location.hash.indexOf('#display') !== 0) return;
      const nm = mins(nowLocal().substr(11));
      const cur = d.items.find(i => mins(i.start) <= nm && nm < mins(i.end));
      const next = d.items.filter(i => mins(i.start) > nm);
      app.innerHTML = `<div class="display"><div class="row between"><div><div class="big">${esc(d.room.name)}</div><div style="opacity:.7;font-size:20px">${esc(d.todayText)}</div></div><div class="clock" id="clk">${nowLocal().substr(11)}</div></div>
        ${d.closed ? `<div class="state closedst"><div style="font-size:44px">⛔ ปิดให้บริการ</div><div style="font-size:22px">${esc(d.closed)}</div></div>` :
          cur ? `<div class="state busyst"><div style="font-size:22px;opacity:.85">กำลังใช้งาน · ${cur.start}–${cur.end} น.</div><div style="font-size:42px;font-weight:700">${esc(cur.label)}</div><div style="font-size:22px">${esc(cur.course || '')} ${esc(cur.who || '')}</div></div>` :
          `<div class="state free"><div style="font-size:48px;font-weight:700">✅ ว่าง</div><div style="font-size:22px">${next[0] ? 'การใช้ครั้งถัดไป ' + next[0].start + ' น.' : 'ไม่มีการจองต่อจากนี้ในวันนี้'}</div></div>`}
        <div class="nx"><div style="opacity:.7;margin-bottom:8px">ตารางวันนี้</div>${d.items.length ? d.items.map(i => `<div style="padding:6px 0;border-bottom:1px solid #333;${mins(i.end) <= nm ? 'opacity:.4' : ''}"><b>${i.start}–${i.end}</b> · ${esc(i.label)} <span style="opacity:.6">${esc(i.course || '')}</span></div>`).join('') : '<div>— ไม่มีการจอง —</div>'}</div>
        <div style="opacity:.6;font-size:16px">จองห้องออนไลน์: ${esc(CFG.baseUrl || P.site.appName)}</div></div>`;
    }).catch(e => { app.innerHTML = `<div class="display"><div class="big">${esc(e.message)}</div></div>`; });

    clearInterval(dispTimer);

  }

  /* ---------- รายการจอง ---------- */

        if (F.status && ['active', 'novideo'].indexOf(F.status) === -1 && b.status !== F.status) return false;
        if (F.room && b.roomId !== F.room) return false;
        if (F.from && b.date < F.from) return false; if (F.to && b.date > F.to) return false;
        if (q && [b.code, b.name, b.title, b.course, b.phone, b.studentId, b.advisor, b.email].join(' ').toLowerCase().indexOf(q) === -1) return false;
        return true;
      }).sort((a, b) => F.status === 'active' || F.status === 'pending' ? (a.date + a.start).localeCompare(b.date + b.start) : (b.date + b.start).localeCompare(a.date + a.start));
    };
    const draw = () => {
      const rows = list();
      $('#cnt').textContent = 'พบ ' + rows.length + ' รายการ · ' + fmt(rows.reduce((s, b) => s + hours(b), 0)) + ' ชั่วโมง';
      $('#tbl').innerHTML = `<tr><th><input type="checkbox" id="ckAll"></th><th>วันเวลา</th><th>ห้อง</th><th>หัวข้อ / ผู้จอง</th><th>สถานะ</th><th></th></tr>` + (rows.slice(0, 400).map(b => {
        const r = roomOf(b.roomId);
        return `<tr class="click" data-open="${b.id}"><td onclick="event.stopPropagation()">${b.status === 'pending' ? `<input type="checkbox" class="ck" value="${b.id}">` : ''}</td><td class="nowrap">${thD(b.date)}<div class="small"><b>${b.start}–${b.end}</b></div></td>
          <td><span class="dot" style="--c:${esc(r.color)}"></span>${esc(r.code || r.name)}</td><td>${esc(b.title)} ${truthy(b.record) ? (b.videoUrl ? '🎬' : '🎥') : ''}<div class="xs muted">${esc(b.name)} · ${esc(P.userTypes[b.userType] || '')}${b.course ? ' · ' + esc(b.course) : ''} · ${esc(b.code)}</div></td>

      $$('.ck').forEach(c => c.onchange = upd);
      $('#ckAll').onchange = e => { $$('.ck').forEach(c => c.checked = e.target.checked); upd(); };
    };
    $('#fq').oninput = e => { F.q = e.target.value; draw(); };
    $('#fs').onchange = e => { F.status = e.target.value; draw(); };
    $('#fr').onchange = e => { F.room = e.target.value; draw(); };
    $('#ff').onchange = e => { F.from = e.target.value; draw(); };
    $('#ft').onchange = e => { F.to = e.target.value; draw(); };
    $('#nb').onclick = () => bookingForm({});
    $('#bulk').onclick = () => api('approveMany', $$('.ck:checked').map(c => c.value)).then(r => { toast('อนุมัติ ' + r.ok.length + ' รายการ' + (r.fail.length ? ' · ไม่สำเร็จ ' + r.fail.length + ' (เวลาชน)' : ''), r.fail.length ? 'err' : 'ok'); refresh(); }).catch(e => toast(e.message, 'err'));
    $('#exp').onclick = () => download('bookings-' + A.today + '.csv', csv(list(), [['code', 'รหัส'], ['date', 'วันที่'], ['start', 'เริ่ม'], ['end', 'สิ้นสุด'], [b => roomOf(b.roomId).name, 'ห้อง'], ['title', 'หัวข้อ'],
      [b => P.purposes[b.purpose], 'วัตถุประสงค์'], ['name', 'ผู้จอง'], [b => P.userTypes[b.userType], 'ประเภท'], ['studentId', 'รหัสนักศึกษา'], ['faculty', 'คณะ'], ['major', 'สาขา'], ['phone', 'โทร'], ['email', 'อีเมล'],
      ['course', 'รายวิชา'], ['advisor', 'อาจารย์'], ['participants', 'จำนวน'], ['equipment', 'อุปกรณ์'], ['record', 'บันทึกวิดีโอ'], [b => P.bookingStatus[b.status], 'สถานะ'], ['videoUrl', 'ลิงก์วิดีโอ'], ['checkinAt', 'เช็กอิน'], ['checkoutAt', 'เช็กเอาต์'], ['condition', 'สภาพห้อง'], ['createdAt', 'วันที่จอง']]));
    draw();
  }

  /* ---------- ตัวแก้ไขแบบรวม (อุปกรณ์ วันปิด ห้อง ข่าว เอกสาร) ---------- */
  function itemForm(table, item, fields, title) {
    const m = modal(title, `<form id="itf"><div class="fgrid">${fields.map(fd => {
      const v = item[fd.k] != null && item[fd.k] !== '' ? item[fd.k] : (fd.def != null ? fd.def : '');
      if (fd.t === 'check') return `<label class="check" style="grid-column:1/-1"><input type="checkbox" name="${fd.k}" ${truthy(v) ? 'checked' : ''}> ${fd.l}</label>`;
      if (fd.t === 'select') return `<label class="f"><span>${fd.l}</span><select name="${fd.k}">${fd.o.map(o => `<option value="${esc(o[0])}" ${String(o[0]) === String(v) ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select></label>`;
      if (fd.t === 'area') return `<label class="f" style="grid-column:1/-1"><span>${fd.l}</span><textarea name="${fd.k}" rows="${fd.rows || 4}">${esc(v)}</textarea></label>`;
      return `<label class="f" ${fd.wide ? 'style="grid-column:1/-1"' : ''}><span>${fd.l}</span><input type="${fd.t || 'text'}" name="${fd.k}" value="${esc(v)}" ${fd.ph ? `placeholder="${esc(fd.ph)}"` : ''}></label>`;
    }).join('')}</div></form>`, `${item.id || item.key ? '<button class="btn ghost" id="itDel">🗑 ลบ</button>' : ''}<button class="btn ghost" data-x>ยกเลิก</button><button class="btn" id="itOk">บันทึก</button>`, { wide: true });
    $('#itOk', m).onclick = () => { const o = formData($('#itf', m)); if (item.id) o.id = item.id; if (item.key && !o.key) o.key = item.key; api('saveItem', table, o).then(() => { m.close(); toast('บันทึกแล้ว', 'ok'); refresh(); }).catch(e => toast(e.message, 'err')); };
    const d = $('#itDel', m); if (d) d.onclick = () => confirmBox('ลบรายการนี้?', 'ลบ').then(ok => ok && api('deleteItem', table, item.id || item.key).then(() => { m.close(); toast('ลบแล้ว', 'ok'); refresh(); }).catch(e => toast(e.message, 'err')));
  }

        <div class="card tscroll" style="padding:0"><table class="t"><tr><th>การจอง</th><th>ผู้สอน / หัวข้อ</th><th class="right">ผู้ประเมิน</th><th class="right">เฉลี่ย</th></tr>${Object.keys(byB).map(id => { const b = A.bookings.find(x => x.id === id) || {}; const es = byB[id]; return `<tr class="click" data-open="${esc(id)}"><td class="nowrap">${esc(es[0].bookingCode)}<div class="xs muted">${thD(b.date)}</div></td><td>${esc(b.name || '-')}<div class="xs muted">${esc(b.title || '')}</div></td><td class="right">${es.length}</td><td class="right"><b>${avg(es.map(e => num(e.avg))).toFixed(2)}</b></td></tr>`; }).join('') || '<tr><td colspan="4" class="empty">ยังไม่มีการประเมิน</td></tr>'}</table></div>`;
