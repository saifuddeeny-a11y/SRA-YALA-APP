  /* ---------- รายงาน ---------- */
  function lastDay(ym) { const d = D0(ym + '-01'); d.setUTCMonth(d.getUTCMonth() + 1); d.setUTCDate(0); return iso(d); }
  function utilization(from, to, roomId) {
    const r = R(), per = (mins(r.closeTime) - mins(r.openTime)) / 60;
    const rs = A.rooms.filter(x => truthy(x.active) && truthy(x.bookable) && (!roomId || x.id === roomId));
    let avail = 0;
    rs.forEach(rm => { for (let d = from; d <= to; d = addDays(d, 1)) { if (r.openDays.indexOf(dow(d)) === -1) continue; if (A.closures.some(c => !c.start && d >= c.date && d <= (c.endDate || c.date) && (!c.roomId || c.roomId === rm.id))) continue; avail += per; } });
    const used = A.bookings.filter(b => b.date >= from && b.date <= to && ['approved', 'checkedin', 'completed'].indexOf(b.status) !== -1 && rs.some(x => x.id === b.roomId)).reduce((s, b) => s + hours(b), 0);
    return { avail: avail, used: used, pct: avail ? used / avail * 100 : 0 };
  }
  function aReports(el) {
    const rp = ST.rpt;
    if (!rp.from) { rp.from = A.today.substr(0, 7) + '-01'; rp.to = lastDay(A.today.substr(0, 7)); }
    el.innerHTML = `<div class="row between noprint"><h2 class="mt0">📈 รายงานการใช้ห้อง</h2><div class="row"><button class="btn sm ghost" id="pr">🖨 พิมพ์ / PDF</button></div></div>
      <div class="filters noprint"><select id="preset"><option value="">— ช่วงเวลา —</option><option value="m0">เดือนนี้</option><option value="m1">เดือนที่แล้ว</option><option value="s1">ภาคเรียนที่ 1 (มิ.ย.–ต.ค.)</option><option value="s2">ภาคเรียนที่ 2 (พ.ย.–มี.ค.)</option><option value="fy">ปีงบประมาณ (ต.ค.–ก.ย.)</option></select>
        <input type="date" id="rf" value="${rp.from}"><input type="date" id="rt" value="${rp.to}"></div><div id="rpt"></div>`;
    const draw = () => {
      const from = rp.from, to = rp.to;
      const inR = A.bookings.filter(b => b.date >= from && b.date <= to);
      const used = inR.filter(b => ['approved', 'checkedin', 'completed'].indexOf(b.status) !== -1);
      const decided = inR.filter(b => ['approved', 'checkedin', 'completed', 'noshow', 'rejected'].indexOf(b.status) !== -1);
      const noshow = inR.filter(b => b.status === 'noshow').length, cancel = inR.filter(b => b.status === 'cancelled').length, rej = inR.filter(b => b.status === 'rejected').length;
      const u = utilization(from, to);
      const grp = (arr, key, lab) => { const o = {}; arr.forEach(b => { const k = typeof key === 'function' ? key(b) : b[key]; if (!k) return; o[k] = o[k] || { n: 0, h: 0 }; o[k].n++; o[k].h += hours(b); }); return Object.keys(o).map(k => ({ k: lab ? lab(k) : k, n: o[k].n, h: o[k].h })).sort((a, b) => b.n - a.n); };
      const bars = (rows, unit) => { const mx = Math.max(1, ...rows.map(r => r.n)); return rows.slice(0, 12).map(r => `<div class="hbar"><span class="small">${esc(r.k)}</span><div class="bar"><i style="width:${r.n / mx * 100}%"></i></div><b class="small right">${r.n}</b></div>`).join('') || '<div class="muted small">-</div>'; };
      const fb = A.feedback.filter(f => { const b = A.bookings.find(x => x.id === f.bookingId); return b && b.date >= from && b.date <= to; });
      const sat = fb.length ? fb.reduce((s, f) => s + num(f.q6), 0) / fb.length : 0;
      const people = new Set(used.map(b => (b.phone || '').replace(/\D/g, '') || b.name)).size;
      const participants = used.reduce((s, b) => s + num(b.participants), 0);
      const reqs = A.requests.filter(q => q.createdAt.substr(0, 10) >= from && q.createdAt.substr(0, 10) <= to);
      $('#rpt').innerHTML = `<div class="card"><h3 class="center">รายงานการใช้ห้องทดลองสอน (Micro Teaching)</h3><div class="center muted">${esc(P.site.org)} · ระหว่าง ${thL(from)} ถึง ${thL(to)}</div></div>
        <div class="grid kpis mt">
          <div class="kpi hl"><div class="v">${used.length}</div><div class="l">ครั้งที่ใช้ห้อง</div></div><div class="kpi"><div class="v">${fmt(u.used)}</div><div class="l">ชั่วโมงใช้งาน</div></div>
          <div class="kpi"><div class="v">${fmt(u.pct)}%</div><div class="l">อัตราการใช้ห้อง (${fmt(u.used)}/${fmt(u.avail)} ชม.)</div></div><div class="kpi"><div class="v">${people}</div><div class="l">ผู้จอง (คน) · ผู้เข้าใช้รวม ${fmt(participants, 0)} คน</div></div>
          <div class="kpi"><div class="v">${used.filter(b => truthy(b.record)).length}</div><div class="l">บันทึกวิดีโอการสอน</div></div><div class="kpi"><div class="v">${sat ? sat.toFixed(2) : '-'}</div><div class="l">ความพึงพอใจ (${fb.length} คน)</div></div>
          <div class="kpi"><div class="v">${decided.length ? fmt(noshow / decided.length * 100) : 0}%</div><div class="l">ไม่มาใช้ห้อง (${noshow}) · ยกเลิก ${cancel} · ไม่อนุมัติ ${rej}</div></div><div class="kpi"><div class="v">${reqs.length}</div><div class="l">คำร้อง</div></div></div>
        <div class="grid g2 mt">
          <div class="card"><h3>อัตราการใช้แต่ละห้อง</h3>${A.rooms.filter(r => truthy(r.active) && truthy(r.bookable)).map(r => { const x = utilization(from, to, r.id); return `<div class="hbar"><span class="small"><span class="dot" style="--c:${esc(r.color)}"></span>${esc(r.name)}</span><div class="bar"><i style="width:${Math.min(100, x.pct)}%"></i></div><b class="small right">${fmt(x.pct, 0)}%</b></div>`; }).join('')}</div>
          <div class="card"><h3>ตามวัตถุประสงค์</h3>${bars(grp(used, 'purpose', k => P.purposes[k] || k))}</div>
          <div class="card"><h3>ตามประเภทผู้ใช้</h3>${bars(grp(used, 'userType', k => P.userTypes[k] || k))}</div>
          <div class="card"><h3>ตามคณะ / หน่วยงาน</h3>${bars(grp(used, b => b.faculty || 'ไม่ระบุ'))}</div>
          <div class="card"><h3>รายวิชาที่ใช้ห้องมากที่สุด</h3>${bars(grp(used, 'course'))}</div>
          <div class="card"><h3>ช่วงเวลาที่ใช้มากที่สุด</h3>${bars(grp(used, b => b.start.substr(0, 2) + ':00 น.'))}</div>
          <div class="card"><h3>ตามวันในสัปดาห์</h3>${bars(grp(used, b => 'วัน' + TDL[dow(b.date)]))}</div>
          <div class="card"><h3>คำร้องตามประเภท</h3>${bars(grp(reqs, 'type', k => P.requestTypes[k] || k))}</div></div>
        <div class="card mt noprint"><h3>ส่งออกข้อมูล</h3><div class="row"><button class="btn sm ghost" id="x1">⬇ การจองในช่วงนี้ (CSV)</button><button class="btn sm ghost" id="x2">⬇ สรุปรายห้อง (CSV)</button></div></div>`;
      $('#x1').onclick = () => download('report-bookings-' + from + '_' + to + '.csv', csv(inR, [['code', 'รหัส'], ['date', 'วันที่'], ['start', 'เริ่ม'], ['end', 'สิ้นสุด'], [b => hours(b), 'ชั่วโมง'], [b => roomOf(b.roomId).name, 'ห้อง'], [b => P.purposes[b.purpose], 'วัตถุประสงค์'], [b => P.userTypes[b.userType], 'ประเภทผู้ใช้'], ['faculty', 'คณะ'], ['course', 'รายวิชา'], ['participants', 'จำนวนผู้เข้าใช้'], [b => P.bookingStatus[b.status], 'สถานะ']]));
      $('#x2').onclick = () => download('report-rooms-' + from + '_' + to + '.csv', csv(A.rooms.filter(r => truthy(r.active)), [['name', 'ห้อง'], [r => used.filter(b => b.roomId === r.id).length, 'ครั้ง'], [r => utilization(from, to, r.id).used, 'ชั่วโมงใช้'], [r => utilization(from, to, r.id).avail, 'ชั่วโมงเปิดให้บริการ'], [r => fmt(utilization(from, to, r.id).pct) + '%', 'อัตราการใช้']]));
    };
    $('#rf').onchange = e => { rp.from = e.target.value; draw(); };
    $('#rt').onchange = e => { rp.to = e.target.value; draw(); };
    $('#preset').onchange = e => {
      const y = Number(A.today.substr(0, 4)), m = Number(A.today.substr(5, 2)), v = e.target.value, p2 = n => ('0' + n).slice(-2);
      if (v === 'm0') { rp.from = A.today.substr(0, 7) + '-01'; rp.to = lastDay(A.today.substr(0, 7)); }
      if (v === 'm1') { const d = D0(A.today.substr(0, 7) + '-01'); d.setUTCMonth(d.getUTCMonth() - 1); const k = iso(d).substr(0, 7); rp.from = k + '-01'; rp.to = lastDay(k); }
      if (v === 's1') { const yy = m >= 6 ? y : y - 1; rp.from = yy + '-06-01'; rp.to = yy + '-10-31'; }
      if (v === 's2') { const yy = m >= 11 ? y : y - 1; rp.from = yy + '-11-01'; rp.to = lastDay((yy + 1) + '-03'); }
      if (v === 'fy') { const yy = m >= 10 ? y : y - 1; rp.from = yy + '-10-01'; rp.to = (yy + 1) + '-09-30'; }
      $('#rf').value = rp.from; $('#rt').value = rp.to; draw();
      void p2;
    };
    $('#pr').onclick = () => window.print();
    draw();
  }

  /* ---------- เนื้อหาเว็บ ---------- */
  function aContent(el) {
    const tab = ST.ctTab || 'pages';
    el.innerHTML = `<h2 class="mt0">📝 เนื้อหาหน้าเว็บ</h2><div class="tabs"><button data-t="pages">หน้าเว็บ</button><button data-t="news">ข่าวประชาสัมพันธ์</button><button data-t="docs">เอกสารดาวน์โหลด</button></div><div id="ct"></div>`;
    $$('[data-t]').forEach(b => { b.classList.toggle('on', b.dataset.t === tab); b.onclick = () => { ST.ctTab = b.dataset.t; aContent(el); }; });
    const ct = $('#ct');
    if (tab === 'pages') {
      ct.innerHTML = `${isAdmin() ? '<div class="row mb"><button class="btn sm" id="np">＋ เพิ่มหน้า</button></div>' : '<p class="muted small">แก้ไขหน้าเว็บได้เฉพาะผู้ดูแลระบบ</p>'}
        <div class="card tscroll" style="padding:0"><table class="t"><tr><th>หน้า</th><th>รหัส (ลิงก์)</th><th>ในเมนู</th><th>แก้ไขล่าสุด</th></tr>${A.pages.map(p => `<tr class="${isAdmin() ? 'click' : ''}" data-p="${esc(p.key)}"><td>${esc(p.icon)} ${esc(p.title)}</td><td><code>#page/${esc(p.key)}</code></td><td>${truthy(p.inMenu) ? '✓' : ''}</td><td class="small">${thDT(p.updatedAt)}</td></tr>`).join('')}</table></div>`;
      if (isAdmin()) { $('#np').onclick = () => pageEditor({}); $$('[data-p]', ct).forEach(tr => tr.onclick = () => pageEditor(A.pages.find(p => p.key === tr.dataset.p))); }
    } else if (tab === 'news') {
      const fields = [{ k: 'title', l: 'หัวข้อ *', wide: true }, { k: 'date', l: 'วันที่', t: 'date', def: A.today }, { k: 'body', l: 'รายละเอียด', t: 'area' }, { k: 'pinned', l: '📌 ปักหมุดไว้บนสุด', t: 'check' }, { k: 'active', l: 'แสดงบนหน้าแรก', t: 'check', def: 'TRUE' }];
      ct.innerHTML = `<div class="row mb"><button class="btn sm" id="nn">＋ เพิ่มข่าว</button></div><div class="card tscroll" style="padding:0"><table class="t"><tr><th>วันที่</th><th>หัวข้อ</th><th>สถานะ</th></tr>${A.news.slice().sort((a, b) => b.date.localeCompare(a.date)).map(n => `<tr class="click" data-n="${n.id}"><td class="nowrap">${thD(n.date)}</td><td>${truthy(n.pinned) ? '📌 ' : ''}${esc(n.title)}</td><td>${truthy(n.active) ? 'แสดง' : 'ซ่อน'}</td></tr>`).join('') || '<tr><td colspan="3" class="empty">ยังไม่มีข่าว</td></tr>'}</table></div>`;
      $('#nn').onclick = () => itemForm('News', {}, fields, '＋ เพิ่มข่าว');
      $$('[data-n]', ct).forEach(tr => tr.onclick = () => itemForm('News', A.news.find(x => x.id === tr.dataset.n), fields, '✎ แก้ไขข่าว'));
    } else {
      const fields = [{ k: 'title', l: 'ชื่อเอกสาร *', wide: true }, { k: 'category', l: 'หมวด', ph: 'แบบฟอร์ม / แบบประเมิน / ระเบียบ/ประกาศ / คู่มือ' }, { k: 'order', l: 'ลำดับ', t: 'number' }, { k: 'url', l: 'ลิงก์ไฟล์ (Google Drive แชร์ “ทุกคนที่มีลิงก์”)', wide: true, ph: 'https://drive.google.com/…' },
        { k: 'description', l: 'คำอธิบาย', t: 'area', rows: 2 }, { k: 'active', l: 'แสดงบนเว็บ', t: 'check', def: 'TRUE' }];
      ct.innerHTML = `${isAdmin() ? '<div class="row mb"><button class="btn sm" id="nd">＋ เพิ่มเอกสาร</button></div>' : ''}<div class="card tscroll" style="padding:0"><table class="t"><tr><th>เอกสาร</th><th>หมวด</th><th>ไฟล์</th></tr>${A.docs.map(d => `<tr class="${isAdmin() ? 'click' : ''}" data-d="${d.id}"><td>${esc(d.title)}<div class="xs muted">${esc(d.description)}</div></td><td>${esc(d.category)}</td><td>${d.url ? '✓ แนบแล้ว' : '<span class="badge b-pending">ยังไม่แนบ</span>'}</td></tr>`).join('')}</table></div>`;
      if (isAdmin()) { $('#nd').onclick = () => itemForm('Docs', {}, fields, '＋ เพิ่มเอกสาร'); $$('[data-d]', ct).forEach(tr => tr.onclick = () => itemForm('Docs', A.docs.find(x => x.id === tr.dataset.d), fields, '✎ แก้ไขเอกสาร')); }
    }
  }
  function pageEditor(p) {
    const isNew = !p.key;
    const m = modal(isNew ? '＋ เพิ่มหน้าเว็บ' : '✎ แก้ไขหน้า: ' + esc(p.title), `<div class="fgrid"><label class="f"><span>ชื่อหน้า *</span><input type="text" id="pt" value="${esc(p.title || '')}"></label>
      <label class="f"><span>รหัสหน้า (อังกฤษ)</span><input type="text" id="pk" value="${esc(p.key || '')}" ${isNew ? '' : 'disabled'} placeholder="เช่น booking-guide"></label><label class="f"><span>ไอคอน (อีโมจิ)</span><input type="text" id="pi" value="${esc(p.icon || '📄')}"></label><label class="f"><span>ลำดับ</span><input type="number" id="po" value="${esc(p.order || 100)}"></label></div>
      <label class="check"><input type="checkbox" id="pm" ${truthy(p.inMenu) ? 'checked' : ''}> แสดงในเมนูด้านบน</label>
      <div class="xs muted mt">รูปแบบ: <code># หัวข้อ</code> <code>## หัวข้อย่อย</code> <code>- รายการ</code> <code>1. ลำดับ</code> <code>**ตัวหนา**</code> <code>[ลิงก์](https://…)</code> <code>&gt; กล่องหมายเหตุ</code> <code>| ตาราง | ... |</code></div>
      <div class="grid g2 mt" style="align-items:start"><textarea id="pb" style="min-height:380px;font-family:monospace;font-size:13.5px">${esc(p.body || '')}</textarea><div class="card md" id="pv" style="max-height:420px;overflow:auto;box-shadow:none"></div></div>`,
      `${!isNew ? '<button class="btn ghost" id="pd">🗑</button>' : ''}<button class="btn ghost" data-x>ยกเลิก</button><button class="btn" id="ps">บันทึก</button>`, { wide: true });
    const pv = () => { $('#pv', m).innerHTML = md($('#pb', m).value); };
    $('#pb', m).oninput = pv; pv();
    $('#ps', m).onclick = () => api('saveItem', 'Pages', { key: isNew ? $('#pk', m).value : p.key, title: $('#pt', m).value, icon: $('#pi', m).value, order: $('#po', m).value, inMenu: $('#pm', m).checked ? 'TRUE' : 'FALSE', body: $('#pb', m).value })
      .then(() => { m.close(); toast('บันทึกแล้ว', 'ok'); return call('getPublicData').then(d => { P = d; refresh(); }); }).catch(e => toast(e.message, 'err'));
    const pd = $('#pd', m); if (pd) pd.onclick = () => confirmBox('ลบหน้านี้?', 'ลบ').then(ok => ok && api('deleteItem', 'Pages', p.key).then(() => { m.close(); return call('getPublicData').then(d => { P = d; refresh(); }); }));
  }

  /* ---------- ผู้ใช้งาน ---------- */
  function aUsers(el) {
    el.innerHTML = `<div class="row between"><h2 class="mt0">👥 ผู้ใช้งานระบบหลังบ้าน</h2><button class="btn sm" id="nu">＋ เพิ่มผู้ใช้</button></div>
      <div class="card tscroll" style="padding:0"><table class="t"><tr><th>ชื่อผู้ใช้</th><th>ชื่อ</th><th>สิทธิ์</th><th>เข้าใช้ล่าสุด</th><th>สถานะ</th></tr>${A.users.map(u => `<tr class="click" data-u="${u.id}"><td>${esc(u.username)}</td><td>${esc(u.name)}<div class="xs muted">${esc(u.email)}</div></td><td>${u.role === 'admin' ? 'ผู้ดูแลระบบ' : 'เจ้าหน้าที่'}</td><td class="small">${u.lastLogin ? thDT(u.lastLogin) : '-'}</td><td>${truthy(u.active) ? '<span class="badge b-approved">ใช้งาน</span>' : '<span class="badge b-cancelled">ระงับ</span>'}</td></tr>`).join('')}</table></div>
      <div class="card mt small"><b>สิทธิ์การใช้งาน</b><ul class="mt0"><li><b>ผู้ดูแลระบบ</b> — ทุกเมนู รวมถึงผู้ใช้งาน ตั้งค่า เนื้อหาหน้าเว็บ ห้อง และลบข้อมูล</li><li><b>เจ้าหน้าที่</b> — อนุมัติ/เช็กอินการจอง เพิ่มการจอง คำร้อง อุปกรณ์ วันปิดห้อง ข่าว และดูรายงาน</li></ul></div>`;
    const form = u => {
      const m = modal(u.id ? '✎ แก้ไขผู้ใช้' : '＋ เพิ่มผู้ใช้', `<div class="fgrid"><label class="f"><span>ชื่อผู้ใช้ (อังกฤษ) *</span><input type="text" id="uu" value="${esc(u.username || '')}"></label><label class="f"><span>ชื่อ-นามสกุล *</span><input type="text" id="un" value="${esc(u.name || '')}"></label>
        <label class="f"><span>อีเมล (รับแจ้งเตือน/ทดสอบ)</span><input type="email" id="ue" value="${esc(u.email || '')}"></label><label class="f"><span>โทรศัพท์</span><input type="tel" id="up" value="${esc(u.phone || '')}"></label>
        <label class="f"><span>สิทธิ์</span><select id="ur"><option value="staff">เจ้าหน้าที่</option><option value="admin" ${u.role === 'admin' ? 'selected' : ''}>ผู้ดูแลระบบ</option></select></label><label class="f"><span>${u.id ? 'ตั้งรหัสผ่านใหม่ (เว้นว่าง = ไม่เปลี่ยน)' : 'รหัสผ่านเริ่มต้น *'}</span><input type="text" id="upw"></label></div>
        <label class="check"><input type="checkbox" id="ua" ${u.id ? (truthy(u.active) ? 'checked' : '') : 'checked'}> เปิดใช้งาน</label>`, `${u.id ? '<button class="btn ghost" id="ud">🗑</button>' : ''}<button class="btn ghost" data-x>ยกเลิก</button><button class="btn" id="us">บันทึก</button>`);
      $('#us', m).onclick = () => api('saveUser', { id: u.id, username: $('#uu', m).value, name: $('#un', m).value, email: $('#ue', m).value, phone: $('#up', m).value, role: $('#ur', m).value, password: $('#upw', m).value, active: $('#ua', m).checked ? 'TRUE' : 'FALSE' }).then(() => { m.close(); toast('บันทึกแล้ว', 'ok'); refresh(); }).catch(e => toast(e.message, 'err'));
      const ud = $('#ud', m); if (ud) ud.onclick = () => confirmBox('ลบผู้ใช้ ' + esc(u.username) + '?', 'ลบ').then(ok => ok && api('deleteUser', u.id).then(() => { m.close(); refresh(); }).catch(e => toast(e.message, 'err')));
    };
    $('#nu').onclick = () => form({});
    $$('[data-u]').forEach(tr => tr.onclick = () => form(A.users.find(u => u.id === tr.dataset.u)));
  }

  /* ---------- ตั้งค่า ---------- */
  function aSettings(el) {
    const s = A.settings;
    const inp = (k, l, t, ph) => `<label class="f"><span>${l}</span><input type="${t || 'text'}" name="${k}" value="${esc(s[k] || '')}" ${ph ? `placeholder="${esc(ph)}"` : ''}></label>`;
    const area = (k, l, ph) => `<label class="f" style="grid-column:1/-1"><span>${l}</span><textarea name="${k}" rows="3" placeholder="${esc(ph || '')}">${esc(s[k] || '')}</textarea></label>`;
    const chk = (k, l, def) => `<label class="check" style="grid-column:1/-1"><input type="checkbox" name="${k}" ${(s[k] === undefined || s[k] === '' ? def : truthy(s[k])) ? 'checked' : ''}> ${l}</label>`;
    const days = String(s.openDays || '1,2,3,4,5').split(',');
    el.innerHTML = `<h2 class="mt0">⚙️ ตั้งค่าระบบ</h2><form id="stf">
      <div class="card"><h3>ข้อมูลหน่วยงานและช่องทางติดต่อ</h3><div class="fgrid">${inp('appName', 'ชื่อระบบ / ชื่อเว็บไซต์')}${inp('org', 'หน่วยงาน')}${inp('building', 'อาคาร / ห้อง', '', 'เช่น อาคาร 9 ชั้น 3')}${inp('phone', 'โทรศัพท์')}${inp('email', 'อีเมลติดต่อ', 'email')}${inp('line', 'LINE ID / LINE OA')}${inp('facebook', 'ลิงก์เพจ Facebook', 'url')}${inp('mapUrl', 'ลิงก์ Google Maps', 'url')}
        ${area('address', 'ที่อยู่')}${inp('hoursText', 'ข้อความเวลาให้บริการ')}${area('staffText', 'รายชื่อผู้รับผิดชอบ (แสดงในหน้าติดต่อ)', 'เช่น อ.ชื่อ-สกุล ผู้ดูแลห้อง โทร ...')}</div></div>
      <div class="card"><h3>หน้าแรก</h3><div class="fgrid">${inp('heroTitle', 'ข้อความใหญ่บนแบนเนอร์')}${inp('heroText', 'ข้อความรอง')}${inp('welcome', 'ข้อความต้อนรับ')}${area('announce', 'ประกาศด่วน (แสดงแถบสีเหลืองบนหน้าแรก — เว้นว่างเพื่อซ่อน)')}</div></div>
      <div class="card"><h3>กฎการจอง</h3><div class="fgrid">${inp('openTime', 'เวลาเปิด', 'time')}${inp('closeTime', 'เวลาปิด', 'time')}
        <label class="f"><span>ช่วงเวลาละ (นาที)</span><select name="slotMinutes">${[15, 30, 60].map(n => `<option ${String(s.slotMinutes || 30) === String(n) ? 'selected' : ''}>${n}</option>`).join('')}</select></label>
        ${inp('minLeadHours', 'ต้องจองล่วงหน้าอย่างน้อย (ชั่วโมง)', 'number')}${inp('maxAdvanceDays', 'จองล่วงหน้าได้ไม่เกิน (วัน)', 'number')}${inp('maxHours', 'จองครั้งละไม่เกิน (ชั่วโมง)', 'number')}${inp('maxActivePerPerson', 'รายการค้างต่อคนสูงสุด (0 = ไม่จำกัด)', 'number')}${inp('bufferMinutes', 'เวลาเตรียมห้องระหว่างการจอง (นาที)', 'number')}
        <div class="f" style="grid-column:1/-1"><span class="small" style="font-weight:600">วันที่เปิดให้จองออนไลน์</span><div class="chips mt">${[1, 2, 3, 4, 5, 6, 0].map(d => `<label class="chip"><input type="checkbox" class="od" value="${d}" ${days.indexOf(String(d)) !== -1 ? 'checked' : ''}>${TDL[d]}</label>`).join('')}</div></div>
        ${chk('autoApprove', 'อนุมัติอัตโนมัติ (ไม่ต้องรอเจ้าหน้าที่ — ถ้าเวลาว่างและผ่านกฎ)', false)}${chk('requireAdvisor', 'นักศึกษาต้องระบุอาจารย์ผู้สอน', true)}${chk('showNames', 'แสดงชื่อผู้จองในตารางการใช้ห้องสาธารณะ (ปิดไว้ตาม PDPA เป็นค่าเริ่มต้น)', false)}</div></div>
      <div class="card"><h3>การแจ้งเตือนทางอีเมล</h3><div class="fgrid">${chk('mailEnabled', 'เปิดการส่งอีเมล (ยืนยันการจอง ผลอนุมัติ ไฟล์วิดีโอ คำร้อง)', true)}${area('notifyEmails', 'อีเมลเจ้าหน้าที่ที่รับแจ้งเมื่อมีการจอง/คำร้องใหม่ (คั่นด้วยจุลภาค)')}</div>
        <button type="button" class="btn sm ghost" id="tm">✉ ทดสอบส่งอีเมล</button><div class="xs muted mt">เตือนผู้จองล่วงหน้า 1 วัน: ในโปรแกรมแก้ไข Apps Script รันฟังก์ชัน <code>installDailyReminder</code> ครั้งเดียว · โควตาอีเมลของ Google: บัญชีทั่วไป ~100 ฉบับ/วัน, Google Workspace ~1,500 ฉบับ/วัน</div></div>
      <div class="row mt"><button class="btn" type="submit">💾 บันทึกการตั้งค่า</button></div></form>`;
    const f = $('#stf');
    $('#tm').onclick = () => api('testEmail').then(to => toast('ส่งอีเมลทดสอบไปที่ ' + to, 'ok')).catch(e => toast(e.message, 'err'));
    f.onsubmit = e => {
      e.preventDefault();
      const o = formData(f);
      o.openDays = $$('.od', f).filter(c => c.checked).map(c => c.value).join(',');
      api('saveSettings', o).then(() => call('getPublicData')).then(d => { P = d; toast('บันทึกแล้ว', 'ok'); refresh(); }).catch(err => toast(err.message, 'err'));
    };
  }

  function aLog(el) {
    el.innerHTML = `<h2 class="mt0">🧾 บันทึกการใช้งานระบบ (400 รายการล่าสุด)</h2><div class="card tscroll" style="padding:0"><table class="t"><tr><th>เวลา</th><th>ผู้ใช้</th><th>การกระทำ</th><th>รายการ</th><th>รายละเอียด</th></tr>${A.log.map(l => `<tr><td class="nowrap small">${thDT(l.time)}</td><td>${esc(l.who)}</td><td><code>${esc(l.action)}</code></td><td class="small">${esc(l.target)}</td><td class="small">${esc(l.detail)}</td></tr>`).join('') || '<tr><td colspan="5" class="empty">-</td></tr>'}</table></div>`;
  }

  /* ================= start ================= */
  function start() {
    if (!location.hash) {
      if (CFG.startView === 'display') location.hash = '#display/' + (CFG.startRoom || '');
      else if (CFG.startView === 'status') location.hash = '#status/' + (CFG.startCode || '');
      else if (CFG.startView === 'evaluate') location.hash = '#evaluate/' + (CFG.startCode || '');
      else if (CFG.startView === 'admin') location.hash = '#admin';
      else if (CFG.startView === 'book') location.hash = '#book';
      else if (CFG.startView === 'schedule') location.hash = '#schedule';
    }
    call('getPublicData').then(d => { P = d; render(); }).catch(e => { app.innerHTML = `<div class="wrap page"><div class="card"><h2>เปิดระบบไม่สำเร็จ</h2><p>${esc(e.message)}</p></div></div>`; });
  }
  start();
})();
</script>
</body>
</html>
