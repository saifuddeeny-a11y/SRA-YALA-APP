<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #0f5e4b;
    --brand-ink: #0a3f33;
    --brand-soft: #e6f0ec;
    --accent: #c79a2b;
    --accent-soft: #f7efd9;
    --bg: #f7f5ef;
    --surface: #ffffff;
    --surface-2: #fbfaf6;
    --ink: #1c2925;
    --ink-2: #3b4a45;
    --muted: #66746f;
    --line: #e5e1d6;
    --danger: #b3382c;
    --ok: #1f7a4d;
    --warn: #b7791f;
    --radius: 14px;
    --radius-sm: 9px;
    --shadow: 0 1px 2px rgba(20, 40, 34, .06), 0 6px 20px rgba(20, 40, 34, .07);
    --shadow-lg: 0 10px 40px rgba(20, 40, 34, .16);
    --font-head: 'Prompt', 'Sarabun', system-ui, sans-serif;
    --font-body: 'Sarabun', 'Prompt', system-ui, sans-serif;
    --max: 1180px;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font-body); font-size: 17px; line-height: 1.7;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3, h4 { font-family: var(--font-head); line-height: 1.3; margin: 0 0 .5em; color: var(--ink); font-weight: 600; }
  h1 { font-size: clamp(28px, 4.4vw, 46px); }
  h2 { font-size: clamp(23px, 3vw, 31px); }
  h3 { font-size: 20px; }
  p { margin: 0 0 1em; }
  a { color: var(--brand); text-decoration: none; }
  a:hover { text-decoration: underline; }
  img { max-width: 100%; display: block; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 70%, transparent); outline-offset: 2px; border-radius: 6px; }
  .container { width: 100%; max-width: var(--max); margin: 0 auto; padding: 0 20px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    padding: 10px 20px; border-radius: 999px; border: 1.5px solid transparent;
    font-family: var(--font-head); font-weight: 500; font-size: 15.5px; cursor: pointer;
    background: var(--brand); color: #fff; text-decoration: none !important; transition: transform .15s, background .15s, box-shadow .15s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--brand-ink); box-shadow: var(--shadow); }
  .btn:active { transform: translateY(1px); }
  .btn.accent { background: var(--accent); color: #1f1606; }
  .btn.accent:hover { background: #b0861f; }
  .btn.ghost { background: transparent; color: var(--brand); border-color: color-mix(in srgb, var(--brand) 35%, transparent); }
  .btn.ghost:hover { background: var(--brand-soft); box-shadow: none; }
  .btn.light { background: rgba(255,255,255,.14); color: #fff; border-color: rgba(255,255,255,.5); backdrop-filter: blur(4px); }
  .btn.light:hover { background: rgba(255,255,255,.26); }
  .btn.sm { padding: 6px 14px; font-size: 14px; }
  .btn.danger { background: var(--danger); }
  .btn[disabled] { opacity: .55; cursor: not-allowed; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px; border-radius: 999px;
    background: var(--brand-soft); color: var(--brand-ink); font-size: 13.5px; font-weight: 500; font-family: var(--font-head);
  }
  .chip.gold { background: var(--accent-soft); color: #7a5a10; }
  .muted { color: var(--muted); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .spinner { width: 22px; height: 22px; border-radius: 50%; border: 3px solid var(--brand-soft); border-top-color: var(--brand); animation: spin .8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast-wrap { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 9999; display: grid; gap: 8px; width: min(92vw, 420px); }
  .toast { background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 12px; box-shadow: var(--shadow-lg); font-size: 15px; animation: rise .25s ease; }
  .toast.ok { background: var(--ok); } .toast.err { background: var(--danger); }
  @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
