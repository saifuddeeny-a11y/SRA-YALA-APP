  .page { padding: 28px 0 70px; }

    background: radial-gradient(circle at 90% 0, rgba(243,207,116,.35), transparent 40%), linear-gradient(130deg, var(--brand-ink), var(--brand)); box-shadow: var(--shadow); }
  .total .k { font-family: var(--font-head); opacity: .85; }
  .total .v { font-family: var(--font-head); font-weight: 700; font-size: clamp(32px, 6vw, 46px); line-height: 1.15; }

  .acc .h { display: flex; align-items: center; gap: 10px; font-family: var(--font-head); font-weight: 600; color: var(--ink); }
  .acc .h span { width: 38px; height: 38px; border-radius: 11px; display: flex; align-items: center; justify-content: center; font-size: 20px; background: var(--brand-soft); }
  .acc .bal { font-family: var(--font-head); font-weight: 700; font-size: 28px; color: var(--brand-ink); line-height: 1.2; }

  .acc .meta { font-size: 13.5px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .acc .pend { font-size: 13.5px; color: #8a6512; background: var(--accent-soft); padding: 4px 10px; border-radius: 8px; }

  .acc.hajj .goal .bar i { background: linear-gradient(90deg, #b0861f, var(--accent)); }

  .sumrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }

  .acc-pick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }

  .fcard .fi { width: 46px; height: 46px; border-radius: 12px; background: var(--brand-soft); display: flex; align-items: center; justify-content: center; font-size: 22px; flex: none; }
  .fcard b { font-family: var(--font-head); font-size: 16.5px; display: block; }
  .fcard p { margin: 2px 0 0; font-size: 14.5px; color: var(--muted); }
  .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  .facts div { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; }
  .facts small { display: block; color: var(--muted); font-family: var(--font-head); font-size: 13px; }
  .facts b { font-family: var(--font-head); color: var(--brand-ink); font-weight: 600; word-break: break-word; }
  .total.grp { background: radial-gradient(circle at 90% 0, rgba(243,207,116,.35), transparent 40%), linear-gradient(130deg, #2b4a1f, #4f7a2c); }

  .mtab { width: 100%; border-collapse: collapse; font-size: 14px; }

<div id="root"><div class="loading"><div><span class="spinner" style="width:38px;height:38px;border-width:4px"></span><p>กำลังโหลด...</p></div></div></div>
<div class="toast-wrap" id="toasts"></div>

<script>
var BASE_URL = <?!= JSON.stringify(baseUrl) ?>;
var CFG = <?!= memberConfig ?>;
(function () {
  'use strict';
  var root = document.getElementById('root');
  var hasGas = typeof google !== 'undefined' && google.script && google.script.run;
  var TOKEN = null, D = null, TAB = 'home', ARG = null;
  var ACC = ['savings', 'hajj', 'umrah'];
  var ACC_ICON = { savings: '💰', hajj: '🕋', umrah: '🕌' };
  var ACCL = CFG.accounts || { savings: 'เงินออมทรัพย์', hajj: 'บัญชีฮัจย์', umrah: 'บัญชีอุมเราะห์' };
  try { TOKEN = sessionStorage.getItem('sra_mtoken'); } catch (e) { }

  /* ---------------- helpers ---------------- */
  var esc = SRAForm.esc;
  function $(s, c) { return (c || document).querySelector(s); }
  function $$(s, c) { return Array.prototype.slice.call((c || document).querySelectorAll(s)); }
  function store(fn) { try { return fn(window.localStorage); } catch (e) { return null; } }
  function toast(msg, type) { var el = document.createElement('div'); el.className = 'toast ' + (type || ''); el.textContent = msg; $('#toasts').appendChild(el); setTimeout(function () { el.remove(); }, 3800); }
  function num(v) { var n = Number(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; }
  function money(v) { return num(v).toLocaleString('th-TH', { minimumFractionDigits: 0, maximumFractionDigits: 2 }); }
  var TM = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  function thDate(s, time) {
    if (!s) return '-'; var d = /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s + 'T00:00:00') : new Date(s); if (isNaN(d)) return esc(s);
    var t = d.getDate() + ' ' + TM[d.getMonth()] + ' ' + (d.getFullYear() + 543);
    if (time) t += ' ' + ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) + ' น.';
    return t;
  }
  function today() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
  function spin() { return '<span class="spinner" style="width:16px;height:16px;border-width:2px;border-color:rgba(255,255,255,.35);border-top-color:#fff"></span>'; }

  if (CFG.themeColor) document.documentElement.style.setProperty('--brand', CFG.themeColor);
  if (CFG.accentColor) document.documentElement.style.setProperty('--accent', CFG.accentColor);

  /** เรียกฟังก์ชันฝั่งเซิร์ฟเวอร์ → Promise */
  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      if (!hasGas) { reject(new Error('ต้องเปิดผ่านเว็บแอป Google Apps Script')); return; }
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (err) {
        var msg = (err && err.message) || String(err);
        if (/MEMBER_AUTH:/.test(msg)) { msg = msg.replace(/.*MEMBER_AUTH:\s*/, ''); logout(true, msg); }
        reject(new Error(msg));
      });
      r[fn].apply(r, args);
    });
  }
  function api(fn) { return call.apply(null, [fn, TOKEN].concat(Array.prototype.slice.call(arguments, 1))); }

  /* ================================================================
   *  LOGIN
   * ================================================================ */
  function brandBlock() {
    return '<div class="ml-brand">' + (CFG.logoUrl ? '<img src="' + esc(CFG.logoUrl) + '" alt="">' : '<div class="mk">🕌</div>') +
      '<div><small>' + esc(CFG.siteName) + '</small><b>' + esc(CFG.fundName) + '</b></div></div>';
  }
  function showLogin(msg, type) {
    var saved = store(function (s) { return s.getItem('sra_member_no'); }) || '';
    root.innerHTML = '<div class="ml"><aside class="ml-side">' + brandBlock() +
      '<div><h1>ออมวันนี้ <span class="hl">เพื่อการเดินทาง</span>แห่งศรัทธา</h1>' +
      '<p>เข้าสู่ระบบเพื่อดูยอดเงินออม บัญชีฮัจย์ และบัญชีอุมเราะห์ของคุณ ติดตามความก้าวหน้าสู่เป้าหมาย และกรอกแบบฟอร์มของกองทุน</p>' +
      '<div class="ml-feats"><div><span>💰</span>ยอดคงเหลือแยกตามบัญชี อัปเดตจากเจ้าหน้าที่</div><div><span>🎯</span>ความก้าวหน้าสู่เป้าหมายฮัจย์-อุมเราะห์</div><div><span>🧾</span>แจ้งฝากเงินพร้อมแนบสลิป</div><div><span>🧺</span>เงินออมกองทุนกลุ่มอาชีพและเงินสัจจะ</div><div><span>📝</span>แบบฟอร์มและบันทึกรายรับ-รายจ่าย</div></div></div>' +
      '<div class="ml-foot">' + esc(CFG.organization || '') + '</div></aside>' +
      '<main class="ml-main"><form class="ml-card" id="lf" novalidate autocomplete="on">' +
      '<h2>เข้าสู่ระบบสมาชิก</h2><p class="sub">กรอกรหัสสมาชิกและรหัสผ่านที่ได้รับจากเจ้าหน้าที่กองทุน</p>' +
      '<div id="lmsg"' + (msg ? ' class="msg ' + (type || 'err') + '"' : ' hidden') + ' role="alert">' + esc(msg || '') + '</div>' +
      (CFG.notice ? '<div class="msg info">' + esc(CFG.notice) + '</div>' : '') +
      '<label class="fld"><span>รหัสสมาชิก</span><input name="u" autocomplete="username" required value="' + esc(saved) + '"></label>' +
      '<label class="fld"><span>รหัสผ่าน</span><div class="pw-wrap"><input name="p" type="password" autocomplete="current-password" required><button type="button" class="pw-tg" data-pw>แสดง</button></div></label>' +

  function shrink(file) {
    return new Promise(function (resolve, reject) {
      var r = new FileReader();
      r.onerror = reject;
      r.onload = function () {
        if (!/^image\/(jpeg|png|webp)$/.test(file.type)) { resolve({ name: file.name, mimeType: file.type, data: String(r.result).split(',')[1], preview: /^image\//.test(file.type) ? r.result : '' }); return; }
        var img = new Image();
        img.onload = function () {
          var max = 1600, s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
          var c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
          var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
          var url = c.toDataURL('image/jpeg', 0.85);
          resolve({ name: file.name.replace(/\.\w+$/, '') + '.jpg', mimeType: 'image/jpeg', data: url.split(',')[1], preview: url });
        };
        img.onerror = function () { resolve({ name: file.name, mimeType: file.type, data: String(r.result).split(',')[1], preview: '' }); };
        img.src = r.result;
      };
      r.readAsDataURL(file);
    });
  }

        box.innerHTML = '<span class="spinner"></span> กำลังเตรียมไฟล์...';
        shrink(file).then(function (s) {
          if (s.data.length * 0.75 > 5 * 1048576) { onChange(null); box.innerHTML = '✕ ไฟล์ใหญ่เกิน 5 MB — คลิกเพื่อเลือกใหม่'; return; }

      inp.click();
    };
    box.addEventListener('click', function (e) {

  var GCAT_ICON = { share: '🤝', income: '🛒', support: '🎁', repay: '↩️', expense: '🧵', lend: '🤲', welfare: '❤️', dividend: '💸', other: '📌' };
  var gYear = String(new Date().getFullYear());
  function gcatName(t) { var c = ((D.group || {}).cats || {})[t.type === 'withdraw' ? 'withdraw' : 'deposit'] || {}; return c[t.category] || t.category || ''; }
  function gtxRow(t) {
    var w = t.type === 'withdraw', st = t.status || 'approved';
    var cls = 'tx' + (w ? ' w' : '') + (st === 'pending' ? ' p' : st === 'rejected' ? ' r' : '');
    return '<div class="' + cls + '"><div class="ic">' + (GCAT_ICON[t.category] || '🧺') + '</div><div><div class="t">' + esc(gcatName(t)) + (t.mine ? ' · ของฉัน' : '') +
      (st === 'pending' ? '<span class="pill p">รอตรวจสอบ</span>' : st === 'rejected' ? '<span class="pill r">ไม่อนุมัติ</span>' : '') + '</div>' +
      '<div class="s">' + thDate(t.date) + (t.memberName && !t.mine ? ' · ' + esc(t.memberName) : '') + (t.note ? ' · ' + esc(t.note) : '') + (t.hasSlip ? ' · 📎 แนบสลิป' : '') + '</div></div>' +
      '<div class="a">' + (w ? '−' : '+') + money(t.amount) + '</div></div>';
  }
  function monthsHtml(months, share) {
    return '<div class="months">' + TM.map(function (m, i) {
      var v = num(months[gYear + '-' + ('0' + (i + 1)).slice(-2)]);
      var ok = v && (!share || v >= share);
      return '<div class="' + (v ? (ok ? 'ok' : 'part') : '') + '" title="' + (v ? money(v) + ' บาท' : 'ยังไม่ส่ง') + '"><small>' + m + '</small>' + (v ? (ok ? '✓' : money(v)) : '—') + '</div>';
    }).join('') + '</div>';
  }
  function yearSum(months) { return Object.keys(months || {}).filter(function (k) { return k.indexOf(gYear) === 0; }).reduce(function (s, k) { return s + num(months[k]); }, 0); }
  VIEWS.group = function (arg) {
    var G = D.group;
    if (!G) return '<div class="panel"><div class="empty">บัญชีของคุณยังไม่ได้อยู่ในกลุ่มอาชีพ กรุณาติดต่อเจ้าหน้าที่กองทุน</div></div>';
    var g = G.group, b = G.balance, share = num(g.monthlyShare);
    var ym = today().substr(0, 7), paidNow = num(G.mine.months[ym]);
    var recent = arg === 'all' ? G.transactions : G.transactions.slice(0, 12);
    var h = '<div class="hello"><div><h2>' + esc((g.icon ? g.icon + ' ' : '') + g.name) + '</h2><p>' + (g.location ? esc(g.location) + ' · ' : '') + 'สมาชิก ' + G.memberCount + ' คน' + (g.treasurerName ? ' · เหรัญญิก ' + esc(g.treasurerName) : '') + (G.isTreasurer ? ' <span class="pill p">คุณเป็นเหรัญญิกกลุ่ม</span>' : '') + '</p></div>' +
      (CFG.allowDepositNotice ? '<div class="row"><button class="btn accent" data-tab="gsend">🤝 ส่งเงินสัจจะ</button>' + (G.isTreasurer ? '<button class="btn" data-tab="gsend" data-arg="book">📒 บันทึกรายรับ-รายจ่ายกลุ่ม</button>' : '') + '</div>' : '') + '</div>' +
      '<div class="total grp"><div class="k">เงินออมกองทุนกลุ่ม</div><div class="v">' + money(b.balance) + '<small>บาท</small></div><div class="n">รายรับสะสม ' + money(b.deposit) + ' · รายจ่ายสะสม ' + money(b.withdraw) + ' บาท · นับเฉพาะรายการที่เจ้าหน้าที่ตรวจสอบแล้ว</div></div>' +
      (g.savingsGoal ? '<div class="panel"><h3>🎯 เป้าหมายกองทุนกลุ่ม</h3>' + goalHtml(b.balance, g.savingsGoal) + '</div>' : '') +
      '<div class="grid2">' +
      '<div class="panel"><h3>🤝 เงินสัจจะของฉัน</h3><div class="sumrow" style="grid-template-columns:1fr 1fr"><div><small>ส่งแล้วปี ' + (Number(gYear) + 543) + '</small><b>' + money(yearSum(G.mine.months)) + '</b></div><div><small>สะสมทั้งหมด</small><b>' + money(G.mine.total) + '</b></div></div>' +
      (share ? '<p class="muted" style="margin:-4px 0 10px;font-size:14.5px">กลุ่มกำหนดเงินสัจจะ <b>' + money(share) + ' บาท/เดือน</b> · เดือนนี้' + (paidNow >= share ? ' <b style="color:var(--ok)">ส่งครบแล้ว ✓</b>' : (paidNow ? 'ส่งแล้ว ' + money(paidNow) + ' บาท' : ' <b style="color:#8a6512">ยังไม่ได้ส่ง</b>')) + '</p>' : '') +
      (G.mine.pending ? '<div class="pend" style="margin-bottom:10px">⏳ รอตรวจสอบ ' + money(G.mine.pending) + ' บาท</div>' : '') + monthsHtml(G.mine.months, share) + '</div>' +
      '<div class="panel"><h3>📊 สรุปกองทุนกลุ่ม</h3>' + catList(b.cats.deposit, 'deposit', 'รายรับ') + catList(b.cats.withdraw, 'withdraw', 'รายจ่าย') + '</div></div>';
    if (G.isTreasurer && G.members) {
      h += '<div class="panel"><div class="row between" style="margin-bottom:10px"><h3 style="margin:0">👥 การส่งเงินสัจจะของสมาชิก ปี ' + (Number(gYear) + 543) + '</h3><span class="muted" style="font-size:13.5px">เห็นเฉพาะเหรัญญิก</span></div><div style="overflow-x:auto"><table class="mtab"><thead><tr><th>สมาชิก</th>' +
        TM.map(function (m) { return '<th>' + m + '</th>'; }).join('') + '<th>รวมปีนี้</th></tr></thead><tbody>' + G.members.map(function (x) {
          return '<tr><td><b>' + esc(x.name) + '</b><small>' + esc(x.memberNo) + '</small></td>' + TM.map(function (_, i) {
            var v = num(x.months[gYear + '-' + ('0' + (i + 1)).slice(-2)]), ok = v && (!share || v >= share);
            return '<td class="' + (v ? (ok ? 'ok' : 'part') : '') + '">' + (v ? (ok ? '✓' : money(v)) : '·') + '</td>';
          }).join('') + '<td><b>' + money(yearSum(x.months)) + '</b></td></tr>';
        }).join('') + '</tbody></table></div></div>';
    }
    h += '<div class="panel"><h3>🧾 รายการเงินของกลุ่มล่าสุด</h3>' + (recent.length ? recent.map(gtxRow).join('') : '<div class="empty">ยังไม่มีรายการเงินของกลุ่ม</div>') +
      (G.transactions.length > recent.length ? '<p style="margin:12px 0 0;text-align:center"><a href="#" data-tab="group" data-arg="all">ดูทั้งหมด ' + G.transactions.length + ' รายการ →</a></p>' : '') + '</div>';
    return h;
  };
  function catList(c, type, label) {
    var keys = Object.keys(c || {});
    if (!keys.length) return '<p class="muted" style="font-size:14.5px;margin:0 0 10px">' + label + ': ยังไม่มีรายการ</p>';
    return '<div style="margin-bottom:12px"><small class="muted" style="font-family:var(--font-head)">' + label + '</small>' + keys.sort(function (a, b) { return c[b] - c[a]; }).map(function (k) {
      return '<div class="row between" style="padding:6px 0;border-bottom:1px dashed var(--line)"><span>' + (GCAT_ICON[k] || '') + ' ' + esc(gcatName({ type: type, category: k })) + '</span><b style="font-family:var(--font-head);color:' + (type === 'withdraw' ? 'var(--danger)' : 'var(--ok)') + '">' + money(c[k]) + '</b></div>';
    }).join('') + '</div>';
  }

  /* ---------- ส่งเงินสัจจะ / เหรัญญิกบันทึกรายรับ-รายจ่ายกลุ่ม ---------- */
  var gslip = null;
  VIEWS.gsend = function (arg) {
    var G = D.group;
    if (!G) return VIEWS.group();
    if (!CFG.allowDepositNotice) return '<div class="panel"><div class="empty">ขณะนี้ปิดการแจ้งเงินออนไลน์ กรุณาติดต่อเหรัญญิกกลุ่มหรือเจ้าหน้าที่กองทุน</div></div>';
    gslip = null;
    var book = arg === 'book' && G.isTreasurer, share = num(G.group.monthlyShare);
    var catSel = function (type) { var c = G.cats[type] || {}; return Object.keys(c).map(function (k) { return '<option value="' + k + '">' + (GCAT_ICON[k] || '') + ' ' + esc(c[k]) + '</option>'; }).join(''); };
    return '<p><a href="#" data-tab="group">← กลุ่มอาชีพของฉัน</a></p><div class="panel" style="max-width:720px">' +
      (book ? '<h3>📒 บันทึกรายรับ-รายจ่ายของกลุ่ม</h3><p class="muted" style="margin-top:-6px">สำหรับเหรัญญิก — แจ้งรายได้จากการขาย เงินสนับสนุน ค่าวัตถุดิบ หรือเงินสัจจะที่รับจากสมาชิก เจ้าหน้าที่จะตรวจสอบก่อนนับเข้ายอดกองทุน</p>'
        : '<h3>🤝 ส่งเงินสัจจะกลุ่ม</h3><p class="muted" style="margin-top:-6px">แจ้งการโอนหรือส่งเงินสัจจะเข้ากองทุน ' + esc(G.group.name) + ' เจ้าหน้าที่จะตรวจสอบและอนุมัติ ยอดจึงจะเข้ากองทุนกลุ่ม</p>') +
      '<form id="gf" novalidate>' +
      (book ? '<div class="acc-pick" style="grid-template-columns:1fr 1fr" role="radiogroup" aria-label="ประเภท"><label><input type="radio" name="type" value="deposit" checked><span>➕</span>รายรับ</label><label><input type="radio" name="type" value="withdraw"><span>➖</span>รายจ่าย</label></div>' +
        '<div class="grid2"><label class="fld"><span>หมวด *</span><select class="sel" name="cat" style="border-radius:12px;width:100%">' + catSel('deposit') + '</select></label>' +
        '<label class="fld"><span>สมาชิก (ผู้ส่งเงินสัจจะ / ผู้รับเงิน)</span><select class="sel" name="mem" style="border-radius:12px;width:100%"><option value="">— ไม่ระบุ —</option>' + (G.members || []).map(function (x) { return '<option value="' + esc(x.id) + '">' + esc(x.memberNo + ' · ' + x.name) + '</option>'; }).join('') + '</select></label></div>' : '') +
      '<div class="grid2"><label class="fld"><span>จำนวนเงิน (บาท) *</span><input name="amt" type="number" inputmode="decimal" min="1" step="any" required placeholder="0" value="' + (book || !share ? '' : share) + '"></label>' +
      '<label class="fld"><span>วันที่ *</span><input name="date" type="date" required value="' + today() + '" max="' + today() + '"></label></div>' +
      '<label class="fld"><span>หมายเหตุ</span><input name="note" maxlength="300" placeholder="' + (book ? 'เช่น ขายผลผลิตที่ตลาดนัด, ซื้อวัตถุดิบ' : 'เช่น เงินสัจจะเดือนนี้, โอนผ่านธนาคาร') + '"></label>' +
      '<div class="fld"><span>แนบสลิป / หลักฐาน (ไม่บังคับ)</span><div class="slip" id="gslip" tabindex="0">📎 คลิกเพื่อเลือกภาพสลิป หรือไฟล์ PDF (ไม่เกิน 5 MB)</div></div>' +
      '<button class="btn" type="submit" id="gbtn">' + (book ? 'ส่งรายการให้เจ้าหน้าที่ตรวจสอบ' : 'ส่งแจ้งเงินสัจจะ') + '</button></form></div>';
  };
  BIND.gsend = function (v, arg) {
    var f = $('#gf'); if (!f) return;
    var book = arg === 'book' && D.group.isTreasurer;
    slipPicker($('#gslip'), function (s) { gslip = s; });
    if (book) {
      var syncType = function () {
        var t = (f.querySelector('input[name=type]:checked') || {}).value || 'deposit', c = D.group.cats[t] || {};
        f.cat.innerHTML = Object.keys(c).map(function (k) { return '<option value="' + k + '">' + (GCAT_ICON[k] || '') + ' ' + esc(c[k]) + '</option>'; }).join('');
        $$('.acc-pick label', f).forEach(function (l) { l.classList.toggle('on', l.querySelector('input').checked); });
      };
      $$('input[name=type]', f).forEach(function (i) { i.addEventListener('change', syncType); }); syncType();
    }
    f.addEventListener('submit', function (e) {
      e.preventDefault();
      var amt = num(f.amt.value);
      if (!(amt > 0)) { toast('กรุณากรอกจำนวนเงิน', 'err'); f.amt.focus(); return; }
      if (!f.date.value) { toast('กรุณาระบุวันที่', 'err'); return; }
      var p = { amount: amt, date: f.date.value, note: f.note.value, slip: gslip ? { name: gslip.name, mimeType: gslip.mimeType, data: gslip.data } : null };
      if (book) { p.type = (f.querySelector('input[name=type]:checked') || {}).value; p.category = f.cat.value; p.memberId = f.mem.value; }
      var b = $('#gbtn'), label = b.textContent; b.disabled = true; b.innerHTML = spin() + ' กำลังส่ง...';
      api('memberNotifyGroupTransaction', p)
        .then(function () { toast('ส่งรายการเรียบร้อย รอเจ้าหน้าที่ตรวจสอบ', 'ok'); return refresh(); })
        .then(function () { show('group'); })
        .catch(function (er) { b.disabled = false; b.textContent = label; toast(er.message, 'err'); });
    });
  };

  /* ---------- แบบฟอร์ม ---------- */
  function respCount(id) { return D.responses.filter(function (r) { return r.formId === id; }).length; }
  VIEWS.forms = function () {
    var list = D.forms || [];
    var mem = list.filter(function (f) { return f.audience === 'member'; }), pub = list.filter(function (f) { return f.audience !== 'member'; });
    var card = function (f) {
      var n = respCount(f.id);
      return '<div class="fcard" data-tab="form" data-arg="' + esc(f.id) + '" tabindex="0"><div class="fi">' + esc(f.icon || '📝') + '</div><div style="flex:1"><b>' + esc(f.title) + '</b>' +
        (f.description ? '<p>' + esc(f.description) + '</p>' : '') + (n ? '<p style="color:var(--brand)">✓ คุณส่งแล้ว ' + n + ' ครั้ง</p>' : '') + '</div><span style="color:var(--brand);align-self:center">→</span></div>';
    };
    return (mem.length ? '<h3>📒 แบบฟอร์มสำหรับสมาชิก</h3>' + mem.map(card).join('') : '') +
      (pub.length ? '<h3 style="margin-top:22px">📋 แบบฟอร์มทั่วไป</h3>' + pub.map(card).join('') : '') +
      (!list.length ? '<div class="panel"><div class="empty">ยังไม่มีแบบฟอร์ม</div></div>' : '');
  };
  VIEWS.form = function (id) {
    var f = (D.forms || []).filter(function (x) { return x.id === id; })[0];
    if (!f) return '<div class="panel"><div class="empty">ไม่พบแบบฟอร์ม</div></div>';
    return '<p><a href="#" data-tab="forms">← แบบฟอร์มทั้งหมด</a></p><div class="panel" style="max-width:780px"><h3>' + esc(f.icon || '📝') + ' ' + esc(f.title) + '</h3>' +
      (f.description ? '<p class="muted" style="margin-top:-6px">' + esc(f.description) + '</p>' : '') + '<div id="fbox">' + SRAForm.render(f, { submitLabel: 'บันทึกข้อมูล' }) + '</div></div>';
  };
  BIND.form = function (v, id) {
    var f = (D.forms || []).filter(function (x) { return x.id === id; })[0]; if (!f) return;
    var bindOne = function () {
      var el = $('form', $('#fbox'));
      el.addEventListener('submit', function (e) {
        e.preventDefault();
        var r = SRAForm.read(el, f);
        if (r.missing.length) { toast('กรุณากรอก: ' + r.missing.join(', '), 'err'); return; }
        var b = el.querySelector('button[type=submit]'); b.disabled = true; b.innerHTML = spin() + ' กำลังบันทึก...';
        call('submitForm', f.id, r.data, TOKEN).then(function (res) {
          D.responses.unshift({ id: 'local', formId: f.id, status: 'new', createdAt: new Date().toISOString() });
          $('#fbox').innerHTML = SRAForm.done(res.message, true);
          $('[data-sf-again]').onclick = function () { $('#fbox').innerHTML = SRAForm.render(f, { submitLabel: 'บันทึกข้อมูล' }); bindOne(); };
        }).catch(function (er) { b.disabled = false; b.textContent = 'บันทึกข้อมูล'; toast(er.message, 'err'); });
      });
    };
    bindOne();
  };

  /* ---------- ข้อมูลของฉัน ---------- */
  VIEWS.me = function () {
    var m = D.member;
    var fact = function (k, v) { return '<div><small>' + k + '</small><b>' + (v ? esc(v) : '—') + '</b></div>'; };
    return '<div class="panel"><h3>👤 ข้อมูลสมาชิก</h3><div class="facts">' + fact('รหัสสมาชิก', m.memberNo) + fact('ชื่อ-นามสกุล', m.name) + fact('เบอร์โทรศัพท์', m.phone) +
      fact('กลุ่ม', D.groupName) + fact('วันที่เป็นสมาชิก', m.joinDate ? thDate(m.joinDate) : '') + fact('ที่อยู่', m.address) + '</div>' +
      '<div class="facts" style="margin-top:10px">' + ACC.map(function (a) { var g = num(m[a + 'Goal']); return fact('เป้าหมาย' + ACCL[a], g ? money(g) + ' บาท' : 'ยังไม่ได้ตั้ง'); }).join('') + '</div>' +
      '<p class="muted" style="margin:14px 0 0;font-size:14.5px">หากข้อมูลไม่ถูกต้อง หรือต้องการตั้ง/เปลี่ยนเป้าหมายการออม กรุณาแจ้งเจ้าหน้าที่กองทุน' + (CFG.phone ? ' โทร ' + esc(CFG.phone) : '') + '</p></div>' +
      '<div class="panel" style="max-width:520px"><h3>🔒 เปลี่ยนรหัสผ่าน</h3><form id="pf" novalidate>' + pwFields() + '<button class="btn" type="submit">เปลี่ยนรหัสผ่าน</button></form></div>';
  };
  BIND.me = function () { bindPw($('#pf'), function () { toast('เปลี่ยนรหัสผ่านเรียบร้อย', 'ok'); }); };

  /* ---------------- start ---------------- */
  if (TOKEN) boot(); else showLogin('');
})();
</script>
</body>
</html>
