  function rows(table) { return (DB.tables[table] || []).slice(); }

    var list = DB.tables[table], k = pk(table), i;
    for (i = 0; i < list.length; i++) if (list[i][k] === rec[k]) { list[i] = rec; return; }
    list.push(rec);
  }

      hasFile || table === 'Albums' ? '<label class="switch" style="margin-top:6px"><input type="checkbox" checked> ย้ายไฟล์ใน Google Drive ไปถังขยะด้วย</label>' : '')

  function readAsDataUrl(blob) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsDataURL(blob); }); }
  /** ย่อรูปก่อนอัปโหลด (ด้านยาวสุด 1920px) */
  function prepareImage(file) {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return Promise.resolve(file);
    return readAsDataUrl(file).then(function (url) {
      return new Promise(function (resolve) {
        var img = new Image();
        img.onload = function () {
          var max = 1920, w = img.naturalWidth, h = img.naturalHeight;
          if (w <= max && h <= max && file.size < 900 * 1024) return resolve(file);
          var s = Math.min(1, max / Math.max(w, h)); var cw = Math.round(w * s), ch = Math.round(h * s);
          var c = document.createElement('canvas'); c.width = cw; c.height = ch;
          var ctx = c.getContext('2d');
          var keepPng = file.type === 'image/png' && file.size < 1.5 * 1048576;
          if (!keepPng) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cw, ch); }
          ctx.drawImage(img, 0, 0, cw, ch);
          c.toBlob(function (b) {
            if (!b) return resolve(file);
            b.name = keepPng ? file.name : file.name.replace(/\.(png|webp|jpe?g)$/i, '') + '.jpg';
            resolve(b.size < file.size ? b : file);
          }, keepPng ? 'image/png' : 'image/jpeg', 0.86);
        };
        img.onerror = function () { resolve(file); };
        img.src = url;

    });
  }
  var MAX_MB = 20;
  /** อัปโหลด 1 ไฟล์ → คืนข้อมูลไฟล์ใน Drive */
  function uploadOne(file, folder) {
    if (file.size > MAX_MB * 1048576) return Promise.reject(new Error('ไฟล์ใหญ่เกิน ' + MAX_MB + ' MB'));
    var isImg = /^image\//.test(file.type);
    return (isImg ? prepareImage(file) : Promise.resolve(file)).then(function (f) {
      return readAsDataUrl(f).then(function (dataUrl) {
        var b64 = String(dataUrl).split(',')[1] || '';
        return api('uploadFile', { name: f.name || file.name, mimeType: f.type || file.type || 'application/octet-stream', data: b64, folder: folder || (isImg ? 'Images' : 'Documents') });
      });
    }).then(function (rec) {
      DB.tables.Media.push(rec);
      if (rec.sharing && rec.sharing !== 'anyone') toast('คำเตือน: โดเมนไม่อนุญาตให้แชร์ไฟล์แบบสาธารณะ — ผู้ชมภายนอกอาจมองไม่เห็นไฟล์', 'err');

    return '<div class="row between" style="margin-bottom:14px"><p class="muted" style="margin:0"><b>admin</b> = จัดการได้ทุกอย่างรวมถึงผู้ใช้ · <b>editor</b> = แก้ไขเนื้อหาได้ทั้งหมด ยกเว้นจัดการผู้ใช้</p><button class="btn" id="addUser">+ เพิ่มผู้ใช้</button></div>' +
      '<div class="tbl-wrap" style="margin-bottom:22px"><table class="tbl"><thead><tr><th>ชื่อผู้ใช้</th><th>ชื่อ</th><th>สิทธิ์</th><th>เข้าใช้ล่าสุด</th><th>สถานะ</th><th></th></tr></thead><tbody>' +
      list.map(function (u) { return '<tr><td class="ttl">' + esc(u.username) + (u.id === USER.id ? ' <span class="pill new">คุณ</span>' : '') + '</td><td>' + esc(u.name) + '</td><td><span class="pill ' + (u.role === 'admin' ? 'gold' : '') + '">' + esc(u.role) + '</span></td><td class="sub">' + thDate(u.lastLogin, true) + '</td><td>' + (truthy(u.active) ? '<span class="pill on">ใช้งาน</span>' : '<span class="pill off">ระงับ</span>') + '</td>' +
        '<td class="acts"><button class="icon-btn" data-uedit="' + esc(u.id) + '">✎</button> ' + (u.id !== USER.id ? '<button class="icon-btn del" data-udel="' + esc(u.id) + '">🗑</button>' : '') + '</td></tr>'; }).join('') + '</tbody></table></div>' +
      '<div class="box"><h3>🕘 ประวัติการใช้งาน (200 รายการล่าสุด)</h3><div class="tbl-wrap" style="border:0;max-height:480px"><table class="tbl"><thead><tr><th>เวลา</th><th>ผู้ใช้</th><th>การกระทำ</th><th>รายละเอียด</th></tr></thead><tbody>' +
      (DB.tables.Logs || []).map(function (l) { return '<tr><td class="sub" style="white-space:nowrap">' + thDate(l.time, true) + '</td><td>' + esc(l.user) + '</td><td>' + esc(l.action) + '</td><td class="sub">' + esc(l.detail) + '</td></tr>'; }).join('') + '</tbody></table></div></div>';
  };
  BIND.users = function (el) {
    var form = function (u) {
      u = u || { active: 'TRUE', role: 'editor' };
      openDrawer(u.id ? 'แก้ไขผู้ใช้' : 'เพิ่มผู้ใช้', '<form id="uForm" onsubmit="return false">' +
        '<label class="field"><span class="lb">ชื่อผู้ใช้ (a-z, 0-9)</span><input name="username" value="' + esc(u.username || '') + '"></label>' +
        '<label class="field"><span class="lb">ชื่อที่แสดง</span><input name="name" value="' + esc(u.name || '') + '"></label>' +
        '<label class="field"><span class="lb">สิทธิ์</span><select name="role"><option value="editor"' + (u.role !== 'admin' ? ' selected' : '') + '>editor — แก้ไขเนื้อหา</option><option value="admin"' + (u.role === 'admin' ? ' selected' : '') + '>admin — ผู้ดูแลระบบ</option></select></label>' +
        '<label class="field"><span class="lb">' + (u.id ? 'ตั้งรหัสผ่านใหม่ (เว้นว่างถ้าไม่เปลี่ยน)' : 'รหัสผ่าน (อย่างน้อย 8 ตัว)') + '</span><input name="password" type="password" autocomplete="new-password"></label>' +
        '<div class="field"><label class="switch"><input type="checkbox" name="active"' + (truthy(u.active) ? ' checked' : '') + '> เปิดใช้งานบัญชี</label></div></form>',
        '<button class="btn ghost" data-close-drawer>ยกเลิก</button><button class="btn" id="uSave">💾 บันทึก</button>');
      $('#uSave').onclick = function () {
        var f = $('#uForm'); busy(true);
        api('saveUser', { id: u.id, username: f.username.value, name: f.name.value, role: f.role.value, password: f.password.value, active: f.active.checked }).then(function (saved) {
          busy(false); upsertLocal('Users', saved); closeDrawer(); toast('บันทึกผู้ใช้แล้ว', 'ok'); show('users', null, true);
        }).catch(fail);
      };
    };
    $('#addUser').onclick = function () { form(); };
    el.onclick = function (e) {
      var ed = e.target.closest('[data-uedit]'); if (ed) form(findRec('Users', ed.getAttribute('data-uedit')));
      var dl = e.target.closest('[data-udel]');
      if (dl) confirmBox('ลบผู้ใช้นี้?', 'ลบ').then(function (r) { if (!r) return; busy(true); api('deleteUser', dl.getAttribute('data-udel')).then(function () { busy(false); DB.tables.Users = DB.tables.Users.filter(function (x) { return x.id !== dl.getAttribute('data-udel'); }); show('users', null, true); }).catch(fail); });
    };
  };

  /* ============================================================
   *  START
   * ============================================================ */
  if (TOKEN) boot(); else showLogin();
})();
</script>
</body>
</html>
