  function fileKind(d) {
    var m = String(d.mimeType || '') + ' ' + String(d.fileName || d.url || '');

    if (/presentation|powerpoint|\.pptx?\b/i.test(m)) return ['ppt', 'PPT'];

    var people = list.reduce(function (a, r) { return a + num(r.participants); }, 0);
    var budget = list.reduce(function (a, r) { return a + num(r.budget); }, 0), spent = list.reduce(function (a, r) { return a + num(r.spent); }, 0);
    var pgs = list.map(progOf).filter(function (x) { return x !== null; });
    var avg = pgs.length ? Math.round(pgs.reduce(function (a, b) { return a + b; }, 0) / pgs.length) : null;
    var tiles = [{ label: 'กิจกรรมทั้งหมด', value: list.length, unit: 'กิจกรรม' }, { label: 'ดำเนินการเสร็จสิ้น', value: done, unit: 'กิจกรรม', note: doing ? 'กำลังดำเนินการ ' + doing + ' กิจกรรม' : '' }];
    if (avg !== null) tiles.push({ label: 'ความก้าวหน้าเฉลี่ย', value: avg, unit: '%' });
    if (people) tiles.push({ label: 'ผู้เข้าร่วมกิจกรรมรวม', value: people.toLocaleString('th-TH'), unit: 'คน' });
    if (budget) tiles.push({ label: 'งบประมาณ / ใช้จ่ายจริง', value: money(spent), unit: 'บาท', note: 'จากงบประมาณ ' + money(budget) + ' บาท (' + Math.round(spent / budget * 100) + '%)' });
    var h = '<div class="print-only"><b>' + esc(S.siteName || '') + '</b> · ' + esc(page('reports').title) + (repFilter.year ? ' ปีงบประมาณ ' + esc(repFilter.year) : '') + ' · พิมพ์เมื่อ ' + thDate(new Date().toISOString()) + '</div>' +
      '<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:26px">' + statTiles(tiles) + '</div>';
    if (kp.length) h += '<div class="panel" style="margin-bottom:26px"><h3><span class="ic">🎯</span>ผลการดำเนินงานตามตัวชี้วัด</h3>' + kp.map(kpiRow).join('') + '</div>';
    h += list.length ? '<div class="grid-3">' + list.map(reportCard).join('') + '</div>' : '<div class="empty">ไม่พบรายงานตามเงื่อนไข</div>';
    el.innerHTML = h;
  }

  PAGES.reportitem = function (id) {
    var r = (DATA.reports || []).filter(function (x) { return x.id === id; })[0];
    if (!r) return PAGES.reports();
    var rp = page('reports'), pg = progOf(r);
    var h = pageHead({ title: r.title, subtitle: r.objective }, [{ k: 'reports', label: rp.title }, { label: r.title }]);
    var imgs = (r.images || []).map(function (u) { return typeof u === 'string' ? { url: u } : u; });
    if (r.coverUrl) registerSet('rcover_' + r.id, [{ url: r.coverUrl, caption: r.title }]);
    var facts = [['สถานะ', stPill(r.status) || '-', true], ['ปีงบประมาณ', r.fiscalYear], ['ระยะการดำเนินงาน', r.phase ? 'ระยะที่ ' + r.phase : ''], ['วันที่ดำเนินการ', r.activityDate ? thDate(r.activityDate) : ''],
      ['กลุ่มเป้าหมาย', groupName(r.groupId)], ['สถานที่', r.location], ['ผู้เข้าร่วม', r.participants ? r.participants + ' คน' : ''],
      ['งบประมาณ', r.budget ? money(r.budget) + ' บาท' : ''], ['ใช้จ่ายจริง', r.spent ? money(r.spent) + ' บาท' : ''], ['ความก้าวหน้า', pg !== null ? pg + '%' : '']]
      .filter(function (f) { return f[1]; });
    h += '<section class="block"><div class="container"><article class="article" style="max-width:960px">' +
      '<div class="detail-grid">' + facts.map(function (f) { return '<div class="f"><div class="k">' + f[0] + '</div><div class="v">' + (f[2] ? f[1] : esc(f[1])) + '</div></div>'; }).join('') + '</div>' +
      (pg !== null ? '<div class="prog" style="height:12px;margin:-10px 0 26px"><span style="width:' + pg + '%"></span></div>' : '') +
      (r.coverUrl ? '<div class="cover" data-lb-set="rcover_' + attr(r.id) + '" data-lb-i="0">' + imgTag(r.coverUrl, r.title) + '</div>' : '') +
      (r.objective ? '<div class="rblock"><h4>วัตถุประสงค์</h4><p>' + esc(r.objective) + '</p></div>' : '') +
      (r.target ? '<div class="rblock gold"><h4>เป้าหมาย</h4><p>' + esc(r.target) + '</p></div>' : '') +
      (r.result ? '<div class="rblock"><h4>ผลการดำเนินงาน</h4><p>' + esc(r.result) + '</p></div>' : '') +
      (r.content ? '<div class="prose" style="max-width:none;margin-top:20px">' + r.content + '</div>' : '') +
      (imgs.length ? '<h3 style="margin-top:28px">ภาพกิจกรรม</h3>' + galleryHtml(imgs, 'r_' + r.id, 3) : '') +
      '<div class="no-print" style="display:flex;gap:10px;flex-wrap:wrap;margin-top:28px">' +
      (r.fileId ? '<a class="btn" href="https://drive.google.com/uc?export=download&id=' + attr(r.fileId) + '" target="_blank" rel="noopener">📥 ดาวน์โหลดรายงานฉบับเต็ม</a><a class="btn ghost" href="#" data-preview="https://drive.google.com/file/d/' + attr(r.fileId) + '/preview" data-href="https://drive.google.com/file/d/' + attr(r.fileId) + '/view" data-title="' + attr(r.title) + '">เปิดดูรายงาน</a>' :
        (r.fileUrl ? '<a class="btn" href="' + attr(r.fileUrl) + '" target="_blank" rel="noopener">📥 เปิดรายงานฉบับเต็ม ' + ICON.ext + '</a>' : '')) +
      '<button class="btn ghost" onclick="window.print()">🖨 พิมพ์</button><a class="btn ghost"' + navAttrs('reports') + '>← กลับหน้ารายงาน</a></div></article></div></section>';
    return h;
  };

  /* ---------- คลังภาพ ---------- */
  var SITE_ALBUMS = [['home_activity', 'กิจกรรมดำเนินการ'], ['home_congrats', 'ขอแสดงความยินดี'], ['home_learning', 'แหล่งเรียนรู้'], ['model', 'แผนภาพโมเดล'], ['research', 'พื้นที่วิจัย']];
  function allAlbums() {
    var out = (DATA.albums || []).map(function (a) { var key = 'album:' + a.id; var g = gal(key); return { key: key, title: a.title, desc: a.description, date: a.date, cover: a.coverUrl || (g[0] && g[0].url), count: g.length }; });
    SITE_ALBUMS.forEach(function (x) { var g = gal(x[0]); if (g.length) out.push({ key: x[0], title: x[1], cover: g[0].url, count: g.length }); });
    (DATA.groups || []).forEach(function (gr) { var g = gal('group:' + gr.id); if (g.length) out.push({ key: 'group:' + gr.id, title: gr.name, cover: g[0].url, count: g.length }); });
    return out;
  }
  PAGES.gallery = function () {
    var p = page('gallery');
    var albums = allAlbums();
    var h = pageHead(p, [{ k: 'news', label: menu('news', 'ข่าวสาร') }, { label: p.title }]);
    h += '<section class="block"><div class="container">' + (p.content ? '<div class="prose" style="margin-bottom:24px">' + p.content + '</div>' : '') +
      (albums.length ? '<div class="grid-3">' + albums.map(function (a) {
        return '<article class="card click album" data-nav="album" data-id="' + attr(a.key) + '" tabindex="0"><div class="thumb">' + (a.cover ? imgTag(a.cover, a.title) : '<div class="placeholder">🖼️</div>') + '<span class="count">' + a.count + ' ภาพ</span></div>' +
          '<div class="body"><h3>' + esc(a.title) + '</h3>' + (a.date ? '<div class="meta">' + thDate(a.date) + '</div>' : '') + (a.desc ? '<div class="muted" style="font-size:15px">' + esc(a.desc) + '</div>' : '') + '</div></article>';
      }).join('') + '</div>' : '<div class="empty">ยังไม่มีอัลบั้มภาพ</div>') + '</div></section>';
    return h;
  };
  PAGES.album = function (key) {
    var a = allAlbums().filter(function (x) { return x.key === key; })[0];
    if (!a) return PAGES.gallery();
    var gp = page('gallery');
    var h = pageHead({ title: a.title, subtitle: a.desc || (a.count + ' ภาพ') }, [{ k: 'gallery', label: gp.title }, { label: a.title }]);
    h += '<section class="block"><div class="container">' + (a.date ? '<p class="muted">📅 ' + thDate(a.date) + ' · ' + a.count + ' ภาพ</p>' : '') + galleryHtml(gal(key), 'alb', 3) +
      '<div style="margin-top:26px"><a class="btn ghost"' + navAttrs('gallery') + '>← อัลบั้มทั้งหมด</a></div></div></section>';
    return h;
  };

  PAGES.contact = function () {
    var p = page('contact');
    var h = pageHead(p, [{ label: p.title }]);
    h += '<section class="block"><div class="container"><div class="contact-grid"><div>' +
      (p.content ? '<div class="prose" style="margin-bottom:20px">' + p.content + '</div>' : '') + '<div class="cinfo">' +
      (S.email ? '<a class="link-card" href="mailto:' + attr(S.email) + '"><span class="ic">' + ICON.mail + '</span><span><span class="t">อีเมล</span><span class="d" style="display:block">' + esc(S.email) + '</span></span></a>' : '') +
      (S.phone ? '<a class="link-card" href="tel:' + attr(String(S.phone).replace(/[^0-9+]/g, '')) + '"><span class="ic">' + ICON.phone + '</span><span><span class="t">โทรศัพท์</span><span class="d" style="display:block">' + esc(S.phone) + '</span></span></a>' : '') +
      (S.facebookUrl ? '<a class="link-card" href="' + attr(S.facebookUrl) + '" target="_blank" rel="noopener"><span class="ic">' + ICON.fb + '</span><span><span class="t">Facebook / แชทสด</span><span class="d" style="display:block">ติดตามข่าวสารและพูดคุยกับทีมงาน</span></span><span class="go">' + ICON.ext + '</span></a>' : '') +
      (S.address ? '<div class="link-card"><span class="ic">' + ICON.home + '</span><span><span class="t">ที่อยู่</span><span class="d" style="display:block">' + esc(S.address) + '</span></span></div>' : '') +
      '</div></div>' +
      '<div class="panel"><h3><span class="ic">✉️</span>ส่งข้อความถึงทีมงาน</h3><form class="form" id="contactForm" novalidate>' +
      '<div class="row2"><label>ชื่อ-นามสกุล *<input name="name" required maxlength="120" autocomplete="name"></label><label>เบอร์โทรศัพท์<input name="phone" maxlength="40" inputmode="tel" autocomplete="tel"></label></div>' +
      '<label>อีเมล<input name="email" type="email" maxlength="160" autocomplete="email"></label>' +
      '<label>เรื่อง<input name="subject" maxlength="200"></label>' +
      '<label>ข้อความ *<textarea name="message" rows="5" required maxlength="4000"></textarea></label>' +
      '<input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">' +
      '<div><button class="btn" type="submit" id="contactBtn">ส่งข้อความ</button></div></form></div></div></div></section>';
    var docs = docsFor('contact');
    if (docs.length) h += '<section class="block alt"><div class="container">' + secHead('Documents', 'คลังเอกสาร', 'เอกสารเพื่อเป็นแหล่งข้อมูลให้ผู้เข้าชมค้นหาข้อมูลได้ด้วยตนเอง') + docs.map(docRow).join('') + '</div></section>';
    return h;
  };

  /* ===================== render ===================== */
  function render() {
    buildNav(current.page);
    var fn = PAGES[current.page] || PAGES.home;
    LB_SETS = {};
    app.innerHTML = fn(current.id);
    // events of dynamic parts
    var ds = document.getElementById('docSearch');
    if (ds) { renderDocList(); ds.addEventListener('input', function () { docFilter.q = this.value; renderDocList(); }); }
    if (document.getElementById('repBody')) {
      renderReports();
      document.getElementById('repYear').onchange = function () { repFilter.year = this.value; renderReports(); };
      document.getElementById('repStatus').onchange = function () { repFilter.status = this.value; renderReports(); };
      document.getElementById('repSearch').oninput = function () { repFilter.q = this.value; renderReports(); };
    }
    var ns = document.getElementById('newsSearch');
    if (ns) { renderNewsList(); ns.addEventListener('input', function () { newsFilter.q = this.value; renderNewsList(); }); }
    app.querySelectorAll('[data-cat]').forEach(function (b) { b.addEventListener('click', function () { docFilter.cat = b.getAttribute('data-cat'); app.querySelectorAll('[data-cat]').forEach(function (x) { x.classList.toggle('on', x === b); }); renderDocList(); }); });
    app.querySelectorAll('[data-ncat]').forEach(function (b) { b.addEventListener('click', function () { newsFilter.cat = b.getAttribute('data-ncat'); app.querySelectorAll('[data-ncat]').forEach(function (x) { x.classList.toggle('on', x === b); }); renderNewsList(); }); });
    bindPublicForm();
    var cf = document.getElementById('contactForm');
    if (cf) cf.addEventListener('submit', submitContact);
    app.querySelectorAll('[tabindex="0"][data-nav], figure[data-lb-set]').forEach(function (el) {
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter') el.click(); });
    });
  }

  function submitContact(e) {
    e.preventDefault();
    var f = e.target, btn = document.getElementById('contactBtn');
    var payload = {}; Array.prototype.forEach.call(f.elements, function (el) { if (el.name) payload[el.name] = el.value; });
    if (!payload.name.trim() || !payload.message.trim()) { toast('กรุณากรอกชื่อและข้อความ', 'err'); return; }
    if (!hasGas) { toast('ส่งข้อความเรียบร้อย (โหมดตัวอย่าง)', 'ok'); f.reset(); return; }
    btn.disabled = true; btn.innerHTML = '<span class="spinner" style="width:16px;height:16px;border-width:2px"></span> กำลังส่ง...';
    google.script.run.withSuccessHandler(function () {
      btn.disabled = false; btn.textContent = 'ส่งข้อความ'; f.reset(); toast('ส่งข้อความเรียบร้อย ทีมงานจะติดต่อกลับโดยเร็ว', 'ok');
    }).withFailureHandler(function (err) {
      btn.disabled = false; btn.textContent = 'ส่งข้อความ'; toast(err.message || 'ส่งไม่สำเร็จ', 'err');
    }).submitMessage(payload);
  }

  function renderChrome() {
    if (S.themeColor) document.documentElement.style.setProperty('--brand', S.themeColor);
    if (S.accentColor) document.documentElement.style.setProperty('--accent', S.accentColor);
    var logo = document.getElementById('brandLogo');
    if (S.logoUrl) logo.src = S.logoUrl; else logo.style.display = 'none';
    document.getElementById('brandName').textContent = S.siteName || 'SRA YALA';
    document.getElementById('brandTag').textContent = S.organization || '';
    document.getElementById('memberBtn').href = memberUrl();
    var fab = document.getElementById('chatFab');
    if (S.chatUrl || S.facebookUrl) fab.href = S.chatUrl || S.facebookUrl; else fab.style.display = 'none';
    var stats = DATA.stats || {};
    var q = function (k, label) { return '<li><a' + navAttrs(k) + '>' + esc(label) + '</a></li>'; };
    document.getElementById('footer').innerHTML = '<div class="container"><div class="cols">' +
      '<div><div class="fb">' + (S.logoUrl ? '<img src="' + attr(S.logoUrl) + '" alt="">' : '') + '<div><div style="font-family:var(--font-head);font-weight:700;font-size:20px;color:#fff">' + esc(S.siteName || '') + '</div><div style="font-size:14px">' + esc(S.organization || '') + '</div></div></div>' +
      '<p style="font-size:15px">' + esc(S.tagline || '') + '</p>' +
      (S.facebookUrl ? '<a class="btn sm light" href="' + attr(S.facebookUrl) + '" target="_blank" rel="noopener">' + ICON.fb + ' Facebook</a>' : '') + '</div>' +
      '<div><h4>เมนู</h4><ul>' + q('model', menu('model', 'โมเดล')) + q('research', menu('research', 'พื้นที่วิจัย')) + q('reports', page('reports').title || 'รายงานผลดำเนินการ') + q('dashboard', menu('dashboard', 'แสดง dashboard')) + q('news', menu('news', 'ข่าวสาร')) + q('gallery', page('gallery').title || 'คลังภาพ') + q('downloads', page('downloads').title || 'เอกสารดาวน์โหลด') + q('tools', page('tools').title || 'เครื่องมือ') + '</ul></div>' +
      '<div><h4>ติดต่อเรา</h4><ul>' + (S.email ? '<li><a href="mailto:' + attr(S.email) + '">✉ ' + esc(S.email) + '</a></li>' : '') + (S.phone ? '<li><a href="tel:' + attr(String(S.phone).replace(/[^0-9+]/g, '')) + '">☎ ' + esc(S.phone) + '</a></li>' : '') +
      (S.address ? '<li style="font-size:14.5px">' + esc(S.address) + '</li>' : '') + '<li><a' + navAttrs('contact') + '>ส่งข้อความถึงทีมงาน →</a></li><li><a href="' + attr(memberUrl()) + '" target="_top">🔐 เข้าสู่ระบบสมาชิกกองทุน →</a></li></ul></div></div>' +
      '<div class="bottom"><span>' + esc(S.footerText || '') + '</span><span>' + (truthy(S.showVisitCounter) ? 'ผู้เข้าชม <b id="visitCount">' + Number(stats.visits || 0).toLocaleString('th-TH') + '</b> ครั้ง · ' : '') +
      '<a href="' + attr((DATA.baseUrl || '') + '?mode=admin') + '" target="_top">สำหรับผู้ดูแล</a></span></div></div>';
  }

  /* ===================== boot ===================== */
  renderChrome();
  var r = DATA.initialRoute || {};
  current = { page: PAGES[r.page] ? r.page : 'home', id: r.id || '' };
  render();
  if (hasGas) {
    if (google.script.history) {
      try { google.script.history.setChangeHandler(function (e) { var st = e.state || (e.location && e.location.parameter) || {}; go(st.page || 'home', st.id || '', { fromHistory: true }); }); } catch (err) { }
    }
    google.script.run.withSuccessHandler(function (s) {
      var el = document.getElementById('visitCount'); if (el && s) el.textContent = Number(s.visits).toLocaleString('th-TH');
    }).logVisit();
  }
})();
</script>
