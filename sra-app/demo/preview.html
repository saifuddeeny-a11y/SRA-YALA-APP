      try {
        if (!props.getProperty('SETUP_DONE')) setup();
      } finally {
        lock.releaseLock();
      }
    } catch (err) {
      return setupErrorPage_(err);
    }
  }

  var settings = getSettings_();
  var siteName = settings.siteName || 'SRA YALA';
  var tpl;

  if (params.mode === 'member') {
    tpl = HtmlService.createTemplateFromFile('Member');
    tpl.baseUrl = baseUrl;
    tpl.siteName = siteName;
    tpl.memberConfig = safeJson_(memberPublicConfig_(settings));
    return finalize_(tpl.evaluate(), 'เข้าสู่ระบบสมาชิก — ' + (settings.fundName || 'กองทุนออมทรัพย์และบัญชีฮัจย์-อุมเราะห์'), settings);
  }

  if (params.mode === 'admin') {
    tpl = HtmlService.createTemplateFromFile('Admin');
    tpl.baseUrl = baseUrl;
    tpl.siteName = siteName;
    return finalize_(tpl.evaluate(), siteName + ' — ระบบจัดการเว็บไซต์', settings);
  }

  tpl = HtmlService.createTemplateFromFile('Index');
  var data = getPublicData_();
  data.baseUrl = baseUrl;
  data.initialRoute = { page: params.page || 'home', id: params.id || '' };
  tpl.bootstrap = safeJson_(data);
  return finalize_(tpl.evaluate(), siteName + (settings.tagline ? ' — ' + settings.tagline : ''), settings);
}

/** true เมื่อหน้าเว็บถูกเปิดจากแอปมือถือ (PWA) */
var APP_MODE_ = false;
var APP_INFO_ = { base: '', mode: 'site' };

/**
 * สคริปต์เชื่อมกับแอปมือถือ: เมื่ออยู่ในแอป ลิงก์ที่จะสลับหน้า (หน้าเว็บ / ระบบสมาชิก / หลังบ้าน)
 * จะถูกส่งให้แอปเปิดแทน เพื่อไม่ให้หลุดออกจากแอปไปเปิดในเบราว์เซอร์
 */
function appBridgeHtml_(base, mode) {
  return '<script>(function(){var B=' + JSON.stringify(String(base || '')) + ',M=' + JSON.stringify(String(mode || 'site')) + ';' +
    'function post(o){try{window.top.postMessage(o,"*");}catch(e){}}' +
    'document.addEventListener("click",function(e){if(e.defaultPrevented)return;var a=e.target&&e.target.closest?e.target.closest("a[href]"):null;if(!a)return;' +
    'var h=a.getAttribute("href")||"",t=(a.getAttribute("target")||"").toLowerCase();if(t==="_blank"||!B||h.indexOf(B)!==0)return;' +
    'e.preventDefault();post({sra:"nav",url:h});});' +
    'post({sra:"page",mode:M,title:document.title});})();<\/script>';
}

function finalize_(output, title, settings) {
  if (APP_MODE_) { try { output.append(appBridgeHtml_(APP_INFO_.base, APP_INFO_.mode)); } catch (err) { } }
  output.setTitle(title)
    .addMetaTag('viewport', 'width=device-width, initial-scale=1')
    .setXFrameOptionsMode(HtmlService.XFrameOptionsMode.ALLOWALL);
  if (settings && settings.faviconUrl) {
    try { output.setFaviconUrl(settings.faviconUrl); } catch (err) { /* ต้องเป็น .png สาธารณะ */ }
  }
  return output;
}

/** หน้าแจ้งปัญหาการติดตั้ง พร้อมสาเหตุจริงและวิธีแก้ */

  if (/permission|สิทธิ์|access|not have/i.test(msg)) {

    msg.replace(/[<>&]/g, '') + '</p></div>').setTitle('SRA YALA — ติดตั้งระบบ')
    .addMetaTag('viewport', 'width=device-width, initial-scale=1');

/** ใช้ใน HTML template: <?!= include('Theme') ?> */

}

function safeJson_(obj) {
  return JSON.stringify(obj)
    .replace(/</g, '\\u003c')
    .replace(/>/g, '\\u003e')

/**
 * สร้าง Google Sheet ฐานข้อมูล + โฟลเดอร์ Drive + ใส่ข้อมูลเริ่มต้นจากเว็บเดิม
 * รันซ้ำได้อย่างปลอดภัย: จะไม่สร้างซ้ำถ้ามีอยู่แล้ว
 */
function setup() {
  var props = PropertiesService.getScriptProperties();
  var ss;
  var dbId = props.getProperty('DB_ID') || DB_SPREADSHEET_ID;
  if (!dbId) {
    // สคริปต์ที่ผูกกับชีต (ส่วนขยาย › Apps Script) ใช้ชีตนั้นเลย
    try { var active = SpreadsheetApp.getActiveSpreadsheet(); if (active) dbId = active.getId(); } catch (err) { }
  }
  if (dbId) {
    ss = SpreadsheetApp.openById(dbId);
  } else {
    ss = SpreadsheetApp.create(APP_NAME + ' — Database');
  }
  props.setProperty('DB_ID', ss.getId());

  // โฟลเดอร์เก็บไฟล์
  var rootId = props.getProperty('ROOT_FOLDER_ID');
  var root;
  if (rootId) {
    root = DriveApp.getFolderById(rootId);
  } else {
    root = DriveApp.createFolder(APP_NAME + ' — Uploads');
    props.setProperty('ROOT_FOLDER_ID', root.getId());
  }
  ['Images', 'Documents', 'Files', 'Slips'].forEach(function (name) {
    var key = 'FOLDER_' + name.toUpperCase();
    if (!props.getProperty(key)) {
      props.setProperty(key, root.createFolder(name).getId());
    }
  });

  // สร้างชีตตาม SCHEMA
  Object.keys(SCHEMA).forEach(function (name) { ensureSheet_(ss, name); });
  ['Sheet1', 'ชีต1', 'แผ่นงาน1'].forEach(function (n) {
    var def = ss.getSheetByName(n);
    // ลบชีตว่างเริ่มต้นเท่านั้น (ไม่ลบถ้ามีข้อมูล)
    if (def && def.getLastRow() === 0 && ss.getSheets().length > 1) ss.deleteSheet(def);
  });

  // ข้อมูลเริ่มต้น (ใส่เฉพาะตารางที่ยังว่าง)
  seedData_(ss);
  seedForms_();

  // ผู้ดูแลเริ่มต้น
  if (readTable_('Users').length === 0) {
    var salt = Utilities.getUuid();
    insertRow_('Users', {
      id: newId_(), username: INITIAL_ADMIN_USERNAME, name: 'ผู้ดูแลระบบ', role: 'admin',
      passwordHash: hashPassword_(INITIAL_ADMIN_PASSWORD, salt), salt: salt,
      active: 'TRUE', lastLogin: '', createdAt: nowIso_()
    });
  }

  clearPublicCache_();
  props.setProperty('SETUP_DONE', nowIso_());
  Logger.log('ติดตั้งเสร็จ');
  Logger.log('ฐานข้อมูล: ' + ss.getUrl());
  Logger.log('โฟลเดอร์ไฟล์: ' + root.getUrl());
  Logger.log('ผู้ใช้เริ่มต้น: ' + INITIAL_ADMIN_USERNAME + ' / ' + INITIAL_ADMIN_PASSWORD + ' (กรุณาเปลี่ยนรหัสผ่านหลังเข้าสู่ระบบ)');
  return { dbUrl: ss.getUrl(), folderUrl: root.getUrl() };
}

/** รีเซ็ตรหัสผ่านผู้ใช้ admin กลับเป็นค่าเริ่มต้น (ใช้กรณีลืมรหัสผ่าน — รันจากโปรแกรมแก้ไข) */
function resetAdminPassword() {
  var users = readTable_('Users');
  var u = users.filter(function (x) { return x.username === INITIAL_ADMIN_USERNAME; })[0];
  var salt = Utilities.getUuid();
  if (u) {
    u.salt = salt; u.passwordHash = hashPassword_(INITIAL_ADMIN_PASSWORD, salt); u.active = 'TRUE';
    updateRow_('Users', u);
  } else {
    insertRow_('Users', {
      id: newId_(), username: INITIAL_ADMIN_USERNAME, name: 'ผู้ดูแลระบบ', role: 'admin',
      passwordHash: hashPassword_(INITIAL_ADMIN_PASSWORD, salt), salt: salt, active: 'TRUE', lastLogin: '', createdAt: nowIso_()
    });
  }
  Logger.log('รีเซ็ตรหัสผ่านแล้ว: ' + INITIAL_ADMIN_USERNAME + ' / ' + INITIAL_ADMIN_PASSWORD);
}

function ensureSheet_(ss, name) {
  var headers = SCHEMA[name];
  var sh = ss.getSheetByName(name);
  if (!sh) {
    sh = ss.insertSheet(name);
  }
  var lastCol = sh.getLastColumn();
  if (sh.getLastRow() === 0 || lastCol === 0) {
    sh.getRange(1, 1, 1, headers.length).setValues([headers]);
  } else {
    // เติมคอลัมน์ที่ขาด (รองรับการอัปเกรดเวอร์ชัน)
    var existing = sh.getRange(1, 1, 1, lastCol).getValues()[0];
    var missing = headers.filter(function (h) { return existing.indexOf(h) === -1; });
    if (missing.length) {
      sh.getRange(1, lastCol + 1, 1, missing.length).setValues([missing]);
    }
  }
  sh.setFrozenRows(1);
  sh.getRange(1, 1, 1, Math.max(headers.length, sh.getLastColumn())).setFontWeight('bold').setBackground('#e8f1ee');
  // เก็บทุกค่าเป็นข้อความ เพื่อกัน Sheets แปลงเบอร์โทร/วันที่เอง
  sh.getRange(1, 1, sh.getMaxRows(), Math.max(headers.length, sh.getLastColumn())).setNumberFormat('@');
  return sh;
}

/* ============================================================
 *  DATABASE HELPERS (Google Sheets)
 * ============================================================ */

var _ssCache = null;
function db_() {
  if (_ssCache) return _ssCache;
  var id = PropertiesService.getScriptProperties().getProperty('DB_ID') || DB_SPREADSHEET_ID;
  if (!id) throw new Error('ยังไม่ได้ติดตั้งระบบ (รัน setup ก่อน)');
  _ssCache = SpreadsheetApp.openById(id);
  return _ssCache;
}

function sheet_(name) {
  if (!SCHEMA[name]) throw new Error('ไม่รู้จักตาราง: ' + name);
  var sh = db_().getSheetByName(name);
  if (!sh) sh = ensureSheet_(db_(), name);
  return sh;
}

function headers_(sh) {
  var lastCol = sh.getLastColumn();
  if (lastCol === 0) return [];
  return sh.getRange(1, 1, 1, lastCol).getValues()[0].map(String);
}

/** อ่านตารางทั้งหมดเป็น array ของ object */
function readTable_(name) {
  var sh = sheet_(name);
  var values = sh.getDataRange().getValues();
  if (values.length < 2) return [];
  var head = values[0].map(String);
  var out = [];
  for (var r = 1; r < values.length; r++) {
    var row = values[r];
    if (row.join('') === '') continue;
    var o = {};
    for (var c = 0; c < head.length; c++) {
      if (!head[c]) continue;
      var v = row[c];
      if (v instanceof Date) v = v.toISOString();
      o[head[c]] = v === null || v === undefined ? '' : String(v);
    }
    out.push(o);
  }
  return out;
}

function findRowIndex_(sh, id) {
  var last = sh.getLastRow();
  if (last < 2) return -1;
  var ids = sh.getRange(2, 1, last - 1, 1).getValues();
  for (var i = 0; i < ids.length; i++) {
    if (String(ids[i][0]) === String(id)) return i + 2;
  }
  return -1;
}

function rowFromObj_(head, obj) {
  return head.map(function (h) {
    var v = obj[h];
    if (v === undefined || v === null) return '';
    if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
    if (typeof v === 'object') return JSON.stringify(v);
    return String(v);
  });
}

function insertRow_(name, obj) {
  var sh = sheet_(name);
  var head = headers_(sh);
  var row = rowFromObj_(head, obj);
  var target = sh.getLastRow() + 1;
  if (target > sh.getMaxRows()) {
    sh.insertRowsAfter(sh.getMaxRows(), 500); // ขยายชีตเมื่อแถวเต็ม
  }
  sh.getRange(target, 1, 1, head.length).setNumberFormat('@').setValues([row]);
  return obj;
}

function updateRow_(name, obj) {
  var sh = sheet_(name);
  var head = headers_(sh);
  var idx = findRowIndex_(sh, obj[head[0]]);
  if (idx === -1) return insertRow_(name, obj);
  var current = sh.getRange(idx, 1, 1, head.length).getValues()[0];
  var merged = {};
  head.forEach(function (h, i) { merged[h] = current[i]; });
  Object.keys(obj).forEach(function (k) { if (head.indexOf(k) !== -1) merged[k] = obj[k]; });
  sh.getRange(idx, 1, 1, head.length).setNumberFormat('@').setValues([rowFromObj_(head, merged)]);
  var out = {};
  head.forEach(function (h) { out[h] = merged[h] === undefined || merged[h] === null ? '' : String(merged[h]); });
  return out;
}

function deleteRow_(name, id) {
  var sh = sheet_(name);
  var idx = findRowIndex_(sh, id);
  if (idx === -1) return false;
  sh.deleteRow(idx);
  return true;
}

function getRow_(name, id) {
  var rows = readTable_(name);
  for (var i = 0; i < rows.length; i++) if (String(rows[i][SCHEMA[name][0]]) === String(id)) return rows[i];
  return null;
}

function getSettings_() {
  var out = {};
  readTable_('Settings').forEach(function (r) { out[r.key] = r.value; });
  return out;
}

function setSetting_(key, value) {
  updateRow_('Settings', { key: key, value: value == null ? '' : String(value) });
}

/* ============================================================
 *  AUTH
 * ============================================================ */

function hashPassword_(password, salt) {
  var raw = Utilities.computeDigest(Utilities.DigestAlgorithm.SHA_256, salt + '::' + password, Utilities.Charset.UTF_8);
  return raw.map(function (b) { var v = (b < 0 ? b + 256 : b).toString(16); return v.length === 1 ? '0' + v : v; }).join('');
}

/** ตรวจ token และคืนข้อมูลผู้ใช้ — โยน error ถ้าไม่ผ่าน */
function requireAuth_(token, needAdmin) {
  if (!token) throw new Error('AUTH: กรุณาเข้าสู่ระบบ');
  var cache = CacheService.getScriptCache();
  var raw = cache.get('sess_' + token);
  if (!raw) throw new Error('AUTH: หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบใหม่');
  var user = JSON.parse(raw);
  cache.put('sess_' + token, raw, SESSION_TTL); // ต่ออายุ
  if (needAdmin && user.role !== 'admin') throw new Error('ต้องเป็นผู้ดูแลระบบ (admin) เท่านั้น');
  return user;
}

function logAction_(user, action, detail) {
  try {
    insertRow_('Logs', { id: newId_(), time: nowIso_(), user: user ? user.username : '-', action: action, detail: String(detail || '').substr(0, 300) });
    var sh = sheet_('Logs');
    if (sh.getLastRow() > 3000) sh.deleteRows(2, 1000); // เก็บประวัติล่าสุดไม่เกิน ~3,000 รายการ
  } catch (err) { /* ไม่ให้ log ทำให้ระบบล้ม */ }
}

/* ============================================================
 *  CACHE (แบ่งเป็นชิ้น เพราะ CacheService จำกัด 100KB/คีย์)
 * ============================================================ */

function cachePutBig_(key, str, ttl) {
  var cache = CacheService.getScriptCache();
  var size = 90000;
  var n = Math.ceil(str.length / size);
  var map = {};
  for (var i = 0; i < n; i++) map[key + '_' + i] = str.substr(i * size, size);
  map[key + '_n'] = String(n);
  try { cache.putAll(map, ttl); } catch (err) { /* ข้อมูลใหญ่เกิน — ข้ามแคช */ }
}

function cacheGetBig_(key) {
  var cache = CacheService.getScriptCache();
  var n = cache.get(key + '_n');
  if (!n) return null;
  var keys = [];
  for (var i = 0; i < Number(n); i++) keys.push(key + '_' + i);
  var got = cache.getAll(keys);
  var out = '';
  for (var j = 0; j < keys.length; j++) {
    if (got[keys[j]] === undefined || got[keys[j]] === null) return null;
    out += got[keys[j]];
  }
  return out;
}

function clearPublicCache_() {
  // เปลี่ยนเวอร์ชันแคช แทนการลบทุกชิ้น
  PropertiesService.getScriptProperties().setProperty('CACHE_VER', String(new Date().getTime()));
}

function publicCacheKey_() {
  return 'pub_' + (PropertiesService.getScriptProperties().getProperty('CACHE_VER') || '0');
}

/* ============================================================
 *  UTILITIES
 * ============================================================ */

function newId_() {
  return Utilities.getUuid().replace(/-/g, '').substr(0, 12);
}

function nowIso_() {
  return new Date().toISOString();
}

function isTrue_(v) {
  return v === true || String(v).toUpperCase() === 'TRUE' || v === '1' || v === 1;
}

function byOrder_(a, b) {
  var oa = Number(a.order || 0), ob = Number(b.order || 0);
  if (oa !== ob) return oa - ob;
  return String(a.createdAt || '').localeCompare(String(b.createdAt || ''));
}

/** URL สำหรับแสดงรูปจาก Google Drive (ไฟล์ต้องแชร์แบบ "ทุกคนที่มีลิงก์") */
function driveImageUrl_(fileId) {
  return 'https://drive.google.com/thumbnail?id=' + fileId + '&sz=w1920';
}

function driveViewUrl_(fileId) {
  return 'https://drive.google.com/file/d/' + fileId + '/view';
}

function driveDownloadUrl_(fileId) {
  return 'https://drive.google.com/uc?export=download&id=' + fileId;
}

/** ลบแท็กอันตรายออกจาก HTML ที่บันทึกจากหลังบ้าน */
function sanitizeHtml_(html) {
  if (!html) return '';
  return String(html)
    .replace(/<\s*(script|style|iframe|object|embed|link|meta)[^>]*>[\s\S]*?<\s*\/\s*\1\s*>/gi, '')
    .replace(/<\s*(script|style|iframe|object|embed|link|meta)[^>]*\/?>/gi, '')
    .replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi, '')
    .replace(/(href|src)\s*=\s*(["'])\s*javascript:[^"']*\2/gi, '$1="#"');
}

/** รวมข้อมูลทั้งหมดที่หน้าเว็บสาธารณะต้องใช้ (มีแคช) */
function getPublicData_() {
  var key = publicCacheKey_();
  var cached = cacheGetBig_(key);
  if (cached) {
    var c = JSON.parse(cached);
    c.stats = publicStats_();
    return c;
  }

  var settings = getSettings_();
  delete settings.notifyEmail;

  var pages = {};
  readTable_('Pages').forEach(function (p) { pages[p.id] = p; });

  var pub = function (r) { return r.published === '' || isTrue_(r.published); };

  var groups = readTable_('Groups').filter(pub).sort(byOrder_);

  var news = readTable_('News').filter(pub).map(function (n) {
    try { n.images = n.images ? JSON.parse(n.images) : []; } catch (err) { n.images = []; }
    return n;
  }).sort(function (a, b) {
    var da = String(a.date || a.createdAt || '').substr(0, 10), dbb = String(b.date || b.createdAt || '').substr(0, 10);
    if (da !== dbb) return dbb.localeCompare(da); // วันที่ใหม่สุดก่อน
    var ca = String(a.createdAt || ''), cb = String(b.createdAt || '');
    if (ca !== cb) return cb.localeCompare(ca);
    return Number(a.order || 0) - Number(b.order || 0);
  });

  var gallery = groupBy_(readTable_('Gallery').filter(pub).sort(byOrder_), 'section');
  var documents = readTable_('Documents').filter(pub).sort(byOrder_).map(function (d) { if (!d.kind) d.kind = 'document'; return d; });
  var parseImgs = function (r) { try { r.images = r.images ? JSON.parse(r.images) : []; } catch (err) { r.images = []; } return r; };
  var reports = readTable_('Reports').filter(pub).map(parseImgs).sort(function (a, b) {
    var ya = String(a.fiscalYear || ''), yb = String(b.fiscalYear || '');
    if (ya !== yb) return yb.localeCompare(ya);
    var da = String(a.activityDate || ''), dbb = String(b.activityDate || '');
    if (da !== dbb) return dbb.localeCompare(da);
    return byOrder_(a, b);
  });
  var kpis = readTable_('KPIs').filter(pub).sort(byOrder_);
  var albums = readTable_('Albums').filter(pub).sort(function (a, b) {
    var da = String(a.date || a.createdAt || ''), dbb = String(b.date || b.createdAt || '');
    if (da !== dbb) return dbb.localeCompare(da);
    return byOrder_(a, b);
  });
  var links = groupBy_(readTable_('Links').filter(pub).sort(byOrder_), 'section');
  var indicators = groupBy_(readTable_('Indicators').filter(pub).sort(byOrder_), 'section');
  var steps = readTable_('Steps').filter(pub).sort(byOrder_);

  var data = {
    settings: settings, pages: pages, groups: groups, news: news, gallery: gallery,
    documents: documents, reports: reports, kpis: kpis, albums: albums, links: links, indicators: indicators, steps: steps,
    forms: publicForms_(), accounts: accountLabels_(settings),
    generatedAt: nowIso_()
  };
  cachePutBig_(key, JSON.stringify(data), PUBLIC_CACHE_TTL);
  data.stats = publicStats_();
  return data;
}

/** เรียกจากหน้าเว็บเพื่อโหลดข้อมูลล่าสุด */

function publicStats_() {

function groupBy_(rows, field) {

  });

/** นับผู้เข้าชม (เรียกครั้งเดียวต่อการเปิดเว็บ) */
function logVisit() {

/** รับข้อความจากแบบฟอร์มติดต่อ */
function submitMessage(payload) {
  payload = payload || {};
  if (payload.website) return { ok: true }; // honeypot กันบอท
  var name = String(payload.name || '').trim().substr(0, 120);
  var message = String(payload.message || '').trim().substr(0, 4000);
  if (!name || !message) throw new Error('กรุณากรอกชื่อและข้อความ');

  var cache = CacheService.getScriptCache();
  var count = Number(cache.get('msg_rate') || 0);
  if (count > 30) throw new Error('มีการส่งข้อความจำนวนมาก กรุณาลองใหม่ภายหลัง');
  cache.put('msg_rate', String(count + 1), 600);

  var rec = {
    id: newId_(), name: name,
    email: String(payload.email || '').trim().substr(0, 160),
    phone: String(payload.phone || '').trim().substr(0, 40),
    subject: String(payload.subject || '').trim().substr(0, 200),
    message: message, status: 'new', createdAt: nowIso_()
  };
  insertRow_('Messages', rec);

  var to = getSettings_().notifyEmail;
  if (to) {
    try {
      MailApp.sendEmail({
        to: to,
        subject: '[SRA YALA] ข้อความใหม่จากเว็บไซต์: ' + (rec.subject || rec.name),
        body: 'ชื่อ: ' + rec.name + '\nอีเมล: ' + rec.email + '\nโทร: ' + rec.phone + '\nเรื่อง: ' + rec.subject + '\n\n' + rec.message
      });
    } catch (err) { /* ส่งอีเมลไม่สำเร็จ ไม่กระทบการบันทึก */ }
  }
  return { ok: true };
}

 *  AUTH API
 * ------------------------------------------------------------ */

function login(username, password) {
  var cache = CacheService.getScriptCache();
  var fails = Number(cache.get('login_fail') || 0);
  if (fails >= 10) throw new Error('เข้าสู่ระบบผิดหลายครั้ง กรุณารอ 10 นาทีแล้วลองใหม่');

  username = String(username || '').trim().toLowerCase();
  var user = readTable_('Users').filter(function (u) {
    return String(u.username).toLowerCase() === username && isTrue_(u.active);
  })[0];

  if (!user || hashPassword_(String(password || ''), user.salt) !== user.passwordHash) {
    cache.put('login_fail', String(fails + 1), 600);
    throw new Error('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
  }

  var token = Utilities.getUuid() + Utilities.getUuid().replace(/-/g, '');
  var sess = { id: user.id, username: user.username, name: user.name, role: user.role };
  cache.put('sess_' + token, JSON.stringify(sess), SESSION_TTL);
  updateRow_('Users', { id: user.id, lastLogin: nowIso_() });
  logAction_(sess, 'login', '');
  return { token: token, user: sess };
}

function logout(token) {
  try { CacheService.getScriptCache().remove('sess_' + token); } catch (err) { }
  return true;
}

function me(token) {
  return requireAuth_(token);
}

function changePassword(token, oldPassword, newPassword) {
  var sess = requireAuth_(token);
  var user = getRow_('Users', sess.id);
  if (!user || hashPassword_(String(oldPassword || ''), user.salt) !== user.passwordHash) {
    throw new Error('รหัสผ่านเดิมไม่ถูกต้อง');
  }
  validatePassword_(newPassword);
  var salt = Utilities.getUuid();
  updateRow_('Users', { id: user.id, salt: salt, passwordHash: hashPassword_(String(newPassword), salt) });
  logAction_(sess, 'change-password', '');
  return true;
}

function validatePassword_(pw) {
  pw = String(pw || '');
  if (pw.length < 8) throw new Error('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร');
}

/** โหลดข้อมูลทั้งหมดสำหรับหลังบ้าน */
function adminGetAll(token) {
  var user = requireAuth_(token);
  var out = { user: user, settings: getSettings_(), tables: {} };
  EDITABLE_TABLES.concat(['Media']).forEach(function (t) {
    out.tables[t] = readTable_(t);
  });
  out.tables.Members = readTable_('Members').map(stripMember_);
  out.tables.Transactions = readTable_('Transactions');
  out.accounts = accountLabels_(out.settings);
  if (user.role === 'admin') {
    out.tables.Users = readTable_('Users').map(stripSecret_);
    out.tables.Logs = readTable_('Logs').slice(-200).reverse();
  }
  var p = PropertiesService.getScriptProperties();
  var daily = [];
  for (var i = 13; i >= 0; i--) {
    var d = new Date(new Date().getTime() - i * 86400000);
    var k = Utilities.formatDate(d, 'Asia/Bangkok', 'yyyy-MM-dd');
    daily.push({ date: k, count: Number(p.getProperty('VISITS_' + k) || 0) });
  }
  out.stats = { visits: Number(p.getProperty('VISITS') || 0), daily: daily };
  try {
    out.links = {
      db: db_().getUrl(),
      folder: DriveApp.getFolderById(p.getProperty('ROOT_FOLDER_ID')).getUrl()
    };
  } catch (err) { out.links = {}; }
  return out;
}

function stripSecret_(u) {
  var c = {};
  Object.keys(u).forEach(function (k) { if (k !== 'passwordHash' && k !== 'salt') c[k] = u[k]; });
  return c;
}

var HTML_FIELDS = { Pages: ['content'], Groups: ['detail'], News: ['content'], Steps: ['description'], Reports: ['content'] };

/** เพิ่ม/แก้ไขข้อมูลในตาราง */
function adminSave(token, table, record) {
  var user = requireAuth_(token);
  if (EDITABLE_TABLES.indexOf(table) === -1) throw new Error('ไม่อนุญาตให้แก้ไขตาราง ' + table);
  record = record || {};
  var pk = SCHEMA[table][0];
  var clean = {};
  SCHEMA[table].forEach(function (f) {
    if (record[f] !== undefined) clean[f] = record[f];
  });
  (HTML_FIELDS[table] || []).forEach(function (f) {
    if (clean[f] !== undefined) clean[f] = sanitizeHtml_(clean[f]);
  });
  if (clean.images !== undefined && typeof clean.images !== 'string') clean.images = JSON.stringify(clean.images);
  if (clean.fields !== undefined && typeof clean.fields !== 'string') clean.fields = JSON.stringify(clean.fields);
  if (clean.data !== undefined && typeof clean.data !== 'string') clean.data = JSON.stringify(clean.data);

  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    var isNew = !clean[pk] || !getRow_(table, clean[pk]);
    if (!clean[pk]) clean[pk] = table === 'Pages' ? newId_() : newId_();
    var now = nowIso_();
    if (SCHEMA[table].indexOf('updatedAt') !== -1) clean.updatedAt = now;
    if (isNew && SCHEMA[table].indexOf('createdAt') !== -1 && !clean.createdAt) clean.createdAt = now;
    if (isNew && SCHEMA[table].indexOf('published') !== -1 && clean.published === undefined) clean.published = 'TRUE';
    if (isNew && SCHEMA[table].indexOf('order') !== -1 && (clean.order === undefined || clean.order === '')) {
      clean.order = String(readTable_(table).length + 1);
    }
    var saved = isNew ? insertRow_(table, fill_(table, clean)) : updateRow_(table, clean);
    clearPublicCache_();
    logAction_(user, (isNew ? 'create ' : 'update ') + table, clean.title || clean.name || clean.label || clean[pk]);
    return fill_(table, saved);
  } finally {
    lock.releaseLock();
  }
}

function fill_(table, obj) {
  var o = {};
  SCHEMA[table].forEach(function (f) { o[f] = obj[f] === undefined || obj[f] === null ? '' : obj[f]; });
  return o;
}

/** ลบข้อมูล — ถ้า trashFile = true จะย้ายไฟล์ใน Drive ที่ผูกอยู่ไปถังขยะด้วย */
function adminDelete(token, table, id, trashFile) {
  var user = requireAuth_(token, table === 'Users');
  if (EDITABLE_TABLES.indexOf(table) === -1 && table !== 'Media') throw new Error('ไม่อนุญาตให้ลบจากตาราง ' + table);
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    var row = getRow_(table, id);
    if (!row) return false;
    if (trashFile && row.fileId) {
      try { DriveApp.getFileById(row.fileId).setTrashed(true); } catch (err) { }
      if (table !== 'Media') {
        readTable_('Media').filter(function (m) { return m.fileId === row.fileId; })
          .forEach(function (m) { deleteRow_('Media', m.id); });
      }
    }
    if (table === 'Albums') {
      // ลบภาพทั้งหมดในอัลบั้มด้วย
      readTable_('Gallery').filter(function (g) { return g.section === 'album:' + id; }).forEach(function (g) {
        if (trashFile && g.fileId) { try { DriveApp.getFileById(g.fileId).setTrashed(true); } catch (err) { } }
        deleteRow_('Gallery', g.id);
      });
    }
    deleteRow_(table, id);
    clearPublicCache_();
    logAction_(user, 'delete ' + table, row.title || row.name || row.label || id);
    return true;
  } finally {
    lock.releaseLock();
  }
}

/** จัดลำดับใหม่ตาม array ของ id */
function adminReorder(token, table, ids) {
  var user = requireAuth_(token);
  if (EDITABLE_TABLES.indexOf(table) === -1) throw new Error('ไม่อนุญาต');
  var sh = sheet_(table);
  var head = headers_(sh);
  var orderCol = head.indexOf('order');
  if (orderCol === -1) throw new Error('ตารางนี้ไม่มีลำดับ');
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    var last = sh.getLastRow();
    if (last < 2) return true;
    var idVals = sh.getRange(2, 1, last - 1, 1).getValues();
    var orders = sh.getRange(2, orderCol + 1, last - 1, 1).getValues();
    var pos = {};
    ids.forEach(function (id, i) { pos[String(id)] = i + 1; });
    for (var i = 0; i < idVals.length; i++) {
      var k = String(idVals[i][0]);
      if (pos[k] !== undefined) orders[i][0] = String(pos[k]);
    }
    sh.getRange(2, orderCol + 1, last - 1, 1).setNumberFormat('@').setValues(orders);
    clearPublicCache_();
    logAction_(user, 'reorder ' + table, ids.length + ' รายการ');
    return true;
  } finally {
    lock.releaseLock();
  }
}

/**
 * อัปโหลดไฟล์ไป Google Drive
 * payload = { name, mimeType, data (base64 ไม่มี prefix), folder: 'Images'|'Documents'|'Files' }
 */
function uploadFile(token, payload) {
  var user = requireAuth_(token);
  if (!payload || !payload.data) throw new Error('ไม่พบข้อมูลไฟล์');
  var bytes = Utilities.base64Decode(payload.data);
  if (bytes.length > MAX_UPLOAD_BYTES) {
    throw new Error('ไฟล์ใหญ่เกิน ' + Math.round(MAX_UPLOAD_BYTES / 1048576) + ' MB');
  }
  var mime = payload.mimeType || 'application/octet-stream';
  var name = String(payload.name || ('file-' + new Date().getTime())).replace(/[\\\/:*?"<>|]/g, '_');
  var folderName = payload.folder || (mime.indexOf('image/') === 0 ? 'Images' : 'Documents');
  var folderId = PropertiesService.getScriptProperties().getProperty('FOLDER_' + folderName.toUpperCase())
    || PropertiesService.getScriptProperties().getProperty('ROOT_FOLDER_ID');
  var folder = DriveApp.getFolderById(folderId);

  var blob = Utilities.newBlob(bytes, mime, name);
  var file = folder.createFile(blob);
  var sharing = shareFile_(file);

  var id = file.getId();
  var rec = {
    id: newId_(), fileId: id, name: name, mimeType: mime, size: String(bytes.length),
    url: mime.indexOf('image/') === 0 ? driveImageUrl_(id) : driveViewUrl_(id),
    viewUrl: driveViewUrl_(id), downloadUrl: driveDownloadUrl_(id),
    folder: folderName, uploadedBy: user.username, createdAt: nowIso_()
  };
  insertRow_('Media', rec);
  logAction_(user, 'upload', name);
  rec.sharing = sharing;
  return rec;
}

/** ตั้งค่าแชร์ไฟล์ให้ทุกคนดูได้ (ถ้าโดเมนไม่อนุญาต จะลดเป็นเฉพาะในโดเมน) */
function shareFile_(file) {
  try {
    file.setSharing(DriveApp.Access.ANYONE_WITH_LINK, DriveApp.Permission.VIEW);
    return 'anyone';
  } catch (err) {
    try {
      file.setSharing(DriveApp.Access.DOMAIN_WITH_LINK, DriveApp.Permission.VIEW);
      return 'domain';
    } catch (err2) {
      return 'private';
    }
  }
}

/** นำเข้ารูป/ไฟล์จาก URL ภายนอกมาเก็บใน Drive */
function importFromUrl(token, url, name) {
  var user = requireAuth_(token);
  return importUrl_(user, url, name);
}

function importUrl_(user, url, name) {
  var res = UrlFetchApp.fetch(url, { muteHttpExceptions: true, followRedirects: true });
  if (res.getResponseCode() >= 300) throw new Error('ดาวน์โหลดไม่สำเร็จ (' + res.getResponseCode() + ')');
  var blob = res.getBlob();
  var mime = blob.getContentType() || 'image/jpeg';
  var ext = mime.indexOf('png') !== -1 ? '.png' : mime.indexOf('gif') !== -1 ? '.gif' : mime.indexOf('webp') !== -1 ? '.webp' : mime.indexOf('pdf') !== -1 ? '.pdf' : '.jpg';
  blob.setName((name || ('import-' + new Date().getTime())) + ext);
  var folderKey = mime.indexOf('image/') === 0 ? 'FOLDER_IMAGES' : 'FOLDER_FILES';
  var folder = DriveApp.getFolderById(PropertiesService.getScriptProperties().getProperty(folderKey));
  var file = folder.createFile(blob);
  shareFile_(file);
  var id = file.getId();
  var rec = {
    id: newId_(), fileId: id, name: blob.getName(), mimeType: mime, size: String(blob.getBytes().length),
    url: mime.indexOf('image/') === 0 ? driveImageUrl_(id) : driveViewUrl_(id),
    viewUrl: driveViewUrl_(id), downloadUrl: driveDownloadUrl_(id),
    folder: mime.indexOf('image/') === 0 ? 'Images' : 'Files', uploadedBy: user ? user.username : 'system', createdAt: nowIso_()
  };
  insertRow_('Media', rec);
  return rec;
}

/**
 * ย้ายรูปภาพทั้งหมดที่ยังอ้างอิงจาก Google Sites เดิม มาเก็บใน Google Drive ของระบบ
 * (ทำครั้งละไม่เกิน 25 รูปเพื่อไม่ให้เกินเวลา 6 นาทีของ Apps Script — กดซ้ำจนครบ)
 */
function migrateExternalImages(token) {
  var user = requireAuth_(token);
  var isExternal = function (u) { return u && /googleusercontent\.com\/sitesv\//.test(String(u)); };
  var done = 0, failed = 0, limit = 25, memo = {};
  var importOne = function (u, label) {
    if (memo[u]) return memo[u];
    var rec = importUrl_(user, u, label);
    memo[u] = rec.url;
    return rec.url;
  };
  var step = function (table, fields) {
    readTable_(table).forEach(function (row) {
      fields.forEach(function (f) {
        if (done + failed >= limit) return;
        if (f === 'images') {
          var arr = []; try { arr = JSON.parse(row.images || '[]'); } catch (err) { arr = []; }
          var changed = false;
          arr = arr.map(function (u) {
            if (done + failed < limit && isExternal(u)) {
              try { var nu = importOne(u, (row.title || table) + '-img'); done++; changed = true; return nu; } catch (err) { failed++; }
            }
            return u;
          });
          if (changed) { var upd = { images: JSON.stringify(arr) }; upd[SCHEMA[table][0]] = row[SCHEMA[table][0]]; updateRow_(table, upd); }
        } else if (isExternal(row[f])) {
          try {
            var nu2 = importOne(row[f], row.title || row.name || row.caption || table);
            var upd2 = {}; upd2[SCHEMA[table][0]] = row[SCHEMA[table][0]]; upd2[f] = nu2;
            updateRow_(table, upd2); done++;
          } catch (err) { failed++; }
        }
      });
    });
  };
  step('Settings', ['value']);
  step('Gallery', ['url']);
  step('News', ['coverUrl', 'images']);
  step('Groups', ['coverUrl']);
  step('Pages', ['imageUrl']);
  step('Documents', ['coverUrl']);
  step('Steps', ['imageUrl']);
  step('Reports', ['coverUrl', 'images']);
  step('Albums', ['coverUrl']);

  var remaining = 0;
  ['Gallery', 'News', 'Groups', 'Pages', 'Documents', 'Steps', 'Settings', 'Reports', 'Albums'].forEach(function (t) {
    readTable_(t).forEach(function (row) {
      Object.keys(row).forEach(function (k) {
        var v = row[k];
        if (isExternal(v)) remaining++;
        else if (k === 'images' && /sitesv/.test(v)) { try { JSON.parse(v).forEach(function (u) { if (isExternal(u)) remaining++; }); } catch (err) { } }
      });
    });
  });
  clearPublicCache_();
  logAction_(user, 'migrate-images', 'สำเร็จ ' + done + ' / ล้มเหลว ' + failed);
  return { done: done, failed: failed, remaining: remaining };
}

/* ------------------------------------------------------------
 *  ADMIN API — ผู้ใช้ (เฉพาะ admin)
 * ------------------------------------------------------------ */

function saveUser(token, u) {
  var sess = requireAuth_(token, true);
  u = u || {};
  var username = String(u.username || '').trim().toLowerCase();
  if (!/^[a-z0-9._-]{3,40}$/.test(username)) throw new Error('ชื่อผู้ใช้ใช้ได้เฉพาะ a-z 0-9 . _ - (3–40 ตัว)');
  var all = readTable_('Users');
  var dup = all.filter(function (x) { return x.username.toLowerCase() === username && x.id !== u.id; })[0];
  if (dup) throw new Error('ชื่อผู้ใช้นี้มีอยู่แล้ว');
  var rec = { username: username, name: String(u.name || username), role: u.role === 'admin' ? 'admin' : 'editor', active: isTrue_(u.active) ? 'TRUE' : 'FALSE' };
  if (u.id) {
    if (u.id === sess.id && rec.role !== 'admin') throw new Error('ไม่สามารถลดสิทธิ์ของตนเองได้');
    rec.id = u.id;
  } else {
    rec.id = newId_(); rec.createdAt = nowIso_();
    if (!u.password) throw new Error('กรุณาตั้งรหัสผ่าน');
  }
  if (u.password) {
    validatePassword_(u.password);
    rec.salt = Utilities.getUuid();
    rec.passwordHash = hashPassword_(String(u.password), rec.salt);
  }
  var saved = u.id ? updateRow_('Users', rec) : insertRow_('Users', fill_('Users', rec));
  logAction_(sess, (u.id ? 'update' : 'create') + ' user', username);
  return stripSecret_(saved);
}

function deleteUser(token, id) {
  var sess = requireAuth_(token, true);
  if (id === sess.id) throw new Error('ไม่สามารถลบบัญชีของตนเองได้');

/**
 * ============================================================
 *  ระบบสมาชิก — กองทุนออมทรัพย์และบัญชีฮัจย์-อุมเราะห์
 *  + แบบฟอร์มออนไลน์ที่บันทึกลง Google Sheet
 * ------------------------------------------------------------
 *  หน้าเข้าสู่ระบบสมาชิกแยกจากหน้าเว็บ:  URL เว็บ?mode=member
 *  ใช้ฐานข้อมูล (Google Sheet) เดียวกับเว็บไซต์และหลังบ้าน
 *    - Members       ข้อมูลสมาชิก + รหัสผ่าน (hash)
 *    - Transactions  รายการฝาก/ถอน แยก 3 บัญชี
 *    - Forms         แบบฟอร์มที่สร้างจากหลังบ้าน
 *    - FormResponses คำตอบแบบฟอร์ม
 * ============================================================
 */

/** อายุการเข้าสู่ระบบของสมาชิก (วินาที) สูงสุด 21600 = 6 ชั่วโมง */
var MEMBER_SESSION_TTL = 21600;

/** ขนาดไฟล์สลิปสูงสุด */
var MAX_SLIP_BYTES = 5 * 1024 * 1024;

/** บัญชีของสมาชิก (ชื่อแสดงผลเปลี่ยนได้ที่ ตั้งค่าเว็บไซต์ › ระบบสมาชิก) */
var ACCOUNTS = ['savings', 'hajj', 'umrah'];
var ACCOUNT_LABELS = { savings: 'เงินออมทรัพย์', hajj: 'บัญชีฮัจย์', umrah: 'บัญชีอุมเราะห์' };
var TX_TYPES = { deposit: 'ฝาก', withdraw: 'ถอน' };
var TX_STATUS = ['approved', 'pending', 'rejected'];

var FORM_FIELD_TYPES = ['text', 'textarea', 'number', 'date', 'tel', 'email', 'select', 'radio', 'checkbox', 'section'];

/* ------------------------------------------------------------
 *  ค่าตั้งต้นที่หน้าสมาชิกต้องใช้ (ไม่มีข้อมูลลับ)
 * ------------------------------------------------------------ */
function memberPublicConfig_(settings) {
  settings = settings || getSettings_();
  return {
    siteName: settings.siteName || 'SRA YALA',
    fundName: settings.fundName || 'กองทุนออมทรัพย์และบัญชีฮัจย์-อุมเราะห์',
    organization: settings.organization || '',
    logoUrl: settings.logoUrl || '',
    themeColor: settings.themeColor || '',
    accentColor: settings.accentColor || '',
    phone: settings.phone || '',
    email: settings.email || '',
    notice: settings.memberNotice || '',
    allowDepositNotice: settings.memberDepositNotice !== 'FALSE',
    accounts: accountLabels_(settings)
  };
}

function accountLabels_(settings) {
  settings = settings || getSettings_();
  return {
    savings: settings.acc_savings || ACCOUNT_LABELS.savings,
    hajj: settings.acc_hajj || ACCOUNT_LABELS.hajj,
    umrah: settings.acc_umrah || ACCOUNT_LABELS.umrah
  };
}

/* ------------------------------------------------------------
 *  SESSION ของสมาชิก (แยกจากผู้ดูแล)
 * ------------------------------------------------------------ */
function requireMember_(token) {
  if (!token || !/^[a-zA-Z0-9-]{20,100}$/.test(String(token))) throw new Error('MEMBER_AUTH: กรุณาเข้าสู่ระบบสมาชิก');
  var cache = CacheService.getScriptCache();
  var raw = cache.get('msess_' + token);
  if (!raw) throw new Error('MEMBER_AUTH: หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบใหม่');
  var sess = JSON.parse(raw);
  var m = getRow_('Members', sess.id);
  if (!m || !isTrue_(m.active)) {
    cache.remove('msess_' + token);
    throw new Error('MEMBER_AUTH: บัญชีนี้ถูกระงับการใช้งาน กรุณาติดต่อเจ้าหน้าที่');
  }
  cache.put('msess_' + token, raw, MEMBER_SESSION_TTL); // ต่ออายุ
  return m;
}

function publicMember_(m) {
  return {
    id: m.id, memberNo: m.memberNo, name: m.name, phone: m.phone, groupId: m.groupId, address: m.address,
    joinDate: m.joinDate, savingsGoal: m.savingsGoal, hajjGoal: m.hajjGoal, umrahGoal: m.umrahGoal,
    mustChangePw: isTrue_(m.mustChangePw), lastLogin: m.lastLogin
  };
}

function stripMember_(m) {
  var c = {};
  Object.keys(m).forEach(function (k) { if (k !== 'passwordHash' && k !== 'salt') c[k] = m[k]; });
  c.hasPassword = !!m.passwordHash;
  return c;
}

function findMemberByNo_(memberNo) {
  var key = String(memberNo || '').trim().toLowerCase();
  if (!key) return null;
  return readTable_('Members').filter(function (m) { return String(m.memberNo).trim().toLowerCase() === key; })[0] || null;
}

/* ------------------------------------------------------------
 *  MEMBER API — เรียกจากหน้า Member.html
 * ------------------------------------------------------------ */

function memberLogin(memberNo, password) {
  memberNo = String(memberNo || '').trim();
  password = String(password || '');
  if (!memberNo || !password) throw new Error('กรุณากรอกรหัสสมาชิกและรหัสผ่าน');

  var cache = CacheService.getScriptCache();
  var failKey = 'mfail_' + memberNo.toLowerCase().replace(/[^a-z0-9ก-๙_-]/g, '');
  var fails = Number(cache.get(failKey) || 0);
  if (fails >= 5) throw new Error('กรอกรหัสผ่านผิดหลายครั้ง กรุณารอ 15 นาทีแล้วลองใหม่');
  var allFails = Number(cache.get('mfail_all') || 0);
  if (allFails >= 60) throw new Error('มีการเข้าสู่ระบบผิดจำนวนมาก กรุณาลองใหม่ภายหลัง');

  var m = findMemberByNo_(memberNo);
  if (!m || !m.passwordHash || hashPassword_(password, m.salt) !== m.passwordHash) {
    cache.put(failKey, String(fails + 1), 900);
    cache.put('mfail_all', String(allFails + 1), 600);
    throw new Error('รหัสสมาชิกหรือรหัสผ่านไม่ถูกต้อง');
  }
  if (!isTrue_(m.active)) throw new Error('บัญชีนี้ถูกระงับการใช้งาน กรุณาติดต่อเจ้าหน้าที่กองทุน');

  cache.remove(failKey);
  var token = Utilities.getUuid() + Utilities.getUuid().replace(/-/g, '');
  cache.put('msess_' + token, JSON.stringify({ id: m.id, memberNo: m.memberNo, name: m.name }), MEMBER_SESSION_TTL);
  updateRow_('Members', { id: m.id, lastLogin: nowIso_() });
  return { token: token, member: publicMember_(m) };
}

function memberLogout(token) {
  try { CacheService.getScriptCache().remove('msess_' + token); } catch (err) { }
  return true;
}

/** ข้อมูลทั้งหมดของสมาชิกที่เข้าสู่ระบบ */
function memberGetData(token) {
  var m = requireMember_(token);
  var txs = readTable_('Transactions').filter(function (t) { return t.memberId === m.id; })
    .sort(function (a, b) {
      var d = String(b.date || '').localeCompare(String(a.date || ''));
      return d !== 0 ? d : String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
    })
    .map(function (t) {
      return { id: t.id, date: t.date, account: t.account, type: t.type, amount: t.amount, note: t.note, status: t.status || 'approved', hasSlip: !!t.slipFileId, createdAt: t.createdAt };
    });
  var group = m.groupId ? getRow_('Groups', m.groupId) : null;
  var responses = readTable_('FormResponses').filter(function (r) { return r.memberId === m.id; })
    .map(function (r) { return { id: r.id, formId: r.formId, status: r.status, createdAt: r.createdAt }; })
    .sort(function (a, b) { return String(b.createdAt).localeCompare(String(a.createdAt)); });
  return {
    member: publicMember_(m),
    groupName: group ? group.name : '',
    balances: computeBalances_(txs),
    transactions: txs,
    forms: publicForms_().filter(function (f) { return f.status !== 'closed'; }),
    responses: responses,
    config: memberPublicConfig_()
  };
}

function memberChangePassword(token, oldPassword, newPassword) {
  var m = requireMember_(token);
  if (hashPassword_(String(oldPassword || ''), m.salt) !== m.passwordHash) throw new Error('รหัสผ่านเดิมไม่ถูกต้อง');
  validateMemberPassword_(newPassword);
  if (String(oldPassword) === String(newPassword)) throw new Error('รหัสผ่านใหม่ต้องไม่ซ้ำกับรหัสเดิม');
  var salt = Utilities.getUuid();
  updateRow_('Members', { id: m.id, salt: salt, passwordHash: hashPassword_(String(newPassword), salt), mustChangePw: 'FALSE', updatedAt: nowIso_() });
  return true;
}

function validateMemberPassword_(pw) {
  pw = String(pw || '');
  if (pw.length < 6) throw new Error('รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร');
  if (pw.length > 64) throw new Error('รหัสผ่านยาวเกินไป');
}

/**
 * สมาชิกแจ้งการฝากเงิน (พร้อมแนบสลิปได้) → สถานะ “รอตรวจสอบ”
 * เจ้าหน้าที่อนุมัติที่หลังบ้าน แล้วยอดจึงเข้าบัญชี
 * payload = { account, amount, date, note, slip: { name, mimeType, data(base64) } }
 */
function memberNotifyDeposit(token, payload) {
  var m = requireMember_(token);
  var settings = getSettings_();
  if (settings.memberDepositNotice === 'FALSE') throw new Error('ปิดการแจ้งฝากเงินออนไลน์ชั่วคราว กรุณาติดต่อเจ้าหน้าที่');
  payload = payload || {};
  var account = String(payload.account || '');
  if (ACCOUNTS.indexOf(account) === -1) throw new Error('กรุณาเลือกบัญชี');
  var amount = parseAmount_(payload.amount);
  if (!(amount > 0)) throw new Error('กรุณากรอกจำนวนเงินให้ถูกต้อง');
  if (amount > 1000000) throw new Error('จำนวนเงินต่อครั้งสูงเกินกำหนด กรุณาติดต่อเจ้าหน้าที่');
  var date = normDate_(payload.date) || Utilities.formatDate(new Date(), 'Asia/Bangkok', 'yyyy-MM-dd');

  var pending = readTable_('Transactions').filter(function (t) { return t.memberId === m.id && t.status === 'pending'; }).length;
  if (pending >= 20) throw new Error('มีรายการรอตรวจสอบจำนวนมาก กรุณารอเจ้าหน้าที่ตรวจสอบก่อน');

  var slipFileId = '', slipUrl = '';
  if (payload.slip && payload.slip.data) {
    var mime = String(payload.slip.mimeType || '');
    if (!/^image\/(jpeg|png|webp|heic|heif)$/.test(mime) && mime !== 'application/pdf') throw new Error('สลิปต้องเป็นไฟล์ภาพหรือ PDF');
    var bytes = Utilities.base64Decode(payload.slip.data);
    if (bytes.length > MAX_SLIP_BYTES) throw new Error('ไฟล์สลิปใหญ่เกิน 5 MB');
    var props = PropertiesService.getScriptProperties();
    var folderId = props.getProperty('FOLDER_SLIPS') || props.getProperty('ROOT_FOLDER_ID');
    var name = 'slip-' + String(m.memberNo).replace(/[^a-zA-Z0-9_-]/g, '') + '-' + date + '-' + new Date().getTime() + (mime === 'application/pdf' ? '.pdf' : '.jpg');
    // สลิปเป็นข้อมูลส่วนบุคคล: ไม่แชร์สาธารณะ เปิดได้เฉพาะเจ้าของ Drive / ผู้ดูแล
    var file = DriveApp.getFolderById(folderId).createFile(Utilities.newBlob(bytes, mime, name));
    slipFileId = file.getId();
    slipUrl = driveViewUrl_(slipFileId);
  }

  var now = nowIso_();
  var rec = {
    id: newId_(), memberId: m.id, date: date, account: account, type: 'deposit', amount: String(amount),
    note: String(payload.note || '').trim().substr(0, 300), slipFileId: slipFileId, slipUrl: slipUrl,
    status: 'pending', recordedBy: 'member:' + m.memberNo, createdAt: now, updatedAt: now
  };
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try { insertRow_('Transactions', rec); } finally { lock.releaseLock(); }

  if (settings.notifyEmail) {
    try {
      MailApp.sendEmail({
        to: settings.notifyEmail,
        subject: '[' + (settings.siteName || 'SRA YALA') + '] สมาชิกแจ้งฝากเงิน: ' + m.name,
        body: 'รหัสสมาชิก: ' + m.memberNo + '\nชื่อ: ' + m.name + '\nบัญชี: ' + accountLabels_(settings)[account] +
          '\nจำนวน: ' + amount.toLocaleString() + ' บาท\nวันที่: ' + date + '\nหมายเหตุ: ' + rec.note +
          '\n\nตรวจสอบและอนุมัติได้ที่หลังบ้าน › บันทึกเงินออม'
      });
    } catch (err) { }
  }
  return { ok: true, id: rec.id };
}

/* ------------------------------------------------------------
 *  คำนวณยอดเงิน
 * ------------------------------------------------------------ */
function parseAmount_(v) {
  var n = Number(String(v == null ? '' : v).replace(/[, ]/g, ''));
  if (isNaN(n)) return NaN;
  return Math.round(n * 100) / 100;
}

function normDate_(v) {
  var s = String(v || '').substr(0, 10);
  return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : '';
}

/** ยอดคงเหลือแต่ละบัญชี (นับเฉพาะรายการที่อนุมัติแล้ว) */
function computeBalances_(txs) {
  var out = {};
  ACCOUNTS.forEach(function (a) { out[a] = { deposit: 0, withdraw: 0, balance: 0, pending: 0, count: 0 }; });
  (txs || []).forEach(function (t) {
    var b = out[t.account]; if (!b) return;
    var amt = parseAmount_(t.amount); if (isNaN(amt)) return;
    var st = t.status || 'approved';
    if (st === 'pending') { if (t.type === 'deposit') b.pending += amt; return; }
    if (st !== 'approved') return;
    b.count++;
    if (t.type === 'withdraw') b.withdraw += amt; else b.deposit += amt;
  });
  ACCOUNTS.forEach(function (a) {
    var b = out[a];
    b.balance = Math.round((b.deposit - b.withdraw) * 100) / 100;
    b.deposit = Math.round(b.deposit * 100) / 100; b.withdraw = Math.round(b.withdraw * 100) / 100; b.pending = Math.round(b.pending * 100) / 100;
  });
  return out;
}

/**
 * ส่งคำตอบแบบฟอร์ม
 * data = { fieldKey: value | [values] }, memberToken = ใส่เมื่อเป็นแบบฟอร์มสำหรับสมาชิก
 */
function submitForm(formId, data, memberToken) {
  data = data || {};
  if (data.__hp) return { ok: true }; // honeypot กันบอท
  var row = getRow_('Forms', formId);
  if (!row || !(row.published === '' || isTrue_(row.published))) throw new Error('ไม่พบแบบฟอร์มนี้');
  if (row.status === 'closed') throw new Error('แบบฟอร์มนี้ปิดรับข้อมูลแล้ว');

  var member = null;
  if (row.audience === 'member') member = requireMember_(memberToken);
  else if (memberToken) { try { member = requireMember_(memberToken); } catch (err) { member = null; } }

  var cache = CacheService.getScriptCache();
  var count = Number(cache.get('form_rate') || 0);
  if (count > 80) throw new Error('มีการส่งข้อมูลจำนวนมาก กรุณาลองใหม่ภายหลัง');
  cache.put('form_rate', String(count + 1), 600);

  var fields = [];
  try { fields = JSON.parse(row.fields || '[]'); } catch (err) { fields = []; }
  var clean = {}, missing = [];
  fields.forEach(function (f) {
    if (!f || !f.k || f.t === 'section') return;
    var v = data[f.k];
    var opts = Array.isArray(f.opts) ? f.opts.map(String) : [];
    if (f.t === 'checkbox') {
      var arr = (Array.isArray(v) ? v : (v ? [v] : [])).map(String).filter(function (x) { return opts.length === 0 || opts.indexOf(x) !== -1; });
      if (f.req && !arr.length) missing.push(f.l);
      clean[f.k] = arr.join(', ');
      return;
    }
    v = String(v == null ? '' : v).trim().substr(0, f.t === 'textarea' ? 3000 : 300);
    if (f.req && !v) { missing.push(f.l); return; }
    if (!v) { clean[f.k] = ''; return; }
    if (f.t === 'number') {
      var n = parseAmount_(v);
      if (isNaN(n)) throw new Error('“' + f.l + '” ต้องเป็นตัวเลข');
      v = String(n);
    } else if (f.t === 'date') {
      if (!normDate_(v)) throw new Error('“' + f.l + '” วันที่ไม่ถูกต้อง');
    } else if (f.t === 'email') {
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) throw new Error('“' + f.l + '” อีเมลไม่ถูกต้อง');
    } else if (f.t === 'tel') {
      if (!/^[0-9+\-\s()]{6,20}$/.test(v)) throw new Error('“' + f.l + '” เบอร์โทรไม่ถูกต้อง');
    } else if ((f.t === 'select' || f.t === 'radio') && opts.length && opts.indexOf(v) === -1) {
      throw new Error('“' + f.l + '” ตัวเลือกไม่ถูกต้อง');
    }
    clean[f.k] = v;
  });
  if (missing.length) throw new Error('กรุณากรอก: ' + missing.join(', '));

  var rec = {
    id: newId_(), formId: row.id, memberId: member ? member.id : '', memberName: member ? (member.memberNo + ' ' + member.name) : '',
    data: JSON.stringify(clean), status: 'new', createdAt: nowIso_()
  };
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try { insertRow_('FormResponses', rec); } finally { lock.releaseLock(); }

  var to = getSettings_().notifyEmail;
  if (to) {
    try {
      var body = fields.filter(function (f) { return f.t !== 'section'; }).map(function (f) { return f.l + ': ' + (clean[f.k] || '-'); }).join('\n');
      MailApp.sendEmail({ to: to, subject: '[SRA YALA] คำตอบใหม่: ' + row.title, body: (rec.memberName ? 'สมาชิก: ' + rec.memberName + '\n\n' : '') + body });
    } catch (err) { }
  }
  return { ok: true, message: row.successMessage || 'บันทึกข้อมูลเรียบร้อย ขอบคุณค่ะ' };
}

function adminSaveMember(token, m) {
  var user = requireAuth_(token);
  m = m || {};
  var memberNo = String(m.memberNo || '').trim();
  var name = String(m.name || '').trim();
  if (!memberNo) throw new Error('กรุณากรอกรหัสสมาชิก');
  if (!/^[A-Za-z0-9ก-๙._\/-]{1,30}$/.test(memberNo)) throw new Error('รหัสสมาชิกใช้ได้เฉพาะตัวอักษร ตัวเลข และ . _ - / (ไม่เกิน 30 ตัว)');
  if (!name) throw new Error('กรุณากรอกชื่อ-นามสกุล');

  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    var dup = findMemberByNo_(memberNo);
    if (dup && dup.id !== m.id) throw new Error('รหัสสมาชิก ' + memberNo + ' มีอยู่แล้ว');
    var now = nowIso_();
    var rec = {
      memberNo: memberNo, name: name.substr(0, 150),
      phone: String(m.phone || '').trim().substr(0, 40), groupId: String(m.groupId || ''),
      address: String(m.address || '').trim().substr(0, 500), joinDate: normDate_(m.joinDate),
      savingsGoal: goal_(m.savingsGoal), hajjGoal: goal_(m.hajjGoal), umrahGoal: goal_(m.umrahGoal),
      note: String(m.note || '').trim().substr(0, 500),
      active: m.active === undefined ? 'TRUE' : (isTrue_(m.active) ? 'TRUE' : 'FALSE'), updatedAt: now
    };
    var isNew = !m.id || !getRow_('Members', m.id);
    if (isNew) {
      if (!m.password) throw new Error('กรุณาตั้งรหัสผ่านเริ่มต้นให้สมาชิก');
      rec.id = newId_(); rec.createdAt = now; rec.lastLogin = '';
    } else {
      rec.id = m.id;
    }
    if (m.password) {
      validateMemberPassword_(m.password);
      rec.salt = Utilities.getUuid();
      rec.passwordHash = hashPassword_(String(m.password), rec.salt);
      rec.mustChangePw = m.mustChangePw === undefined ? 'TRUE' : (isTrue_(m.mustChangePw) ? 'TRUE' : 'FALSE');
    }
    var saved = isNew ? insertRow_('Members', fill_('Members', rec)) : updateRow_('Members', rec);
    logAction_(user, (isNew ? 'create' : 'update') + ' member' + (m.password && !isNew ? ' (reset password)' : ''), memberNo + ' ' + name);
    return stripMember_(fill_('Members', saved));
  } finally {
    lock.releaseLock();
  }
}

function goal_(v) {
  if (v === '' || v == null) return '';
  var n = parseAmount_(v);
  return isNaN(n) || n < 0 ? '' : String(n);
}

/** ลบสมาชิก (เฉพาะ admin) — ถ้ามีรายการเงินต้องยืนยันลบรายการด้วย */
function adminDeleteMember(token, id, alsoTransactions) {
  var user = requireAuth_(token, true);
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {

    logAction_(user, 'delete member', m.memberNo + ' ' + m.name + (txs.length ? ' (+' + txs.length + ' รายการเงิน)' : ''));

}

/**
 * นำเข้าสมาชิกหลายคน
 * list = [{ memberNo, name, phone, groupId, joinDate }], defaultPassword = รหัสผ่านเริ่มต้น (สมาชิกต้องเปลี่ยนเมื่อเข้าครั้งแรก)
 */
function adminImportMembers(token, list, defaultPassword) {
  var user = requireAuth_(token);
  validateMemberPassword_(defaultPassword);
  list = Array.isArray(list) ? list.slice(0, 1000) : [];
  var existing = {};
  readTable_('Members').forEach(function (m) { existing[String(m.memberNo).trim().toLowerCase()] = true; });
  var added = [], skipped = [];
  var lock = LockService.getScriptLock();
  lock.waitLock(30000);
  try {
    var now = nowIso_();
    list.forEach(function (r) {
      var no = String(r.memberNo || '').trim(), name = String(r.name || '').trim();
      if (!no || !name || existing[no.toLowerCase()] || !/^[A-Za-z0-9ก-๙._\/-]{1,30}$/.test(no)) { skipped.push(no || name || '(ว่าง)'); return; }
      var salt = Utilities.getUuid();
      var rec = fill_('Members', {
        id: newId_(), memberNo: no, name: name.substr(0, 150), phone: String(r.phone || '').trim().substr(0, 40), groupId: String(r.groupId || ''),
        address: '', joinDate: normDate_(r.joinDate), savingsGoal: '', hajjGoal: '', umrahGoal: '', note: '',
        passwordHash: hashPassword_(String(defaultPassword), salt), salt: salt, mustChangePw: 'TRUE', active: 'TRUE', lastLogin: '', createdAt: now, updatedAt: now
      });
      insertRow_('Members', rec);
      existing[no.toLowerCase()] = true;
      added.push(stripMember_(rec));
    });
  } finally {
    lock.releaseLock();
  }
  logAction_(user, 'import members', added.length + ' คน');
  return { added: added, skipped: skipped };
}

/** เพิ่ม/แก้ไขรายการฝาก-ถอน (เจ้าหน้าที่บันทึก = อนุมัติทันที) */
function adminSaveTransaction(token, t) {
  var user = requireAuth_(token);
  t = t || {};
  var m = getRow_('Members', t.memberId);
  if (!m) throw new Error('ไม่พบสมาชิก');
  if (ACCOUNTS.indexOf(t.account) === -1) throw new Error('กรุณาเลือกบัญชี');
  if (!TX_TYPES[t.type]) throw new Error('กรุณาเลือกประเภท ฝาก/ถอน');
  var amount = parseAmount_(t.amount);
  if (!(amount > 0)) throw new Error('จำนวนเงินต้องมากกว่า 0');
  var date = normDate_(t.date);
  if (!date) throw new Error('กรุณาระบุวันที่');
  var status = TX_STATUS.indexOf(t.status) !== -1 ? t.status : 'approved';

  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    var all = readTable_('Transactions');
    var old = t.id ? all.filter(function (x) { return x.id === t.id; })[0] : null;
    if (t.type === 'withdraw' && status === 'approved') {
      var others = all.filter(function (x) { return x.memberId === m.id && x.id !== t.id; });
      var bal = computeBalances_(others)[t.account].balance;
      if (amount > bal + 0.001) throw new Error('ยอดถอนเกินยอดคงเหลือ (คงเหลือ ' + bal.toLocaleString() + ' บาท)');
    }
    var now = nowIso_();
    var rec = {
      memberId: m.id, date: date, account: t.account, type: t.type, amount: String(amount),
      note: String(t.note || '').trim().substr(0, 300), status: status, updatedAt: now
    };
    var saved;
    if (old) {
      rec.id = old.id;
      saved = updateRow_('Transactions', rec);
    } else {
      rec.id = newId_(); rec.slipFileId = ''; rec.slipUrl = ''; rec.recordedBy = user.username; rec.createdAt = now;
      saved = insertRow_('Transactions', fill_('Transactions', rec));
    }
    logAction_(user, (old ? 'update' : 'create') + ' transaction', m.memberNo + ' ' + TX_TYPES[t.type] + ' ' + amount + ' (' + t.account + ')');
    return fill_('Transactions', saved);
  } finally {
    lock.releaseLock();
  }
}

/** อนุมัติ / ไม่อนุมัติ รายการที่สมาชิกแจ้ง */
function adminSetTransactionStatus(token, id, status) {
  var user = requireAuth_(token);
  if (TX_STATUS.indexOf(status) === -1) throw new Error('สถานะไม่ถูกต้อง');
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    var t = getRow_('Transactions', id);
    if (!t) throw new Error('ไม่พบรายการ');
    if (status === 'approved' && t.type === 'withdraw') {
      var others = readTable_('Transactions').filter(function (x) { return x.memberId === t.memberId && x.id !== t.id; });
      var bal = computeBalances_(others)[t.account].balance;
      if (parseAmount_(t.amount) > bal + 0.001) throw new Error('ยอดถอนเกินยอดคงเหลือ');
    }
    var saved = updateRow_('Transactions', { id: id, status: status, updatedAt: nowIso_() });
    logAction_(user, 'transaction ' + status, id);
    return fill_('Transactions', saved);
  } finally {
    lock.releaseLock();
  }
}

function adminDeleteTransaction(token, id) {
  var user = requireAuth_(token);
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try {
    var t = getRow_('Transactions', id);
    if (!t) return false;
    deleteRow_('Transactions', id);
    logAction_(user, 'delete transaction', t.memberId + ' ' + t.type + ' ' + t.amount);
    return true;
  } finally {
    lock.releaseLock();
  }
}
