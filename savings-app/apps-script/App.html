<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5e4b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --brand: #0f5e4b; --brand-ink: #0a3f33; --brand-soft: #e3efe9; --accent: #c79a2b; --accent-soft: #fbf1d8;
    --bg: #f6f5f0; --surface: #ffffff; --surface-2: #faf9f5; --ink: #1d2a25; --ink-2: #3c4a44; --muted: #66756e; --line: #e3e6e0;
    --ok: #1d7a4f; --warn: #a86b00; --danger: #b3382c; --ok-soft: #e1f3e9; --warn-soft: #fdf0d5; --danger-soft: #fbe7e4;
    --s1: #2a78d6; --s2: #eb6834;
    --radius: 16px; --shadow: 0 6px 22px rgba(20, 40, 32, .07);
    --font: 'Sarabun', 'Noto Sans Thai', Tahoma, sans-serif; --font-head: 'Prompt', 'Sarabun', sans-serif;
    --nav-h: 66px; --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.55; }
  body { min-height: 100vh; }
  [hidden] { display: none !important; }
  h1, h2, h3, h4 { font-family: var(--font-head); font-weight: 600; margin: 0 0 8px; line-height: 1.3; color: var(--ink); }
  h2 { font-size: 21px; } h3 { font-size: 17px; }
  a { color: var(--brand); }
  button, input, select, textarea { font: inherit; color: inherit; }
  .muted { color: var(--muted); } .small { font-size: 14px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .grow { flex: 1; min-width: 0; }

  /* ---------- ปุ่ม / ฟอร์ม ---------- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 999px; padding: 10px 18px; background: var(--brand); color: #fff;
    font-family: var(--font-head); font-size: 15px; cursor: pointer; text-decoration: none; white-space: nowrap; min-height: 42px; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.sm { padding: 6px 13px; font-size: 14px; min-height: 34px; }
  .btn.ghost { background: transparent; color: var(--brand); border: 1.5px solid var(--line); }
  .btn.gold { background: var(--accent); color: #231803; }
  .btn.red { background: var(--danger); }
  .btn.block { width: 100%; }
  .icon-btn { border: 0; background: var(--surface-2); border: 1px solid var(--line); width: 36px; height: 36px; border-radius: 10px; cursor: pointer; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; }
  .fld { display: grid; gap: 5px; margin-bottom: 13px; }
  .fld > span { font-family: var(--font-head); font-size: 14px; color: var(--ink-2); }
  .fld input, .fld select, .fld textarea, .inp { width: 100%; padding: 11px 13px; border: 1.5px solid var(--line); border-radius: 12px; background: #fff; font-size: 16px; }
  .fld textarea { resize: vertical; min-height: 76px; }
  .fld input:focus, .fld select:focus, .fld textarea:focus, .inp:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
  .hint { font-size: 13px; color: var(--muted); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; padding: 4px; gap: 4px; margin-bottom: 14px; }
  .seg button { border: 0; background: none; padding: 9px 6px; border-radius: 10px; font-family: var(--font-head); font-size: 15px; cursor: pointer; color: var(--ink-2); }
  .seg button.on { background: var(--surface); color: var(--brand-ink); box-shadow: 0 1px 4px rgba(0,0,0,.08); font-weight: 600; }
  .seg button.on.dep { color: var(--ok); } .seg button.on.wd { color: var(--danger); }
  .switch { display: flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer; margin-bottom: 12px; }
  .switch input { width: 20px; height: 20px; accent-color: var(--brand); }

  /* ---------- เข้าสู่ระบบ ---------- */
  .login { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
    background: radial-gradient(circle at 90% 0, rgba(243, 207, 116, .3), transparent 42%), linear-gradient(160deg, var(--brand), var(--brand-ink)); }
  .login .card { width: min(420px, 100%); background: #fff; border-radius: 22px; padding: 26px 22px; box-shadow: 0 20px 50px rgba(0,0,0,.25); }
  .login .logo { width: 62px; height: 62px; border-radius: 18px; background: var(--brand-soft); display: grid; place-items: center; font-size: 32px; margin-bottom: 12px; }
  .msg { padding: 10px 13px; border-radius: 12px; font-size: 14.5px; margin-bottom: 12px; }
  .msg.err { background: var(--danger-soft); color: var(--danger); } .msg.ok { background: var(--ok-soft); color: var(--ok); } .msg.info { background: var(--brand-soft); color: var(--brand-ink); }

  /* ---------- โครงแอป ---------- */
  .top { position: sticky; top: 0; z-index: 30; background: rgba(246, 245, 240, .94); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
  .top .in { max-width: 1100px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 12px; min-height: 58px; }
  .top .ttl { flex: 1; min-width: 0; }
  .top .ttl b { font-family: var(--font-head); font-size: 17.5px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .ttl small { color: var(--muted); font-size: 13px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .back { border: 0; background: var(--surface); border: 1px solid var(--line); width: 38px; height: 38px; border-radius: 12px; cursor: pointer; font-size: 18px; flex: none; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px 16px calc(var(--nav-h) + var(--safe-b) + 90px); }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: #fff; border-top: 1px solid var(--line); display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
    height: calc(var(--nav-h) + var(--safe-b)); padding-bottom: var(--safe-b); box-shadow: 0 -4px 16px rgba(0,0,0,.05); }
  .nav button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--muted); font-family: var(--font-head); font-size: 12px; cursor: pointer; position: relative; }
  .nav button .e { font-size: 21px; line-height: 1; filter: grayscale(.6); opacity: .85; }
  .nav button.on { color: var(--brand); } .nav button.on .e { filter: none; opacity: 1; }
  .nav button.on::before { content: ''; position: absolute; top: 0; left: 26%; right: 26%; height: 3px; border-radius: 0 0 4px 4px; background: var(--brand); }
  .nav .bd { position: absolute; top: 7px; left: 56%; background: var(--danger); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 6px; }
  .fab { position: fixed; right: 16px; bottom: calc(var(--nav-h) + var(--safe-b) + 14px); z-index: 41; width: 58px; height: 58px; border-radius: 50%; border: 0; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #e2b64a); color: #231803; font-size: 26px; box-shadow: 0 8px 22px rgba(120, 80, 0, .35); }
  @media (min-width: 900px) {
    .nav { top: 58px; bottom: 0; right: auto; width: 210px; height: auto; grid-auto-flow: row; grid-auto-rows: 58px; align-content: start; border-top: 0; border-right: 1px solid var(--line); padding: 10px 0; box-shadow: none; }
    .nav button { flex-direction: row; justify-content: flex-start; gap: 12px; padding: 0 22px; font-size: 15px; }
    .nav button.on { background: var(--brand-soft); }
    .nav button.on::before { top: 10px; bottom: 10px; left: 0; right: auto; width: 4px; height: auto; border-radius: 0 4px 4px 0; }
    .nav .bd { position: static; }
    main, .top .in { padding-left: 236px; max-width: 1340px; }
    main { padding-bottom: 90px; }
    .fab { bottom: 22px; right: 22px; }
  }

  /* ---------- การ์ด / ตัวเลข ---------- */
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; }
  .card > h3 { display: flex; align-items: center; gap: 8px; }
  .hero { border-radius: 20px; padding: 20px; color: #fff; margin-bottom: 14px; box-shadow: var(--shadow);
    background: radial-gradient(circle at 92% 0, rgba(243, 207, 116, .35), transparent 40%), linear-gradient(130deg, var(--brand-ink), var(--brand)); }
  .hero .k { font-family: var(--font-head); opacity: .88; font-size: 15px; }
  .hero .v { font-family: var(--font-head); font-weight: 700; font-size: clamp(30px, 8vw, 42px); line-height: 1.15; }
  .hero .v small { font-size: 16px; font-weight: 500; opacity: .85; margin-left: 4px; }
  .hero .n { font-size: 14px; opacity: .88; margin-top: 4px; }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
  @media (min-width: 700px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; min-width: 0; }
  .tile .l { font-size: 13.5px; color: var(--muted); font-family: var(--font-head); }
  .tile .n { font-family: var(--font-head); font-weight: 700; font-size: 22px; color: var(--brand-ink); line-height: 1.25; word-break: break-word; }
  .tile .n small { font-size: 13px; color: var(--muted); font-weight: 500; margin-left: 3px; }
  .tile .s { font-size: 12.5px; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 1px 9px; border-radius: 999px; font-size: 12.5px; font-family: var(--font-head); background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
  .pill.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .pill.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .pill.bad { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
  .goal .bar, .pbar { height: 9px; border-radius: 999px; background: var(--brand-soft); overflow: hidden; }
  .goal .bar i, .pbar i { display: block; height: 100%; border-radius: 999px; background: var(--brand); }
  .hero .goal .bar { background: rgba(255,255,255,.2); } .hero .goal .bar i { background: #f3cf74; }
  .goal .gt { display: flex; justify-content: space-between; font-size: 13px; font-family: var(--font-head); margin: 4px 0; }

  /* ---------- รายการ ---------- */
  .list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
  .li { display: grid; grid-template-columns: 42px 1fr auto; gap: 11px; align-items: center; padding: 11px 14px; border-bottom: 1px solid var(--line); }
  .li:last-child { border-bottom: 0; }
  .li.tap { cursor: pointer; } .li.tap:hover { background: var(--surface-2); }
  .li .ic { width: 42px; height: 42px; border-radius: 12px; background: var(--brand-soft); display: grid; place-items: center; font-size: 19px; }
  .li .ic.w { background: var(--danger-soft); }
  .li .t { font-family: var(--font-head); font-weight: 500; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; }
  .li .s { font-size: 13.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
  .li .a { font-family: var(--font-head); font-weight: 700; text-align: right; white-space: nowrap; }
  .li .a.p { color: var(--ok); } .li .a.m { color: var(--danger); }
  .li .a small { display: block; font-weight: 400; font-size: 12px; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 28px 12px; }
  .search { width: 100%; padding: 11px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; font-size: 16px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .filters select, .filters input { padding: 9px 12px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; font-size: 15px; max-width: 100%; }

  /* ---------- กราฟ ---------- */
  .chart { position: relative; height: 190px; margin: 6px 0 4px 36px; }
  .chart .gl { position: absolute; left: 0; right: 0; border-top: 1px solid #eceee9; }
  .chart .gl span { position: absolute; right: 100%; top: -9px; padding-right: 6px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .chart .cols { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 6px; }
  .chart .col { flex: 1; height: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 2px; position: relative; cursor: default; min-width: 0; }
  .chart .col:hover { background: rgba(15, 94, 75, .05); border-radius: 6px 6px 0 0; }
  .chart .bar { flex: 1; max-width: 16px; border-radius: 4px 4px 0 0; min-height: 0; }
  .chart .col .x { position: absolute; top: 100%; margin-top: 4px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
  .chart-x { height: 22px; }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13.5px; color: var(--ink-2); margin-bottom: 4px; }
  .legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .hbars { display: grid; gap: 10px; }
  .hb { display: grid; grid-template-columns: minmax(90px, 32%) 1fr auto; gap: 10px; align-items: center; font-size: 14px; }
  .hb .lb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hb .tr { height: 14px; background: var(--surface-2); border-radius: 0 4px 4px 0; }
  .hb .tr i { display: block; height: 100%; background: var(--brand); border-radius: 0 4px 4px 0; min-width: 2px; }
  .hb .v { font-family: var(--font-head); font-weight: 600; white-space: nowrap; }
  #tip { position: fixed; z-index: 90; pointer-events: none; background: #1d2a25; color: #fff; padding: 7px 10px; border-radius: 9px; font-size: 13px; line-height: 1.45; box-shadow: 0 6px 18px rgba(0,0,0,.25); white-space: pre; transform: translate(-50%, calc(-100% - 12px)); }
  table.tb { width: 100%; border-collapse: collapse; font-size: 14px; }
  .tb th, .tb td { padding: 8px 8px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
  .tb th:first-child, .tb td:first-child { text-align: left; }
  .tb th { font-family: var(--font-head); font-weight: 500; color: var(--muted); font-size: 13px; }
  .tbl-wrap { overflow-x: auto; }
  details.raw summary { cursor: pointer; font-size: 14px; color: var(--brand); margin-top: 6px; }

  /* ---------- แผ่นฟอร์มล่าง (bottom sheet) ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(10, 30, 24, .45); z-index: 60; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .scrim.on { opacity: 1; pointer-events: auto; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; background: #fff; border-radius: 22px 22px 0 0; max-height: 92vh; overflow-y: auto;
    padding: 8px 18px calc(18px + var(--safe-b)); transform: translateY(105%); transition: transform .25s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -10px 40px rgba(0,0,0,.18); }
  .sheet.on { transform: none; }
  @media (min-width: 700px) { .sheet { left: 50%; right: auto; width: 560px; margin-left: -280px; bottom: auto; top: 50%; border-radius: 20px; transform: translateY(-40%) scale(.97); opacity: 0; pointer-events: none; transition: all .2s; }
    .sheet.on { transform: translateY(-50%); opacity: 1; pointer-events: auto; } }
  .sheet .grab { width: 42px; height: 5px; border-radius: 9px; background: #d6dbd7; margin: 2px auto 12px; }
  .sheet .foot { display: flex; gap: 10px; margin-top: 6px; }
  .sheet .foot .btn { flex: 1; }
  .toasts { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--nav-h) + var(--safe-b) + 16px); z-index: 80; display: grid; gap: 8px; width: min(420px, calc(100% - 32px)); }
  .toast { background: #1d2a25; color: #fff; padding: 11px 15px; border-radius: 12px; font-size: 14.5px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }
  .toast.ok { background: var(--ok); } .toast.err { background: var(--danger); }
  .spin { display: inline-block; width: 18px; height: 18px; border: 2.5px solid rgba(15, 94, 75, .2); border-top-color: var(--brand); border-radius: 50%; animation: sp .8s linear infinite; vertical-align: -3px; }
  .btn .spin { border-color: rgba(255,255,255,.35); border-top-color: #fff; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .loading { min-height: 70vh; display: grid; place-items: center; color: var(--muted); text-align: center; }
  .busy { position: fixed; top: 0; left: 0; height: 3px; width: 100%; z-index: 99; background: linear-gradient(90deg, transparent, var(--accent), transparent); background-size: 50% 100%; background-repeat: no-repeat; animation: bz 1s linear infinite; }
  @keyframes bz { from { background-position: -50% 0; } to { background-position: 150% 0; } }

  /* ---------- แชต ---------- */
  .chat { display: flex; flex-direction: column; gap: 10px; }
  .bubble { max-width: 86%; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; word-break: break-word; font-size: 15.5px; line-height: 1.6; }
  .bubble.u { align-self: flex-end; background: var(--brand); color: #fff; border-bottom-right-radius: 6px; }
  .bubble.b { align-self: flex-start; background: #fff; border: 1px solid var(--line); border-bottom-left-radius: 6px; }
  .bubble .src { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1.5px solid var(--line); background: #fff; border-radius: 999px; padding: 7px 13px; font-size: 14px; cursor: pointer; font-family: var(--font-head); color: var(--brand-ink); }
  .chip:hover { border-color: var(--brand); }
  .composer { position: sticky; bottom: calc(var(--nav-h) + var(--safe-b) + 8px); display: flex; gap: 8px; background: var(--bg); padding: 8px 0; }
  .composer textarea { flex: 1; resize: none; min-height: 48px; max-height: 140px; padding: 12px 14px; border-radius: 16px; border: 1.5px solid var(--line); font-size: 16px; background: #fff; }
  @media (min-width: 900px) { .composer { bottom: 8px; } }
</style>
</head>
<body>
<div id="root"><div class="loading"><div><span class="spin" style="width:34px;height:34px;border-width:4px"></span><p>กำลังโหลด...</p></div></div></div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toasts" id="toasts"></div>
<div id="tip" hidden></div>

<script>
var CFG = <?!= cfg ?>;
(function () {
  'use strict';
  const root = document.getElementById('root');
  const hasGas = typeof google !== 'undefined' && google.script && google.script.run;
  let TOKEN = null, D = null, VIEW = '', ARG = null, HIST = [];
  try { TOKEN = sessionStorage.getItem('ss_token'); } catch (e) { }
  if (CFG.themeColor) document.documentElement.style.setProperty('--brand', CFG.themeColor);

  /* ================= helpers ================= */
  const $ = (s, c) => (c || document).querySelector(s);
  const $$ = (s, c) => Array.prototype.slice.call((c || document).querySelectorAll(s));
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = v => { const n = Number(String(v == null ? '' : v).replace(/[^0-9.\-]/g, '')); return isNaN(n) ? 0 : n; };
  const money = v => num(v).toLocaleString('th-TH', { maximumFractionDigits: 2 });
  const short = v => { v = num(v); const a = Math.abs(v); return a >= 1e6 ? (v / 1e6).toLocaleString('th-TH', { maximumFractionDigits: 1 }) + ' ล.' : a >= 1e4 ? (v / 1e3).toLocaleString('th-TH', { maximumFractionDigits: 0 }) + 'K' : money(v); };
  const TM = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  const thDate = s => { if (!s) return '-'; const d = /^\d{4}-\d{2}-\d{2}$/.test(s) ? new Date(s + 'T00:00:00') : new Date(s); return isNaN(d) ? esc(s) : d.getDate() + ' ' + TM[d.getMonth()] + ' ' + (d.getFullYear() + 543); };
  const ymLabel = ym => TM[Number(ym.substr(5, 2)) - 1] + ' ' + String(Number(ym.substr(0, 4)) + 543).substr(2);
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); };
  const truthy = v => v === true || String(v).toUpperCase() === 'TRUE';
  function toast(msg, type) { const el = document.createElement('div'); el.className = 'toast ' + (type || ''); el.textContent = msg; $('#toasts').appendChild(el); setTimeout(() => el.remove(), 3800); }
  function busy(on) { let b = $('#busyBar'); if (on && !b) { b = document.createElement('div'); b.id = 'busyBar'; b.className = 'busy'; document.body.appendChild(b); } else if (!on && b) b.remove(); }

  function call(fn, ...args) {
    return new Promise((resolve, reject) => {
      if (!hasGas) { reject(new Error('ต้องเปิดผ่านเว็บแอป Google Apps Script')); return; }
      const r = google.script.run.withSuccessHandler(resolve).withFailureHandler(err => {
        let msg = (err && err.message) || String(err);
        if (/AUTH:/.test(msg)) { msg = msg.replace(/.*AUTH:\s*/, ''); logout(msg); }
        reject(new Error(msg));

  /** จำลองแผนปลดหนี้รายเดือน (ดอกเบี้ยลดต้นลดดอก) */
  function simulate(debts, extra, method) {
    let ds = debts.map(d => ({ id: d.id, name: d.creditor, bal: d.outstanding, rate: num(d.rate), min: num(d.monthlyPayment), done: 0 }));
    const budget = ds.reduce((s, d) => s + d.min, 0) + num(extra);
    if (!ds.length) return null;
    if (budget <= 0) return { error: 'ใส่ยอดผ่อนต่อเดือนในรายการหนี้ หรือใส่เงินโปะเพิ่ม เพื่อคำนวณแผน' };
    let month = 0, interest = 0;
    while (ds.some(d => d.bal > 0.005) && month < 600) {
      month++;
      ds.forEach(d => { if (d.bal > 0) { const i = d.bal * d.rate / 1200; d.bal += i; interest += i; } });
      let left = budget;
      ds.forEach(d => { if (d.bal > 0) { const p = Math.min(d.bal, d.min, left); d.bal -= p; left -= p; } });
      const order = ds.filter(d => d.bal > 0.005).sort((a, b) => method === 'snowball' ? a.bal - b.bal : b.rate - a.rate || a.bal - b.bal);
      for (const d of order) { if (left <= 0) break; const p = Math.min(d.bal, left); d.bal -= p; left -= p; }
      ds.forEach(d => { if (d.bal <= 0.005 && !d.done) { d.bal = 0; d.done = month; } });
      if (month === 1 && ds.every(d => d.bal > 0) && left <= 0 && ds.reduce((s, d) => s + d.bal, 0) >= debts.reduce((s, d) => s + d.outstanding, 0)) return { error: 'ยอดผ่อนรวม ' + money(budget) + ' บาท/เดือน ไม่พอจ่ายดอกเบี้ย หนี้จะไม่ลดลง — ควรเพิ่มยอดผ่อนหรือเจรจาลดดอกเบี้ยกับเจ้าหนี้' };
    }
    if (month >= 600) return { error: 'ตามยอดผ่อนนี้ใช้เวลาเกิน 50 ปี — ควรเพิ่มยอดผ่อนหรือเจรจาปรับโครงสร้างหนี้' };
    return { months: month, interest: interest, budget: budget, order: ds.slice().sort((a, b) => a.done - b.done) };
  }

  function bubble(h) {
    const src = h.source === 'ai' ? '🤖 ตอบโดย AI' : h.source === 'faq' ? '📚 จากคลังคำตอบ' : h.source === 'help' ? 'ℹ️ ระบบ' : '';

  BIND.chat = function () {
    const box = $('#chatBox'), inp = $('#chatIn');
    const scroll = () => { const last = box.lastElementChild; if (last) last.scrollIntoView({ block: 'end', behavior: 'smooth' }); };
    const send = q => {
      q = String(q || '').trim(); if (!q) return;
      HIST.push({ role: 'user', content: q }); chatlogFresh = false;
      box.insertAdjacentHTML('beforeend', bubble(HIST[HIST.length - 1]) + '<div class="bubble b" id="typing"><span class="spin"></span> กำลังพิมพ์...</div>');
      inp.value = ''; $('#chatGo').disabled = true; scroll();
      api('chatAsk', HIST.slice(-12).map(h => ({ role: h.role, content: h.content }))).then(r => {
        HIST.push({ role: 'assistant', content: r.answer, source: r.source });
      }).catch(e => { HIST.push({ role: 'assistant', content: 'ขออภัยค่ะ ระบบขัดข้อง: ' + e.message, source: 'help' }); }).then(() => {
        try { sessionStorage.setItem('ss_chat', JSON.stringify(HIST.slice(-40))); } catch (e) { }
        const t = $('#typing'); if (t) t.remove();
        if (VIEW !== 'chat') return;
        box.insertAdjacentHTML('beforeend', bubble(HIST[HIST.length - 1])); $('#chatGo').disabled = false; scroll();
      });
    };
    $('#chatF').addEventListener('submit', e => { e.preventDefault(); send(inp.value); });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && window.innerWidth > 700) { e.preventDefault(); send(inp.value); } });
    $('#chips').onclick = e => { const c = e.target.closest('.chip'); if (c) send(c.textContent); };
    const clr = $('#chatClr'); if (clr) clr.onclick = () => { HIST = []; try { sessionStorage.removeItem('ss_chat'); } catch (e) { } render(); };
    if (HIST.length) scroll();
  };

    const r = id ? Object.assign({}, groupOf(id)) : { active: 'TRUE', icon: '🧺' };
    const sh = openSheet(id ? 'แก้ไขกลุ่มอาชีพ' : 'เพิ่มกลุ่มอาชีพ',
      '<div class="grid2" style="grid-template-columns:90px 1fr"><label class="fld"><span>ไอคอน</span><input name="icon" value="' + esc(r.icon || '') + '" maxlength="4"></label><label class="fld"><span>ชื่อกลุ่ม *</span><input name="name" value="' + esc(r.name || '') + '" placeholder="เช่น กลุ่มอาชีพเชือกกล้วย"></label></div>' +
      '<label class="fld"><span>ที่ตั้ง</span><input name="location" value="' + esc(r.location || '') + '"></label>' +
      '<div class="grid2"><label class="fld"><span>เงินออม/สัจจะต่อเดือน (บาท/คน)</span><input name="monthlyShare" type="number" inputmode="decimal" value="' + esc(r.monthlyShare || '') + '"></label><label class="fld"><span>เป้าหมายเงินออมของกลุ่ม</span><input name="savingsGoal" type="number" inputmode="decimal" value="' + esc(r.savingsGoal || '') + '"></label></div>' +
      '<label class="fld"><span>รายละเอียด</span><textarea name="description" rows="3">' + esc(r.description || '') + '</textarea></label>' +
      '<label class="switch"><input type="checkbox" name="active"' + (truthy(r.active) || r.active === '' ? ' checked' : '') + '> เปิดใช้งาน</label>',
      (id ? '<button class="btn ghost" id="gDel" style="flex:0 0 auto">🗑</button>' : '<button class="btn ghost" data-close>ยกเลิก</button>') + '<button class="btn" id="gOk">💾 บันทึก</button>');
    $('#gOk').onclick = function () {
      const d = formData(sh, ['icon', 'name', 'location', 'monthlyShare', 'savingsGoal', 'description', 'active']); if (!d.name) return toast('กรุณากรอกชื่อกลุ่ม', 'err'); if (id) d.id = id;
      saveBtn(this, mutate('saveRecord', 'Groups', d), () => toast('บันทึกกลุ่มแล้ว', 'ok'));
    };
    if (id) $('#gDel').onclick = () => confirmBox('ลบกลุ่ม “' + esc(r.name) + '”? (ลบได้เฉพาะกลุ่มที่ไม่มีสมาชิกและรายการ)').then(ok => ok && mutate('deleteRecord', 'Groups', id).then(() => { toast('ลบแล้ว', 'ok'); render(); }));
  }

  VIEWS.users = function () {
    return '<p><button class="btn" id="uAdd">＋ เพิ่มผู้ใช้</button></p><div class="list">' + (D.users || []).map(u => '<div class="li tap" data-u="' + esc(u.id) + '"><div class="ic">' + (u.role === 'admin' ? '🛡️' : '🧑‍💼') + '</div><div style="min-width:0"><div class="t">' + esc(u.name) + (truthy(u.active) ? '' : ' <span class="pill bad">ระงับ</span>') + '</div><div class="s">' + esc(u.username) + ' · ' + (u.role === 'admin' ? 'ผู้ดูแลทุกกลุ่ม' : 'เจ้าหน้าที่ ' + esc(groupName(u.groupId))) + (u.lastLogin ? ' · เข้าล่าสุด ' + thDate(u.lastLogin) : '') + '</div></div><div class="a">›</div></div>').join('') + '</div>' +
      '<p class="small muted">เจ้าหน้าที่ประจำกลุ่ม (เช่น ประธาน/เหรัญญิก) บันทึกฝาก-ถอน รายรับ-รายจ่าย สมาชิก และคลินิกหนี้ได้เฉพาะกลุ่มของตน แต่ดูแดชบอร์ดภาพรวมได้ทุกกลุ่ม</p>';
  };
  BIND.users = function (v) {
    const form = id => {
      const r = id ? Object.assign({}, D.users.find(u => u.id === id)) : { role: 'officer', active: 'TRUE', groupId: (D.groups[0] || {}).id };
      const sh = openSheet(id ? 'แก้ไขผู้ใช้' : 'เพิ่มผู้ใช้',
        '<div class="grid2"><label class="fld"><span>ชื่อผู้ใช้ *</span><input name="username" value="' + esc(r.username || '') + '" autocapitalize="off"></label><label class="fld"><span>ชื่อ-นามสกุล *</span><input name="name" value="' + esc(r.name || '') + '"></label></div>' +
        '<label class="fld"><span>สิทธิ์</span><select name="role">' + opt([['officer', 'เจ้าหน้าที่ประจำกลุ่ม'], ['admin', 'ผู้ดูแลระบบ (ทุกกลุ่ม)']], r.role) + '</select></label>' +
        '<label class="fld" id="ugf"><span>กลุ่มอาชีพ</span><select name="groupId">' + opt(D.groups.map(g => [g.id, g.name]), r.groupId) + '</select></label>' +
        '<label class="fld"><span>' + (id ? 'รหัสผ่านใหม่ (เว้นว่าง = ไม่เปลี่ยน)' : 'รหัสผ่านเริ่มต้น * (อย่างน้อย 8 ตัว)') + '</span><input name="password" autocomplete="new-password"></label>' +
        '<label class="switch"><input type="checkbox" name="active"' + (truthy(r.active) ? ' checked' : '') + '> เปิดใช้งาน</label>',
        (id ? '<button class="btn ghost" id="uDel" style="flex:0 0 auto">🗑</button>' : '<button class="btn ghost" data-close>ยกเลิก</button>') + '<button class="btn" id="uOk">💾 บันทึก</button>');
      const syncRole = () => { $('#ugf').hidden = formVal(sh, 'role') === 'admin'; };
      sh.querySelector('[name=role]').onchange = syncRole; syncRole();
      $('#uOk').onclick = function () { const d = formData(sh, ['username', 'name', 'role', 'groupId', 'password', 'active']); if (id) d.id = id; saveBtn(this, mutate('saveRecord', 'Users', d), () => toast('บันทึกผู้ใช้แล้ว', 'ok')); };
      if (id) $('#uDel').onclick = () => confirmBox('ลบผู้ใช้ “' + esc(r.username) + '”?').then(ok => ok && mutate('deleteRecord', 'Users', id).then(() => { toast('ลบแล้ว', 'ok'); render(); }));
    };
    $('#uAdd').onclick = () => form(null);
    v.addEventListener('click', e => { const a = e.target.closest('[data-u]'); if (a) form(a.getAttribute('data-u')); });
  };

  VIEWS.faq = function () {
    return '<p class="small muted">แชตบอตใช้คำตอบเหล่านี้เมื่อไม่ได้ตั้งค่า AI หรือ AI ใช้ไม่ได้ ระบบจับคู่จาก “คำสำคัญ” ที่อยู่ในคำถาม</p><p><button class="btn" id="fAdd">＋ เพิ่มคำถาม-คำตอบ</button></p><div class="list">' +
      D.faq.map(f => '<div class="li tap" data-f="' + esc(f.id) + '" style="grid-template-columns:1fr auto"><div style="min-width:0"><div class="t">' + esc(f.question) + (truthy(f.active) || f.active === '' ? '' : ' <span class="pill">ปิด</span>') + '</div><div class="s">คำสำคัญ: ' + esc(f.keywords || '-') + '</div></div><div class="a">›</div></div>').join('') + '</div>';
  };
  BIND.faq = function (v) {
    const form = id => {
      const r = id ? Object.assign({}, D.faq.find(f => f.id === id)) : { active: 'TRUE' };
      const sh = openSheet(id ? 'แก้ไขคำถาม-คำตอบ' : 'เพิ่มคำถาม-คำตอบ', '<label class="fld"><span>คำถาม *</span><input name="question" value="' + esc(r.question || '') + '"></label>' +
        '<label class="fld"><span>คำสำคัญ (คั่นด้วยจุลภาค)</span><input name="keywords" value="' + esc(r.keywords || '') + '" placeholder="เช่น ออมเงิน,เก็บเงิน,ออมยังไง"></label>' +
        '<label class="fld"><span>คำตอบ *</span><textarea name="answer" rows="7">' + esc(r.answer || '') + '</textarea></label><label class="switch"><input type="checkbox" name="active"' + (truthy(r.active) || r.active === '' ? ' checked' : '') + '> ใช้งาน</label>',
        (id ? '<button class="btn ghost" id="fDel" style="flex:0 0 auto">🗑</button>' : '<button class="btn ghost" data-close>ยกเลิก</button>') + '<button class="btn" id="fOk">💾 บันทึก</button>');
      $('#fOk').onclick = function () { const d = formData(sh, ['question', 'keywords', 'answer', 'active']); if (id) d.id = id; saveBtn(this, mutate('saveRecord', 'FAQ', d), () => toast('บันทึกแล้ว', 'ok')); };
      if (id) $('#fDel').onclick = () => confirmBox('ลบคำถามนี้?').then(ok => ok && mutate('deleteRecord', 'FAQ', id).then(() => { toast('ลบแล้ว', 'ok'); render(); }));
    };
    $('#fAdd').onclick = () => form(null);
    v.addEventListener('click', e => { const a = e.target.closest('[data-f]'); if (a) form(a.getAttribute('data-f')); });
  };

  let chatlogFresh = true;
  BIND.chatlog = function () {
    if (chatlogFresh) return;
    chatlogFresh = true;
    api('getAll').then(d => { D = d; if (VIEW === 'chatlog') render(); }).catch(() => { });
  };
  VIEWS.chatlog = function () {
    const L = D.chatLog || [];
    return '<p class="small muted">คำถามล่าสุด 200 รายการ (เก็บไม่เกิน 300 ตัวอักษร) ใช้ดูว่าสมาชิกต้องการความรู้เรื่องใด แล้วเพิ่มในคลังคำตอบหรือจัดอบรม</p>' +
      (L.length ? '<div class="list">' + L.map(c => '<div class="li" style="grid-template-columns:1fr auto"><div style="min-width:0"><div class="t" style="font-weight:400">' + esc(c.question) + '</div><div class="s">' + thDate(c.time) + ' · ' + esc(c.role === 'member' ? 'สมาชิก' : 'เจ้าหน้าที่') + '</div></div><span class="pill">' + (c.source === 'ai' ? 'AI' : c.source === 'faq' ? 'คลังคำตอบ' : 'ไม่พบคำตอบ') + '</span></div>').join('') + '</div>' : '<div class="card empty">ยังไม่มีคำถาม</div>');
  };

  VIEWS.settings = function () {
    const s = D.settings || {};
    return '<form class="card" id="sf"><h3>⚙️ ข้อมูลแอป</h3>' +
      '<label class="fld"><span>ชื่อแอป</span><input name="appName" value="' + esc(s.appName || '') + '"></label><label class="fld"><span>หน่วยงาน / โครงการ</span><input name="org" value="' + esc(s.org || '') + '"></label>' +
      '<label class="fld"><span>เบอร์ติดต่อเจ้าหน้าที่</span><input name="phone" value="' + esc(s.phone || '') + '"></label>' +
      '<h3 style="margin-top:18px">🤖 แชตบอต</h3><label class="fld"><span>ชื่อแชตบอต</span><input name="botName" value="' + esc(s.botName || '') + '"></label>' +
      '<label class="switch"><input type="checkbox" name="aiEnabled"' + (s.aiEnabled !== 'FALSE' ? ' checked' : '') + '> ใช้ AI ตอบ (ถ้าไม่มีคีย์ หรือปิด จะตอบจากคลังคำตอบ)</label>' +
      '<div class="msg ' + (D.aiKeySet ? 'ok' : 'info') + '">' + (D.aiKeySet ? '✓ ตั้งคีย์ OpenAI แล้ว (เก็บใน Script Properties ไม่แสดงที่หน้าเว็บ)' : 'ยังไม่ได้ตั้งคีย์ OpenAI — แชตบอตจะตอบจากคลังคำตอบ') + '</div>' +
      '<label class="fld"><span>' + (D.aiKeySet ? 'เปลี่ยนคีย์ OpenAI (เว้นว่าง = ไม่เปลี่ยน, พิมพ์ - เพื่อลบ)' : 'คีย์ OpenAI API') + '</span><input name="openaiKey" type="password" autocomplete="off" placeholder="sk-..."><span class="hint">สร้างที่ platform.openai.com › API keys · มีค่าใช้จ่ายตามการใช้งาน ตั้งวงเงินที่บัญชี OpenAI ด้วย</span></label>' +
      '<div class="grid2"><label class="fld"><span>รุ่น AI</span><input name="aiModel" value="' + esc(s.aiModel || 'gpt-4o-mini') + '"></label><label class="fld"><span>จำนวนคำถาม AI ต่อคนต่อวัน</span><input name="chatDailyLimit" type="number" value="' + esc(s.chatDailyLimit || '30') + '"></label></div>' +
      '<label class="fld"><span>ข้อมูลเพิ่มเติมให้แชตบอตรู้ (เช่น วันฝากเงินของกลุ่ม ระเบียบกลุ่ม)</span><textarea name="botExtra" rows="4">' + esc(s.botExtra || '') + '</textarea></label>' +
      '<div class="row"><button class="btn" type="submit">💾 บันทึก</button>' + (D.aiKeySet ? '<button class="btn ghost" type="button" id="aiTest">ทดสอบ AI</button>' : '') + '</div></form>';
  };
  BIND.settings = function () {
    $('#sf').addEventListener('submit', e => { e.preventDefault(); const f = e.target, b = f.querySelector('button[type=submit]');
      const d = formData(f, ['appName', 'org', 'phone', 'botName', 'aiEnabled', 'openaiKey', 'aiModel', 'chatDailyLimit', 'botExtra']);
      saveBtn(b, mutate('saveSettings', d), () => toast('บันทึกการตั้งค่าแล้ว', 'ok')); });
    const t = $('#aiTest'); if (t) t.onclick = function () { const b = this; b.disabled = true; b.innerHTML = '<span class="spin"></span>'; api('chatTestAI').then(r => toast(r, 'ok')).catch(e => toast(e.message, 'err')).then(() => { b.disabled = false; b.textContent = 'ทดสอบ AI'; }); };
  };

  /* ================= start ================= */
  if (TOKEN) boot(); else showLogin('');
})();
</script>
</body>
</html>
