function ensureSheet_(ss, name) {
  var headers = SCHEMA[name];
  var sh = ss.getSheetByName(name) || ss.insertSheet(name);
  var lastCol = sh.getLastColumn();
  if (sh.getLastRow() === 0 || lastCol === 0) {
    sh.getRange(1, 1, 1, headers.length).setValues([headers]);
  } else {
    var existing = sh.getRange(1, 1, 1, lastCol).getValues()[0];
    var missing = headers.filter(function (h) { return existing.indexOf(h) === -1; });
    if (missing.length) sh.getRange(1, lastCol + 1, 1, missing.length).setValues([missing]);
  }
  var width = Math.max(headers.length, sh.getLastColumn());
  sh.setFrozenRows(1);
  sh.getRange(1, 1, 1, width).setFontWeight('bold').setBackground('#e3efe9');
  sh.getRange(1, 1, sh.getMaxRows(), width).setNumberFormat('@');
  return sh;
}

var _ss = null;
function db_() {

  if (!id) throw new Error('ยังไม่ได้ติดตั้งระบบ (รัน setup ก่อน)');

function sheet_(name) {
  if (!SCHEMA[name]) throw new Error('ไม่รู้จักตาราง: ' + name);
  return db_().getSheetByName(name) || ensureSheet_(db_(), name);

function headers_(sh) {

  return c ? sh.getRange(1, 1, 1, c).getValues()[0].map(String) : [];

var _tableCache = {};
function readTable_(name) {

  var values = sheet_(name).getDataRange().getValues();
  var out = [];
  if (values.length >= 2) {
    var head = values[0].map(String);
    for (var r = 1; r < values.length; r++) {
      if (values[r].join('') === '') continue;
      var o = {};
      for (var c = 0; c < head.length; c++) {
        if (!head[c]) continue;
        var v = values[r][c];
        if (v instanceof Date) v = v.toISOString();
        o[head[c]] = v === null || v === undefined ? '' : String(v);
      }
      out.push(o);
    }
  }
  _tableCache[name] = out;
  return readTable_(name);
}

function rowIndex_(sh, id) {
  var last = sh.getLastRow();
  if (last < 2) return -1;
  var ids = sh.getRange(2, 1, last - 1, 1).getValues();
  for (var i = 0; i < ids.length; i++) if (String(ids[i][0]) === String(id)) return i + 2;
  return -1;
}

function toRow_(head, obj) {
  return head.map(function (h) {
    var v = obj[h];
    if (v === undefined || v === null) return '';
    if (typeof v === 'boolean') return v ? 'TRUE' : 'FALSE';
    if (typeof v === 'object') return JSON.stringify(v);
    return String(v);
  });
}

function insertRow_(name, obj) {
  var sh = sheet_(name), head = headers_(sh), target = sh.getLastRow() + 1;
  if (target > sh.getMaxRows()) sh.insertRowsAfter(sh.getMaxRows(), 500);
  sh.getRange(target, 1, 1, head.length).setNumberFormat('@').setValues([toRow_(head, obj)]);
  delete _tableCache[name];
  return fill_(name, obj);
}

/** เพิ่มหลายแถวในครั้งเดียว (เร็วกว่าเพิ่มทีละแถวมาก) */
function appendRows_(name, objs) {
  if (!objs || !objs.length) return;
  var sh = sheet_(name), head = headers_(sh), start = sh.getLastRow() + 1;
  var need = start + objs.length - 1 - sh.getMaxRows();
  if (need > 0) sh.insertRowsAfter(sh.getMaxRows(), need + 200);
  sh.getRange(start, 1, objs.length, head.length).setNumberFormat('@').setValues(objs.map(function (o) { return toRow_(head, o); }));
  delete _tableCache[name];
}

function updateRow_(name, obj) {
  var sh = sheet_(name), head = headers_(sh), idx = rowIndex_(sh, obj[head[0]]);
  if (idx === -1) return insertRow_(name, obj);
  var cur = sh.getRange(idx, 1, 1, head.length).getValues()[0], merged = {};
  head.forEach(function (h, i) { merged[h] = cur[i]; });
  Object.keys(obj).forEach(function (k) { if (head.indexOf(k) !== -1) merged[k] = obj[k]; });
  sh.getRange(idx, 1, 1, head.length).setNumberFormat('@').setValues([toRow_(head, merged)]);
  delete _tableCache[name];
  var out = {};
  head.forEach(function (h) { out[h] = merged[h] === undefined || merged[h] === null ? '' : String(merged[h]); });
  return fill_(name, out);
}

function deleteRow_(name, id) {
  var sh = sheet_(name), idx = rowIndex_(sh, id);
  if (idx === -1) return false;
  sh.deleteRow(idx);
  delete _tableCache[name];
  return true;
}

function getRow_(name, id) {
  var rows = readTable_(name), k = SCHEMA[name][0];
  for (var i = 0; i < rows.length; i++) if (String(rows[i][k]) === String(id)) return rows[i];
  return null;
}

function fill_(name, obj) {
  var o = {};
  SCHEMA[name].forEach(function (f) { o[f] = obj[f] === undefined || obj[f] === null ? '' : String(obj[f]); });
  return o;
}

function getSettings_() {

}

/** เข้าสู่ระบบเจ้าหน้าที่ */
function staffLogin(username, password) {
  username = String(username || '').trim().toLowerCase();
  password = String(password || '');
  if (!username || !password) throw new Error('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');
  var key = 'u_' + username.replace(/[^a-z0-9._-]/g, '');
  checkLockout_(key);
  var u = readTable_('Users').filter(function (x) { return String(x.username).toLowerCase() === username; })[0];
  if (!u || hashPassword_(password, u.salt) !== u.passwordHash) { recordFail_(key); throw new Error('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง'); }
  if (!isTrue_(u.active)) throw new Error('บัญชีนี้ถูกระงับการใช้งาน');
  CacheService.getScriptCache().remove('fail_' + key);
  updateRow_('Users', { id: u.id, lastLogin: nowIso_() });
  var sess = { kind: 'staff', id: u.id, role: u.role === 'admin' ? 'admin' : 'officer', groupId: u.role === 'admin' ? '' : u.groupId, name: u.name, username: u.username };
  return { token: newSession_(sess), user: sess };
}

/** เข้าสู่ระบบสมาชิก (รหัสสมาชิก + PIN) */
function memberLogin(memberNo, pin) {

  checkLockout_(key);

  if (!m || !m.pinHash || hashPassword_(pin, m.salt) !== m.pinHash) { recordFail_(key); throw new Error('รหัสสมาชิกหรือ PIN ไม่ถูกต้อง'); }
  if (!isTrue_(m.active)) throw new Error('บัญชีนี้ถูกระงับ กรุณาติดต่อเจ้าหน้าที่กลุ่ม');

function logout(token) {

/** ตรวจ token → ข้อมูลผู้ใช้ (โยน error ถ้าไม่ผ่าน) */
function requireSession_(token, roles) {
  if (!token || !/^[a-zA-Z0-9-]{20,100}$/.test(String(token))) throw new Error('AUTH: กรุณาเข้าสู่ระบบ');
  var cache = CacheService.getScriptCache();
  var raw = cache.get('s_' + token);
  if (!raw) throw new Error('AUTH: หมดเวลาการใช้งาน กรุณาเข้าสู่ระบบใหม่');
  var s = JSON.parse(raw);
  var rec = s.kind === 'member' ? getRow_('Members', s.id) : getRow_('Users', s.id);
  if (!rec || !isTrue_(rec.active)) { cache.remove('s_' + token); throw new Error('AUTH: บัญชีนี้ถูกระงับการใช้งาน'); }
  if (s.kind === 'member') s.groupId = rec.groupId;
  else if (s.role === 'officer') s.groupId = rec.groupId;
  cache.put('s_' + token, JSON.stringify(s), SESSION_TTL);
  if (roles && roles.indexOf(s.role) === -1) throw new Error('ไม่มีสิทธิ์ทำรายการนี้');

    st.savings += w ? -a : a;
    st[accountOf_(t) === 'hajj' ? 'hajj' : 'monthly'] += w ? -a : a;
    if (String(t.date).substr(0, 7) === ym) { if (w) st.wdMonth += a; else st.depMonth += a; }
    put(gid, w ? 'wd' : 'dep', t.date, a);
  });
  ledger.forEach(function (t) {
    var st = stat[t.groupId], a = num_(t.amount) || 0, e = t.type === 'expense';
    if (!st) return;
    if (e) st.expense += a; else st.income += a;
    put(t.groupId, e ? 'exp' : 'inc', t.date, a);
  });
  var debtors = {};
  debts.forEach(function (d) {
    var gid = memberGroup[d.memberId], st = stat[gid];
    if (!st || d.status === 'closed') return;
    var o = (ds[d.id] || {}).outstanding || 0;
    if (!o) return;
    st.debt += o;
    if (!debtors[d.memberId]) { debtors[d.memberId] = 1; st.debtors++; }
  });
  readTable_('Counsel').forEach(function (c) { var st = stat[memberGroup[c.memberId]]; if (st) st.counsel++; });
  var r2 = function (n) { return Math.round(n * 100) / 100; };
  var list = groups.map(function (g) {
    var s = stat[g.id];
    s.fund = r2(s.income - s.expense);
    ['savings', 'monthly', 'hajj', 'depMonth', 'wdMonth', 'income', 'expense', 'debt'].forEach(function (k) { s[k] = r2(s[k]); });
    return s;
  });
  var tot = { groups: list.length, members: 0, savings: 0, monthly: 0, hajj: 0, depMonth: 0, wdMonth: 0, fund: 0, income: 0, expense: 0, debt: 0, debtors: 0 };
  list.forEach(function (s) { Object.keys(tot).forEach(function (k) { if (k !== 'groups') tot[k] = r2(tot[k] + s[k]); }); });
  return { months: months, groups: list, totals: tot, trend: all, trendByGroup: byGroup };
}

/* ------------------------------------------------------------
 *  โหลดข้อมูลทั้งหมดตามสิทธิ์
 * ------------------------------------------------------------ */
function getAll(token) {
  var s = requireSession_(token);
  var out = { user: s, config: publicConfig_(), cats: LEDGER_CATS, debtKinds: DEBT_KINDS, accounts: accountLabels_(), today: todayIso_() };
  var groups = readTable_('Groups').sort(byOrder_);
  var members = readTable_('Members');
  var inGroup = function (gid) { return s.role === 'admin' || gid === s.groupId; };
  var memberIds = {};
  members.forEach(function (m) { if (s.role === 'member' ? m.id === s.id : inGroup(m.groupId)) memberIds[m.id] = true; });
  var mine = function (r) { return !!memberIds[r.memberId]; };

  out.groups = s.role === 'member' ? groups.filter(function (g) { return g.id === s.groupId; }) : groups;
  out.members = members.filter(function (m) { return memberIds[m.id]; }).map(stripMember_);
  out.savings = readTable_('Savings').filter(mine);
  out.debts = readTable_('Debts').filter(mine);
  out.payments = readTable_('DebtPayments').filter(mine);
  out.counsel = readTable_('Counsel').filter(mine);
  out.ledger = s.role === 'member' ? [] : readTable_('Ledger').filter(function (t) { return inGroup(t.groupId); });
  out.faq = readTable_('FAQ').sort(byOrder_);
  out.dashboard = dashboard_(s.role === 'admin' ? null : (s.role === 'officer' && !s.groupId ? [] : (s.role === 'member' ? [s.groupId] : null)));
  if (s.role === 'admin') {
    out.users = readTable_('Users').map(stripUser_);
    var st = getSettings_();
    out.settings = st;
    out.aiKeySet = !!PropertiesService.getScriptProperties().getProperty('OPENAI_API_KEY');
    out.chatLog = readTable_('ChatLog').slice(-200).reverse();
    try { out.dbUrl = db_().getUrl(); } catch (err) { out.dbUrl = ''; }
  }
  return out;
}

/* ------------------------------------------------------------
 *  บันทึก / ลบ (ตัวกลาง)
 * ------------------------------------------------------------ */
function saveRecord(token, table, rec) {
  var s = requireSession_(token);
  rec = rec || {};
  var fn = SAVE_[table];
  if (!fn) throw new Error('ไม่อนุญาตให้บันทึกตาราง ' + table);
  withLock_(function () { fn(s, rec); });
  return getAll(token);
}

function deleteRecord(token, table, id) {
  var s = requireSession_(token);
  var fn = DELETE_[table];
  if (!fn) throw new Error('ไม่อนุญาตให้ลบจากตาราง ' + table);
  withLock_(function () {
    var row = getRow_(table, id);
    if (!row) return;
    fn(s, row);
    deleteRow_(table, id);
  });
  return getAll(token);
}

var DELETE_ = {
  Groups: function (s, row) {
    if (s.role !== 'admin') throw new Error('เฉพาะผู้ดูแลระบบเท่านั้น');
    if (readTable_('Members').some(function (m) { return m.groupId === row.id; })) throw new Error('กลุ่มนี้ยังมีสมาชิก — ย้ายหรือลบสมาชิกก่อน หรือปิดใช้งานกลุ่มแทน');
    if (readTable_('Ledger').some(function (t) { return t.groupId === row.id; })) throw new Error('กลุ่มนี้มีรายการรายรับ-รายจ่าย — ปิดใช้งานกลุ่มแทนการลบ');
  },
  Members: function (s, row) {
    if (s.role !== 'admin') throw new Error('เฉพาะผู้ดูแลระบบลบสมาชิกได้ (เจ้าหน้าที่กลุ่มใช้ “ระงับ” แทน)');
    var n = readTable_('Savings').filter(function (t) { return t.memberId === row.id; }).length + readTable_('Debts').filter(function (t) { return t.memberId === row.id; }).length;
    if (n) throw new Error('สมาชิกนี้มีรายการเงินหรือหนี้ ' + n + ' รายการ — แนะนำให้ “ระงับ” แทนการลบ');
  },
  Savings: function (s, row) { if (s.role === 'member') throw new Error('ไม่มีสิทธิ์'); memberFor_(s, row.memberId); },
  Ledger: function (s, row) { if (!canGroup_(s, row.groupId)) throw new Error('ไม่มีสิทธิ์'); },
  Debts: function (s, row) {
    memberFor_(s, row.memberId);
    readTable_('DebtPayments').filter(function (p) { return p.debtId === row.id; }).forEach(function (p) { deleteRow_('DebtPayments', p.id); });
  },
  DebtPayments: function (s, row) {
    memberFor_(s, row.memberId);
    var d = getRow_('Debts', row.debtId);
    if (d && d.status === 'closed') updateRow_('Debts', { id: d.id, status: 'active', updatedAt: nowIso_() });
  },
  Counsel: function (s, row) { if (s.role === 'member') throw new Error('ไม่มีสิทธิ์'); memberFor_(s, row.memberId); },
  FAQ: function (s) { if (s.role !== 'admin') throw new Error('เฉพาะผู้ดูแลระบบเท่านั้น'); },
  Users: function (s, row) {
    if (s.role !== 'admin') throw new Error('เฉพาะผู้ดูแลระบบเท่านั้น');
    if (row.id === s.id) throw new Error('ไม่สามารถลบบัญชีของตนเองได้');
  }
};

function amountOrBlank_(v) {
  if (v === '' || v == null) return '';
  var n = num_(v);
  return isNaN(n) || n < 0 ? '' : String(n);
}

function validatePassword_(pw) {
  pw = String(pw || '');
  if (pw.length < 8) throw new Error('รหัสผ่านต้องมีอย่างน้อย 8 ตัวอักษร');
  if (pw.length > 64) throw new Error('รหัสผ่านยาวเกินไป');
}

/* ------------------------------------------------------------
 *  บัญชีของฉัน / ตั้งค่า
 * ------------------------------------------------------------ */

/** เปลี่ยนรหัสผ่าน (เจ้าหน้าที่) หรือ PIN (สมาชิก) */
function changeSecret(token, oldValue, newValue) {
  var s = requireSession_(token);
  if (s.kind === 'member') {
    var m = getRow_('Members', s.id);
    if (hashPassword_(String(oldValue || ''), m.salt) !== m.pinHash) throw new Error('PIN เดิมไม่ถูกต้อง');
    if (!/^\S{4,32}$/.test(String(newValue || ''))) throw new Error('PIN ใหม่ต้องมีอย่างน้อย 4 ตัว (ไม่มีช่องว่าง)');
    var salt = Utilities.getUuid();
    updateRow_('Members', { id: m.id, salt: salt, pinHash: hashPassword_(String(newValue), salt), updatedAt: nowIso_() });
  } else {
    var u = getRow_('Users', s.id);
    if (hashPassword_(String(oldValue || ''), u.salt) !== u.passwordHash) throw new Error('รหัสผ่านเดิมไม่ถูกต้อง');
    validatePassword_(newValue);
    var salt2 = Utilities.getUuid();
    updateRow_('Users', { id: u.id, salt: salt2, passwordHash: hashPassword_(String(newValue), salt2) });
  }
  return true;
}

/**
 * บันทึกการตั้งค่า (admin)
 * openaiKey: เก็บใน Script Properties (ไม่อยู่ในชีต และไม่ส่งกลับมาที่หน้าเว็บ) — ส่ง '-' เพื่อลบคีย์
 */
function saveSettings(token, obj) {
  requireSession_(token, ['admin']);
  obj = obj || {};
  var allowed = ['appName', 'org', 'phone', 'botName', 'aiEnabled', 'aiModel', 'chatDailyLimit', 'botExtra', 'themeColor', 'acc_savings', 'acc_hajj'];
  withLock_(function () {
    allowed.forEach(function (k) { if (obj[k] !== undefined) setSetting_(k, text_(obj[k], k === 'botExtra' ? 3000 : 200)); });
    if (obj.openaiKey) {
      var props = PropertiesService.getScriptProperties();
      if (obj.openaiKey === '-') props.deleteProperty('OPENAI_API_KEY');
      else props.setProperty('OPENAI_API_KEY', String(obj.openaiKey).trim());
    }
  });
  return getAll(token);
}

/** สมาชิกแก้ข้อมูลครัวเรือนของตนเอง (รายได้ รายจ่าย อาชีพ เป้าหมายเงินออม) */
function saveMyProfile(token, p) {
  var s = requireSession_(token, ['member']);
  p = p || {};
  withLock_(function () {

/**
 * ============================================================
 *  แชตบอตการเงิน (คลินิกแก้หนี้) — ตอบอัตโนมัติ
 * ------------------------------------------------------------
 *  1) ถ้าตั้งคีย์ OpenAI ไว้ (ตั้งค่า › แชตบอต) และเปิดใช้ AI → ตอบด้วย AI
 *     คีย์เก็บใน Script Properties ชื่อ OPENAI_API_KEY (ไม่อยู่ในโค้ด/ชีต และหน้าเว็บมองไม่เห็น)
 *  2) ถ้าไม่มีคีย์ / ใช้เกินโควตาต่อวัน / AI ขัดข้อง → ตอบจากคลังคำถามที่พบบ่อย (แท็บ FAQ)
 *     ซึ่งผู้ดูแลเพิ่ม/แก้ไขได้ที่หน้า ตั้งค่า › คลังคำตอบแชตบอต
 * ============================================================
 */

var OPENAI_URL = 'https://api.openai.com/v1/chat/completions';

/**
 * ถามแชตบอต
 * history = [{ role: 'user'|'assistant', content: '...' }, ...] (ข้อความล่าสุดต้องเป็นของผู้ใช้)
 * คืน { answer, source: 'ai'|'faq'|'help', remaining }
 */
function chatAsk(token, history) {
  var s = requireSession_(token);
  history = (Array.isArray(history) ? history : []).slice(-12).map(function (h) {
    return { role: h && h.role === 'assistant' ? 'assistant' : 'user', content: text_(h && h.content, 1500) };
  }).filter(function (h) { return h.content; });
  var last = history[history.length - 1];
  if (!last || last.role !== 'user') throw new Error('กรุณาพิมพ์คำถาม');
  var q = last.content;

  var settings = getSettings_();
  var limit = Number(settings.chatDailyLimit || 30) || 30;
  var who = s.kind === 'member' ? 'member:' + s.memberNo : s.username;
  var today = todayIso_();
  var used = readTable_('ChatLog').filter(function (r) { return r.who === who && r.source === 'ai' && String(r.time).substr(0, 10) === today; }).length;
  var key = PropertiesService.getScriptProperties().getProperty('OPENAI_API_KEY');
  var aiOn = !!key && settings.aiEnabled !== 'FALSE' && used < limit;

  var answer = '', source = '';
  if (aiOn) {
    try {
      answer = askOpenAI_(key, settings, s, history);
      source = 'ai';
    } catch (err) {
      Logger.log('OpenAI error: ' + err);
      answer = '';
    }
  }
  if (!answer) {
    var hit = faqAnswer_(q);
    if (hit) { answer = hit.answer; source = 'faq'; }
    else { answer = helpAnswer_(settings, key && used >= limit); source = 'help'; }
  }
  logChat_(who, s.role, q, source);
  return { answer: answer, source: source, remaining: key && settings.aiEnabled !== 'FALSE' ? Math.max(0, limit - used - (source === 'ai' ? 1 : 0)) : null };
}

function logChat_(who, role, q, source) {
  try {
    withLock_(function () {
      insertRow_('ChatLog', { id: newId_(), time: nowIso_(), who: who, role: role, question: text_(q, 300), source: source });
      var sh = sheet_('ChatLog');
      if (sh.getLastRow() > 3000) { sh.deleteRows(2, 1000); delete _tableCache.ChatLog; }
    });
  } catch (err) { }
}

/** สรุปข้อมูลการเงินของสมาชิกที่เข้าสู่ระบบ (ไม่มีข้อมูลระบุตัวตน) */
function userContext_(s) {
  if (s.kind !== 'member') return 'ผู้ใช้เป็นเจ้าหน้าที่' + (s.role === 'admin' ? 'ผู้ดูแลระบบ' : 'ประจำกลุ่ม') + ' อาจถามเพื่อนำไปให้คำปรึกษาสมาชิก';
  var m = getRow_('Members', s.id);
  if (!m) return '';
  var sv = readTable_('Savings'), labels = accountLabels_();
  var bal = savingsBalance_(sv, m.id, '', 'savings'), hajj = savingsBalance_(sv, m.id, '', 'hajj');
  var debts = readTable_('Debts').filter(function (d) { return d.memberId === m.id && d.status !== 'closed'; });
  var st = debtStatus_(debts, readTable_('DebtPayments').filter(function (p) { return p.memberId === m.id; }));
  var g = getRow_('Groups', m.groupId);
  var parts = ['กลุ่มอาชีพ: ' + (g ? g.name : '-'), 'อาชีพ: ' + (m.occupation || '-'), labels.savings + ' ' + money_(bal) + ' บาท', labels.hajj + ' ' + money_(hajj) + ' บาท'];
  if (m.income) parts.push('รายได้ครัวเรือนต่อเดือนประมาณ ' + money_(m.income) + ' บาท');
  if (m.expense) parts.push('รายจ่ายต่อเดือนประมาณ ' + money_(m.expense) + ' บาท');
  if (debts.length) {
    parts.push('หนี้ที่ยังค้าง ' + debts.length + ' รายการ: ' + debts.map(function (d) {
      return (DEBT_KINDS[d.kind] || d.kind) + ' คงเหลือ ' + money_(st[d.id].outstanding) + ' บาท' + (d.rate !== '' ? ' ดอกเบี้ย ' + d.rate + '%/ปี' : '') + (d.monthlyPayment ? ' ผ่อน ' + money_(d.monthlyPayment) + '/เดือน' : '');
    }).join('; '));
  } else parts.push('ยังไม่ได้บันทึกหนี้ในคลินิกแก้หนี้');
  return parts.join(' · ');
}

function askOpenAI_(key, settings, s, history) {
  var model = settings.aiModel || 'gpt-4o-mini';
  var body = { model: model, messages: [{ role: 'system', content: systemPrompt_(settings, s) }].concat(history), max_completion_tokens: 900 };
  if (!/^(o\d|gpt-5)/.test(model)) body.temperature = 0.4; // รุ่นที่ใช้การให้เหตุผลไม่รองรับ temperature
  var res = UrlFetchApp.fetch(OPENAI_URL, {
    method: 'post', contentType: 'application/json', muteHttpExceptions: true,
    headers: { Authorization: 'Bearer ' + key }, payload: JSON.stringify(body)
  });
  var code = res.getResponseCode();
  if (code !== 200) throw new Error('OpenAI HTTP ' + code + ': ' + String(res.getContentText()).substr(0, 300));
  var j = JSON.parse(res.getContentText());
  var out = j && j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content;
  if (!out) throw new Error('OpenAI: ไม่มีคำตอบ');
  return String(out).trim();
}

/* ------------------------------------------------------------
 *  ตอบจากคลังคำถาม (FAQ) — ใช้เมื่อไม่มี AI
 * ------------------------------------------------------------ */
function normTh_(t) { return String(t || '').toLowerCase().replace(/[\s​?？!.,:;"'()\[\]]/g, ''); }

function faqAnswer_(q) {
  var nq = normTh_(q);
  if (!nq) return null;
  var best = null, bestScore = 0;
  readTable_('FAQ').filter(function (f) { return f.active === '' || isTrue_(f.active); }).forEach(function (f) {
    var score = 0;
    String(f.keywords || '').split(/[,|\n]/).forEach(function (k) {
      k = normTh_(k);
      if (k && nq.indexOf(k) !== -1) score += Math.min(3, 1 + k.length / 6);
    });
    var nf = normTh_(f.question);
    if (nf && (nq.indexOf(nf) !== -1 || nf.indexOf(nq) !== -1) && nq.length >= 4) score += 4;
    if (score > bestScore) { bestScore = score; best = f; }
  });
  return bestScore >= 1 ? best : null;
}

function helpAnswer_(settings, overLimit) {
  var topics = readTable_('FAQ').filter(function (f) { return f.active === '' || isTrue_(f.active); }).sort(byOrder_).slice(0, 8).map(function (f) { return '• ' + f.question; });
  return (overLimit ? 'วันนี้ใช้ผู้ช่วย AI ครบโควตาแล้ว ตอนนี้ตอบจากคลังคำถามได้ค่ะ\n\n' : '') +
    'ขออภัยค่ะ ' + (settings.botName || 'น้องออม') + ' ยังไม่มีคำตอบสำหรับคำถามนี้ ลองถามด้วยคำสั้น ๆ เช่น “ออมเงินยังไง” “หนี้นอกระบบ” “ผ่อนหนี้อันไหนก่อน”' +
    (topics.length ? '\n\nหัวข้อที่ถามได้:\n' + topics.join('\n') : '') +
    '\n\nหรือปรึกษาเจ้าหน้าที่กลุ่มอาชีพของคุณ' + (settings.phone ? ' โทร ' + settings.phone : '') + ' และคลินิกแก้หนี้ (บสส.) โทร 1443';
}

/**
 * ============================================================
 *  นำเข้าข้อมูลจากไฟล์ Excel / CSV หรือจากลิงก์ Google Sheet
 * ------------------------------------------------------------
 *  รองรับตาราง "ติดตามการออมรายเดือน" (ชื่อ-นามสกุล | ตำบล | อำเภอ | จังหวัด | กลุ่ม | ม.ค. … ธ.ค.)
 *  หน้าแอปแปลงไฟล์เป็นตาราง แล้วส่งมาที่ importData()
 *
 *  นำเข้าซ้ำได้ (อัปเดตข้อมูล): แต่ละช่อง "สมาชิก × เดือน × บัญชี" มีรหัสอ้างอิง (ref)
 *    - ช่องที่มีเงิน → เพิ่ม หรือแก้ยอดให้ตรงกับไฟล์
 *    - ช่องว่าง/0 ที่เคยนำเข้า → ลบรายการเดิมออก
 *    - รายการที่บันทึกในแอปเอง (ไม่มี ref) ไม่ถูกแตะต้อง
 * ============================================================
 */

/** อ่านทุกแท็บของ Google Sheet จากลิงก์ (บัญชีที่ติดตั้งแอปต้องมีสิทธิ์ดูชีตนั้น) */
function importReadSheet(token, url) {
  requireSession_(token, ['admin', 'officer']);
  url = String(url || '').trim();
  var m = /\/spreadsheets\/d\/([a-zA-Z0-9_-]{20,})/.exec(url) || /^([a-zA-Z0-9_-]{30,})$/.exec(url);
  if (!m) throw new Error('ลิงก์ Google Sheet ไม่ถูกต้อง (ต้องเป็นลิงก์ docs.google.com/spreadsheets/d/...)');
  var ss;
  try { ss = SpreadsheetApp.openById(m[1]); } catch (err) {
    throw new Error('เปิดชีตไม่ได้ — ให้แชร์ชีตเป็น “ทุกคนที่มีลิงก์ดูได้” หรือแชร์ให้บัญชีที่ติดตั้งแอป แล้วลองใหม่');
  }
  try {
    return {
      title: ss.getName(),
      sheets: ss.getSheets().map(function (sh) {
        var r = Math.min(sh.getLastRow(), 3000), c = Math.min(sh.getLastColumn(), 60);
        return { name: sh.getName(), rows: r && c ? sh.getRange(1, 1, r, c).getDisplayValues() : [] };
      })
    };
  } catch (err) {
    throw new Error('อ่านข้อมูลจากลิงก์ไม่ได้ — ดาวน์โหลดชีตเป็นไฟล์ Excel (ไฟล์ › ดาวน์โหลด › .xlsx) แล้วใช้ “อัปโหลดไฟล์” แทน');
  }
}

function normName_(s) { return String(s || '').replace(/[\s​ ]+/g, '').toLowerCase(); }

/**
 * นำเข้า / อัปเดตข้อมูล
 * p = { tables: [{ account: 'savings'|'hajj', year: 2025, rows: [{ name, group, tambon, amphoe, province, months: [12 ค่า: ตัวเลข | null] }] }],
 *       defaultPin: '' (ตั้ง PIN ให้สมาชิกใหม่ ถ้าใส่), dryRun: true = ตรวจสอบอย่างเดียว }
 */
function importData(token, p) {
  var s = requireSession_(token, ['admin', 'officer']);
  p = p || {};
  if (!Array.isArray(p.tables) || !p.tables.length) throw new Error('ไม่พบตารางข้อมูลที่จะนำเข้า');
  if (p.defaultPin && !/^\S{4,32}$/.test(String(p.defaultPin))) throw new Error('PIN เริ่มต้นต้องมีอย่างน้อย 4 ตัว (ไม่มีช่องว่าง)');
  ensureSchema_();
  var res = withLock_(function () { return applyImport_(s, p, !!p.dryRun); });
  if (!p.dryRun) return { summary: res, data: getAll(token) };
  return { summary: res };
}

function applyImport_(s, p, dry) {
  var now = nowIso_(), who = 'import:' + (s.username || s.name);
  var sum = { groupsNew: [], membersNew: 0, membersMatched: 0, inserted: 0, updated: 0, deleted: 0, unchanged: 0, amount: { savings: 0, hajj: 0 }, skipped: [] };

  // ---------- กลุ่ม ----------
  var groups = readTable_('Groups'), gIdx = {};
  groups.forEach(function (g) { gIdx[normName_(g.name)] = g; });
  var newGroups = [];
  var groupFor = function (row) {
    var key = normName_(row.group);
    if (!key) return null;
    if (gIdx[key]) return gIdx[key];
    if (s.role !== 'admin') return null;
    var loc = [row.tambon ? 'ต.' + row.tambon : '', row.amphoe ? 'อ.' + row.amphoe : '', row.province ? 'จ.' + row.province : ''].filter(String).join(' ');
    var g = fill_('Groups', { id: newId_(), name: text_(row.group, 120), icon: '🧺', location: loc, description: 'สร้างจากการนำเข้าข้อมูล', active: 'TRUE',
      order: String(groups.length + newGroups.length + 1), createdAt: now, updatedAt: now });
    gIdx[key] = g; newGroups.push(g); sum.groupsNew.push(g.name);
    return g;
  };

  // ---------- สมาชิก ----------
  var members = readTable_('Members'), byNameGroup = {}, byName = {};
  members.forEach(function (m) {
    byNameGroup[normName_(m.name) + '|' + m.groupId] = m;
    var k = normName_(m.name);
    byName[k] = byName[k] ? 'DUP' : m;
  });
  var maxNo = 0, prefix = 'M', width = 3;
  members.forEach(function (m) { var x = /^([A-Za-zก-๙]*)(\d+)$/.exec(String(m.memberNo)); if (x && Number(x[2]) >= maxNo) { maxNo = Number(x[2]); prefix = x[1] || 'M'; width = Math.max(3, x[2].length); } });
  var newMembers = [], seenMember = {};
  var memberFor = function (row, g) {
    var k = normName_(row.name);
    var m = byNameGroup[k + '|' + g.id] || (byName[k] && byName[k] !== 'DUP' ? byName[k] : null);
    if (m) { if (!seenMember[m.id]) { seenMember[m.id] = 1; sum.membersMatched++; } return m; }
    maxNo++;
    var no = String(maxNo); while (no.length < width) no = '0' + no;
    var rec = { id: newId_(), memberNo: prefix + no, name: text_(row.name, 150), phone: '', groupId: g.id, joinDate: '', occupation: '', income: '', expense: '', savingsGoal: '',
      note: 'นำเข้าจากไฟล์', pinHash: '', salt: '', active: 'TRUE', lastLogin: '', createdAt: now, updatedAt: now };
    if (p.defaultPin) { rec.salt = Utilities.getUuid(); rec.pinHash = hashPassword_(String(p.defaultPin), rec.salt); }
    rec = fill_('Members', rec);
    byNameGroup[k + '|' + g.id] = rec; byName[k] = rec; seenMember[rec.id] = 1;
    newMembers.push(rec); sum.membersNew++;
    return rec;
  };

  // ---------- ยอดรายเดือนที่ต้องการ ----------
  var desired = {}, covered = {};
  p.tables.forEach(function (t, ti) {
    var account = ACCOUNTS[t.account] ? t.account : 'savings';
    var year = Number(t.year);
    if (!(year >= 2000 && year <= 2100)) throw new Error('ตารางที่ ' + (ti + 1) + ': ปีไม่ถูกต้อง');
    (t.rows || []).slice(0, 5000).forEach(function (row) {
      var g = groupFor(row);
      if (!g) { if (row.name) sum.skipped.push(text_(row.name, 60) + (row.group ? ' (ไม่มีสิทธิ์/ไม่พบกลุ่ม ' + text_(row.group, 40) + ')' : ' (ไม่ทราบกลุ่ม)')); return; }
      if (s.role === 'officer' && g.id !== s.groupId) { if (row.name) sum.skipped.push(text_(row.name, 60) + ' (อยู่นอกกลุ่มของคุณ)'); return; }
      if (!normName_(row.name)) return; // แถวว่าง (ยังไม่มีชื่อสมาชิก) — สร้างแค่กลุ่ม
      var m = memberFor(row, g);
      var months = Array.isArray(row.months) ? row.months : [];
      for (var k = 0; k < 12; k++) {
        var mm = ('0' + (k + 1)).slice(-2), ref = 'imp:' + account + ':' + m.id + ':' + year + '-' + mm;
        covered[ref] = 1;
        var v = months[k] === null || months[k] === undefined || months[k] === '' ? 0 : num_(months[k]);
        if (isNaN(v)) v = 0;
        if (v) {
          var d = desired[ref] || { memberId: m.id, groupId: g.id, account: account, date: year + '-' + mm + '-01', amount: 0, label: THAI_MONTHS_[k] + ' ' + (year + 543) };
          d.amount = Math.round((d.amount + v) * 100) / 100; // ชื่อซ้ำในตารางเดียวกัน → รวมยอด
          desired[ref] = d;
        }
      }
    });
  });

  // ---------- เทียบกับรายการเดิม ----------
  var sh = sheet_('Savings'), head = headers_(sh), last = sh.getLastRow();
  var values = last > 1 ? sh.getRange(2, 1, last - 1, head.length).getValues() : [];
  var ci = {}; head.forEach(function (h, i) { ci[h] = i; });
  var updates = [], deletes = [], existing = {};
  values.forEach(function (row, i) {
    var ref = String(row[ci.ref] || '');
    if (!ref || !covered[ref]) return;
    existing[ref] = 1;
    var d = desired[ref];
    if (!d) { deletes.push(i + 2); return; }

n(d => { busy(false); D = d; return d; }).catch(e => { busy(false); toast(e.message, 'err'); throw e; });\n  }\n\n  /* lookup */\n  const isStaff = () => D && D.user.role !== 'member';\n  const isAdmin = () => D && D.user.role === 'admin';\n  const groupOf = id => (D.groups || []).find(g => g.id === id) || {};\n  const memberOf = id => (D.members || []).find(m => m.id === id) || {};\n  const groupName = id => groupOf(id).name || '-';\n  const activeMembers = () => D.members.filter(m => truthy(m.active)).sort((a, b) => String(a.memberNo).localeCompare(String(b.memberNo), 'th', { numeric: true }));\n  const ACCS = ['savings', 'hajj'];\n  const ACC_E = { savings: '💰', hajj: '🕋' };\n  const accOf = t => t.account === 'hajj' ? 'hajj' : 'savings';\n  const accName = a => ((D && D.accounts) || CFG.accounts || {})[a] || (a === 'hajj' ? 'บัญชีอัลฮัจย์-อุมเราะห์' : 'เงินออมรายเดือน');\n  /** ยอดคงเหลือ — acc เว้นว่าง = รวมทุกบัญชี */\n  function balanceOf(memberId, acc) { return D.savings.reduce((s, t) => t.memberId === memberId && (!acc || accOf(t) === acc) ? s + (t.type === 'withdraw' ? -num(t.amount) : num(t.amount)) : s, 0); }\n  const accLine = memberId => ACCS.map(a => ACC_E[a] + ' ' + esc(accName(a)) + ' ' + money(balanceOf(memberId, a))).join(' · ');\n  function debtInfo(memberId) {\n    const paid = {};\n    D.payments.forEach(p => { paid[p.debtId] = (paid[p.debtId] || 0) + num(p.amount); });\n    const list = D.debts.filter(d => d.memberId === memberId).map(d => Object.assign({}, d, { paid: paid[d.id] || 0, outstanding: Math.max(0, num(d.principal) - (paid[d.id] || 0)) }));\n    const act = list.filter(d => d.status !== 'closed' && d.outstanding > 0);\n    const m = memberOf(memberId);\n    const monthly = act.reduce((s, d) => s + num(d.monthlyPayment), 0);\n    const income = num(m.income);\n    return { list, active: act, total: act.reduce((s, d) => s + d.outstanding, 0), monthly, income, dti: income ? monthly / income * 100 : null };\n  }\n  function dtiPill(dti) atch (e) { }\n    root.innerHTML = '<div class=\"login\"><form class=\"card\" id=\"lf\" novalidate autocomplete=\"on\"><div class=\"logo\">🌱</div>' +\n      '<h2 style=\"margin-bottom:2px\">' + esc(CFG.appName) + '</h2><p class=\"muted small\" style=\"margin:0 0 16px\">' + esc(CFG.org) + ' · ระบบออมทรัพย์กลุ่มอาชีพ และคลินิกแก้หนี้</p>' +\n      '<div id=\"lmsg\"' + (msg ? ' class=\"msg ' + (type || 'err') + '\"' : ' hidden') + ' role=\"alert\">' + esc(msg || '') + '</div>' +\n      segHtml('mode', mode, [['member', '👤 สมาชิก'], ['staff', '🧑‍💼 เจ้าหน้าที่']]) +\n      '<label class=\"fld\"><span id=\"lu\">รหัสสมาชิก</span><input name=\"u\" autocomplete=\"username\" required></label>' +\n      '<label class=\"fld\"><span id=\"lp\">PIN</span><input name=\"p\" type=\"password\" autocomplete=\"current-password\" required></label>' +\n      '<button class=\"btn block\" id=\"lbtn\" type=\"submit\">เข้าสู่ระบบ</button>' +\n      '<p class=\"muted small\" style=\"margin:14px 0 0;text-align:center\">ลืมรหัส? ติดต่อเจ้าหน้าที่กลุ่มอาชีพ' + (CFG.phone ? ' โทร ' + esc(CFG.phone) : '') + '</p></form></div>';\n    const f = $('#lf');\n    const sync = m => { mode = m; $('#lu').textContent = m === 'staff' ? 'ชื่อผู้ใช้' : 'รหัสสมาชิก'; $('#lp').textContent = m === 'staff' ? 'รหัสผ่าน' : 'PIN'; f.p.setAttribute('inputmode', m === 'staff' ? 'text' : 'numeric'); try { localStorage.setItem('ss_mode', m); } catch (e) { } };\n    bindSeg(f, (k, v) => sync(v)); sync(mode);\n    try { const last = localStorage.getItem('ss_user_' + mode); if (last) f.u.value = last; } catch (e) { }\n    f.addEventListener('submit', e => {\n      e.preventDefault();\n      const m = $('#lmsg'), b = $('#lbtn');\n      if (!f.u.value.trim() || !f.p.value) { m.hidden = false; m.className = 'msg err'; m.textContent = 'กรุณากรอกข้อมูลให้ครบ'; return; }\n      b.disabled = true; b.innerHTML = '<span class=\"spin\"></span> กำลังตรวจสอบ';\n      call(mode === 'staff' ? 'staffLogin' : 'memberLogin', f.u.value.trim() xs.filter(t => t.type === 'withdraw').reduce((s, t) => s + num(t.amount), 0);\n    return '<div class=\"card\"><div class=\"row between\"><div class=\"grow\"><h3 style=\"margin:0\">' + esc(m.name) + ' ' + (truthy(m.active) ? '' : '<span class=\"pill bad\">ระงับ</span>') + '</h3><div class=\"small muted\">' + esc(m.memberNo) + ' · ' + esc(groupName(m.groupId)) + (m.phone ? ' · ☎ <a href=\"tel:' + esc(m.phone) + '\">' + esc(m.phone) + '</a>' : '') + (m.occupation ? ' · ' + esc(m.occupation) : '') + '</div></div><button class=\"btn sm ghost\" id=\"mdEdit\">✎ แก้ไข</button></div></div>' +\n      '<div class=\"hero\"><div class=\"k\">เงินออมคงเหลือรวมทุกบัญชี</div><div class=\"v\">' + money(bal) + '<small>บาท</small></div><div class=\"n\">' + accLine(id) + '</div><div class=\"n\">ฝากรวม ' + money(dep) + ' · ถอนรวม ' + money(wd) + '</div>' + goalHtml(bal, m.savingsGoal) + '</div>' +\n      '<div class=\"row\" style=\"margin-bottom:14px\"><button class=\"btn\" id=\"mdDep\">➕ ฝาก</button><button class=\"btn gold\" id=\"mdWd\">➖ ถอน</button><button class=\"btn ghost\" data-go=\"cmember\" data-arg=\"' + esc(id) + '\">🩺 คลินิกหนี้' + (di.total ? ' (' + short(di.total) + ')' : '') + '</button></div>' +\n      '<h3>รายการเงินออม</h3>' + (txs.length ? '<div class=\"list\">' + txs.map(t => savRow(t, false)).join('') + '</div>' : '<div class=\"card empty\">ยังไม่มีรายการ</div>');\n  };\n  BIND.member = function (v, id) {\n    if (!$('#mdEdit')) return;\n    $('#mdEdit').onclick = () => memberForm(id);\n    $('#mdDep').onclick = () => savingForm(null, { memberId: id, type: 'deposit' });\n    $('#mdWd').onclick = () => savingForm(null, { memberId: id, type: 'withdraw' });\n    v.addEventListener('click', e => { const a = e.target.closest('[data-sav]'); if (a) savingForm(a.getAttribute('data-sav')); });\n  };\n\n  /* ================= คลินิกแก้หนี้ ================= */\n  let clQ = '';\n  VIEWS.clinic = function () {\n    if (!isStaff()) return VIEWS.cmember(D.user.id);\n    const rows = D.members.map(m => Object.assign({ m: m }, debtInfo(m.id))).filter(x => x.list.length);\n    const tot = rows.reduce((s, x) => s + x.total, 0), heavy = rows.filter(x => x.dti != null && x.dti > 40).length;\n    return '<div class=\"hero\"><div class=\"k\">🩺 หนี้คงค้างของสมาชิกในคลินิก</div><div class=\"v\">' + money(tot) + '<small>บาท</small></div><div class=\"n\">' + rows.filter(x => x.total).length + ' คนที่ยังมีหนี้ · ภาระหนี้เกิน 40% ของรายได้ ' + heavy + ' คน</div></div>' +\n      '<div class=\"row\" style=\"margin-bottom:12px\"><input class=\"search grow\" id=\"cq\" placeholder=\"🔍 ค้นหาสมาชิกเพื่อเปิดแฟ้มคลินิก\" value=\"' + esc(clQ) + '\"></div><div id=\"clist\"></div>' +\n      '<p class=\"small muted\">แตะชื่อสมาชิกเพื่อบันทึกหนี้ การชำระ แผนปลดหนี้ และบันทึกการให้คำปรึกษา · สมาชิกเปิดดูแฟ้มของตนเองได้ในแอป</p>';\n  };\n  BIND.clinic = function () {\n    if (!isStaff()) return BIND.cmember($('#view'), D.user.id);\n    const draw = () => {\n      const q = clQ.toLowerCase();\n      const list = D.members.filter(m => q ? (m.memberNo + ' ' + m.name).toLowerCase().indexOf(q) !== -1 : D.debts.some(d => d.memberId === m.id))\n        .map(m => Object.assign({ m: m }, debtInfo(m.id))).sort((a, b) => (b.dti || 0) - (a.dti || 0) || b.total - a.total);\n      $('#clist').innerHTML = list.length ? '<div class=\"list\">' + list.map(x => '<div class=\"li tap\" data-go=\"cmember\" data-arg=\"' + esc(x.m.id) + '\"><div class=\"ic' + (x.dti > 40 ? ' w' : '') + '\">' + (x.total ? '🩺' : '✅') + '</div><div style=\"min-width:0\"><div class=\"t\">' + esc(x.m.name) + '</div><div class=\"s\">' + esc(x.m.memberNo) + ' · ' + x.active.length + ' หนี้ค้าง · ผ่อน ' + money(x.monthly) + '/เดือน</div><div style=\"margin-top:3px\">' + dtiPill(x.dti) + '</div></div><div class=\"a m\">' + money(x.total) + '<small>คงเหลือ</small></div></div>').join('') + '</div>'\n        : '<div class=\"card empty\">' + (q ? 'ไม่พบสมาชิก' : 'ยังไม่มีสมาชิกที่บันทึกหนี้ — ค้นหาชื่อสมาชิกด้านบนเพื่อเปิดแฟ้มคลินิก') + '</div>';\n    };\n    draw();\n    $('#cq').oninput = function () { clQ = this.value; draw(); };\n  };\n\n  let planExtra = '', planMethod = 'avalanche';\n  /** จำลองแผนปลดหนี้รายเดือน (ดอกเบี้ยลดต้นลดดอก) */\n  function simulate(debts, extra, method) {\n    let ds = debts.map(d => ({ id: d.id, name: d.creditor, bal: d.outstanding, rate: num(d.rate), min: num(d.monthlyPayment), done: 0 }));\n    const budget = ds.reduce((s, d) => s + d.min, 0) + num(extra);\n    if (!ds.length) return null;\n    if (budget <= 0) return { error: 'ใส่ยอดผ่อนต่อเดือนในรายการหนี้ หรือใส่เงินโปะเพิ่ม เพื่อคำนวณแผน' };\n    let month = 0, interest = 0;\n    while (ds.some(d => d.bal > 0.005) && month < 600) {\n      month++;\n      ds.forEach(d => { if (d.bal > 0) { const i = d.bal * d.rate / 1200; d.bal += i; interest += i; } });\n      let left = budget;\n      ds.forEach(d => { if (d.bal > 0) { const p = Math.min(d.bal, d.min, left); d.bal -= p; left -= p; } });\n      const order = ds.filter(d => d.bal > 0.005).sort((a, b) => method === 'snowball' ? a.bal - b.bal : b.rate - a.rate || a.bal - b.bal);\n      for (const d of order) { if (left <= 0) break; const p = Math.min(d.bal, left); d.bal -= p; left -= p; }\n      ds.forEach(d => { if (d.bal <= 0.005 && !d.done) { d.bal = 0; d.done = month; } });\n      if (month === 1 && ds.every(d => d.bal > 0) && left <= 0 && ds.reduce((s, d) => s + d.bal, 0) >= debts.reduce((s, d) => s + d.outstanding, 0)) return { error: 'ยอดผ่อนรวม ' + money(budget) + ' บาท/เดือน ไม่พอจ่ายดอกเบี้ย หนี้จะไม่ลดลง — ควรเพิ่มยอดผ่อนหรือเจรจาลดดอกเบี้ยกับเจ้าหนี้' };\n    }\n    if (month >= 600) return { error: 'ตามยอดผ่อนนี้ใช้เวลาเกิน 50 ปี — ควรเพิ่มยอดผ่อนหรือเจรจาปรับโครงสร้างหนี้' };\n    return { months: month, interest: interest, budget: budget, order: ds.slice().sort((a, b) => a.done - b.done) };\n  }\n  function monthsText(n) { const y = Math.floor(n / 12), m = n % 12; return (y ? y + ' ปี ' : '') + (m ? m + ' เดือน' : (y ? '' : '0 เดือน')); }\n  function addMonths(n) { const d = new Date(); d.setMonth(d.getMonth() + n); return TM[d.getMonth()] + ' ' + (d.getFullYear() + 543); }\n\n  VIEWS.cmember = function (id) {\n    const m = memberOf(id);\n    if (!m.id) return '<div class=\"card empty\">ไม่พบสมาชิก</div>';\n    const di = debtInfo(id), self = D.user.role === 'member';\n    const notes = sortDate(D.counsel.filter(c => c.memberId === id));\n    const left = di.income ? di.income - num(m.expense) - di.monthly : null;\n    let h = (self ? '' : '<div class=\"card\"><b>' + esc(m.name) + '</b> <span class=\"muted small\">' + esc(m.memberNo) + ' · ' + esc(groupName(m.groupId)) + '</span></div>');\n    h += '<div class=\"hero\"><div class=\"k\">หนี้คงเหลือรวม</div><div class=\"v\">' + money(di.total) + '<small>บาท</small></div><div class=\"n\">' + di.active.length + ' รายการที่ยังผ่อน · ผ่อนรวม ' + money(di.monthly) + ' บาท/เดือน</div></div>';\n    h += '<div class=\"tiles\"><div class=\"tile\"><div class=\"l\">หนี้ต่อรายได้</div><div style=\"margin-top:4px\">' + dtiPill(di.dti) + '</div><div class=\"s\">ควรไม่เกิน 30–40%</div></div>' +\n      '<div class=\"tile\"><div class=\"l\">รายได้/เดือน</div><div class=\"n\">' + (di.income ? money(di.income) : '-') + '</div><div class=\"s\">รายจ่าย ' + (m.expense ? money(m.expense) : '-') + '</div></div>' +\n      '<div class=\"tile\"><div class=\"l\">เหลือหลังจ่ายทุกอย่าง</div><div class=\"n\" style=\"color:' + (left != null && left < 0 ? 'var(--danger)' : 'var(--brand-ink)') + '\">' + (left == null ? '-' : money(left)) + '</div><div class=\"s\">รายได้ − รายจ่าย − ผ่อนหนี้</div></div>' +\n      '<div class=\"tile\"><div class=\"l\">เงินออมในกลุ่ม</div><div class=\"n\">' + money(balanceOf(id)) + '</div><div class=\"s\">ไม่ควรถอนมาโปะจนไม่มีเงินฉุกเฉิน</div></div></div>';\n    if (self && !di.income) h += '<div class=\"msg info\">ใส่รายได้และรายจ่ายต่อเดือนที่หน้า “ฉัน” เพื่อดูสัดส่วนหนี้ต่อรายได้</div>';\n    h += '<div class=\"row between\" style=\"margin:4px 0 lse;\n    text = text.replace(/^﻿/, '');\n    for (let i = 0; i < text.length; i++) {\n      const c = text[i];\n      if (q) { if (c === '\"') { if (text[i + 1] === '\"') { cell += '\"'; i++; } else q = false; } else cell += c; }\n      else if (c === '\"') q = true;\n      else if (c === ',' || c === '\\t') { row.push(cell); cell = ''; }\n      else if (c === '\\n' || c === '\\r') { if (c === '\\r' && text[i + 1] === '\\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }\n      else cell += c;\n    }\n    if (cell !== '' || row.length) { row.push(cell); rows.push(row); }\n    return rows;\n  }\n  /**\n   * หาตาราง \"ติดตามการออมรายเดือน\" ในแผ่นงาน\n   * หัวตาราง = แถวที่มีคำว่า “ชื่อ” และชื่อเดือน · แถวป้ายกำกับ “ตำบล… อำเภอ…” และ “กลุ่ม…” ใช้เติมข้อมูลที่เว้นว่าง\n   */\n  function parseGrid(rows, sheetName) {\n    const tables = []; let cur = null, ctx = {}, label = '', yearText = '';\n    for (let i = 0; i < rows.length; i++) {\n      const r = (rows[i] || []).map(v => String(v == null ? '' : v).trim());\n      const nz = r.filter(Boolean);\n      if (!nz.length) continue;\n      const nameCol = r.findIndex(c => /ชื่อ/.test(c) && c.length < 30);\n      const mcols = r.map(monthIdx);\n      if (nameCol !== -1 && mcols.some(x => x >= 0)) {\n        const col = k => r.findIndex(c => normCell(c).indexOf(k) === 0 && c.length < 24);\n        const months = new Array(12).fill(-1);\n        mcols.forEach((m, j) => { if (m >= 0 && months[m] < 0) months[m] = j; });\n        const f = months.findIndex(x => x >= 0), base = months[f] - f;\n        for (let k = 0; k < 12; k++) if (months[k] < 0) months[k] = base + k;\n        yearText += ' ' + r.join(' ');\n        const ym = /(25\\d\\d|20\\d\\d)/.exec(label + ' ' + yearText);\n        const idx = tables.length;\n        cur = { sheet: sheetName, row: i + 1, label: label, cols: { name: nameCol, tambon: col('ตำบล'), amphoe: col('อำเภอ'), province: col('จังหวัด'), group: col('กลุ่ม') }, months: months,\n
