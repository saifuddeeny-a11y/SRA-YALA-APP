<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
:root{
  --ink:#16213a; --muted:#5b6780; --line:#e3e8f1; --bg:#f3f5fb; --card:#fff;
  --navy:#1e2a5a; --indigo:#3b3fb6; --gold:#f2b632; --gold2:#ffd56b;
  --ok:#0f8a5f; --okbg:#e3f6ee; --warn:#a15c00; --warnbg:#fff3dc; --bad:#c0262d; --badbg:#fde8e9; --none:#64748b; --nonebg:#eef1f6;
  --s1:#7c3aed; --s2:#2563eb; --s3:#0d9488; --s4:#ea580c; --s5:#db2777; --s6:#475569; --s7:#16a34a; --s8:#0891b2; --s9:#b45309;
  --gadm:#7c3aed; --gtch:#2563eb; --gres:#0d9488; --gsvc:#ea580c;
  --r:14px; --sh:0 1px 2px rgba(22,33,58,.06),0 6px 20px rgba(22,33,58,.06);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Sarabun',Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
a{color:var(--indigo)}
button,input,select,textarea{font:inherit}
/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  background:linear-gradient(110deg,#1e2a5a 0%,#3b3fb6 55%,#7c3aed 100%);color:#fff;padding:10px 20px;box-shadow:0 4px 18px rgba(30,42,90,.25)}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3a2600;font-weight:800;border-radius:12px;padding:8px 10px;font-size:14px;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.t1{font-weight:700;font-size:17px;line-height:1.25}
.t2{font-size:13px;opacity:.85}
.ctrls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ctrls label{font-size:13px;display:flex;gap:6px;align-items:center;opacity:.95}
.ctrls select{border-radius:999px;border:0;padding:6px 12px;max-width:270px;background:rgba(255,255,255,.95)}
.btn-top{border:1px solid rgba(255,255,255,.6);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer}
.btn-top:hover{background:rgba(255,255,255,.22)}
/* ---------- layout ---------- */
.shell{display:grid;grid-template-columns:262px 1fr;min-height:calc(100vh - 64px)}
.side{background:#fff;border-right:1px solid var(--line);padding:14px 10px;position:sticky;top:64px;height:calc(100vh - 64px);overflow:auto}
.side .h{font-size:11.5px;color:var(--muted);padding:12px 10px 4px;letter-spacing:.04em;font-weight:600}
.side a{display:flex;align-items:center;gap:9px;padding:7px 10px;border-radius:10px;text-decoration:none;color:var(--ink);font-size:14px;cursor:pointer;margin:1px 0}
.side a:hover{background:#f1f3fa}
.side a.on{background:color-mix(in srgb,var(--c,#3b3fb6) 12%,#fff);color:var(--c,#3b3fb6);font-weight:600}
.side a .dot{width:26px;height:26px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;background:var(--c,#3b3fb6);color:#fff;font-size:12px;font-weight:700;flex:0 0 auto}
.side a .lb{flex:1;line-height:1.3}
.side a .s{font-size:11.5px;color:var(--muted);white-space:nowrap}
main{padding:22px 26px 70px;min-width:0}
h2.pg{margin:0 0 4px;font-size:24px;color:var(--navy);line-height:1.3}
.lead{color:var(--muted);margin:0 0 16px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--sh)}
.card h3{margin:0 0 10px;font-size:16.5px;color:var(--navy)}
.card.accent{border-top:4px solid var(--c,#3b3fb6)}
/* ---------- hero ---------- */
.hero{border-radius:20px;padding:22px 24px;color:#fff;display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;margin-bottom:16px;
  background:radial-gradient(1200px 300px at 100% 0%,rgba(242,182,50,.35),transparent 60%),linear-gradient(120deg,#1e2a5a,#3b3fb6 60%,#7c3aed);box-shadow:0 10px 30px rgba(59,63,182,.25)}
.hero h2{margin:0;font-size:24px}
.hero .sub{opacity:.9;margin:2px 0 12px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:8px 12px}
.kpi b{display:block;font-size:22px;line-height:1.2}
.kpi span{font-size:12.5px;opacity:.9}
.ring{position:relative;width:138px;height:138px}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .v b{font-size:30px;line-height:1}
.ring .v span{font-size:12px;opacity:.85}
/* ---------- group cards ---------- */
.gc{cursor:pointer;position:relative;overflow:hidden;transition:transform .15s, box-shadow .15s;border-top:5px solid var(--c)}
.gc:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(22,33,58,.12)}
.gc.sel{outline:2px solid var(--c);outline-offset:-2px}
.gc .nm{font-size:14px;color:var(--muted);font-weight:600}
.gc .sc{font-size:32px;font-weight:800;color:var(--c);line-height:1.2}
.gc .sc small{font-size:15px;color:var(--muted);font-weight:400}
.gc .badge{position:absolute;top:10px;right:10px;font-size:11px;background:var(--c);color:#fff;border-radius:999px;padding:1px 8px}
.bar{height:9px;background:#e9edf5;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c,#3b3fb6);border-radius:99px;transition:width .4s}
/* ---------- tables ---------- */
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{padding:9px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:600;font-size:13px;background:#f7f8fc}
table.t td.n,table.t th.n{text-align:right;white-space:nowrap}
table.t td.c,table.t th.c{text-align:center}
table.t tr.click{cursor:pointer}
table.t tr.click:hover td{background:#f6f7fd}
table.t tr.sech td{background:color-mix(in srgb,var(--c) 10%,#fff);font-weight:700;color:var(--c)}
.wx td.c b{display:inline-block;min-width:32px;padding:1px 6px;border-radius:7px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c)}
.wx td.c.z{color:#c3cad6}
.chip{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;white-space:nowrap;font-weight:600}
.c-full{background:var(--okbg);color:var(--ok)}
.c-partial{background:var(--warnbg);color:var(--warn)}
.c-noevidence{background:var(--badbg);color:var(--bad)}
.c-none{background:var(--nonebg);color:var(--none)}
.lvl{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:28px;padding:0 9px;border-radius:9px;background:var(--c,#3b3fb6);color:#fff;font-weight:700;font-size:13.5px}
.lvl.zero{background:#c3cad6}
/* ---------- section banner & indicator cards ---------- */
.banner{border-radius:18px;padding:18px 22px;color:#fff;margin-bottom:16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;
  background:linear-gradient(120deg,var(--c),color-mix(in srgb,var(--c) 55%,#1e2a5a))}
.banner .num{width:54px;height:54px;border-radius:14px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:800}
.banner h2{margin:0;font-size:22px}
.banner .sub{opacity:.92;font-size:14px}
.banner .sc{margin-left:auto;text-align:right}
.banner .sc b{font-size:28px}
.ind-card{display:grid;grid-template-columns:62px 1fr auto;gap:14px;align-items:center;cursor:pointer;border-left:5px solid var(--c);transition:box-shadow .15s}
.ind-card:hover{box-shadow:0 8px 22px rgba(22,33,58,.1)}
.ind-card .code{font-weight:800;color:var(--c);font-size:18px}
.ind-card .nm{font-weight:600}
.ind-card .meta{font-size:13px;color:var(--muted);margin-top:3px}
.ind-card .mini{height:6px;margin-top:8px}
/* ---------- buttons & forms ---------- */
.btn{border:1px solid var(--indigo);background:var(--indigo);color:#fff;border-radius:10px;padding:7px 15px;cursor:pointer;font-size:14px;font-weight:500}
.btn:hover{filter:brightness(1.08)}
.btn.light{background:#fff;color:var(--indigo)}
.btn.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));border-color:var(--gold);color:#3a2600}
.btn.sm{padding:4px 11px;font-size:13px}
.btn.danger{background:#fff;color:var(--bad);border-color:#efb7ba}
.btn:disabled{opacity:.5;cursor:wait}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.f{display:grid;gap:4px;margin-bottom:10px}
.f label{font-size:13px;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{border:1px solid #cdd5e3;border-radius:9px;padding:8px 10px;width:100%;background:#fff}
.f input:focus,.f select:focus,.f textarea:focus{outline:2px solid color-mix(in srgb,var(--indigo) 35%,#fff);border-color:var(--indigo)}
.f textarea{min-height:90px;resize:vertical}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:4px 0}
.chk input{margin-top:5px;width:auto!important;flex:0 0 auto}
.row .chk{white-space:nowrap;margin-right:10px}
/* ---------- info boxes ---------- */
.box{border-radius:11px;padding:10px 13px;margin:8px 0;font-size:14px}
.box ul{margin:4px 0 0;padding-left:20px}
.box.ok{background:var(--okbg);color:#0b5a3e}
.box.gap{background:var(--warnbg);color:#6b3d00}
.box.warn{background:#f2f4f9;color:#38425a}
.box.ai{background:#eef0ff;color:#2a2f8f}
.box.desc{background:color-mix(in srgb,var(--c,#3b3fb6) 8%,#fff);border-left:4px solid var(--c,#3b3fb6);color:#26304a}
.rubric td.cur{background:color-mix(in srgb,var(--c,#3b3fb6) 12%,#fff)}
.rubric td.cur:first-child{box-shadow:inset 4px 0 0 var(--c,#3b3fb6)}
.rubric ul{margin:4px 0 0;padding-left:18px;color:var(--muted);font-size:13.5px}
.lvn{display:inline-flex;width:30px;height:30px;border-radius:50%;align-items:center;justify-content:center;font-weight:700;background:#eef1f7;color:var(--ink)}
td.cur .lvn{background:var(--c,#3b3fb6);color:#fff}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--c,#3b3fb6);color:#fff;border-color:var(--c,#3b3fb6)}
.work{border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin:9px 0;background:#fff;border-left:4px solid var(--c,#3b3fb6)}
.work .wt{font-weight:700}
.work .wd{font-size:13.5px;color:var(--muted);white-space:pre-wrap;margin-top:3px}
.ev{display:inline-flex;gap:6px;align-items:center;font-size:13px;border:1px solid var(--line);border-radius:9px;padding:3px 9px;margin:5px 6px 0 0;background:#fafbfe;max-width:100%;flex-wrap:wrap}
.ev b{color:var(--c,#3b3fb6);font-weight:700}
.ev .x{color:var(--bad);cursor:pointer}
.ev .ed{color:var(--indigo);cursor:pointer}
.note{background:#fbfcff;border:1px dashed #c9d2e4;border-radius:12px;padding:12px 16px;font-size:13.5px;color:#38425a}
.note h4{margin:2px 0 6px;font-size:15px;color:var(--navy)}
.note ul{margin:2px 0 8px;padding-left:20px}
.loading{color:var(--muted);padding:50px;text-align:center}
.tag{font-size:12.5px;color:var(--muted)}
.hr{border-top:1px solid var(--line);margin:14px 0}
.gdef{border-left:5px solid var(--c);}
.gdef h3{color:var(--c)}
/* ---------- modal & toast ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:30px 12px;backdrop-filter:blur(2px)}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:16px;max-width:800px;width:100%;padding:20px 22px;box-shadow:0 20px 50px rgba(0,0,0,.3);border-top:6px solid var(--c,#3b3fb6)}
.modal h3{margin:0 0 12px;color:var(--navy)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#16213a;color:#fff;padding:10px 18px;border-radius:12px;font-size:14px;display:none;z-index:60;max-width:90vw;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.on{display:block}
.toast.err{background:var(--bad)}
/* ---------- report ---------- */
.rpt{background:#fff;padding:22px 26px;border:1px solid var(--line);border-radius:14px;font-size:14px;box-shadow:var(--sh)}
.rpt h1{font-size:21px;margin:0;color:var(--navy)}.rpt .sub{color:#555;margin:2px 0 10px}
.rpt h2{font-size:16px;border-bottom:3px solid var(--indigo);padding-bottom:3px;margin-top:22px;color:var(--navy)}
.rpt h3{font-size:15px;color:var(--indigo);margin:14px 0 6px}
.rpt table{border-collapse:collapse;width:100%;margin:6px 0}
.rpt th,.rpt td{border:1px solid #cfd6e4;padding:5px 7px;vertical-align:top;text-align:left}
.rpt th{background:#eef1fa}.rpt .n{text-align:right}.rpt .hl td{background:#fff6dc}
.rpt .ind{border:1px solid #dde3ef;border-radius:8px;padding:7px 11px;margin:8px 0;page-break-inside:avoid}
.rpt .ih{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.rpt .ih span{color:var(--indigo);font-weight:600}
.rpt .ok{color:var(--ok);margin:4px 0}.rpt .gap{color:var(--warn);margin:4px 0}.rpt .bad{color:var(--bad)}
.rpt .d{color:#555;font-size:12.5px;margin:3px 0}
.rpt .note{margin-top:6px}.rpt .foot{color:#777;font-size:11px;margin-top:14px}
/* ---------- responsive ---------- */
@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:880px){
  .top{position:static}
  .shell{grid-template-columns:1fr}
  .side{position:static;height:auto;display:flex;overflow-x:auto;gap:4px;padding:8px;border-right:0;border-bottom:1px solid var(--line)}
  .side .h,.side a .s{display:none}
  .side a{white-space:nowrap;flex:0 0 auto}
  main{padding:16px}
  .g2,.g3{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center}
  .ind-card{grid-template-columns:1fr auto}
  .ind-card .code{grid-column:1/-1}
  .tblwrap{overflow-x:auto}
}
@media (max-width:520px){.g4,.kpis{grid-template-columns:1fr 1fr}.ctrls select{max-width:180px}.gc .sc{font-size:26px}}
@media print{
  .top,.side,.noprint,.btn{display:none!important}
  .shell{display:block} main{padding:0} body{background:#fff}
  .rpt{border:0;padding:0;box-shadow:none}
}

.who{font-size:13.5px;opacity:.95;margin-right:4px}
#userBox{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hero .avatar,.avatar{width:96px;height:96px;border-radius:28px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#3a2600;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.2)}
.tile{border-top:5px solid var(--c)}
.tile .ti{width:52px;height:52px;border-radius:14px;background:color-mix(in srgb,var(--c) 14%,#fff);color:var(--c);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:800;margin-bottom:6px}
.course{cursor:pointer;position:relative;overflow:hidden;transition:transform .15s,box-shadow .15s;padding-top:20px}
.course:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(22,33,58,.12)}
.course .cbar{position:absolute;inset:0 0 auto 0;height:8px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 40%,#fff))}
.course h3{color:var(--c)}
.course .code{margin-top:10px;display:inline-block;font-weight:800;letter-spacing:3px;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);padding:3px 12px;border-radius:9px}
.lrow{display:flex;align-items:center;gap:12px;padding:11px 14px;margin-bottom:8px;cursor:pointer;border-left:4px solid var(--c,#3b3fb6);border-radius:12px;background:#fff;flex-wrap:wrap}
.card.lrow{padding:12px 16px}
div.lrow:not(.card){border:1px solid var(--line);border-left:4px solid var(--c,#3b3fb6)}
.lrow:hover{background:#f7f8fd}
.lnum{width:34px;height:34px;border-radius:50%;background:#eef1f7;display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 auto;font-size:13px}
.lnum.done{background:var(--ok);color:#fff}
.tabs.big button{padding:8px 16px;font-size:14px;font-weight:600}
.kpic b{display:block;font-size:24px;color:var(--c,#3b3fb6)}
.qz{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:10px 0;background:#fbfcff}
.qin{flex:1;border:1px solid #cdd5e3;border-radius:8px;padding:6px 9px;width:100%;margin:4px 0}
.qz .chk{align-items:center}
.aibar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:linear-gradient(90deg,#eef0ff,#fff6dc);border:1px solid #d9dcff;border-radius:12px;padding:8px 10px;margin:4px 0 10px}
.aibar b{color:#3b3fb6;font-size:13.5px}
.aibar input{border:1px solid #cdd5e3;border-radius:8px;padding:6px 9px;flex:1;min-width:140px}
.swatch{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.swatch input{margin:0;accent-color:#fff}
.video{position:relative;padding-top:56.25%;border-radius:12px;overflow:hidden;background:#000;margin-bottom:14px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.md h3,.md h4,.md h5{color:var(--navy);margin:14px 0 6px}
.md p{margin:6px 0}
.md ul,.md ol{margin:4px 0 8px;padding-left:22px}
.md table{margin:8px 0}
.pfbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:14px;font-size:13.5px}
.pfbar select{border:1px solid #cdd5e3;border-radius:999px;padding:4px 10px;max-width:280px}
.files{margin:6px 0}
.gb td.cell{cursor:pointer}
.gb td.cell:hover{background:#eef0ff}
details.card summary{cursor:pointer}
@media (max-width:880px){.hero .avatar{width:72px;height:72px;font-size:32px}}
</style>
</head>
<body>
  <header class="top">
    <div class="brand" data-act="go" data-v="home" style="cursor:pointer">
      <div class="logo">มรย.</div>
      <div><div class="t1" id="sysName">ห้องเรียนออนไลน์</div><div class="t2" id="ownerLine">กำลังโหลด…</div></div>
    </div>
    <div id="userBox"></div>
  </header>
  <div class="shell">
    <nav class="side" id="nav"></nav>
    <main id="main"><div class="loading">กำลังโหลด…</div></main>
  </div>
  <div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>
  <script>
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (ok, no) {
    var r = google.script.run.withSuccessHandler(ok).withFailureHandler(no);
    r[fn].apply(r, args);
  });
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function fx(n) { return (Math.round((Number(n) || 0) * 100) / 100).toLocaleString('th-TH'); }
function toast(msg, err) { var t = $('toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : ''); clearTimeout(t._h); t._h = setTimeout(function () { t.className = 'toast'; }, err ? 6000 : 2800); }
function fail(e) { toast((e && e.message) || String(e), true); }
function ind(code) { return S.boot.indicators.filter(function (i) { return i.code === code; })[0]; }
function sec(n) { return S.boot.sections.filter(function (s) { return s.sec === Number(n); })[0]; }
function an(code) { return S.data.analysis.indicators[code]; }
function gname(k) { return S.boot.groups.filter(function (g) { return g.key === k; })[0].name; }
function evOf(id) { return S.data.evidence.filter(function (e) { return e.workId === id; }); }
function worksOf(code) { return S.data.works.filter(function (w) { return w.code === code; }); }
function chip(st) { return '<span class="chip c-' + st + '">' + STATUS[st] + '</span>'; }
function lvl(a) { return '<span class="lvl' + (a.level ? '' : ' zero') + '">' + (a.level ? fx(a.level) : '–') + '/' + a.maxLevel + '</span>'; }
function pct(v, max) { return max ? Math.max(0, Math.min(100, v / max * 100)) : 0; }
function cv(n) { return '--c:var(--s' + n + ')'; }
function secRow(n) { return S.data.analysis.groups[S.group].sections.filter(function (x) { return x.sec === Number(n); })[0]; }
function relevant(i) { return i.wg[S.group] > 0 || (sec(i.sec).w[S.group] > 0); }
function ring(v, max, color, size) {
  size = size || 138; var r = size / 2 - 10, c = 2 * Math.PI * r, p = pct(v, max) / 100;
  return '<div class="ring" style="width:' + size + 'px;height:' + size + 'px"><svg width="' + size + '" height="' + size + '"><circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="12"/>' +
    '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (c * p) + ' ' + c + '"/></svg>' +
    '<div class="v"><b>' + fx(v) + '</b><span>จาก ' + max + ' คะแนน</span></div></div>';
}


/* ====================== Dashboard ====================== */

  var a70 = 0, b30 = 0; g.sections.forEach(function (r) { if (r.sec <= 6) a70 += r.score; else b30 += r.score; });
  h.push('<div class="hero">' + ring(g.total, 100, '#ffd56b') + '<div><h2>' + esc(gname(S.group)) + '</h2><div class="sub">' + esc(pr ? pr.label : S.period) +

  h.push('<div class="grid g4">');
  var best = S.boot.groups.slice().sort(function (x, y) { return A.groups[y.key].total - A.groups[x.key].total; })[0];
  S.boot.groups.forEach(function (gg) {

      (gg.key === S.boot.settings.PREFERRED_GROUP ? '<span class="badge">กลุ่มที่เลือก</span>' : '') +

  h.push('<div class="grid g2" style="margin-top:16px"><div class="card"><h3>คะแนนรายด้าน</h3><table class="t">');
  g.sections.forEach(function (r) {
    h.push('<tr class="click" style="' + cv(r.sec) + '" data-act="go" data-v="section" data-p="' + r.sec + '"><td><span class="lvl" style="min-width:28px;height:24px;font-size:12px">' + r.sec + '</span> ' + esc(r.name) +
      (r.basis === 'assumed-max' ? ' <span class="tag">*ด้านรอง</span>' : '') + '<div class="bar" style="margin-top:6px"><i style="width:' + pct(r.score, r.weight) + '%"></i></div></td><td class="n"><b>' + fx(r.score) + '</b>/' + r.weight + '</td></tr>');
  });
  h.push('</table></div>');

  var todo = rel.map(function (i) { var a = an(i.code); return { i: i, a: a, gain: (i.wg[S.group] || 0) - (a.points[S.group] || 0) }; })
    .filter(function (x) { return x.a.status !== 'full' && x.gain > 0; }).sort(function (x, y) { return y.gain - x.gain; }).slice(0, 8);
  h.push('<div class="card"><h3>สถานะตัวชี้วัด (' + rel.length + ')</h3><div class="row" style="margin-bottom:12px">' +

    (todo.length ? '<table class="t">' + todo.map(function (x) {
      return '<tr class="click" style="' + cv(x.i.sec) + '" data-act="go" data-v="indicator" data-p="' + x.i.code + '"><td><b style="color:var(--c)">' + x.i.code + '</b> ' + esc(x.i.name) + '<div class="tag">' + esc(x.a.gaps[0] || x.a.warnings[0] || '') + '</div></td><td class="n"><span class="chip c-partial">+' + fx(x.gain) + '</span></td></tr>';
    }).join('') + '</table>' : '<p class="tag">ไม่มีรายการค้าง</p>') + '</div></div>');

}

/* ====================== Section ====================== */
function vSection(n) {
  n = Number(n); var s = sec(n), h = [], r = secRow(n);

    '<div class="sc"><b>' + fx(r ? r.score : 0) + '</b> / ' + (s.w[S.group] || 0) + '<div class="sub">คะแนนที่ได้</div><button class="btn-top" style="margin-top:6px" data-act="secReport" data-p="' + n + '">รายงานด้านนี้ (PDF/Word/Excel)</button></div></div>');

      '<div><div class="nm">' + esc(i.name) + '</div><div class="meta">' + chip(a.status) + ' &nbsp;ผลงาน ' + a.workCount + ' · หลักฐาน ' + a.evidenceCount + ' · ' + esc(i.unit || 'Milestone') + '</div>' +

  });

/* ====================== Indicator ====================== */

  var i = ind(code), a = an(code), h = [], w = i.wg[S.group];
  h.push('<div style="' + cv(i.sec) + '">');
  h.push('<div class="tag"><a data-act="go" data-v="section" data-p="' + i.sec + '" href="javascript:void 0">' + i.sec + '. ' + esc(sec(i.sec).name) + '</a> › ตัวชี้วัด ' + i.code + '</div>');
  h.push('<h2 class="pg"><span style="color:var(--c)">' + i.code + '</span> ' + esc(i.name) + '</h2>');
  h.push('<p class="lead">หน่วยวัด: ' + esc(i.unit || 'Milestone') + ' · ประกาศหน้า ' + i.page + (w ? ' · น้ำหนักใน' + gname(S.group) + ' <b>' + w + '</b> คะแนน' : ' · ไม่มีน้ำหนักโดยตรงใน' + gname(S.group)) + '</p>');
  if (i.desc) h.push('<div class="box desc"><b>คำอธิบาย:</b> ' + esc(i.desc) + '</div>');

  h.push('<div class="grid g2"><div class="card accent"><h3>ผลการวิเคราะห์และคะแนน</h3><div class="row" style="margin-bottom:6px">' + lvl(a) + ' ' + chip(a.status) +
    '<span class="tag">' + (a.finalLevel != null ? 'ผู้ประเมินยืนยันระดับ ' + fx(a.finalLevel) + ' (ระบบแนะนำ ' + fx(a.autoLevel) + ')' : 'ระดับที่ระบบแนะนำ') + '</span>' +

  if (a.value != null) h.push('<div class="tag">ค่าที่ใช้คำนวณ: ' + (i.mode === 'mean' ? a.value.toFixed(2) : Number(a.value).toLocaleString('th-TH') + ' บาท') + '</div>');
  if (a.reasons.length) h.push('<div class="box ok"><b>เหตุผล</b><ul>' + a.reasons.map(li).join('') + '</ul></div>');
  if (a.gaps.length) h.push('<div class="box gap"><b>ช่องว่างสู่ระดับถัดไป</b><ul>' + a.gaps.map(li).join('') + '</ul></div>');
  if (a.warnings.length) h.push('<div class="box warn"><b>ข้อควรระวัง</b><ul>' + a.warnings.map(li).join('') + '</ul></div>');
  if (a.finalNote) h.push('<div class="box warn"><b>บันทึกผู้ประเมิน:</b> ' + esc(a.finalNote) + '</div>');
  var ai = S.data.ai[code];
  if (ai && ai.result) h.push(aiBox(ai));
  if (isT()) h.push('<div class="row noprint" style="margin-top:8px">' + (S.boot.aiReady ? '<button class="btn sm light" data-act="ai" data-p="' + code + '">วิเคราะห์ด้วย AI</button>' : '<span class="tag">AI ยังไม่ได้ตั้งค่า (ใช้เครื่องวิเคราะห์ตามกติกา)</span>') +
    '<span class="sp"></span><button class="btn sm" data-act="final" data-p="' + code + '">ผู้ประเมินยืนยันระดับ</button></div>');
  h.push(evidenceCheck(i));
  h.push('</div><div class="card accent"><h3>เกณฑ์การให้คะแนน</h3>' + rubricTable(i, a) + '</div></div>');

  if (i.comps) h.push('<div class="card accent tblwrap" style="margin-top:14px"><h3>องค์ประกอบ แนวทางการประเมิน และเอกสารหลักฐาน</h3><table class="t"><tr><th>องค์ประกอบ</th><th>แนวทางการประเมิน</th><th>เอกสารหลักฐาน</th></tr>' +
    i.comps.map(function (c, k) { var got = compGot(i, k); return '<tr><td><b>' + (k + 1) + '.</b> ' + esc(c[0]) + (got ? ' <span class="chip c-full">มีหลักฐาน</span>' : '') + '</td><td>' + esc(c[1]) + '</td><td>' + esc(c[2]).split('; ').join('<br>• ').replace(/^/, '• ') + '</td></tr>'; }).join('') + '</table></div>');
  if (i.examples) h.push(examplesCard(i, a));
  if (i.ev || i.note || i.source) h.push('<div class="card accent" style="margin-top:14px"><h3>หลักฐานที่ควรแนบและข้อกำหนด</h3>' +
    (i.ev ? '<div class="box warn"><b>หลักฐานที่ควรแนบ:</b> ' + esc(i.ev) + '</div>' : '') +
    (i.note ? '<div class="box gap"><b>หมายเหตุในประกาศ:</b> ' + esc(i.note) + '</div>' : '') +
    (i.source ? '<div class="box warn"><b>แหล่งข้อมูล/วิธีจัดเก็บ:</b><ul>' + i.source.map(li).join('') + '</ul></div>' : '') + '</div>');

  var ws = worksOf(code);
  h.push('<div class="card accent" style="margin-top:14px"><div class="row"><h3 style="margin:0">ผลงานและหลักฐาน (' + ws.length + ')</h3><span class="sp"></span>' +
    (ws.length ? '<button class="btn sm light" data-act="zip" data-p="' + code + '">ดาวน์โหลดหลักฐาน (ZIP)</button>' : '') +
    (isT() ? '<button class="btn sm" style="background:var(--c);border-color:var(--c)" data-act="newWork" data-p="' + code + '">+ เพิ่มผลงาน</button>' : '') + '</div>');
  if (!ws.length) h.push('<p class="tag">ยังไม่มีผลงานในตัวชี้วัดนี้</p>');
  ws.forEach(function (wk) { h.push(workCard(wk, i)); });
  h.push('</div></div>');
  return h.join('');
}
function li(x) { return '<li>' + esc(x) + '</li>'; }
function compGot(i, k) {
  return worksOf(i.code).some(function (w) { return evOf(w.id).length && (w.items || []).map(Number).indexOf(k) >= 0; });
}
function evidenceCheck(i) {
  var types = {};
  worksOf(i.code).forEach(function (w) { evOf(w.id).forEach(function (e) { types[e.type] = (types[e.type] || 0) + 1; }); });
  var keys = Object.keys(types);
  return '<div class="hr"></div><b style="font-size:14px">ประเภทหลักฐานที่แนบแล้ว</b><div>' + (keys.length ? keys.map(function (k) { return '<span class="ev"><b>' + esc(k) + '</b> ' + types[k] + ' รายการ</span>'; }).join('') : '<span class="tag">ยังไม่มี</span>') + '</div>';
}
function rubricTable(i, a) {
  var cur = Math.floor(a.level || 0), rows = [];
  if (i.mode === 'add') {
    return '<table class="t rubric"><tr><th>ข้อ</th><th>เกณฑ์</th><th class="n">คะแนน</th></tr>' + i.items.map(function (t, k) {
      var got = compGot(i, k);
      return '<tr><td' + (got ? ' class="cur"' : '') + '><span class="lvn">' + (k + 1) + '</span></td><td' + (got ? ' class="cur"' : '') + '>' + esc(t) + '</td><td class="n">' + i.itemPts[k] + '</td></tr>';
    }).join('') + '<tr><td></td><td><b>รวมไม่เกิน</b></td><td class="n"><b>' + i.w + '</b></td></tr></table>';
  }
  if (i.items && !i.comps) {
    rows.push('<tr><th colspan="2">รายการ/ข้อที่ใช้นับ</th></tr>');
    i.items.forEach(function (t, k) { rows.push('<tr><td><span class="lvn">' + (k + 1) + '</span></td><td>' + esc(t) + (compGot(i, k) ? ' <span class="chip c-full">มีหลักฐาน</span>' : '') + '</td></tr>'); });
    rows.push('<tr><th colspan="2">ระดับคะแนน</th></tr>');
  }
  i.lv.forEach(function (t, k) {
    var txt = i.opts ? i.opts.filter(function (o) { return o.lv === k + 1; }).map(function (o) { return esc(o.t); }).join('<br>') : esc(t);
    var bl = i.bullets && i.bullets[k] ? '<ul>' + i.bullets[k].map(li).join('') + '</ul>' : '';
    var c = cur === k + 1 ? ' class="cur"' : '';
    rows.push('<tr><td' + c + ' style="width:70px"><span class="lvn">' + (k + 1) + '</span>' + (i.pts ? '<div class="tag">' + i.pts[k] + ' คะแนน</div>' : '') + '</td><td' + c + '>' +
      (i.mode === 'comp' && k > 0 ? '<span class="tag">แสดงสมรรถนะระดับที่ ' + k + ' และ</span> ' : '') + '<b>' + txt + '</b>' + bl + '</td></tr>');
  });
  return '<table class="t rubric">' + rows.join('') + '</table>' + (i.mode === 'comp' ? '<p class="tag">Milestone สะสม: ระดับที่สูงกว่าต้องแสดงพฤติกรรมของระดับก่อนหน้าครบ</p>' : '');
}

function isS() { return S.role === 'student'; }
function isV() { return S.role === 'viewer'; }
function canPf() { return isT() || isV(); }
function store(k, v) { try { if (v == null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
function guessFaculty(f) {
  f = String(f || '');
  var m = S.boot ? S.boot.faculties.filter(function (x) { return f && x.indexOf(f.replace('คณะ', '').trim().slice(0, 6)) >= 0; })[0] : null;
  return m || (S.boot ? S.boot.faculties[1] : null);
}

function init() {
  document.addEventListener('click', onAct);
  $('modalBg').addEventListener('click', function (e) { if (e.target.id === 'modalBg') closeModal(); });
  call('getBootstrap').then(function (b) {
    S.boot = b; S.group = b.settings.PREFERRED_GROUP || 'tch'; S.period = b.settings.ACTIVE_PERIOD || (b.periods[0] && b.periods[0].id); S.fac = guessFaculty(b.settings.FACULTY);
    $('sysName').textContent = 'ห้องเรียนออนไลน์ ' + (b.settings.OWNER_NAME || '');
    $('ownerLine').textContent = [b.settings.POSITION, b.settings.FACULTY].filter(Boolean).join(' · ') || 'มหาวิทยาลัยราชภัฏยะลา';
    var t = load('tk'), r = load('role');
    if (t && r) { S.token = t; S.role = r; S.me = { name: load('name') || '' }; }
    if (b.isAdmin && S.role !== 'teacher') S.role = 'guest';
    return afterLogin();
  }).catch(fail);
}
function afterLogin() {
  userChip();
  if (isT()) return Promise.all([loadLms(), ensurePf()]).then(function () { go('thome'); }).catch(authFail);
  if (isV()) return ensurePf().then(function () { go('pfhome'); }).catch(authFail);
  if (isS()) return loadStu().then(function () { go('shome'); }).catch(authFail);
  go('home'); return Promise.resolve();
}
function authFail(e) { fail(e); logout(true); }
function userChip() {
  var h = isT() ? '<span class="who">อาจารย์ ●</span><button class="btn-top" data-act="logout">ออกจากระบบ</button>'
    : isV() ? '<span class="who">ผู้ประเมิน (ดูอย่างเดียว)</span><button class="btn-top" data-act="logout">ออกจากระบบ</button>'
    : isS() ? '<span class="who">' + esc(S.me && S.me.name || 'นักศึกษา') + '</span><button class="btn-top" data-act="logout">ออกจากระบบ</button>'
    : '<button class="btn-top" data-act="go" data-v="stuAuth">นักศึกษาเข้าสู่ระบบ</button><button class="btn-top" data-act="tLogin">อาจารย์</button>';
  $('userBox').innerHTML = h;
}
function setAuth(role, token, name) { S.role = role; S.token = token; S.me = { name: name }; store('tk', token); store('role', role); store('name', name); }
function logout(silent) { S.tab = {}; S.role = 'guest'; S.token = null; S.me = null; S.lms = null; S.stu = null; store('tk'); store('role'); store('name'); userChip(); go('home'); if (!silent) toast('ออกจากระบบแล้ว'); }
function ensurePf() {
  if (S.data && S.data.period === S.period) return Promise.resolve();
  return call('pfData', S.token, S.period).then(function (d) { S.data = d; });
}
function loadLms() { return call('lmsTeacherData', S.token).then(function (d) { S.lms = d; }); }
function loadStu() { return call('stuData', S.token).then(function (d) { S.stu = d; S.me = d.me; }); }
function refresh(msg) { return ensurePfForce().then(function () { render(); if (msg) toast(msg); }).catch(fail); }
function ensurePfForce() { return call('pfData', S.token, S.period).then(function (d) { S.data = d; }); }
function reLms(msg) { return loadLms().then(function () { render(); if (msg) toast(msg); }).catch(fail); }
function reStu(msg) { return loadStu().then(function () { render(); if (msg) toast(msg); }).catch(fail); }

var PF_VIEWS = { pfhome: 1, framework: 1, section: 1, indicator: 1, report: 1, works: 1, settings: 1 };
function go(view, param) {
  S.view = view; S.param = param;
  if (PF_VIEWS[view] && !canPf()) { S.view = 'home'; render(); return; }
  if ((view === 'works' || view === 'settings') && !isT()) { S.view = canPf() ? 'pfhome' : 'home'; render(); return; }
  if (PF_VIEWS[view] && !(S.data && S.data.period === S.period)) {
    $('main').innerHTML = '<div class="loading">กำลังประมวลผลแฟ้มประเมิน…</div>';
    ensurePf().then(function () { render(); }).catch(fail);
    renderNav(); return;
  }
  render(); window.scrollTo(0, 0);
}
function render() {
  renderNav();
  var V = {
    home: vLanding, stuAuth: vStuAuth,
    pfhome: vPfHome, framework: vFramework, section: vSection, indicator: vIndicator, report: vReport, works: vWorks, settings: vSettings,
    shome: vSHome, scourse: vSCourse, slesson: vSLesson, sitem: vSItem,
    thome: vTHome, tcourses: vTCourses, tcourse: vTCourse, titem: vTItem, tpending: vTPending, tstudents: vTStudents
  };
  var v = V[S.view] || vLanding;
  if (/^(works|settings|thome|tcourses|tcourse|titem|tpending|tstudents)$/.test(S.view) && !isT()) v = canPf() ? vPfHome : vLanding;
  if (PF_VIEWS[S.view] && !canPf()) v = vLanding;
  if (/^s(home|course|lesson|item)$/.test(S.view) && !isS()) v = vStuAuth;
  try { $('main').innerHTML = (PF_VIEWS[S.view] ? pfBar() : '') + v(S.param); }
  catch (e) { $('main').innerHTML = '<div class="card">เกิดข้อผิดพลาดในการแสดงผล: ' + esc(e.message) + '</div>'; console.error(e); }
  if (S.view === 'report') loadReport();
  if (S.after) { var f = S.after; S.after = null; f(); }
}
function pfBar() {
  return '<div class="pfbar noprint"><span class="tag">แฟ้มประเมิน:</span><label>รอบ <select onchange="S.period=this.value;S.data=null;go(S.view,S.param)">' +
    S.boot.periods.map(function (p) { return '<option value="' + esc(p.id) + '"' + (p.id === S.period ? ' selected' : '') + '>' + esc(p.label) + '</option>'; }).join('') +
    '</select></label><label>กลุ่ม <select onchange="S.group=this.value;render()">' + S.boot.groups.map(function (g) { return '<option value="' + g.key + '"' + (g.key === S.group ? ' selected' : '') + '>' + g.name + '</option>'; }).join('') + '</select></label></div>';
}

/* ---------------- Markdown & media ---------------- */
function md(src) {
  var lines = String(src || '').replace(/\r/g, '').split('\n'), out = [], list = null, tbl = null;
  var inline = function (t) {
    t = esc(t);
    t = t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/(^|[^*])\*([^*]+)\*/g, '$1<i>$2</i>');
    t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank">$1</a>');
    t = t.replace(/(^|\s)(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank">$2</a>');
    return t;
  };
  var flush = function () { if (list) { out.push('</' + list + '>'); list = null; } if (tbl) { out.push('</table>'); tbl = null; } };
  lines.forEach(function (ln) {
    var m;
    if (/^\s*\|.*\|\s*$/.test(ln)) {
      if (/^\s*\|[\s:\-|]+\|\s*$/.test(ln)) return;
      if (list) { out.push('</' + list + '>'); list = null; }
      var cells = ln.trim().slice(1, -1).split('|');
      if (!tbl) { out.push('<table class="t mdt">'); tbl = 1; out.push('<tr>' + cells.map(function (c) { return '<th>' + inline(c.trim()) + '</th>'; }).join('') + '</tr>'); }
      else out.push('<tr>' + cells.map(function (c) { return '<td>' + inline(c.trim()) + '</td>'; }).join('') + '</tr>');
      return;
    }
    if ((m = ln.match(/^\s*[-*•]\s+(.*)/))) { if (tbl) flush(); if (list !== 'ul') { flush(); out.push('<ul>'); list = 'ul'; } out.push('<li>' + inline(m[1]) + '</li>'); return; }
    if ((m = ln.match(/^\s*\d+[.)]\s+(.*)/))) { if (tbl) flush(); if (list !== 'ol') { flush(); out.push('<ol>'); list = 'ol'; } out.push('<li>' + inline(m[1]) + '</li>'); return; }
    flush();
    if ((m = ln.match(/^(#{1,4})\s+(.*)/))) out.push('<h' + (m[1].length + 2) + '>' + inline(m[2]) + '</h' + (m[1].length + 2) + '>');
    else if (ln.trim()) out.push('<p>' + inline(ln) + '</p>');
  });
  flush();
  return '<div class="md">' + out.join('') + '</div>';
}
function videoEmbed(url) {
  if (!url) return '';
  var m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([\w-]{11})/);
  if (m) return '<div class="video"><iframe src="https://www.youtube-nocookie.com/embed/' + m[1] + '" allowfullscreen allow="accelerometer; encrypted-media; gyroscope; picture-in-picture"></iframe></div>';
  var d = url.match(/drive\.google\.com\/file\/d\/([\w-]+)/);
  if (d) return '<div class="video"><iframe src="https://drive.google.com/file/d/' + d[1] + '/preview" allowfullscreen></iframe></div>';
  return '<p><a class="btn light" href="' + esc(url) + '" target="_blank">▶ เปิดวิดีโอ</a></p>';
}
function fileList(files, manage, lessonId) {

    return '<span class="ev"><b>' + icon + '</b> <a href="' + esc(f.url) + '" target="_blank">' + esc(f.name) + '</a>' +

  }).join('') + '</div>';
}

function busy(btn, on) { if (btn) btn.disabled = on; }
function onAct(e) {

  if (!el) return;
  var act = el.getAttribute('data-act'), p = el.getAttribute('data-p');
  if (act === 'go') { e.preventDefault(); go(el.getAttribute('data-v'), p || null); return; }
  if (ACTIONS[act]) { e.preventDefault(); ACTIONS[act](p, el); }
}
function exportCall(el, pr) {

  pr.then(function (r) {

  }).catch(function (x) { busy(el, false); el.textContent = t; fail(x); });
}

  tLogin: function () {

    setTimeout(function () { $('t_pw').focus(); $('t_pw').onkeydown = function (e) { if (e.key === 'Enter') ACTIONS.tDoLogin(null, null); }; }, 50);
  },
  vLogin: function () {
    openModal('<h3>ผู้ประเมิน/กรรมการ เข้าดูแฟ้มผลงาน</h3>' + fld('v_code', 'รหัสเข้าถึง (ได้รับจากอาจารย์)', 'password') + '<p class="tag">ดูได้อย่างเดียว แก้ไขข้อมูลไม่ได้</p><div class="row"><span class="sp"></span><button class="btn light" data-act="close">ยกเลิก</button><button class="btn" data-act="vDoLogin">เข้าดู</button></div>');
    setTimeout(function () { $('v_code').focus(); }, 50);
  },

function stuCourse(cid) { return S.stu.courses.filter(function (c) { return c.id === cid; })[0]; }
function stuLessons(cid) { return S.stu.lessons.filter(function (l) { return l.courseId === cid; }).sort(function (a, b) { return a.order - b.order; }); }
function stuItems(cid) { return S.stu.items.filter(function (i) { return i.courseId === cid; }).sort(function (a, b) { return a.order - b.order; }); }
function stuSub(iid) { return S.stu.subs.filter(function (s) { return s.itemId === iid; })[0]; }
function stuSummary(cid) {
  var its = stuItems(cid), max = 0, got = 0, done = 0;
  its.forEach(function (i) { max += i.maxScore; var s = stuSub(i.id); if (s) { done++; if (s.score !== '' && s.score != null) got += Number(s.score); } });
  var ls = stuLessons(cid), lsDone = ls.filter(function (l) { return S.stu.progress.indexOf(l.id) >= 0; }).length;

  return { max: max, got: Math.round(got * 100) / 100, pct: pct, grade: gradeOf(pct, S.stu.gradeScale), items: its.length, done: done, lessons: ls.length, lsDone: lsDone };

function L() { return S.lms; }
function tCourse(cid) { return L().courses.filter(function (c) { return c.id === cid; })[0]; }
function tLessons(cid) { return L().lessons.filter(function (l) { return l.courseId === cid; }).sort(function (a, b) { return a.order - b.order; }); }
function tItems(cid) { return L().items.filter(function (i) { return i.courseId === cid; }).sort(function (a, b) { return a.order - b.order; }); }
function tEnrolled(cid) { var ids = L().enrollments.filter(function (e) { return e.courseId === cid; }).map(function (e) { return e.sid; }); return L().students.filter(function (s) { return ids.indexOf(s.id) >= 0; }).sort(function (a, b) { return String(a.studentId).localeCompare(String(b.studentId)); }); }

  it = it || { courseId: cid, type: type || 'assignment', maxScore: 10, published: true, quiz: [] };
  var c = tCourse(cid);
  S._quiz = JSON.parse(JSON.stringify(it.quiz || []));
  openModal('<h3>' + (it.id ? 'แก้ไข' : 'สร้าง') + ' ' + { assignment: 'ใบงาน/งานส่ง', quiz: 'แบบทดสอบ', activity: 'กิจกรรม' }[it.type] + ' — ' + esc(c.title) + '</h3>' +
    '<input type="hidden" id="i_type" value="' + it.type + '">' + fld('i_title', 'ชื่องาน *', 'text', it.title) +
    '<div class="grid g3"><div class="f"><label>คะแนนเต็ม</label><input id="i_max" type="number" min="0" step="0.5" value="' + esc(it.maxScore) + '"></div>' + fld('i_due', 'กำหนดส่ง', 'date', it.dueDate) +
    '<div class="f"><label>ผูกกับบทเรียน</label><select id="i_lesson"><option value="">— ไม่ผูก —</option>' + tLessons(cid).map(function (l) { return '<option value="' + l.id + '"' + (l.id === it.lessonId ? ' selected' : '') + '>' + esc(l.title) + '</option>'; }).join('') + '</select></div></div>' +
    (it.type === 'quiz' ? '' : aiBar(it.type === 'assignment' ? 'worksheet' : 'activity', it.type === 'assignment' ? 'ออกแบบใบงาน' : 'ออกแบบกิจกรรม')) +
    '<div class="f"><label>คำชี้แจง/คำสั่งงาน/เกณฑ์ ' + (S.boot.aiReady && it.type !== 'quiz' ? '<a href="javascript:void 0" data-act="aiRubric">+ AI สร้าง rubric</a>' : '') + '</label><textarea id="i_ins" style="min-height:140px">' + esc(it.instructions || '') + '</textarea></div>' +
    (it.type === 'quiz' ? aiBar('quiz', 'ออกข้อสอบ') + '<div id="qzBox"></div><button class="btn sm light" data-act="qzAdd">+ เพิ่มข้อ</button>' : '') +
    '<label class="chk"><input type="checkbox" id="i_pub"' + (it.published ? ' checked' : '') + '> เผยแพร่ให้นักศึกษาเห็น</label>' +
    '<div class="row"><span class="sp"></span><button class="btn light" data-act="close">ปิด</button><button class="btn gold" data-act="itemSave" data-p="' + (it.id || '') + '">บันทึก</button></div>', c.color);
  S._editing = { kind: 'item', courseId: cid, id: it.id, type: it.type };
  if (it.type === 'quiz') qzRender();
}
function qzRender() {
  var box = $('qzBox'); if (!box) return;
  box.innerHTML = S._quiz.map(function (q, k) {
    while (q.choices.length < 4) q.choices.push('');
    return '<div class="qz"><div class="row"><b>ข้อ ' + (k + 1) + '</b><span class="sp"></span><label class="tag">คะแนน <input type="number" min="0" step="0.5" value="' + (q.points || 1) + '" style="width:60px" oninput="S._quiz[' + k + '].points=Number(this.value)"></label><span class="x" data-act="qzDel" data-p="' + k + '">✕ ลบ</span></div>' +
      '<input class="qin" value="' + esc(q.q) + '" placeholder="คำถาม" oninput="S._quiz[' + k + '].q=this.value">' + q.choices.map(function (ch, j) {
        return '<label class="chk"><input type="radio" name="qa' + k + '"' + (Number(q.answer) === j ? ' checked' : '') + ' onchange="S._quiz[' + k + '].answer=' + j + '" title="เฉลย"> <input class="qin" value="' + esc(ch) + '" placeholder="ตัวเลือก ' + (j + 1) + '" oninput="S._quiz[' + k + '].choices[' + j + ']=this.value"></label>';
      }).join('') + '</div>';
  }).join('') || '<p class="tag">ยังไม่มีข้อสอบ — เพิ่มเองหรือให้ AI ช่วยออกข้อสอบ (เลือกวงกลมหน้าตัวเลือกที่ถูก = เฉลย)</p>';
}
function stuReportModal(sid) {
  var cid = S._course, st = tStudent(sid);
  openModal('<div class="row"><h3 style="margin:0">รายงานรายบุคคล — ' + esc(st.name) + '</h3><span class="sp"></span><button class="btn sm light" data-act="stuRptPdf" data-p="' + sid + '">ดาวน์โหลด PDF</button><button class="btn sm light" data-act="close">ปิด</button></div><div id="srBox" style="margin-top:10px"><div class="loading">กำลังโหลด…</div></div>', tCourse(cid).color);
  call('teacherStudentReport', S.token, cid, sid).then(function (h) { $('srBox').innerHTML = h; }).catch(fail);
}

/* ---------------- LMS actions ---------------- */
var LMS_ACTIONS = {
  /* student */
  sJoin: function (p, el) { busy(el, true); call('stuJoin', S.token, v_('j_code')).then(function (t) { busy(el, false); reStu('เข้าร่วมรายวิชา ' + t + ' แล้ว'); }).catch(function (x) { busy(el, false); fail(x); }); },
  sPw: function () { openModal('<h3>เปลี่ยนรหัสผ่าน</h3>' + fld('pw_old', 'รหัสผ่านเดิม', 'password') + fld('pw_new', 'รหัสผ่านใหม่ (≥ 6 ตัว)', 'password') + '<div class="row"><span class="sp"></span><button class="btn light" data-act="close">ยกเลิก</button><button class="btn" data-act="sPwSave">บันทึก</button></div>'); },
  sPwSave: function (p, el) { busy(el, true); call('studentChangePassword', S.token, $('pw_old').value, $('pw_new').value).then(function () { closeModal(); toast('เปลี่ยนรหัสผ่านแล้ว'); }).catch(function (x) { busy(el, false); fail(x); }); },
  sQuiz: function (p, el) {
    var it = S.stu.items.filter(function (x) { return x.id === p; })[0], ans = [], miss = 0;
    it.quiz.forEach(function (q, k) { var r = document.querySelector('input[name="q' + k + '"]:checked'); ans.push(r ? Number(r.value) : -1); if (!r) miss++; });
    if (miss && !confirm('ยังไม่ได้ตอบ ' + miss + ' ข้อ ต้องการส่งเลยหรือไม่?')) return;
    busy(el, true);
    call('stuSubmit', S.token, p, { answers: ans }).then(function (r) { reStu('ได้คะแนน ' + r.score + '/' + r.max); }).catch(function (x) { busy(el, false); fail(x); });
  },
  sSubmit: function (p, el) {
    var files = Array.prototype.slice.call($('sb_files').files), text = $('sb_text').value.trim(), old = stuSub(p);
    if (!text && !files.length && !(old && old.files.length)) return toast('กรุณาพิมพ์คำตอบหรือแนบไฟล์', true);
    if (files.some(function (f) { return f.size > 15 * 1024 * 1024; })) return toast('มีไฟล์ใหญ่เกิน 15MB', true);
    busy(el, true);
    var up = [], chain = Promise.resolve();
    files.forEach(function (f) { chain = chain.then(function () { $('sbMsg').textContent = 'กำลังอัปโหลด ' + f.name + '…'; return readB64(f); }).then(function (b) { return call('stuUpload', S.token, p, { name: f.name, mime: f.type }, b); }).then(function (r) { up.push(r); }); });
    chain.then(function () { return call('stuSubmit', S.token, p, { text: text, files: files.length ? up : (old ? old.files : []) }); })
      .then(function () { reStu('ส่งงานเรียบร้อย'); }).catch(function (x) { busy(el, false); fail(x); });
  },
  sReportPdf: function (p, el) { exportCall(el, call('stuReportPdf', S.token, p)); },
  /* teacher: course */
  courseNew: function () { openModal('<h3>สร้างรายวิชาใหม่</h3>' + courseFields(null) + '<div class="row"><span class="sp"></span><button class="btn light" data-act="close">ยกเลิก</button><button class="btn gold" data-act="courseSave">สร้างรายวิชา</button></div>'); },
  courseSave: function (p, el) {
    var c = collectCourse(p); busy(el, true);
    call('saveCourse', S.token, c).then(function (id) { closeModal(); return loadLms().then(function () { S.tab.tc = p ? 'set' : 'lessons'; go('tcourse', id); toast('บันทึกรายวิชาแล้ว'); }); }).catch(function (x) { busy(el, false); fail(x); });
  },
  courseDel: function (p) { if (!confirm('ลบรายวิชานี้ พร้อมบทเรียน งาน คะแนน และการลงทะเบียนทั้งหมด?')) return; call('deleteCourse', S.token, p).then(function () { return loadLms(); }).then(function () { go('tcourses'); toast('ลบแล้ว'); }).catch(fail); },
  copyInvite: function (p) {
    var c = tCourse(p), txt = 'เชิญเข้าเรียนรายวิชา ' + c.title + '\nเข้าเว็บ: ' + (S.boot.url || '') + '\nลงทะเบียนนักศึกษา แล้วกรอกรหัสเข้าเรียน: ' + c.enrollCode;
    try { navigator.clipboard.writeText(txt).then(function () { toast('คัดลอกคำเชิญแล้ว'); }, function () { prompt('คัดลอกข้อความนี้', txt); }); } catch (e) { prompt('คัดลอกข้อความนี้', txt); }
  },
  toPf: function (p, el) { busy(el, true); call('linkCourseToPortfolio', S.token, S._course, p).then(function (wid) { busy(el, false); S.data = null; toast('บันทึกเป็นผลงานตัวชี้วัด ' + p + ' แล้ว — เลือกระดับที่บรรลุ'); S.after = function () { ACTIONS.editWork(wid); }; go('indicator', p); }).catch(function (x) { busy(el, false); fail(x); }); },
  /* lessons */
  lessonNew: function (p) { lessonForm(p); },
  lessonEdit: function (p) { var l = L().lessons.filter(function (x) { return x.id === p; })[0]; lessonForm(l.courseId, l); },
  lessonDel: function (p) { if (confirm('ลบบทเรียนนี้?')) call('deleteLesson', S.token, p).then(function () { reLms('ลบแล้ว'); }).catch(fail); },
  lessonSave: function (p, el) {
    var e = S._editing, l = { id: p, courseId: e.courseId, title: v_('l_title'), videoUrl: v_('l_video'), order: v_('l_order'), content: $('l_content').value, published: $('l_pub').checked };
    if (!l.title) return toast('กรุณาระบุชื่อบทเรียน', true);
    busy(el, true);
    call('saveLesson', S.token, l).then(function (id) { return loadLms().then(function () { render(); lessonForm(e.courseId, L().lessons.filter(function (x) { return x.id === id; })[0]); toast(p ? 'บันทึกแล้ว' : 'สร้างบทเรียนแล้ว — แนบไฟล์ต่อได้'); }); }).catch(function (x) { busy(el, false); fail(x); });
  },
  mdPrev: function () { $('mdBox').innerHTML = '<div class="card" style="margin-bottom:10px">' + md($('l_content').value) + '</div>'; },
  lfUp: function (p, el) {
    var files = Array.prototype.slice.call($('lf_file').files); if (!files.length) return toast('เลือกไฟล์ก่อน', true);
    if (files.some(function (f) { return f.size > 25 * 1024 * 1024; })) return toast('ไฟล์ใหญ่เกิน 25MB — วิดีโอยาวให้ใช้ลิงก์ YouTube/Drive แทน', true);
    busy(el, true); var chain = Promise.resolve();
    files.forEach(function (f) { chain = chain.then(function () { $('lfMsg').textContent = 'กำลังอัปโหลด ' + f.name + '…'; return readB64(f); }).then(function (b) { return call('uploadLessonFile', S.token, p, { name: f.name, mime: f.type }, b); }); });
    chain.then(function () { return lessonReopen(p, 'อัปโหลดแล้ว'); }).catch(function (x) { busy(el, false); fail(x); });
  },
  lfLink: function (p, el) { busy(el, true); call('addLessonLink', S.token, p, v_('lf_name'), v_('lf_url')).then(function () { return lessonReopen(p, 'เพิ่มลิงก์แล้ว'); }).catch(function (x) { busy(el, false); fail(x); }); },
  lfDel: function (p, el) { if (!confirm('ลบไฟล์นี้?')) return; call('removeLessonFile', S.token, p, el.getAttribute('data-k')).then(function () { return lessonReopen(p, 'ลบแล้ว'); }).catch(fail); },
  /* items */
  itemNew: function (p) { itemForm(S._course, null, p); },
  itemEdit: function (p) { var it = L().items.filter(function (x) { return x.id === p; })[0]; itemForm(it.courseId, it); },
  itemDel: function (p) { if (!confirm('ลบงานนี้และคะแนนทั้งหมดของงานนี้?')) return; var cid = S._course; call('deleteItem', S.token, p).then(function () { return loadLms(); }).then(function () { S.tab.tc = 'items'; go('tcourse', cid); }).catch(fail); },
  itemSave: function (p, el) {
    var e = S._editing, it = { id: p, courseId: e.courseId, type: $('i_type').value, title: v_('i_title'), maxScore: v_('i_max'), dueDate: v_('i_due'), lessonId: $('i_lesson').value, instructions: $('i_ins').value, published: $('i_pub').checked, quiz: S._quiz };
    if (!it.title) return toast('กรุณาระบุชื่องาน', true);
    if (it.type === 'quiz') it.quiz = S._quiz.map(function (q) { return { q: q.q, choices: q.choices.filter(function (c) { return String(c).trim(); }), answer: Number(q.answer) || 0, points: Number(q.points) || 1 }; });
    busy(el, true);
    call('saveItem', S.token, it).then(function (id) { closeModal(); return loadLms().then(function () { go('titem', id); toast('บันทึกงานแล้ว'); }); }).catch(function (x) { busy(el, false); fail(x); });
  },
  qzAdd: function () { S._quiz.push({ q: '', choices: ['', '', '', ''], answer: 0, points: 1 }); qzRender(); },
  qzDel: function (p) { S._quiz.splice(Number(p), 1); qzRender(); },
  /* AI */
  aiGen: function (kind, el) {
    var topic = v_('ai_topic') || v_('l_title') || v_('i_title');
    if (!topic) return toast('กรุณาระบุหัวข้อให้ AI', true);
    var t = el.textContent; busy(el, true); el.textContent = 'AI กำลังสร้าง…';
    call('aiTeach', S.token, kind, { topic: topic, extra: v_('ai_extra'), n: v_('ai_n') }).then(function (r) {
      busy(el, false); el.textContent = t;
      if (kind === 'quiz') { S._quiz = S._quiz.concat(r.map(function (q) { return { q: q.q, choices: q.choices || [], answer: Number(q.answer) || 0, points: Number(q.points) || 1 }; })); qzRender(); toast('AI เพิ่ม ' + r.length + ' ข้อ — ตรวจเฉลยก่อนบันทึก'); }
      else { var ta = $('l_content') || $('i_ins'); ta.value = (ta.value ? ta.value + '\n\n' : '') + r; toast('AI สร้างเนื้อหาแล้ว — ตรวจทานก่อนบันทึก'); }
    }).catch(function (x) { busy(el, false); el.textContent = t; fail(x); });
  },
  aiRubric: function (p, el) {
    var topic = v_('i_title'); if (!topic) return toast('ระบุชื่องานก่อน', true);
    toast('AI กำลังสร้าง rubric…');
    call('aiTeach', S.token, 'rubric', { topic: topic + '\n' + $('i_ins').value.slice(0, 1500) }).then(function (r) { $('i_ins').value += '\n\n' + r; toast('เพิ่ม rubric แล้ว'); }).catch(fail);
  },
  aiFb: function (p, el) {
    var sid = el.getAttribute('data-k'); busy(el, true); el.textContent = 'กำลังร่าง…';
    call('aiTeach', S.token, 'feedback', { subId: p }).then(function (r) {
      busy(el, false); el.textContent = 'AI ช่วยร่าง';
      if (r.score != null && $('sc_' + sid)) $('sc_' + sid).value = r.score;
      if ($('fb_' + sid)) $('fb_' + sid).value = r.feedback || '';
      toast('AI ร่างคะแนนและความเห็นแล้ว — ตรวจทานก่อนบันทึก');
    }).catch(function (x) { busy(el, false); el.textContent = 'AI ช่วยร่าง'; fail(x); });
  },
  /* grading */
  gradeSave: function (p, el) {
    var sid = el.getAttribute('data-k'); busy(el, true);
    call('gradeSubmission', S.token, { itemId: p, sid: sid, score: v_('sc_' + sid), feedback: $('fb_' + sid).value }).then(function () { busy(el, false); el.textContent = '✓ บันทึก'; return loadLms().then(renderNav); }).catch(function (x) { busy(el, false); fail(x); });
  },
  gradeAll: function (p, el) {
    var it = L().items.filter(function (x) { return x.id === p; })[0], studs = tEnrolled(it.courseId), chain = Promise.resolve(), n = 0;
    busy(el, true);
    studs.forEach(function (s) {
      var sc = v_('sc_' + s.id), fb = $('fb_' + s.id).value, sb = tSub(p, s.id);
      if (sc === '' && !fb && !sb) return;
      if (sb && String(sb.score) === sc && (sb.feedback || '') === fb) return;
      chain = chain.then(function () { n++; return call('gradeSubmission', S.token, { itemId: p, sid: s.id, score: sc, feedback: fb }); });
    });
    chain.then(function () { return reLms('บันทึกคะแนน ' + n + ' รายการแล้ว'); }).catch(function (x) { busy(el, false); fail(x); });
  },
  gradeCell: function (p, el) {
    var sid = el.getAttribute('data-k'), it = L().items.filter(function (x) { return x.id === p; })[0], sb = tSub(p, sid), st = tStudent(sid);
    openModal('<h3>ให้คะแนน: ' + esc(it.title) + '</h3><p class="tag">' + esc(st.studentId + ' ' + st.name) + ' · เต็ม ' + it.maxScore + '</p>' +
      (sb ? (sb.text ? '<div class="wd" style="white-space:pre-wrap;max-height:160px;overflow:auto">' + esc(sb.text) + '</div>' : '') + fileList(sb.files) : '<p class="tag">ยังไม่มีงานส่ง (ให้คะแนนกิจกรรม/ในชั้นเรียนได้)</p>') +
      '<div class="grid g2"><div class="f"><label>คะแนน</label><input id="sc_' + sid + '" type="number" step="0.5" min="0" max="' + it.maxScore + '" value="' + esc(sb && sb.score !== '' ? sb.score : '') + '"></div></div><div class="f"><label>ความเห็น</label><textarea id="fb_' + sid + '">' + esc(sb ? sb.feedback : '') + '</textarea></div>' +
      '<div class="row"><span class="sp"></span><button class="btn light" data-act="close">ยกเลิก</button><button class="btn gold" data-act="gradeCellSave" data-p="' + p + '" data-k="' + sid + '">บันทึก</button></div>', tCourse(it.courseId).color);
  },
  gradeCellSave: function (p, el) { var sid = el.getAttribute('data-k'); busy(el, true); call('gradeSubmission', S.token, { itemId: p, sid: sid, score: v_('sc_' + sid), feedback: $('fb_' + sid).value }).then(function () { closeModal(); return reLms('บันทึกคะแนนแล้ว'); }).catch(function (x) { busy(el, false); fail(x); }); },
  subReset: function (p) { if (confirm('ลบงานที่ส่งนี้ เพื่อให้นักศึกษาส่ง/ทำใหม่?')) call('resetSubmission', S.token, p).then(function () { reLms('รีเซ็ตแล้ว'); }).catch(fail); },
  gbXlsx: function (p, el) { exportCall(el, call('exportGradebook', S.token, p)); },
  /* students */
  enrollAdd: function (p, el) { var sid = $('addStu').value; if (!sid) return; busy(el, true); call('enrollStudentByTeacher', S.token, p, sid).then(function () { reLms('เพิ่มนักศึกษาแล้ว'); }).catch(function (x) { busy(el, false); fail(x); }); },
  enrollDel: function (p) { if (confirm('นำนักศึกษาออกจากรายวิชา? (คะแนนยังเก็บไว้)')) call('removeEnrollment', S.token, S._course, p).then(function () { reLms('นำออกแล้ว'); }).catch(fail); },
  stuRpt: function (p) { stuReportModal(p); },
  stuRptPdf: function (p, el) { exportCall(el, call('exportStudentReportPdf', S.token, S._course, p)); },
  stuPw: function (p) {
    var st = tStudent(p);
    openModal('<h3>รีเซ็ตรหัสผ่าน: ' + esc(st.name) + '</h3>' + fld('rp_pw', 'รหัสผ่านใหม่ (≥ 6 ตัว)', 'text', String(st.studentId).slice(-6)) + '<p class="tag">ค่าเริ่มต้น = 6 หลักท้ายของรหัสนักศึกษา แจ้งนักศึกษาให้เปลี่ยนหลังเข้าสู่ระบบ</p><div class="row"><span class="sp"></span><button class="btn light" data-act="close">ยกเลิก</button><button class="btn" data-act="stuPwSave" data-p="' + p + '">บันทึก</button></div>');
  },
  stuPwSave: function (p, el) { busy(el, true); call('resetStudentPassword', S.token, p, v_('rp_pw')).then(function () { closeModal(); toast('รีเซ็ตรหัสผ่านแล้ว'); }).catch(function (x) { busy(el, false); fail(x); }); },
  stuToggle: function (p) { var st = tStudent(p); call('setStudentStatus', S.token, p, st.status === 'disabled' ? 'active' : 'disabled').then(function () { reLms('อัปเดตแล้ว'); }).catch(fail); }
};
function lessonReopen(lid, msg) {
  return loadLms().then(function () { var l = L().lessons.filter(function (x) { return x.id === lid; })[0]; render(); lessonForm(l.courseId, l); toast(msg); });
}

/* ---------------- start ---------------- */
Object.keys(CORE_ACTIONS).forEach(function (k) { ACTIONS[k] = CORE_ACTIONS[k]; });
Object.keys(LMS_ACTIONS).forEach(function (k) { ACTIONS[k] = LMS_ACTIONS[k]; });
init();

</script>
