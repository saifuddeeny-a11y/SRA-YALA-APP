# เผยแพร่เว็บไซต์ห้อง Micro Teaching (microteaching-app/website) ขึ้น GitHub Pages
# เปิดใช้: Settings › Pages › Build and deployment › Source: GitHub Actions
# จากนั้นทุกครั้งที่แก้ไฟล์ในโฟลเดอร์ website (เช่น config.js) เว็บไซต์จะอัปเดตเอง
name: Micro Teaching website

on:
  push:
    paths:
      - 'microteaching-app/website/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: microteaching-app/website
      - id: deployment
        uses: actions/deploy-pages@v4
